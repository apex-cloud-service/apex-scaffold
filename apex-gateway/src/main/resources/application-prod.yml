# ============================================================
# Apex Scaffold - API 网关 生产环境配置
# ============================================================
# 【与 dev 的关键差异】
#   1. Nacos 配置中心/服务发现改为启用（按命名空间隔离环境）
#   2. 路由改为 lb:// 服务名（由 Nacos 解析实例，支持灰度与滚动发布）
#   3. 敏感配置一律环境变量注入
#
# @author Apex Team
# ============================================================

spring:
  cloud:
    nacos:
      config:
        enabled: true
        namespace: ${NACOS_NAMESPACE:prod}
      discovery:
        enabled: true
        register-enabled: true
        namespace: ${NACOS_NAMESPACE:prod}

    gateway:
      discovery:
        locator:
          # ❌ 生产环境不开启自动路由，避免服务名意外暴露为路径
          enabled: false
      routes:
        # 🔒 生产路由指向 Nacos 注册的服务名；灰度期可临时改为单体地址回滚
        - id: auth-domain
          uri: ${ROUTE_AUTH_URI:lb://apex-auth-service}
          predicates:
            - Path=/api/v1/auth/**,/oauth2/**,/.well-known/**,/admin-api/v1/auth/**,/admin-api/v1/sso/**
        - id: workflow-domain
          uri: ${ROUTE_WORKFLOW_URI:lb://apex-workflow-service}
          predicates:
            - Path=/api/v1/workflows/**,/api/workflow/**,/admin-api/v1/workflows/**
        - id: office-domain
          uri: ${ROUTE_OFFICE_URI:lb://apex-office-service}
          predicates:
            - Path=/api/v1/office/**,/api/v1/messages/**,/admin-api/v1/office/**,/admin-api/v1/org/**
        - id: file-domain
          uri: ${ROUTE_FILE_URI:lb://apex-file-service}
          predicates:
            - Path=/api/v1/file/**,/api/v1/files/**,/api/v1/documents/**,/admin-api/v1/documents/**
        # 兜底路由：Phase 6 完成后切换为 lb://apex-system-service
        - id: system-domain
          uri: ${ROUTE_SYSTEM_URI:lb://apex-system-service}
          predicates:
            - Path=/api/v1/**,/admin-api/v1/**,/health,/actuator/**

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  level:
    root: WARN
    com.apex.scaffold.gateway: INFO
    org.springframework.cloud.gateway: WARN
