# ============================================================
# Apex Scaffold - API 网关 生产环境配置
# ============================================================
# 【与 dev 的关键差异】
#   1. Nacos 配置中心/服务发现改为启用（按命名空间隔离环境）
#   2. 路由改为 lb:// 服务名（由 Nacos 解析实例，支持灰度与滚动发布）
#   3. 敏感配置一律环境变量注入
#
# @author Apex Team
# ============================================================

spring:
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:prod}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_REGISTER_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:prod}

    gateway:
      discovery:
        locator:
          # ❌ 生产环境不开启自动路由，避免服务名意外暴露为路径
          enabled: false
      routes:
        # 🔒 生产路由指向 Nacos 注册的服务名；灰度期可临时改为单体地址回滚
        # ---- 认证域（Phase 2 已切换为 apex-auth-service，路径契约见方案 §5.2） ----
        # 💡 auth-service 承载 /auth/v1/**、/auth/v2/**（密码找回）、/oauth2/**、/.well-known/**，
        #    以及认证中心管理面：/api/v1/mfa/**、/api/mfa/**、/api/ip-access-control/**、
        #    /api/v1/auth/configs/**、/api/v1/auth/audit-logs/**。
        # ⚠️ /admin-api/v1/auth/**、/admin-api/v1/sso/** 由 system 承载，走下方 system-domain 兜底。
        # 可用 ROUTE_AUTH_URI 环境变量临时指回单体地址以一键回滚。
        - id: auth-service
          uri: ${ROUTE_AUTH_URI:lb://apex-auth-service}
          predicates:
            - Path=/auth/v1/**,/auth/v2/**,/oauth2/**,/.well-known/**,/api/v1/mfa/**,/api/mfa/**,/api/ip-access-control/**,/api/v1/auth/configs/**,/api/v1/auth/audit-logs/**
        - id: workflow-domain
          uri: ${ROUTE_WORKFLOW_URI:lb://apex-workflow-service}
          predicates:
            - Path=/api/v1/workflows/**,/api/v2/workflow-definitions/**,/api/workflow/**,/admin-api/v1/workflows/**
        # ---- 办公域（Phase 5 已切换为 apex-office-service） ----
        # ⚠️ 本文件重新定义了 routes 列表：YAML 列表不逐元素合并，未在此声明的路由在生产环境将丢失。
        # 因此站内信 WebSocket/HTTP 路由必须与 application.yml 保持同步，且必须排在 office-domain 之前，
        # 否则 /api/v1/messages/** 会先被 office-domain 的 lb://（http 语义）匹配，WebSocket 升级握手丢失。
        # WebSocket 使用独立路由，不经过 HTTP 熔断回退；固定实例便于单机票据原子消费。
        # 本地票据与连接不共享：下列 HTTP/WS 地址必须指向同一单实例。
        # 多实例部署须提供粘性路由及跨实例通知；仅 HTTP 补偿不能修复跨实例票据握手失败。
        # 🔒 生产必须通过环境变量显式指定真实 office 实例地址，勿沿用回环默认值。
        - id: office-message-websocket
          uri: ${ROUTE_OFFICE_WS_URI:lb://apex-office-service}
          predicates:
            - Path=/api/v1/messages/ws
            - Header=Upgrade, (?i)websocket
        - id: office-message-http
          uri: ${ROUTE_OFFICE_MESSAGE_URI:lb://apex-office-service}
          predicates:
            - Path=/api/v1/messages,/api/v1/messages/**
          filters:
            - name: CircuitBreaker
              args:
                name: officeService
                fallbackUri: forward:/__gateway/fallback
        - id: office-domain
          uri: ${ROUTE_OFFICE_URI:lb://apex-office-service}
          predicates:
            - Path=/api/v1/office/**,/api/v2/office/**,/api/office/**,/api/v1/messages/**,/admin-api/v1/office/**,/admin-api/v1/org/**,/admin-api/v1/message-templates,/admin-api/v1/message-templates/**
        # 只读查询聚合（S4-c/S4-d 统一待办门面）：无本地存储，舱壁与超时降级在聚合服务内部完成。
        - id: aggregation-domain
          uri: ${ROUTE_AGGREGATION_URI:lb://apex-aggregation-service}
          predicates:
            - Path=/api/v2/todo
          filters:
            - name: CircuitBreaker
              args:
                name: aggregationService
                fallbackUri: forward:/__gateway/fallback
        - id: file-domain
          uri: ${ROUTE_FILE_URI:lb://apex-file-service}
          predicates:
            - Path=/api/v1/file/**,/api/v1/files/**,/api/v1/documents/**,/admin-api/v1/documents/**,/admin-api/v1/charts/**,/api/v2/files/**,/api/v2/file-shares/**
        # 独立轻量服务未注册 Nacos，使用固定受信地址；JWT 验签沿用全局链，权限由下游复验。
        # ⚠️ 本文件整表重定义 routes：job/masking 路由必须在此显式声明，否则生产环境丢失。
        - id: job-domain
          uri: ${ROUTE_JOB_URI:http://127.0.0.1:8095}
          predicates:
            - Path=/admin-api/v1/jobs,/admin-api/v1/jobs/**
          filters:
            - name: CircuitBreaker
              args:
                name: jobService
                fallbackUri: forward:/__gateway/fallback
        - id: masking-domain
          uri: ${ROUTE_MASKING_URI:http://127.0.0.1:8096}
          predicates:
            - Path=/api/v1/masking/**
          filters:
            - name: CircuitBreaker
              args:
                name: maskingService
                fallbackUri: forward:/__gateway/fallback
        # ---- 开放平台路由组（/open-api/**，D2）：scope 断言 + 租户能力门禁见 OpenApiScopeGatewayFilter ----
        - id: open-api-file
          uri: ${ROUTE_FILE_URI:lb://apex-file-service}
          predicates:
            - Path=/open-api/file/**
          metadata:
            open-api:
              capability: file-storage
              read-scopes: ["open:file:read"]
              write-scopes: ["open:file:write"]
          filters:
            - name: CircuitBreaker
              args:
                name: fileService
                fallbackUri: forward:/__gateway/fallback
        - id: open-api-workflow
          uri: ${ROUTE_WORKFLOW_URI:lb://apex-workflow-service}
          predicates:
            - Path=/open-api/workflow/**
          metadata:
            open-api:
              capability: workflow
              read-scopes: ["open:workflow:read"]
              write-scopes: ["open:workflow:write"]
          filters:
            - name: CircuitBreaker
              args:
                name: workflowService
                fallbackUri: forward:/__gateway/fallback
        - id: open-api-system
          uri: ${ROUTE_SYSTEM_URI:lb://apex-system-service}
          predicates:
            - Path=/open-api/users,/open-api/users/**,/open-api/user/**
          metadata:
            open-api:
              capability: user-org
              read-scopes: ["open:user:read"]
              write-scopes: []
          filters:
            - name: CircuitBreaker
              args:
                name: systemService
                fallbackUri: forward:/__gateway/fallback
        - id: open-api-office
          uri: ${ROUTE_OFFICE_URI:lb://apex-office-service}
          predicates:
            - Path=/open-api/messages/**
          metadata:
            open-api:
              capability: office-message
              read-scopes: []
              write-scopes: ["open:message:send"]
          filters:
            - name: CircuitBreaker
              args:
                name: officeService
                fallbackUri: forward:/__gateway/fallback
        # 集成中心与物联网设备（apex-integration-service）
        # ⚠️ /internal/v1/** 为集群内部端点，不在此路由组内（网关对 /internal/** 强制 403）
        - id: integration-domain
          uri: ${ROUTE_INTEGRATION_URI:lb://apex-integration-service}
          predicates:
            - Path=/integration/v1/**
          filters:
            - name: CircuitBreaker
              args:
                name: integrationService
                fallbackUri: forward:/__gateway/fallback
        # 兜底路由：Phase 6 完成后切换为 lb://apex-system-service
        # 💡 /api/v2/** 逐前缀显式列出：operations / platform / tenant-packages /
        #    capabilities / capability-usage / overview（不放开整个 v2 通配）。
        # 通知 SSE 长连接：长驻响应不得挂 HTTP 熔断（与 office-message-websocket 同理）。
        - id: notification-stream
          uri: ${ROUTE_SYSTEM_URI:lb://apex-system-service}
          predicates:
            - Path=/api/v1/notifications/stream
          metadata:
            # SSE 长连接绕过全局 30s 响应超时；上限与站内信 WS 寿命对齐（1h，到期由服务端关闭）
            response-timeout: 3600000
        - id: system-domain
          uri: ${ROUTE_SYSTEM_URI:lb://apex-system-service}
          predicates:
            - Path=/api/v1/**,/api/v2/operations/**,/api/v2/platform/**,/api/v2/tenant-packages/**,/api/v2/capabilities/**,/api/v2/capability-usage/**,/api/v2/overview/**,/admin-api/v1/**,/health,/actuator/**

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  level:
    root: WARN
    com.apex.scaffold.gateway: INFO
    org.springframework.cloud.gateway: WARN
