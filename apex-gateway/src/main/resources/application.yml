# ============================================================
# Apex Scaffold - API 网关主配置
# ============================================================
# ┌───────────────────────────────────────────────────────────┐
# │ 注释符号规范（全仓配置文件统一约定）                         │
# ├───────────────────────────────────────────────────────────┤
# │ ✅ 已启用能力          ❌ 已禁用能力                       │
# │ ⚠️ 安全提示/注意点     💡 设计说明/优化理由                │
# │ 🔒 敏感配置（环境变量注入，禁止硬编码）                     │
# └───────────────────────────────────────────────────────────┘
#
# 【Phase 1 透明代理说明】
#   本期网关只做"透明代理"：全部 /api/v1/** 与 /admin-api/v1/** 流量转发到
#   现有单体 apex-scaffold（端口 8080），用于验证网关零损耗与契约不变。
#   后续 Phase 按域把路由指向已迁移的微服务（见 docs/08-project-management/plans/microservice-migration-plan.md §15）。
#
# @author Apex Team
# ============================================================

server:
  # 统一端口：遵循迁移方案 §5.1 的部署单元规划（apex-gateway:8080）
  # 保留 GATEWAY_PORT 环境变量覆盖能力，便于本地/多实例调试
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 5s
    idle-timeout: 30s

spring:
  application:
    name: apex-gateway
  main:
    web-application-type: reactive

  # ==================== Redis（限流令牌桶依赖） ====================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 🔒 生产环境必须通过环境变量注入
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

  # ==================== 数据库（访问日志持久化） ====================
  # 💡 Task 4：网关仅承载"访问日志"单表，独立库连接，避免与业务库耦合；
  #    🔒 连接信息一律环境变量注入，禁止硬编码。
  r2dbc:
    url: ${GATEWAY_DB_URL:r2dbc:mysql://127.0.0.1:3306/apex_gateway?serverTimezone=Asia/Shanghai}
    username: ${GATEWAY_DB_USERNAME:root}
    password: ${GATEWAY_DB_PASSWORD:root}
    pool:
      # 访问日志为低频异步写入，连接池无需过大
      initial-size: 2
      max-size: 10
      max-idle-time: 30m

  # ==================== 熔断降级（Resilience4j） ====================
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true

    # ==================== 负载均衡（灰度标签实例级路由） ====================
    # 迁移方案 §15 / Task 3：在 discovery + caching 供应商之上叠加灰度标签过滤装饰器。
    # 💡 全局默认供应商由 lb/GrayTagLoadBalancerConfiguration 通过
    #    @LoadBalancerClients(defaultConfiguration=...) 对全部 lb:// 客户端生效；
    #    实例元数据约定（下游注册侧声明）：
    #      spring.cloud.nacos.discovery.metadata.gray-tag: stable | gray
    #    网关消费 X-Gray-Tag 请求头，按 metadata[gray-tag] 过滤实例，无匹配时回退稳定/全量。
    loadbalancer:
      cache:
        # 实例清单缓存总开关（关闭时每次直查发现客户端，Nacos 压力升高）
        enabled: ${LB_CACHE_ENABLED:true}
        # 实例清单缓存存活时长
        ttl: ${LB_CACHE_TTL:5s}
        # 单个客户端缓存的实例条目上限
        capacity: ${LB_CACHE_CAPACITY:1000}

    gateway:
      # 关闭默认的 X-Forwarded-* 重写，交给入口负载均衡处理
      x-forwarded:
        enabled: true
        for-enabled: true
        host-enabled: true
        port-enabled: true
        proto-enabled: true

      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
        pool:
          type: elastic
          max-idle-time: 30s

      # ==================== 路由规则 ====================
      # 💡 未显式切流的路径统一兜底到单体，保证 Phase 1 行为不变
      routes:
        # ---- 认证域（Phase 2 已切换为 apex-auth-service，路径契约见方案 §5.2） ----
        # 💡 auth-service 承载 /auth/v1/**、/auth/v2/**（密码找回）、/oauth2/**、/.well-known/**，
        #    以及认证中心管理面：/api/v1/mfa/**、/api/mfa/**、/api/ip-access-control/**、
        #    /api/v1/auth/configs/**、/api/v1/auth/audit-logs/**（MfaRouter、AuthCenterRouterConfig、
        #    AuthConfigRouter、AuditLogRouter）。
        # ⚠️ /admin-api/v1/auth/**、/admin-api/v1/sso/** 由 system 承载（AuthConfigRouter、SsoAdminRouter），
        #    不得加入本路由，否则会在 auth-service 404。
        # 💡 其余 /api/v1/auth/**（Keycloak OIDC 登录等）仍由 system-domain 兜底。
        - id: auth-service
          uri: ${ROUTE_AUTH_URI:lb://apex-auth-service}
          predicates:
            - Path=/auth/v1/**,/auth/v2/**,/oauth2/**,/.well-known/**,/api/v1/mfa/**,/api/mfa/**,/api/ip-access-control/**,/api/v1/auth/configs/**,/api/v1/auth/audit-logs/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/__gateway/fallback

        # ---- 工作流域（Phase 3 已切换为 apex-workflow-service） ----
        # 💡 可用 ROUTE_WORKFLOW_URI 环境变量临时指回单体地址以一键回滚。
        - id: workflow-domain
          uri: ${ROUTE_WORKFLOW_URI:lb://apex-workflow-service}
          predicates:
            - Path=/api/v1/workflows/**,/api/v2/workflow-definitions/**,/api/workflow/**,/admin-api/v1/workflows/**
          filters:
            - name: CircuitBreaker
              args:
                name: workflowService
                fallbackUri: forward:/__gateway/fallback

        # ---- 办公域（Phase 5 已切换为 apex-office-service） ----
        # 💡 可用 ROUTE_OFFICE_URI 环境变量临时指回单体地址以一键回滚。
        # WebSocket 使用独立路由，不经过 HTTP 熔断回退；固定实例便于单机票据原子消费。
        # 本地票据与连接不共享：下列 HTTP/WS 地址必须指向同一单实例。
        # 多实例部署须提供粘性路由及跨实例通知；仅 HTTP 补偿不能修复跨实例票据握手失败。
        - id: office-message-websocket
          uri: ${ROUTE_OFFICE_WS_URI:ws://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/messages/ws
            - Header=Upgrade, (?i)websocket
        - id: office-message-http
          uri: ${ROUTE_OFFICE_MESSAGE_URI:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/messages,/api/v1/messages/**
          filters:
            - name: CircuitBreaker
              args:
                name: officeService
                fallbackUri: forward:/__gateway/fallback
        - id: office-domain
          uri: ${ROUTE_OFFICE_URI:lb://apex-office-service}
          predicates:
            - Path=/api/v1/office/**,/api/v2/office/**,/api/office/**,/api/v1/messages/**,/admin-api/v1/office/**,/admin-api/v1/org/**,/admin-api/v1/message-templates
          filters:
            - name: CircuitBreaker
              args:
                name: officeService
                fallbackUri: forward:/__gateway/fallback

        # ---- 文件域（Phase 4 切换为 apex-file-service） ----
        - id: file-domain
          uri: ${ROUTE_FILE_URI:lb://apex-file-service}
          predicates:
            - Path=/api/v1/file/**,/api/v1/files/**,/api/v1/documents/**,/admin-api/v1/documents/**,/admin-api/v1/charts/**,/api/v2/files/**,/api/v2/file-shares/**
          filters:
            - name: CircuitBreaker
              args:
                name: fileService
                fallbackUri: forward:/__gateway/fallback

        # 独立轻量服务未注册 Nacos，使用固定受信地址；JWT 验签沿用全局链，权限由下游复验。
        - id: job-domain
          uri: ${ROUTE_JOB_URI:http://127.0.0.1:8095}
          predicates:
            - Path=/admin-api/v1/jobs,/admin-api/v1/jobs/**
          filters:
            - name: CircuitBreaker
              args:
                name: jobService
                fallbackUri: forward:/__gateway/fallback
        - id: masking-domain
          uri: ${ROUTE_MASKING_URI:http://127.0.0.1:8096}
          predicates:
            - Path=/api/v1/masking/**
          filters:
            - name: CircuitBreaker
              args:
                name: maskingService
                fallbackUri: forward:/__gateway/fallback

        # ---- 开放平台路由组（/open-api/**，D2）：scope 断言 + 租户能力门禁见 OpenApiScopeGatewayFilter ----
        # metadata.open-api：capability=租户订阅能力（D4）；read/write-scopes=对应 HTTP 方法族的 scope 断言（any-of）。
        - id: open-api-file
          uri: ${ROUTE_FILE_URI:lb://apex-file-service}
          predicates:
            - Path=/open-api/file/**,/open-api/files/**
          metadata:
            open-api:
              capability: file-storage
              read-scopes: ["open:file:read"]
              write-scopes: ["open:file:write"]
          filters:
            - name: CircuitBreaker
              args:
                name: fileService
                fallbackUri: forward:/__gateway/fallback
        - id: open-api-workflow
          uri: ${ROUTE_WORKFLOW_URI:lb://apex-workflow-service}
          predicates:
            - Path=/open-api/workflow/**
          metadata:
            open-api:
              capability: workflow
              read-scopes: ["open:workflow:read"]
              write-scopes: ["open:workflow:write"]
          filters:
            - name: CircuitBreaker
              args:
                name: workflowService
                fallbackUri: forward:/__gateway/fallback
        - id: open-api-system
          uri: ${ROUTE_SYSTEM_URI:lb://apex-system-service}
          predicates:
            - Path=/open-api/users/**,/open-api/user/**
          metadata:
            open-api:
              capability: user-org
              read-scopes: ["open:user:read"]
              write-scopes: []
          filters:
            - name: CircuitBreaker
              args:
                name: systemService
                fallbackUri: forward:/__gateway/fallback
        - id: open-api-office
          uri: ${ROUTE_OFFICE_URI:lb://apex-office-service}
          predicates:
            - Path=/open-api/messages/**
          metadata:
            open-api:
              capability: office-message
              read-scopes: []
              write-scopes: ["open:message:send"]
          filters:
            - name: CircuitBreaker
              args:
                name: officeService
                fallbackUri: forward:/__gateway/fallback

        # ---- 集成中心与物联网设备（apex-integration-service） ----
        # 💡 可用 ROUTE_INTEGRATION_URI 环境变量临时指回其它实例以实现一键回滚。
        # ⚠️ /internal/v1/** 为集群内部端点（MQTT 认证钩子、命令下行、聚合统计），
        #    不在此路由组内；网关 JwtSignatureFilter 对 /internal/** 强制 403。
        - id: integration-domain
          uri: ${ROUTE_INTEGRATION_URI:lb://apex-integration-service}
          predicates:
            - Path=/integration/v1/**
          filters:
            - name: CircuitBreaker
              args:
                name: integrationService
                fallbackUri: forward:/__gateway/fallback

        # ---- 兜底：系统管理与其余全部接口（Phase 6 收敛为 apex-system-service） ----
        # 💡 可用 ROUTE_SYSTEM_URI 环境变量临时指回单体地址（http://127.0.0.1:8080）
        #    以实现一键回滚。
        # 💡 /api/v2/** 逐前缀显式列出（不用通配，避免误放行未来新增的 v2 端点）：
        #    operations（运维健康）、platform（平台租户）、tenant-packages（租户套餐）、
        #    capabilities / capability-usage（能力目录与计量）、overview（数据总览）。
        - id: system-domain
          uri: ${ROUTE_SYSTEM_URI:lb://apex-system-service}
          predicates:
            - Path=/api/v1/**,/api/v2/operations/**,/api/v2/platform/**,/api/v2/tenant-packages/**,/api/v2/capabilities/**,/api/v2/capability-usage/**,/api/v2/overview/**,/admin-api/v1/**,/health,/actuator/**
          filters:
            - name: CircuitBreaker
              args:
                name: systemService
                fallbackUri: forward:/__gateway/fallback

      default-filters:
        # 避免 CORS 头重复（网关与下游同时返回时）
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ==================== 熔断阈值（Resilience4j 实例） ====================
# 各路由 CircuitBreaker 过滤器使用的命名实例（authService/workflowService/...）
# 统一继承 default 配置，可按需为单实例覆盖。
resilience4j:
  circuitbreaker:
    configs:
      default:
        # 基于计数的滑动窗口（网关请求量分布不均，计数窗口更直观）
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        # 最少采样请求数，避免小流量误熔断
        minimum-number-of-calls: 20
        # 失败率阈值（%）
        failure-rate-threshold: 50
        # 慢调用比例阈值（%）与慢调用判定时长
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 2s
        # 熔断 OPEN 保持时长，到期后自动进入 HALF_OPEN
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      authService:
        base-config: default
      workflowService:
        base-config: default
      officeService:
        base-config: default
      fileService:
        base-config: default
      systemService:
        base-config: default
      jobService:
        base-config: default
      maskingService:
        base-config: default

# ==================== 健康检查与指标 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    # 网关熔断/限流/灰度/访问日志落库失败计数（apex.gateway.*）由
    # ResilienceConfig、TokenBucketRateLimitFilter、GrayRouteFilter、AccessLogService 注册，
    # 经 /actuator/prometheus 暴露，供 Prometheus 抓取与告警。
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

# ==================== 链路追踪（Brave -> Zipkin） ====================
management.zipkin:
  tracing:
    endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

# ==================== 日志 ====================
logging:
  level:
    root: INFO
    com.apex.scaffold.gateway: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    # 控制台输出包含 traceId，便于本地排查
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# ==================== CORS 跨域（网关统一收敛） ====================
# 说明：跨域策略从主应用迁移到网关唯一一处，下游服务不再各自放行（迁移方案 §5.3）。
cors:
  # 是否允许所有来源（仅开发联调开启，生产必须 false）
  allow-all-origins: ${CORS_ALLOW_ALL_ORIGINS:false}
  # 明确允许的来源域名（逗号分隔；allow-all-origins=false 时必填）
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ==================== 网关自定义能力 ====================
apex:
  gateway:
    # JWKS 验签（风险 #1 缓解：非对称 RSA + 过渡期 HMAC 双 kid 并行验证）
    # 公钥可安全下发；hmac-secret 为对称密钥，生产必须经环境变量/KMS 注入
    jwks:
      # 🔒 过渡期 HMAC 对称密钥（兼容旧 Token 验签）
      hmac-secret: ${JWT_SECRET:}
      # 按 kid 组织的密钥清单（可 Nacos 热更新，密钥轮换时无需重启网关）。
      # 必须为 YAML 列表（或 JSON 数组），不可用标量字符串占位符，否则无法绑定到
      # List<JwksProfile>（会抛 ConverterNotFoundException）。
      # 默认空列表；生产由 Nacos 的 apex-gateway.yaml 覆盖为：
      #   ks:
      #     - kid: hmac-legacy
      #       alg: hmac
      #     - kid: rsa-2026-01
      #       alg: rsa256
      #       public-key-base64: "MIIBIjANBgkqh..."
      ks: []
      # 统一认证收口（A2）：远程 JWKS 拉取（认证中心 /.well-known/jwks.json 完整地址）。
      # 非空时网关周期拉取认证中心轮换公钥并合并进密钥缓存（同 kid 覆盖静态条目，
      # hmac-legacy 不受影响）；为空时仅使用 ks 静态清单与 HMAC 过渡密钥。
      remote-url: ${JWKS_REMOTE_URL:}
      # 远程 JWKS 拉取间隔（秒，下限 30）；认证中心密钥轮换后最迟在此时间内生效。
      remote-refresh-interval-seconds: ${JWKS_REFRESH_INTERVAL_SECONDS:300}
    # 统一认证收口（A3）：令牌撤销流——周期拉取认证中心撤销增量，本地缓存 jti 撤销集，
    # 验签通过但命中撤销集的令牌收敛为 401（登出/踢人在撤销间隔内于网关生效）。
    revocation:
      enabled: ${REVOCATION_FEED_ENABLED:false}
      # 认证中心撤销流端点（GET /internal/v1/tokens/revocations）完整地址；空 = 不拉取。
      url: ${REVOCATION_FEED_URL:}
      # 拉取间隔（秒，下限 5）；撤销生效时延上限 ≈ 间隔 + 一次请求时长。
      pull-interval-seconds: ${REVOCATION_PULL_INTERVAL_SECONDS:15}
      # 启动游标回看窗口（秒）：重启补拉窗口，默认覆盖 2 小时访问令牌全生命周期。
      lookback-seconds: ${REVOCATION_LOOKBACK_SECONDS:7200}
    # 访问日志持久化（Task 4，结构化访问日志异步落库）
    access-log:
      # 落库总开关（关闭时仅保留控制台文件日志）
      enabled: ${GATEWAY_ACCESS_LOG_ENABLED:false}
      # 采样率（0.0–1.0），高流量下按比例抽样落库
      sample-rate: ${GATEWAY_ACCESS_LOG_SAMPLE_RATE:1.0}
      # 单个请求头值最大保留长度（超出截断，防止超长头写入）
      max-header-length: ${GATEWAY_ACCESS_LOG_MAX_HEADER_LENGTH:512}
      # 是否持久化请求体（默认关闭：请求体读取会破坏响应式流且存在敏感数据风险）
      persist-request-body: false
    # 全局限流（Redis 分布式令牌桶，迁移方案 §1.2.2 / Task 2）
    rate-limit:
      # 限流总开关（false 时纯透传）
      enabled: ${RATE_LIMIT_ENABLED:true}
      # 限流算法：token-bucket（令牌桶，默认） | fixed-window（固定窗口计数）
      algorithm: ${RATE_LIMIT_ALGORITHM:token-bucket}
      # 默认桶容量（未命中 rules 时生效）
      default-capacity: ${RATE_LIMIT_CAPACITY:1000}
      # 默认令牌补充速率（令牌/秒）
      default-refill-rate: ${RATE_LIMIT_REFILL_RATE:100}
      # Redis Key 统一前缀（拼接为 {key-prefix}{scope}:{identity}:{path}）
      key-prefix: "apex:gateway:rl:"
      # 固定窗口长度（毫秒，仅 algorithm=fixed-window 使用）
      window-ms: ${RATE_LIMIT_WINDOW_MS:60000}
      # 按资源（Ant 路径通配）覆盖的限流规则，命中后覆盖默认容量与速率（可 Nacos 热更新）
      rules:
        - resource: "/api/v1/workflows/**"
          capacity: 2000
          refill-rate: 200
        - resource: "/api/v1/auth/**"
          capacity: 5000
          refill-rate: 500

# ==================== 灰度发布 ====================
# 三级判定：Header 强制 > 租户白名单 > 用户尾号百分比（迁移方案 §15）
gray:
  # 灰度总开关
  enabled: ${GRAY_ENABLED:false}
  # 用户尾号灰度百分比（0–100），同一用户分桶稳定
  percentage: ${GRAY_PERCENTAGE:0}
  # 强制灰度的租户 ID 白名单（逗号分隔）
  tenant-whitelist: ${GRAY_TENANT_WHITELIST:}
