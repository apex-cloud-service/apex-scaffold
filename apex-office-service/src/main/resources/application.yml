# ============================================================
# Apex Scaffold - 办公服务 application.yml（Phase 5 骨架占位）
# ============================================================
# 【独立库】 办公服务使用独立数据库 apex_office（设计文档 §4.3），
#   表结构：off_department / off_employee / off_binding / off_message /
#          off_message_recipient / off_message_template / off_sync_history /
#          off_calendar / off_approval_process。
# @author Apex Team
# ============================================================

apex:
  seata:
    enabled: ${APEX_SEATA_ENABLED:false}
    application-id: apex-office-service
    transaction-service-group: ${APEX_SEATA_TX_GROUP:apex_tx_group}
    propagation-secret: ${APEX_SEATA_PROPAGATION_SECRET:}
    allowed-origins: []
  tenant:
    enabled: true
  jwks:
    # 共享 JWKS 拉取（统一认证收口 A2）：认证中心 /.well-known/jwks.json；
    # 空 = 拉取关闭，仅用静态公钥兜底；轮换公钥最迟一个刷新周期内生效。
    remote-url: ${JWKS_REMOTE_URL:}
    refresh-interval-seconds: ${JWKS_REFRESH_INTERVAL_SECONDS:300}

# 办公 HTTP 独立验签；RSA 公钥为 X509 DER Base64，HMAC 仅用于显式启用的过渡环境。
# 不配置密钥时拒绝用户认证，绝不使用 X-User-Id/X-Tenant-Id 作为认证依据。
office:
  security:
    jwt-public-key-base64: ${OFFICE_JWT_PUBLIC_KEY_BASE64:}
    # 多公钥格式为 kid=Base64PublicKey,kid=Base64PublicKey，按 JWT header 的 kid 选择公钥；
    # 多公钥优先于单公钥。生产推荐配置 apex.jwks.remote-url 自动拉取认证中心轮换公钥。
    jwt-public-keys-base64: ${OFFICE_JWT_PUBLIC_KEYS_BASE64:}
    jwt-secret: ${OFFICE_JWT_SECRET:}
    authorization:
      # 部署者确认 office JWT userId 就是 auth 用户 ID 后才能开启；默认拒绝，禁止混用 accountId。
      shared-user-namespace: ${OFFICE_AUTHORIZATION_SHARED_USER_NAMESPACE:false}
      # HTTPS auth 中心；未配置则所有 @RequirePermission 接口拒绝访问。
      base-url: ${OFFICE_AUTHORIZATION_BASE_URL:}
      # 总请求超时，必须 > 0 且 <= 30s。
      timeout: ${OFFICE_AUTHORIZATION_TIMEOUT:3s}
      # 每个租户单独注入 readerTokens 映射（安全配置中心或 SPRING_APPLICATION_JSON）。
      # reader token 须属于该租户及 auth-center.authorization-reader-user-id 指定的 reader。
      # 目标使用 JWT userId（不是 accountId）；office/auth 必须共享用户及租户命名空间。
      reader-tokens: {}
  organization:
    # 组织同步把外部通讯录成员解析为本租户真实系统用户时使用的 system 内部接口基址。
    # 集群内直连（如 http://apex-system-service:8082），不经网关；未配置时跳过解析，成员仅写镜像。
    system-base-url: ${OFFICE_ORGANIZATION_SYSTEM_BASE_URL:}
    # 单次解析请求超时；解析失败按未绑定处理，不阻断部门与成员镜像同步。
    timeout: ${OFFICE_ORGANIZATION_SYSTEM_TIMEOUT:3s}
  messages:
    # 单实例内存票据/连接：网关 ROUTE_OFFICE_MESSAGE_URI 与 ROUTE_OFFICE_WS_URI 必须指向同一实例。
    # POST /api/v1/messages/ws-ticket 使用访问 JWT；30 秒内通过 GET /api/v1/messages/ws?ticket=... 消费一次。
    # 服务每 20 秒发送 {"type":"ping"}；客户端须回文本 pong，超过 60 秒无响应或连接满 1 小时关闭。
    # 在线事件只是提示：重连后须查询 /api/v1/messages/inbox 和 /api/v1/messages/unread/count 补偿。
    # recipientIds 使用系统 userId，必须存在本租户未删除且 ACTIVE 的 off_employee.user_id 绑定。
    # 精确来源列表，逗号分隔，包含协议及端口；缺省拒绝所有浏览器握手，禁止通配符。
    allowed-origins: ${OFFICE_MESSAGE_ALLOWED_ORIGINS:}

server:
  port: 8084

spring:
  application:
    name: apex-office-service

  codec:
    max-in-memory-size: 256MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/apex_office?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql
    out-of-order: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.apex.scaffold.office: DEBUG
    com.apex.scaffold.officeservice: DEBUG
    # 握手 URI 含短期 ticket，避免 Web DEBUG 日志记录完整查询串。
    org.springframework.web: INFO

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json