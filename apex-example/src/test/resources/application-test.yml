server:
  port: 0  # 使用随机端口

spring:
  application:
    name: apex-example-test

  # 邮件（演示占位）：满足 MailService 对 JavaMailSender 的装配依赖
  mail:
    host: smtp.example.com
    port: 25

  # 测试环境不接入 Nacos 注册中心（避免启动时尝试注册服务）
  cloud:
    nacos:
      discovery:
        enabled: false

  # 测试环境不依赖本地 Redis：关闭 Spring Data Redis 自动配置，
  # RedissonClient 由 ExampleTestMockConfiguration 的 @Primary 替身覆盖
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  # 数据源（dynamic-datasource 配置，与主应用保持一致）
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          # H2 内存数据库（MODE=MySQL 兼容 MySQL 语法）
          url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
          username: sa
          password:
          driver-class-name: org.h2.Driver

  # Flyway：加载 H2 兼容建表脚本（src/test/resources/db/migration）
  flyway:
    enabled: true
    locations: classpath:db/example-migration
    baseline-on-migrate: true
    clean-disabled: true

# 定时任务：测试环境禁用所有 @Scheduled 任务（outbox/账号注销等），
# 避免依赖主应用业务表（SYS_DOMAIN_EVENT_OUTBOX 等）产生日志噪音
apex:
  scheduling:
    enabled: false
  # Sentinel 系统保护规则：测试环境关闭（避免慢启动/低流量误触发全局降级 503）
  sentinel:
    system-rules:
      enabled: false

# 跨域配置（测试环境放开所有来源，与主应用 application-it.yml 一致）
cors:
  allow-all-origins: true

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.apex.example.model
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# JWT配置(测试用弱密钥)
jwt:
  secret: test-secret-key-for-integration-testing-only-min-32-chars!!!
  expiration: 7200000

# 日志配置
logging:
  level:
    root: WARN
    com.apex: DEBUG
    org.springframework.test: INFO
