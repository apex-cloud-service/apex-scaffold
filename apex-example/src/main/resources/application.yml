server:
  port: 8080

spring:
  application:
    name: apex-example

  # 邮件（演示占位）：MailService 依赖 JavaMailSender 自动装配
  # ⚠️ 仅用于满足 Bean 装配；实际发信需替换为真实 SMTP 配置
  mail:
    host: smtp.example.com
    port: 25

  # 数据源配置（dynamic-datasource，与主应用 apex-interfaces 配置范式一致）
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: ${DB_MASTER_URL:jdbc:mysql://localhost:3306/apex_example?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
          username: ${DB_MASTER_USERNAME:root}
          # 与本地基础设施（docker-compose.infra.yml）默认一致；可用 DB_MASTER_PASSWORD 覆盖
          password: ${DB_MASTER_PASSWORD:apex-root}
          driver-class-name: com.mysql.cj.jdbc.Driver
        # 从库（数据源动态切换演示：@DataSource("slave") 切到本数据源）
        # ✅ 配置与 master 完全一致（仅环境变量前缀 DB_SLAVE_*），连接池参数由下方
        #    Druid 全局配置统一生效；本地演示默认指向同一 MySQL 实例（apex_example 库），
        #    真实从库通过 DB_SLAVE_URL / DB_SLAVE_USERNAME / DB_SLAVE_PASSWORD 注入。
        slave:
          url: ${DB_SLAVE_URL:jdbc:mysql://localhost:3306/apex_example?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
          username: ${DB_SLAVE_USERNAME:root}
          # 默认值与 master 一致（apex-root，与本地基础设施 docker-compose.infra.yml 默认一致）
          password: ${DB_SLAVE_PASSWORD:apex-root}
          driver-class-name: com.mysql.cj.jdbc.Driver

    # Druid连接池（全局配置，对 dynamic 下所有数据源生效）
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
  
  # Flyway数据库迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

# 跨域配置（与主应用 apex-interfaces 保持一致）
cors:
  # 是否允许所有来源（生产建议 false 并配置白名单）
  allow-all-origins: false
  # 明确允许的来源域名（逗号分隔或列表）
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8080

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.apex.example.model
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 商业License验证(默认关闭)
# ------------------------------------------------------------------
# 开启后,标注了 @FeatureGate 的接口将按License授权校验(如 /api/example/reports/premium)。
# 启用步骤:
#   1. 使用 com.apex.scaffold.common.license.LicenseGenerator 生成密钥对与 license.json
#      (将 enabledFeatures 配置为 ["premium_report"],private.key 必须保密,不可提交到仓库)
#   2. 将 license.json 放入 classpath 根目录(src/main/resources/)
#   3. 将公钥保存到服务器路径,配置 public-key-file
#   4. 设置 enabled: true 并重启应用
apex:
  license:
    enabled: false
    file-path: classpath:license.json
    public-key-file: /etc/apex/public.key

# JWT配置
jwt:
  secret: ${JWT_SECRET:example-secret-key-for-testing-only-min-32-chars}
  expiration: 7200000

# 日志配置
logging:
  level:
    root: INFO
    com.apex: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
