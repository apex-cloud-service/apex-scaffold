# ============================================================================
# SonarQube 本地代码质量检查栈（与业务运行栈独立）
# ----------------------------------------------------------------------------
# 用途：启动 PostgreSQL + SonarQube Community，供 mvn/podman 侧的质量门禁分析使用。
# 用法：podman-compose -f podman-compose.sonar.yml up -d
# 前置：需提供 SONAR_DB_PASSWORD（建议置于 .env.sonar，勿入库）。
# ============================================================================
name: apex-sonar

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in .env.sonar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: docker.io/library/sonarqube:10.6-community
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in .env.sonar}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
    name: apex-sonar-postgres-data-106
  sonar_data:
    name: apex-sonar-data-106
  sonar_extensions:
    name: apex-sonar-extensions-106
  sonar_logs:
    name: apex-sonar-logs-106
