# 测试环境配置
spring:
  main:
    allow-bean-definition-overriding: true

# JWT测试配置
jwt:
  secret: test-secret-key-for-unit-testing-only-min-32-characters
  access-token-expire: 7200000
  refresh-token-expire: 604800000
  min-secret-length: 32

# 日志级别
logging:
  level:
    root: WARN
    com.apex: DEBUG
