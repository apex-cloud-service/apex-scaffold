groups:
  - name: security_alerts
    interval: 30s
    rules:
      # 认证失败率过高
      - alert: HighAuthenticationFailureRate
        expr: |
          rate(auth_failure_total[5m]) > 10
        for: 2m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "认证失败率过高"
          description: "过去5分钟内认证失败率超过10次/秒，可能存在暴力破解攻击"
          dashboard: "http://grafana:3000/d/security/security-overview"

      # 暴力破解攻击检测
      - alert: BruteForceAttackDetected
        expr: |
          rate(security_bruteforce_detected_total[1m]) > 0
        for: 1m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "检测到暴力破解攻击"
          description: "系统检测到暴力破解攻击尝试"
          action: "立即检查日志并封禁可疑IP"

      # Token撤销率异常
      - alert: HighTokenRevocationRate
        expr: |
          rate(token_revoked_total[5m]) > 5
        for: 3m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Token撤销率异常"
          description: "过去5分钟内Token撤销率超过5次/秒"

      # 权限拒绝率过高
      - alert: HighPermissionDenialRate
        expr: |
          rate(permission_denied_total[5m]) > 20
        for: 2m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "权限拒绝率过高"
          description: "过去5分钟内权限拒绝超过20次/秒，可能存在未授权访问尝试"

      # 认证成功率低
      - alert: LowAuthenticationSuccessRate
        expr: |
          (rate(auth_success_total[10m]) / (rate(auth_success_total[10m]) + rate(auth_failure_total[10m]))) < 0.5
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "认证成功率低于50%"
          description: "过去10分钟内认证成功率低于50%"

      # 认证耗时过长
      - alert: SlowAuthentication
        expr: |
          histogram_quantile(0.95, rate(auth_duration_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "认证响应时间过长"
          description: "95%的认证请求耗时超过2秒"

  - name: system_alerts
    interval: 30s
    rules:
      # 应用实例下线
      - alert: ServiceDown
        expr: |
          up{job=~"apex-.*"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "服务实例下线"
          description: "{{ $labels.job }} 服务实例已下线"

      # Redis连接失败
      - alert: RedisDown
        expr: |
          redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Redis服务不可用"
          description: "Redis连接失败，可能影响Token验证和会话管理"

      # MySQL连接失败
      - alert: MySQLDown
        expr: |
          mysql_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "MySQL服务不可用"
          description: "MySQL连接失败"

      # JVM内存使用率过高
      - alert: HighJVMMemoryUsage
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "JVM堆内存使用率过高"
          description: "{{ $labels.job }} 堆内存使用率超过85%"

      # CPU使用率过高
      - alert: HighCPUUsage
        expr: |
          process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "CPU使用率过高"
          description: "{{ $labels.job }} CPU使用率超过80%"

  - name: business_alerts
    interval: 60s
    rules:
      # 活跃会话数异常增长
      - alert: UnusualActiveSessionGrowth
        expr: |
          increase(auth_active_sessions[10m]) > 1000
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "活跃会话数异常增长"
          description: "过去10分钟内活跃会话数增长超过1000"

      # Token颁发率异常
      - alert: UnusualTokenIssuanceRate
        expr: |
          rate(token_issued_total[5m]) > 50
        for: 5m
        labels:
          severity: info
          category: business
        annotations:
          summary: "Token颁发率异常"
          description: "过去5分钟内Token颁发率超过50次/秒"
