<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 14px sans-serif;fill:#64748b;text-anchor:middle}
      .section-title{font:600 16px sans-serif;fill:#0f172a}
      .text{font:400 11px sans-serif;fill:#475569}
      .code{font:400 10px monospace;fill:#2563eb}
      .layer-box{fill:#eff6ff;stroke:#3b82f6;stroke-width="2";rx:8}
      .component-box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;rx:6}
      .primary-box{fill:#4f46e5;stroke:#4338ca;stroke-width="2";rx:6}
      .success-box{fill:#059669;stroke:#047857;stroke-width="2";rx:6}
      .warning-box{fill:#d97706;stroke:#b45309;stroke-width="2";rx:6}
      .db-box{fill:#e0e7ff;stroke:#6366f1;stroke-width="2";rx:6}
      .arrow{fill:none;stroke:#64748b;stroke-width="2";marker-end:url(#arrowhead)}
      .flow-arrow{fill:none;stroke:#4f46e5;stroke-width="2".5;marker-end:url(#arrowhead-primary)}
      .label-text{font:500 10px sans-serif;fill:#1e293b}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-primary" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="700" y="35" class="title">Apex Scaffold OAuth2 授权服务器架构</text>
  <text x="700" y="58" class="subtitle">基于Spring Authorization Server · 支持四种授权模式 · WebFlux响应式架构</text>

  <rect x="50" y="90" width="300" height="740" class="layer-box"/>
  <text x="200" y="115" class="section-title" text-anchor="middle">客户端层 (Client Layer)</text>

  <rect x="70" y="135" width="120" height="70" class="component-box"/>
  <text x="130" y="157" class="text" text-anchor="middle" font-weight="600">Web应用</text>
  <text x="130" y="172" class="code" text-anchor="middle">Authorization Code</text>
  <text x="130" y="186" class="code" text-anchor="middle">+ PKCE</text>
  <text x="130" y="198" class="text" text-anchor="middle" font-size="9">Vue 3前端</text>

  <rect x="210" y="135" width="120" height="70" class="component-box"/>
  <text x="270" y="157" class="text" text-anchor="middle" font-weight="600">移动应用</text>
  <text x="270" y="172" class="code" text-anchor="middle">Authorization Code</text>
  <text x="270" y="186" class="code" text-anchor="middle">+ PKCE</text>
  <text x="270" y="198" class="text" text-anchor="middle" font-size="9">微信小程序</text>

  <rect x="70" y="220" width="120" height="70" class="component-box"/>
  <text x="130" y="242" class="text" text-anchor="middle" font-weight="600">服务端应用</text>
  <text x="130" y="257" class="code" text-anchor="middle">Client Credentials</text>
  <text x="130" y="283" class="text" text-anchor="middle" font-size="9">后台服务</text>

  <rect x="210" y="220" width="120" height="70" class="component-box"/>
  <text x="270" y="242" class="text" text-anchor="middle" font-weight="600">第三方应用</text>
  <text x="270" y="257" class="code" text-anchor="middle">Refresh Token</text>
  <text x="270" y="283" class="text" text-anchor="middle" font-size="9">开放平台</text>

  <rect x="70" y="310" width="260" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="200" y="330" class="text" text-anchor="middle" font-weight="600">🔐 注册客户端信息</text>
  <text x="85" y="348" class="text">• client_id: 唯一标识</text>
  <text x="85" y="362" class="text">• client_secret: 密钥</text>
  <text x="85" y="376" class="text">• redirect_uri: 回调地址</text>
  <text x="200" y="390" class="code" text-anchor="middle" font-size="9">OAuth2RegisteredClientEntity</text>

  <path d="M 200,410 L 200,440" class="flow-arrow"/>
  <text x="210" y="428" class="label-text">发起授权请求</text>

  <rect x="370" y="90" width="650" height="740" class="layer-box"/>
  <text x="695" y="115" class="section-title" text-anchor="middle">OAuth2 授权服务器 (Authorization Server)</text>

  <rect x="390" y="135" width="610" height="130" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <text x="695" y="157" class="section-title" text-anchor="middle">授权端点 (Authorization Endpoints)</text>

  <rect x="405" y="172" width="140" height="80" class="primary-box"/>
  <text x="475" y="190" style="font:600 11px sans-serif;fill:#ffffff" text-anchor="middle">/oauth2/authorize</text>
  <text x="475" y="207" class="text" fill="#e0e7ff" text-anchor="middle">授权请求</text>
  <text x="412" y="222" class="code" fill="#c7d2fe">• response_type</text>
  <text x="412" y="235" class="code" fill="#c7d2fe">• client_id</text>
  <text x="412" y="248" class="code" fill="#c7d2fe">• scope</text>

  <rect x="560" y="172" width="130" height="80" class="success-box"/>
  <text x="625" y="190" style="font:600 11px sans-serif;fill:#ffffff" text-anchor="middle">/oauth2/token</text>
  <text x="625" y="207" class="text" fill="#d1fae5" text-anchor="middle">令牌颁发</text>
  <text x="567" y="222" class="code" fill="#a7f3d0">• grant_type</text>
  <text x="567" y="235" class="code" fill="#a7f3d0">• code</text>
  <text x="567" y="248" class="code" fill="#a7f3d0">• refresh_token</text>

  <rect x="705" y="172" width="130" height="80" class="warning-box"/>
  <text x="770" y="190" style="font:600 11px sans-serif;fill:#ffffff" text-anchor="middle">/oauth2/revoke</text>
  <text x="770" y="207" class="text" fill="#fef3c7" text-anchor="middle">令牌撤销</text>
  <text x="712" y="222" class="code" fill="#fde68a">• token</text>
  <text x="712" y="235" class="code" fill="#fde68a">• token_type_hint</text>

  <rect x="850" y="172" width="135" height="80" class="component-box"/>
  <text x="917" y="190" class="text" text-anchor="middle" font-weight="600">/oauth2/introspect</text>
  <text x="917" y="207" class="text" text-anchor="middle">令牌验证</text>
  <text x="857" y="222" class="code">• token</text>
  <text x="857" y="235" class="code">返回: active</text>
  <text x="857" y="248" class="code">scope, exp, iat</text>

  <path d="M 475,252 L 475,285" class="arrow"/>
  <path d="M 625,252 L 625,285" class="arrow"/>
  <path d="M 770,252 L 770,285" class="arrow"/>
  <path d="M 917,252 L 917,285" class="arrow"/>

  <rect x="390" y="285" width="610" height="150" fill="#fef2f2" stroke="#f87171" stroke-width="2" rx="6"/>
  <text x="695" y="307" class="section-title" text-anchor="middle">核心服务层 (Service Layer)</text>

  <rect x="405" y="322" width="180" height="100" class="component-box"/>
  <text x="495" y="340" class="text" text-anchor="middle" font-weight="600">OAuth2AuthorizationService</text>
  <text x="412" y="358" class="code">• generateAuthorizationCode()</text>
  <text x="412" y="372" class="code">• issueAccessToken()</text>
  <text x="412" y="386" class="code">• refreshToken()</text>
  <text x="412" y="400" class="code">• revokeToken()</text>
  <text x="412" y="414" class="code">• validateToken()</text>

  <rect x="600" y="322" width="180" height="100" class="component-box"/>
  <text x="690" y="340" class="text" text-anchor="middle" font-weight="600">ClientManagementService</text>
  <text x="607" y="358" class="code">• registerClient()</text>
  <text x="607" y="372" class="code">• updateClient()</text>
  <text x="607" y="386" class="code">• getClientById()</text>
  <text x="607" y="400" class="code">• validateClientSecret()</text>
  <text x="607" y="414" class="code">• listClients()</text>

  <rect x="795" y="322" width="190" height="100" class="component-box"/>
  <text x="890" y="340" class="text" text-anchor="middle" font-weight="600">ConsentService</text>
  <text x="802" y="358" class="code">• requestConsent()</text>
  <text x="802" y="372" class="code">• saveConsent()</text>
  <text x="802" y="386" class="code">• getUserConsents()</text>
  <text x="802" y="400" class="code">• revokeConsent()</text>
  <text x="802" y="414" class="code" font-size="9">OAuth2AuthorizationConsentEntity</text>

  <path d="M 495,435 L 495,465" class="arrow"/>
  <path d="M 690,435 L 690,465" class="arrow"/>
  <path d="M 890,435 L 890,465" class="arrow"/>

  <rect x="390" y="465" width="610" height="120" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="695" y="487" class="section-title" text-anchor="middle">数据持久层 (Persistence Layer)</text>

  <rect x="405" y="502" width="180" height="70" class="db-box"/>
  <text x="495" y="520" class="text" text-anchor="middle" font-weight="600">授权数据表</text>
  <text x="412" y="536" class="code">oauth2_authorization</text>
  <text x="412" y="549" class="code">oauth2_authorization_code</text>
  <text x="412" y="562" class="code">oauth2_access_token</text>

  <rect x="600" y="502" width="180" height="70" class="db-box"/>
  <text x="690" y="520" class="text" text-anchor="middle" font-weight="600">客户端配置表</text>
  <text x="607" y="536" class="code">oauth2_registered_client</text>
  <text x="607" y="549" class="text" font-size="9">存储client_id、secret</text>
  <text x="607" y="562" class="text" font-size="9">redirect_uri、scopes</text>

  <rect x="795" y="502" width="190" height="70" class="db-box"/>
  <text x="890" y="520" class="text" text-anchor="middle" font-weight="600">用户授权同意表</text>
  <text x="802" y="536" class="code">oauth2_authorization_consent</text>
  <text x="802" y="549" class="text" font-size="9">记录用户对客户端的</text>
  <text x="802" y="562" class="text" font-size="9">授权范围和同意记录</text>

  <rect x="390" y="600" width="290" height="130" fill="#fefce8" stroke="#eab308" stroke-width="2" rx="6"/>
  <text x="535" y="622" class="section-title" text-anchor="middle">安全防护 (Security)</text>
  <text x="405" y="642" class="text">🔒 PKCE (Proof Key for Code Exchange)</text>
  <text x="405" y="659" class="text">🔒 Client Secret 加密存储 (BCrypt)</text>
  <text x="405" y="676" class="text">🔒 Token 黑名单机制 (Redis)</text>
  <text x="405" y="693" class="text">🔒 Scope 权限校验</text>
  <text x="405" y="710" class="text">🔒 CSRF 防护 (State参数)</text>
  <text x="405" y="727" class="text" font-size="9">TokenBlacklistService + 30分钟过期</text>

  <rect x="695" y="600" width="305" height="130" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="6"/>
  <text x="847" y="622" class="section-title" text-anchor="middle">Token 生成策略</text>
  <text x="710" y="642" class="code">Access Token: JWT</text>
  <text x="710" y="657" class="text" font-size="9">• 有效期: 2小时</text>
  <text x="710" y="670" class="text" font-size="9">• 包含: sub, scope, exp, iat</text>
  <text x="710" y="685" class="code">Refresh Token: UUID</text>
  <text x="710" y="700" class="text" font-size="9">• 有效期: 7天</text>
  <text x="710" y="713" class="text" font-size="9">• 自动续期: 剩余时间&lt;30分钟触发</text>
  <text x="710" y="726" class="text" font-size="9">• 一次性使用,刷新后旧Token失效</text>

  <rect x="390" y="750" width="610" height="65" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="695" y="770" class="section-title" text-anchor="middle">WebFlux 响应式架构特性</text>
  <text x="405" y="788" class="text">✅ 非阻塞I/O: 数据库操作使用 Mono/Flux + subscribeOn(Schedulers.boundedElastic())</text>
  <text x="405" y="803" class="text">✅ 背压支持: 大量Token验证请求自动限流</text>

  <rect x="1040" y="90" width="310" height="740" class="layer-box"/>
  <text x="1195" y="115" class="section-title" text-anchor="middle">资源服务器 (Resource Server)</text>

  <rect x="1060" y="135" width="270" height="90" class="component-box"/>
  <text x="1195" y="157" class="text" text-anchor="middle" font-weight="600">OAuth2ResourceServerFilter</text>
  <text x="1067" y="177" class="code">1. 从Header提取 Bearer Token</text>
  <text x="1067" y="191" class="code">2. 调用 /oauth2/introspect 验证</text>
  <text x="1067" y="205" class="code">3. 解析 scope 转换为 SCOPE_* 权限</text>
  <text x="1067" y="219" class="code">4. 设置 SecurityContext</text>

  <path d="M 1195,225 L 1195,245" class="arrow"/>

  <rect x="1060" y="245" width="270" height="140" fill="#fef2f2" stroke="#ef4444" stroke-width="2" rx="6"/>
  <text x="1195" y="265" class="section-title" text-anchor="middle">受保护资源端点</text>
  <text x="1067" y="285" class="code">/oauth2/api/v1/user/profile</text>
  <text x="1075" y="300" class="text" font-size="9">@PreAuthorize("hasAuthority('SCOPE_READ')")</text>
  <text x="1067" y="318" class="code">/oauth2/api/v1/orders</text>
  <text x="1075" y="333" class="text" font-size="9">@PreAuthorize("hasAuthority('SCOPE_WRITE')")</text>
  <text x="1067" y="351" class="code">/oauth2/api/v1/admin/users</text>
  <text x="1075" y="366" class="text" font-size="9">@PreAuthorize("hasAuthority('SCOPE_ADMIN')")</text>
  <text x="1075" y="379" class="text" font-size="9">需要同时满足 OAuth2 scope 和 RBAC 角色</text>

  <rect x="1060" y="400" width="270" height="110" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="1195" y="420" class="section-title" text-anchor="middle">Scope 权限体系</text>
  <text x="1067" y="438" class="code">read: 读取基础资源</text>
  <text x="1067" y="452" class="code">write: 创建和修改资源</text>
  <text x="1067" y="466" class="code">admin: 管理后台权限</text>
  <text x="1067" y="480" class="code">user:profile: 用户资料</text>
  <text x="1067" y="494" class="code">order:manage: 订单管理</text>
  <text x="1067" y="508" class="text" font-size="9">客户端注册时声明 scopes</text>

  <rect x="1060" y="525" width="270" height="90" fill="#fefce8" stroke="#eab308" stroke-width="2" rx="6"/>
  <text x="1195" y="545" class="section-title" text-anchor="middle">错误处理</text>
  <text x="1067" y="563" class="code">401 Unauthorized</text>
  <text x="1075" y="578" class="text" font-size="9">Token无效或已过期</text>
  <text x="1067" y="593" class="code">403 Forbidden</text>
  <text x="1075" y="608" class="text" font-size="9">Scope权限不足</text>

  <rect x="1060" y="630" width="270" height="85" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="6"/>
  <text x="1195" y="650" class="section-title" text-anchor="middle">双重认证策略</text>
  <text x="1067" y="668" class="text" font-size="10">路径: /api/v1/** → JwtAuthenticationFilter</text>
  <text x="1075" y="681" class="text" font-size="9">普通业务接口,验证JWT Token</text>
  <text x="1067" y="696" class="text" font-size="10">路径: /oauth2/api/** → OAuth2ResourceServerFilter</text>
  <text x="1075" y="709" class="text" font-size="9">开放平台接口,验证OAuth2 Token</text>

  <rect x="1060" y="730" width="270" height="85" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="1195" y="750" class="section-title" text-anchor="middle">配置开关</text>
  <text x="1067" y="768" class="code">apex.features.oauth2.enabled=true</text>
  <text x="1075" y="783" class="text" font-size="9">启用OAuth2授权服务器</text>
  <text x="1067" y="798" class="code">apex.features.oauth2.pkce-required=true</text>
  <text x="1075" y="813" class="text" font-size="9">强制要求PKCE(公共客户端)</text>

  <path d="M 350,180 L 390,180" class="flow-arrow"/>
  <path d="M 1000,372 L 1060,372" class="flow-arrow"/>
  <text x="1020" y="368" class="label-text">OAuth2 Token</text>

  <text x="700" y="885" class="code" text-anchor="middle">© 2026 Apex Team · OAuth2授权服务器架构 v3.0</text>
</svg>
