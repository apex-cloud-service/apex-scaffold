<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 13px sans-serif;fill:#64748b;text-anchor:middle}
      .grp{font:600 13px sans-serif;fill:#fff}
      .box-title{font:600 12px sans-serif;fill:#0f172a}
      .box-desc{font:400 10px sans-serif;fill:#475569}
      .code{font:500 9.5px monospace;fill:#2563eb}
      .note{font:500 11px sans-serif;fill:#64748b}
      .legend{font:500 11px sans-serif;fill:#475569}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="700" y="40" class="title">模块结构：apex-infrastructure（五个能力 JAR）</text>
  <text x="700" y="64" class="subtitle">com.apex.scaffold.infrastructure.* · 按能力拆分的共享设施 · 实现领域契约 · v1.3.1</text>

  <!-- five jars grid -->
  <rect x="40" y="92" width="430" height="230" rx="10" fill="#d97706" opacity="0.06" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="92" width="430" height="40" rx="10" fill="#d97706"/>
  <text x="60" y="118" class="grp">persistence · 持久化</text>
  <text x="60" y="150" class="code">├─ persistence.aspect / config</text>
  <text x="60" y="172" class="code">├─ persistence.datapermission（数据权限）</text>
  <text x="60" y="194" class="code">├─ persistence.repository / util</text>
  <text x="60" y="216" class="code">└─ metrics（基础设施指标）</text>
  <text x="60" y="246" class="legend" font-weight="600">职责</text>
  <text x="60" y="270" class="box-desc">• 多租户 SQL 注入 / 审计字段填充基座</text>
  <text x="60" y="292" class="box-desc">• 通用仓储与持久化工具，不含业务 Mapper</text>
  <text x="60" y="312" class="box-desc">← system、integration、messaging 依赖</text>

  <rect x="490" y="92" width="430" height="230" rx="10" fill="#d97706" opacity="0.06" stroke="#d97706" stroke-width="2"/>
  <rect x="490" y="92" width="430" height="40" rx="10" fill="#d97706"/>
  <text x="510" y="118" class="grp">cache · 缓存与限流</text>
  <text x="510" y="150" class="code">├─ cache.annotation / aspect / config</text>
  <text x="510" y="172" class="code">├─ cache.key / loader / wrapper / task</text>
  <text x="510" y="194" class="code">├─ cache.filter / metrics / prewarm / support</text>
  <text x="510" y="216" class="code">└─ ratelimit（local / distributed / adaptive）</text>
  <text x="510" y="246" class="legend" font-weight="600">职责</text>
  <text x="510" y="270" class="box-desc">• 多级缓存一致性 / 预热 / 指标</text>
  <text x="510" y="292" class="box-desc">• 限流算法与分布式限流实现</text>
  <text x="510" y="312" class="box-desc">← auth-service 直接依赖；integration 仅 test</text>

  <rect x="940" y="92" width="420" height="230" rx="10" fill="#d97706" opacity="0.06" stroke="#d97706" stroke-width="2"/>
  <rect x="940" y="92" width="420" height="40" rx="10" fill="#d97706"/>
  <text x="960" y="118" class="grp">messaging · 消息与事件</text>
  <text x="960" y="150" class="code">├─ mq.config / listener / handler / aspect</text>
  <text x="960" y="172" class="code">├─ mq.alert / monitor / metrics / protocol</text>
  <text x="960" y="194" class="code">├─ outbox（entity / mapper / service / dispatcher）</text>
  <text x="960" y="216" class="code">└─ event / notification</text>
  <text x="960" y="246" class="legend" font-weight="600">职责</text>
  <text x="960" y="270" class="box-desc">• RocketMQ 可靠消息 / 死信 / 监控告警</text>
  <text x="960" y="292" class="box-desc">• Outbox 本地消息表与轮询分发</text>
  <text x="960" y="312" class="box-desc">← auth-service 直接依赖；依赖 persistence</text>

  <rect x="40" y="342" width="430" height="230" rx="10" fill="#d97706" opacity="0.06" stroke="#d97706" stroke-width="2"/>
  <rect x="40" y="342" width="430" height="40" rx="10" fill="#d97706"/>
  <text x="60" y="368" class="grp">remote · 远程调用与容错</text>
  <text x="60" y="400" class="code">├─ remote.config / filter / logging / service</text>
  <text x="60" y="422" class="code">├─ circuitbreaker（熔断）</text>
  <text x="60" y="444" class="code">├─ chaos（混沌实验）</text>
  <text x="60" y="466" class="code">└─ logging（调用日志契约）</text>
  <text x="60" y="496" class="legend" font-weight="600">职责</text>
  <text x="60" y="520" class="box-desc">• 同步远程 SDK/HTTP 调用支撑</text>
  <text x="60" y="542" class="box-desc">• 熔断端口实现 / 混沌注入</text>
  <text x="60" y="562" class="box-desc">← integration、infra-integration、job-service 依赖</text>

  <rect x="490" y="342" width="430" height="230" rx="10" fill="#d97706" opacity="0.06" stroke="#d97706" stroke-width="2"/>
  <rect x="490" y="342" width="430" height="40" rx="10" fill="#d97706"/>
  <text x="510" y="368" class="grp">integration · 第三方集成</text>
  <text x="510" y="400" class="code">├─ chuanglan（短信）/ wechat（微信）</text>
  <text x="510" y="422" class="code">├─ encryption / excel / mail / security</text>
  <text x="510" y="444" class="code">├─ audit / config / metrics</text>
  <text x="510" y="466" class="code">└─ 实现共享 gateway：Chuanglan / WeChat</text>
  <text x="510" y="496" class="legend" font-weight="600">职责</text>
  <text x="510" y="520" class="box-desc">• 短信码 / 微信平台 / 加密 / Excel / 邮件</text>
  <text x="510" y="542" class="box-desc">• 依赖 infra-remote；缓存仅 test scope</text>
  <text x="510" y="562" class="box-desc">← auth、auth-service、example 直接依赖</text>

  <rect x="940" y="342" width="420" height="230" rx="10" fill="#94a3b8" opacity="0.10" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="940" y="342" width="420" height="40" rx="10" fill="#94a3b8"/>
  <text x="960" y="368" class="grp">apex-infrastructure（旧坐标兼容）</text>
  <text x="960" y="400" class="code">零实现源码，仅聚合五个能力 JAR</text>
  <text x="960" y="422" class="code">为旧依赖坐标保留，不再承载实现</text>
  <text x="960" y="450" class="legend" font-weight="600">迁移说明</text>
  <text x="960" y="474" class="box-desc">原共享 infrastructure 的持久化/缓存/消息/</text>
  <text x="960" y="494" class="box-desc">远程/集成能力已按上述五 JAR 拆分；</text>
  <text x="960" y="514" class="box-desc">业务专属基础设施在各业务库内</text>
  <text x="960" y="534" class="box-desc">（如 system 的 mapper/PO、auth 的 encryption）</text>

  <rect x="40" y="592" width="1320" height="220" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="620" class="box-title" font-size="14">依赖与边界</text>
  <text x="60" y="648" class="box-desc">1. 统一依赖：persistence / cache / messaging / remote → apex-domain + apex-common；integration → + infra-remote。</text>
  <text x="60" y="676" class="box-desc">2. 依赖倒置落地层：实现共享 domain 的 Gateway/端口（ChuanglanGateway、WeChatGateway、CircuitBreakerPort、DomainEventPublisher 等）。</text>
  <text x="60" y="704" class="box-desc">3. 业务专属基础设施不进共享 JAR：system Mapper/PO 留在 apex-system，auth 加密/调度留在 apex-auth。</text>
  <text x="60" y="732" class="box-desc">4. 阻塞调用在调用边界（含共享适配器内部）经 BlockingIoSchedulers 专用池隔离；共享 JAR 不替代调度器职责。</text>
  <text x="750" y="648" class="box-title" font-size="14">被依赖关系（生产 scope）</text>
  <text x="750" y="676" class="box-desc">persistence：system · integration · messaging　|　cache：system · auth-service · example</text>
  <text x="750" y="704" class="box-desc">messaging：system · auth-service　|　remote：system · integration · infra-integration · job-service</text>
  <text x="750" y="732" class="box-desc">integration：system · auth · auth-service · example</text>
  <text x="750" y="760" class="box-desc">旧坐标 apex-infrastructure：兼容聚合五个能力 JAR</text>

  <text x="700" y="872" class="note" text-anchor="middle">apex-infrastructure-* 是 DDD 依赖倒置的实现层：按能力拆分五 JAR，旧 apex-infrastructure 坐标仅作兼容聚合</text>
</svg>
