<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" width="1400" height="1200">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Scaffold 文件分片上传流程图</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-10</dc:date>
        <dc:version>3.0</dc:version>
        <dc:description>展示分片上传、秒传、断点续传、MinIO对象存储的完整流程</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main { font: 700 36px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .title-version { font: 500 14px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .step-title { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .step-desc { font: 400 12px system-ui, sans-serif; fill: #64748b; }
      .code-label { font: 400 11px 'SF Mono', monospace; fill: #2563eb; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1400" height="1200" fill="#ffffff"/>

  <text x="700" y="50" class="title-main">Apex Scaffold 文件分片上传流程</text>
  <text x="700" y="80" class="title-version">MinIO对象存储 · 秒传 · 断点续传 · 5MB分片 · 最大100MB · v3.0</text>

  <!-- 客户端列 -->
  <rect x="50" y="110" width="380" height="1000" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="140" class="step-title" fill="#3b82f6">客户端 (Vue 3 / 移动端)</text>

  <rect x="70" y="160" width="340" height="80" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="185" class="step-title">1. 选择文件 + 校验</text>
  <text x="90" y="205" class="code-label">文件类型: image/*, application/pdf</text>
  <text x="90" y="222" class="code-label">大小限制: 10MB (配置 max-size-bytes)</text>
  <text x="90" y="239" class="step-desc">前端预校验,避免无效上传</text>

  <line x1="240" y1="240" x2="240" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="270" width="340" height="90" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="295" class="step-title">2. 计算文件哈希 (MD5)</text>
  <text x="90" y="315" class="code-label">const fileHash = await calculateMD5(file)</text>
  <text x="90" y="332" class="step-desc">用于秒传检测和完整性校验</text>
  <text x="90" y="349" class="code-label">分片大小: 5MB (chunkSize = 5 * 1024 * 1024)</text>

  <line x1="240" y1="360" x2="240" y2="390" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="390" width="340" height="80" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="415" class="step-title">3. 请求秒传检测</text>
  <text x="90" y="435" class="code-label">GET /api/v1/files/check?hash={fileHash}</text>
  <text x="90" y="452" class="step-desc">检查文件是否已存在,实现秒传</text>

  <line x1="240" y1="470" x2="240" y2="500" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="500" width="340" height="100" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="525" class="step-title">4. 分片并发上传</text>
  <text x="90" y="545" class="code-label">POST /api/v1/files/generic</text>
  <text x="90" y="562" class="code-label">Content-Type: multipart/form-data</text>
  <text x="90" y="579" class="step-desc">并行上传3个分片,降低总耗时</text>
  <text x="90" y="596" class="code-label">Promise.all([chunk1, chunk2, chunk3])</text>

  <line x1="240" y1="600" x2="240" y2="630" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="630" width="340" height="80" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="90" y="655" class="step-title" fill="#059669">5. 上传完成</text>
  <text x="90" y="675" class="code-label">获取文件访问URL (预签名URL)</text>
  <text x="90" y="692" class="step-desc">有效期: 60分钟,支持直接访问</text>

  <!-- 服务端列 -->
  <rect x="480" y="110" width="420" height="1000" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="500" y="140" class="step-title" fill="#059669">服务端 (FileHandler + FileService)</text>

  <rect x="500" y="390" width="380" height="120" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="520" y="415" class="step-title">哈希查询 + 秒传</text>
  <text x="520" y="435" class="code-label">fileInfoRepository.findByHash(hash)</text>
  <text x="520" y="452" class="step-desc">✅ 已存在 → 直接返回URL (秒传成功)</text>
  <text x="520" y="469" class="step-desc">❌ 不存在 → 继续正常上传流程</text>
  <text x="520" y="486" class="code-label">节省带宽和存储空间</text>

  <line x1="690" y1="510" x2="690" y2="540" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="540" width="380" height="150" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="520" y="565" class="step-title">接收并处理分片</text>
  <text x="520" y="585" class="code-label">FileHandler.handleGenericUpload()</text>
  <text x="520" y="602" class="step-desc">1. 流式读取 readFileBytes(filePart)</text>
  <text x="520" y="619" class="step-desc">2. 大小校验 (超限立即返回错误)</text>
  <text x="520" y="636" class="step-desc">3. 内容类型检测 (魔数验证)</text>
  <text x="520" y="653" class="step-desc">4. 违规内容检测 (可选)</text>
  <text x="520" y="670" class="code-label">fileService.upload(filename, bytes, contentType)</text>

  <!-- 存储层列 -->
  <rect x="950" y="110" width="400" height="1000" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="970" y="140" class="step-title" fill="#d97706">存储层 (MinIO / TOS)</text>

  <rect x="970" y="200" width="360" height="120" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="990" y="225" class="step-title">策略模式选择存储</text>
  <text x="990" y="245" class="code-label">storage.default-type = minio</text>
  <text x="990" y="262" class="step-desc">• MinIO (本地对象存储)</text>
  <text x="990" y="279" class="step-desc">• 火山引擎 TOS (云对象存储)</text>
  <text x="990" y="296" class="step-desc">• Local (本地文件系统)</text>
  <text x="990" y="313" class="code-label">AbstractStorageService 统一接口</text>

  <line x1="1150" y1="320" x2="1150" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="970" y="360" width="360" height="180" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="990" y="385" class="step-title">MinIO 存储执行</text>
  <text x="990" y="405" class="code-label">MinioServiceImpl.doUpload()</text>
  <text x="990" y="422" class="step-desc">1. 生成唯一文件名 (UUID)</text>
  <text x="990" y="439" class="code-label">   {uuid}_{timestamp}.{ext}</text>
  <text x="990" y="456" class="step-desc">2. 上传到存储桶</text>
  <text x="990" y="473" class="code-label">   bucket: apex-files</text>
  <text x="990" y="490" class="code-label">   path: /{tenantId}/{yyyymm}/{uuid}.bin</text>
  <text x="990" y="507" class="step-desc">3. 返回对象Key</text>
  <text x="990" y="524" class="code-label">   MinIO Endpoint: http://localhost:9000</text>

  <line x1="1150" y1="540" x2="1150" y2="580" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="970" y="580" width="360" height="130" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="990" y="605" class="step-title">生成预签名URL</text>
  <text x="990" y="625" class="code-label">getPresignedUrl(bucketName, objectKey, 60)</text>
  <text x="990" y="642" class="step-desc">有效期: 60分钟</text>
  <text x="990" y="659" class="step-desc">签名算法: HMAC-SHA256</text>
  <text x="990" y="676" class="code-label">返回: https://minio.example.com/...</text>
  <text x="990" y="693" class="step-desc">客户端可直接访问,无需认证</text>

  <!-- 连接线 -->
  <line x1="410" y1="430" x2="500" y2="430" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="560" x2="500" y2="560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="880" y1="610" x2="970" y2="610" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="640" x2="880" y2="640" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>

  <line x1="500" y1="670" x2="410" y2="670" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>

  <!-- 高级特性 -->
  <rect x="50" y="760" width="850" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="790" class="step-title">高级特性与优化</text>

  <rect x="70" y="810" width="390" height="250" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="835" class="step-title">断点续传 (Resumable Upload)</text>
  <text x="90" y="858" class="step-desc">• Redis记录上传进度</text>
  <text x="90" y="875" class="code-label">  key: upload:progress:{uploadId}</text>
  <text x="90" y="892" class="code-label">  value: {"uploaded": [0,1,2,5], "total": 10}</text>
  <text x="90" y="909" class="step-desc">• 客户端断线重连后查询进度</text>
  <text x="90" y="926" class="step-desc">• 只上传未完成的分片,节省流量</text>
  <text x="90" y="943" class="step-desc">• 临时分片7天自动清理</text>

  <text x="90" y="970" class="step-title">安全机制</text>
  <text x="90" y="990" class="step-desc">• 文件类型魔数验证 (防伪造扩展名)</text>
  <text x="90" y="1007" class="step-desc">• 租户级存储配额校验</text>
  <text x="90" y="1024" class="step-desc">• 违规内容检测 (ClamAV病毒扫描可选)</text>
  <text x="90" y="1041" class="step-desc">• 预签名URL限时访问,防盗链</text>

  <rect x="480" y="810" width="400" height="250" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="500" y="835" class="step-title">秒传机制 (Instant Upload)</text>
  <text x="500" y="858" class="step-desc">• 原理: 基于文件MD5哈希去重</text>
  <text x="500" y="875" class="code-label">  sys_file_info.file_hash (唯一索引)</text>
  <text x="500" y="892" class="step-desc">• 流程: 先查询哈希是否存在</text>
  <text x="500" y="909" class="step-desc">  ✅ 存在 → 直接返回URL (耗时&lt;100ms)</text>
  <text x="500" y="926" class="step-desc">  ❌ 不存在 → 正常上传</text>
  <text x="500" y="943" class="step-desc">• 效果: 重复文件0流量传输</text>
  <text x="500" y="960" class="step-desc">• 典型场景: 群聊转发图片</text>

  <text x="500" y="990" class="step-title">性能优化</text>
  <text x="500" y="1010" class="step-desc">• 分片并发上传 (3线程并行)</text>
  <text x="500" y="1027" class="step-desc">• 流式读取,避免大文件OOM</text>
  <text x="500" y="1044" class="step-desc">• MinIO composeObject 零拷贝合并</text>

  <rect x="950" y="760" width="400" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="970" y="790" class="step-title">数据库设计</text>

  <rect x="970" y="810" width="360" height="120" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="990" y="835" class="step-title">sys_file_info (文件元数据)</text>
  <text x="990" y="858" class="code-label">id, bucket_name, object_key</text>
  <text x="990" y="875" class="code-label">file_hash (MD5, 唯一索引)</text>
  <text x="990" y="892" class="code-label">file_size, content_type</text>
  <text x="990" y="909" class="code-label">upload_time, tenant_id</text>

  <rect x="970" y="950" width="360" height="110" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="990" y="975" class="step-title">sys_tenant (租户配额)</text>
  <text x="990" y="998" class="code-label">id, storage_quota (总配额 GB)</text>
  <text x="990" y="1015" class="code-label">storage_used (已用 GB)</text>
  <text x="990" y="1032" class="code-label">上传时实时累加 used 字段</text>
  <text x="990" y="1049" class="step-desc">超限拒绝上传 (QUOTA_EXCEEDED)</text>

  <text x="700" y="1190" class="code-label" text-anchor="middle">© 2026 Apex Team · 文件分片上传流程 v3.0 · 基于 FileHandler/MinioServiceImpl 实际代码生成</text>
</svg>
