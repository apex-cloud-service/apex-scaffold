<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950"><defs><style>.t{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.h{font:700 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.l{font:14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.c{font:12px 'Courier New',monospace;fill:#334155}.a{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:14}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}.w{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.b{fill:#fff;stroke:#0891b2;stroke-width:2;rx:14}.line{stroke:#4f46e5;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#4f46e5"/></marker></defs><rect width="1600" height="950" fill="#f8fafc"/><text x="800" y="48" text-anchor="middle" class="t">监控配置链路图 (Monitoring Configuration)</text><text x="800" y="76" text-anchor="middle" class="s">指标采集、存储、告警、可视化与链路追踪</text><rect x="70" y="150" width="300" height="210" class="b"/><text x="220" y="190" text-anchor="middle" class="h">应用与探针目标</text><text x="95" y="230" class="l">应用 /actuator/prometheus</text><text x="95" y="260" class="l">应用健康检查 :8081</text><text x="95" y="290" class="l">Blackbox Exporter :9115</text><text x="95" y="320" class="l">Node Exporter :9100</text><rect x="500" y="120" width="330" height="270" class="a"/><text x="665" y="160" text-anchor="middle" class="h">Prometheus :8083</text><text x="525" y="205" class="c">scrape_interval: 15s</text><text x="525" y="235" class="c">scrape_timeout: 10s</text><text x="525" y="265" class="c">evaluation_interval: 15s</text><text x="525" y="310" class="l">规则目录 /etc/prometheus/rules</text><text x="525" y="340" class="l">数据保留 15 天</text><path d="M370 250H500" class="line"/><rect x="960" y="140" width="250" height="150" class="w"/><text x="1085" y="180" text-anchor="middle" class="h">Alertmanager :9093</text><text x="985" y="225" class="l">18 条告警规则</text><text x="985" y="255" class="l">路由、分组、通知</text><path d="M830 210H960" class="line"/><rect x="1300" y="140" width="220" height="150" class="g"/><text x="1410" y="180" text-anchor="middle" class="h">Grafana :3000</text><text x="1325" y="225" class="l">11 个分组</text><text x="1325" y="255" class="l">66 个面板</text><path d="M1210 215H1300" class="line"/><rect x="500" y="520" width="330" height="170" class="b"/><text x="665" y="560" text-anchor="middle" class="h">核心指标</text><text x="525" y="600" class="l">apex_* 应用指标</text><text x="525" y="630" class="l">错误率 · 延迟 · JVM 堆</text><text x="525" y="660" class="l">限流 · 数据库 · 缓存</text><rect x="960" y="500" width="300" height="190" class="a"/><text x="1110" y="540" text-anchor="middle" class="h">探针与链路</text><text x="985" y="580" class="l">/actuator/health</text><text x="985" y="610" class="l">Grafana /api/health</text><text x="985" y="640" class="l">Zipkin :9411</text><text x="985" y="670" class="l">HTTP 可用性探测</text><path d="M665 390V520" class="line"/><path d="M1085 290V500" class="line"/><text x="800" y="800" text-anchor="middle" class="s">配置重点：抓取目标、规则文件、15 天保留、面板数据源和告警通知链路必须一致</text></svg>
