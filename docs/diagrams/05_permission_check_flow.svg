<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1700" width="1500" height="1700">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Scaffold RBAC权限校验流程图</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-10</dc:date>
        <dc:version>3.0</dc:version>
        <dc:description>展示RBAC三层权限校验:JWT认证、@RequirePermission切面、数据权限DataScope</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main {
        font: 700 36px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .title-version {
        font: 500 16px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
      .layer-label {
        font: 600 16px system-ui, sans-serif;
        fill: #64748b;
      }
      .step-number {
        font: 700 16px system-ui, sans-serif;
        fill: #ffffff;
        text-anchor: middle;
      }
      .step-desc {
        font: 500 14px system-ui, sans-serif;
        fill: #0f172a;
      }
      .code-label {
        font: 400 12px 'SF Mono', monospace;
        fill: #2563eb;
      }
      .note-text {
        font: 400 13px system-ui, sans-serif;
        fill: #475569;
      }
      .decision-text {
        font: 600 14px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .error-text {
        font: 600 14px system-ui, sans-serif;
        fill: #dc2626;
      }
      .success-text {
        font: 600 14px system-ui, sans-serif;
        fill: #059669;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

    <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>

    <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1500" height="1700" fill="#ffffff"/>

  <text x="750" y="50" class="title-main">Apex Scaffold RBAC 权限校验流程</text>
  <text x="750" y="80" class="title-version">三层权限模型 · JWT + RBAC + DataScope · Caffeine缓存60秒 · v3.0</text>

  <rect x="50" y="110" width="1400" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="135" class="layer-label">L1: JWT认证层</text>
  <text x="70" y="155" class="note-text">JwtAuthenticationFilter → Token解析 → SecurityContext</text>

  <rect x="50" y="180" width="1400" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="70" y="205" class="layer-label">L2: 接口权限层</text>
  <text x="70" y="225" class="note-text">@RequirePermission → RequirePermissionAspect → RBAC校验</text>

  <rect x="50" y="250" width="1400" height="60" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text x="70" y="275" class="layer-label">L3: 数据权限层</text>
  <text x="70" y="295" class="note-text">@DataScope → DataScopeAspect → SQL注入WHERE条件</text>

  <g id="step1-request">
    <circle cx="100" cy="370" r="20" fill="#4f46e5"/>
    <text x="100" y="377" class="step-number">1</text>

    <rect x="150" y="340" width="300" height="60" rx="8" fill="#f0f9ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="170" y="365" class="step-desc">HTTP 请求携带 JWT Token</text>
    <text x="170" y="385" class="code-label">Authorization: Bearer {accessToken}</text>
  </g>

  <line x1="300" y1="400" x2="300" y2="440" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="step2-jwt-filter">
    <circle cx="100" cy="470" r="20" fill="#4f46e5"/>
    <text x="100" y="477" class="step-number">2</text>

    <rect x="150" y="440" width="300" height="80" rx="8" fill="#f0f9ff" stroke="#0891b2" stroke-width="2"/>
    <text x="170" y="465" class="step-desc">JwtAuthenticationFilter</text>
    <text x="170" y="485" class="code-label">1. 提取Token</text>
    <text x="170" y="503" class="code-label">2. 检查黑名单</text>
    <text x="170" y="520" class="code-label">3. 解析Claims获取openId</text>
  </g>

  <path d="M300 520 L300 560 L200 560" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="decision1-token-valid">
    <path d="M200 560 L260 600 L200 640 L140 600 Z" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="200" y="605" class="decision-text">Token</text>
    <text x="200" y="622" class="decision-text">有效?</text>
  </g>

  <path d="M140 600 L70 600 L70 680" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-error)"/>
  <text x="85" y="640" class="error-text">否</text>

  <rect x="20" y="680" width="200" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="40" y="705" class="error-text">401 Unauthorized</text>
  <text x="40" y="725" class="code-label">Token无效/过期/黑名单</text>

  <path d="M260 600 L330 600" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="270" y="592" class="success-text">是</text>

  <g id="step3-get-user">
    <circle cx="560" cy="470" r="20" fill="#4f46e5"/>
    <text x="560" y="477" class="step-number">3</text>

    <rect x="330" y="570" width="280" height="80" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <text x="350" y="595" class="step-desc">查询用户信息和角色</text>
    <text x="350" y="615" class="code-label">userRepository.findByOpenId()</text>
    <text x="350" y="633" class="code-label">roleRepository.findByUserId()</text>
  </g>

  <path d="M470 650 L470 690" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="step4-check-admin">
    <circle cx="560" cy="720" r="20" fill="#4f46e5"/>
    <text x="560" y="727" class="step-number">4</text>

    <path d="M470 690 L540 740 L470 790 L400 740 Z" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="470" y="745" class="decision-text">是否管理员?</text>
    <text x="450" y="763" class="code-label">ROLE_ADMIN</text>
  </g>

  <path d="M540 740 L650 740" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="555" y="732" class="success-text">是</text>

  <rect x="650" y="710" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="670" y="735" class="success-text">管理员直接放行</text>
  <text x="670" y="755" class="code-label">跳过权限检查</text>

  <path d="M470 790 L470 850" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="820" class="note-text">否</text>

  <g id="step5-permission-check">
    <circle cx="560" cy="880" r="20" fill="#4f46e5"/>
    <text x="560" y="887" class="step-number">5</text>

    <rect x="330" y="850" width="280" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="350" y="875" class="step-desc">@RequirePermission 切面拦截</text>
    <text x="350" y="895" class="code-label">RequirePermissionAspect</text>
    <text x="350" y="913" class="note-text">解析注解: value, logical</text>
    <text x="350" y="931" class="note-text">所需权限: ["system:user:list"]</text>
  </g>

  <path d="M470 950 L470 990" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="step6-query-permissions">
    <circle cx="560" cy="1020" r="20" fill="#4f46e5"/>
    <text x="560" y="1027" class="step-number">6</text>

    <rect x="330" y="990" width="280" height="120" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="350" y="1015" class="step-desc">查询用户权限 (带缓存)</text>
    <text x="350" y="1035" class="code-label">permissionService.getPermissions()</text>
    <text x="350" y="1053" class="note-text">Caffeine本地缓存 TTL:60秒</text>
    <text x="350" y="1071" class="note-text">Redis key: apex:perm:{tid}:{uid}</text>
    <text x="350" y="1089" class="note-text">SQL: sys_user_role → sys_role_menu</text>
  </g>

  <rect x="680" y="990" width="760" height="280" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="1015" class="layer-label">RBAC 数据模型</text>

  <rect x="700" y="1030" width="200" height="90" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="720" y="1055" class="step-desc">sys_user (用户表)</text>
  <text x="720" y="1075" class="code-label">id, username, openId</text>
  <text x="720" y="1093" class="code-label">phone, status</text>

  <rect x="940" y="1030" width="220" height="90" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="960" y="1055" class="step-desc">sys_user_role (关联表)</text>
  <text x="960" y="1075" class="code-label">user_id, role_id</text>
  <text x="960" y="1093" class="code-label">N:N 关系</text>

  <rect x="1200" y="1030" width="220" height="90" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1220" y="1055" class="step-desc">sys_role (角色表)</text>
  <text x="1220" y="1075" class="code-label">id, name, code</text>
  <text x="1220" y="1093" class="code-label">ADMIN, USER, GUEST</text>

  <rect x="940" y="1150" width="220" height="90" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="960" y="1175" class="step-desc">sys_role_menu (关联表)</text>
  <text x="960" y="1195" class="code-label">role_id, menu_id</text>
  <text x="960" y="1213" class="code-label">N:N 关系</text>

  <rect x="1200" y="1150" width="220" height="90" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1220" y="1175" class="step-desc">sys_menu (菜单/权限表)</text>
  <text x="1220" y="1195" class="code-label">id, name</text>
  <text x="1220" y="1213" class="code-label">permission_code</text>
  <text x="1220" y="1231" class="code-label">system:user:list</text>

  <line x1="900" y1="1075" x2="940" y2="1075" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1160" y1="1075" x2="1200" y2="1075" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="1120" x2="1050" y2="1150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1160" y1="1195" x2="1200" y2="1195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="decision2-has-permission">
    <circle cx="100" cy="1180" r="20" fill="#4f46e5"/>
    <text x="100" y="1187" class="step-number">7</text>

    <path d="M470 1110 L470 1160 L350 1160 L350 1200 L290 1200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M290 1200 L360 1250 L290 1300 L220 1250 Z" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="290" y="1248" class="decision-text">权限匹配?</text>
    <text x="290" y="1265" class="code-label">Logical.AND/OR</text>
  </g>

  <path d="M220 1250 L140 1250 L140 1330" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-error)"/>
  <text x="155" y="1290" class="error-text">否</text>

  <rect x="50" y="1330" width="180" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="1355" class="error-text">403 Forbidden</text>
  <text x="70" y="1375" class="code-label">权限不足,访问被拒绝</text>

  <path d="M360 1250 L450 1250" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="370" y="1242" class="success-text">是</text>

  <g id="step8-data-scope">
    <circle cx="100" cy="1450" r="20" fill="#4f46e5"/>
    <text x="100" y="1457" class="step-number">8</text>

    <rect x="450" y="1220" width="280" height="100" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <text x="470" y="1245" class="step-desc">@DataScope 数据权限 (可选)</text>
    <text x="470" y="1265" class="code-label">DataScopeAspect</text>
    <text x="470" y="1283" class="note-text">type: ALL / DEPT / DEPT_CHILD</text>
    <text x="470" y="1301" class="note-text">注入WHERE条件到MyBatis SQL</text>
  </g>

  <path d="M590" y1="1320" x2="590" y2="1380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g id="step9-execute-business">
    <circle cx="100" cy="1550" r="20" fill="#4f46e5"/>
    <text x="100" y="1557" class="step-number">9</text>

    <rect x="450" y="1380" width="280" height="80" rx="8" fill="#f0f9ff" stroke="#0891b2" stroke-width="2"/>
    <text x="470" y="1405" class="step-desc">执行业务方法</text>
    <text x="470" y="1425" class="code-label">UserHandler.listUsers()</text>
    <text x="470" y="1443" class="note-text">返回过滤后的数据</text>
  </g>

  <path d="M590" y1="1460" x2="590" y2="1500" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>

  <rect x="450" y="1500" width="280" height="60" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="470" y="1525" class="success-text">200 OK</text>
  <text x="470" y="1545" class="code-label">Result&lt;List&lt;UserDTO&gt;&gt;</text>

  <rect x="850" y="1380" width="590" height="180" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="870" y="1405" class="layer-label">权限注解示例</text>

  <rect x="870" y="1420" width="260" height="60" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="890" y="1442" class="code-label">@RequirePermission(</text>
  <text x="900" y="1460" class="code-label">value = "system:user:list",</text>
  <text x="900" y="1476" class="code-label">logical = Logical.AND)</text>

  <rect x="1160" y="1420" width="260" height="60" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1"/>
  <text x="1180" y="1442" class="code-label">@DataScope(</text>
  <text x="1190" y="1460" class="code-label">type = DEPT_AND_CHILD)</text>
  <text x="1180" y="1476" class="code-label">public Mono&lt;List&lt;User&gt;&gt;</text>

  <rect x="870" y="1500" width="550" height="50" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="890" y="1522" class="note-text">注解组合: 同时满足接口权限 + 数据权限两层过滤</text>
  <text x="890" y="1540" class="note-text">管理员自动跳过权限检查,但仍然执行数据权限过滤</text>

  <rect x="50" y="1600" width="1400" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="1625" class="layer-label">性能优化策略</text>
  <text x="70" y="1650" class="note-text">• Caffeine本地缓存: 60秒TTL,避免频繁查询数据库</text>
  <text x="70" y="1670" class="note-text">• Redis分布式缓存: 7天TTL,跨实例共享权限数据</text>
  <text x="800" y="1650" class="note-text">• 管理员快速通道: ROLE_ADMIN直接放行,零数据库查询</text>
  <text x="800" y="1670" class="note-text">• 敏感路径强制刷新: /admin-api/v1/permissions 等路径跳过缓存</text>

  <text x="750" y="1695" class="note-text" text-anchor="middle">© 2026 Apex Team · RBAC权限校验流程 v3.0 · 基于 RequirePermissionAspect 实际代码生成</text>
</svg>
