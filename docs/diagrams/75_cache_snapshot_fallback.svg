<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43a047;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e53935;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64b5f6" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66bb6a" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef5350" />
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#0a0e27"/>

  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">缓存快照降级流程 (Degrade Fallback)</text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="14" fill="#64b5f6" text-anchor="middle">Sentinel 熔断/限流触发时的业务级兜底机制</text>

  <rect x="50" y="100" width="650" height="300" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">正常流程：快照录制</text>

  <rect x="70" y="150" width="180" height="100" rx="6" fill="url(#successGrad)" stroke="#66bb6a" stroke-width="2"/>
  <text x="160" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 请求成功</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e8f5e9">业务接口正常响应</text>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="10" fill="#e8f5e9">返回 Result&lt;T&gt; data</text>
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">资源名: resource</text>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">响应数据: data</text>

  <rect x="280" y="150" width="200" height="100" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="380" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 保存到本地缓存</text>
  <text x="290" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">localFallbackCache</text>
  <text x="290" y="210" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">  .put(key, entry)</text>
  <text x="290" y="225" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">entry = {data, timestamp}</text>
  <text x="290" y="240" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">✓ 始终更新</text>

  <rect x="510" y="150" width="170" height="100" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="595" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 节流写 Redis</text>
  <text x="520" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">检查节流窗口</text>
  <text x="520" y="210" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">5秒内只写一次</text>
  <text x="520" y="225" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">异步写入 Redis</text>
  <text x="520" y="240" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">TTL: 5分钟</text>

  <rect x="70" y="270" width="610" height="110" rx="6" fill="#0d47a1" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="375" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffd54f" text-anchor="middle">防写放大与内存控制</text>
  <text x="80" y="315" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">1. Redis 写入节流: 同一资源在 redisThrottleSeconds (默认5秒) 窗口内最多写一次 Redis</text>
  <text x="80" y="332" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">2. 本地缓存不受节流限制: 始终更新，保证最新数据可用于降级</text>
  <text x="80" y="349" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">3. 容量上限淘汰: 超过 localMaxEntries (默认256) 时按 LRU 淘汰最旧条目</text>
  <text x="80" y="366" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">4. 惰性过期: 读取时校验 TTL (5分钟)，过期条目即时清理</text>

  <rect x="50" y="420" width="650" height="320" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">降级流程：快照读取</text>

  <rect x="70" y="470" width="180" height="100" rx="6" fill="url(#errorGrad)" stroke="#ef5350" stroke-width="2"/>
  <text x="160" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 触发熔断/限流</text>
  <text x="80" y="515" font-family="Arial, sans-serif" font-size="10" fill="#ffebee">Sentinel 拒绝请求</text>
  <text x="80" y="530" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2">BlockException</text>
  <text x="80" y="545" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2">FlowException</text>
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2">DegradeException</text>

  <rect x="280" y="470" width="200" height="100" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="380" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 尝试 Redis 读取</text>
  <text x="290" y="515" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">redisTemplate</text>
  <text x="290" y="530" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">  .opsForValue().get(key)</text>
  <text x="290" y="545" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">→ 命中返回快照</text>
  <text x="290" y="560" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">→ 失败回退本地</text>

  <rect x="510" y="470" width="170" height="100" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="595" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 本地缓存回退</text>
  <text x="520" y="515" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">localFallbackCache</text>
  <text x="520" y="530" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">  .get(key)</text>
  <text x="520" y="545" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">校验 TTL 未过期</text>
  <text x="520" y="560" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">返回 entry.data</text>

  <rect x="70" y="590" width="295" height="130" rx="6" fill="url(#successGrad)" stroke="#66bb6a" stroke-width="2"/>
  <text x="217" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4a. 读接口 - 快照命中</text>
  <text x="80" y="635" font-family="Arial, sans-serif" font-size="10" fill="#e8f5e9">返回缓存数据 + degraded=true</text>
  <text x="80" y="650" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">Result.success(snapshot, traceId)</text>
  <text x="80" y="665" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">✓ 用户体验平滑</text>
  <text x="80" y="680" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">✓ 数据稍有延迟可接受</text>
  <text x="80" y="695" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">✓ 避免完全不可用</text>
  <text x="80" y="710" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">示例: 查询接口、列表接口</text>

  <rect x="385" y="590" width="295" height="130" rx="6" fill="#ef6c00" stroke="#ffa726" stroke-width="2"/>
  <text x="532" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4b. 写接口 - 返回排队中</text>
  <text x="395" y="635" font-family="Arial, sans-serif" font-size="10" fill="#fff3e0">写操作无法返回缓存</text>
  <text x="395" y="650" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2">Result.error(2003,</text>
  <text x="405" y="665" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2">  "系统繁忙，请求已排队")</text>
  <text x="395" y="680" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2">✓ 提示稍后查询结果</text>
  <text x="395" y="695" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2">✓ 客户端重试机制</text>
  <text x="395" y="710" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">示例: 创建接口、更新接口</text>

  <path d="M 250 200 L 280 200" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 480 200 L 510 200" stroke="#64b5f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 250 520 L 280 520" stroke="#ef5350" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 480 520 L 510 520" stroke="#64b5f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 380 570 L 217 590" stroke="#66bb6a" stroke-width="2" marker-end="url(#arrowGreen)" stroke-dasharray="5,5"/>
  <text x="290" y="575" font-family="Arial, sans-serif" font-size="9" fill="#66bb6a">命中</text>
  <path d="M 380 570 L 532 590" stroke="#ffa726" stroke-width="2" marker-end="url(#arrowRed)" stroke-dasharray="5,5"/>
  <text x="470" y="575" font-family="Arial, sans-serif" font-size="9" fill="#ffa726">写操作</text>

  <rect x="730" y="100" width="620" height="310" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">核心设计</text>

  <rect x="750" y="150" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="890" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">双层缓存架构</text>
  <text x="760" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">L1: 本地内存 (ConcurrentHashMap)</text>
  <text x="770" y="210" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">• 高速访问 (纳秒级)</text>
  <text x="770" y="225" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">• 容量上限 256 条</text>
  <text x="760" y="240" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">L2: Redis (ReactiveRedisTemplate)</text>
  <text x="770" y="255" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">• 分布式共享 (毫秒级)</text>

  <rect x="1050" y="150" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1190" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">快照 Key 设计</text>
  <text x="1060" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">degrade:snapshot:{resource}</text>
  <text x="1060" y="210" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">resource = Sentinel 资源名</text>
  <text x="1060" y="225" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">示例:</text>
  <text x="1070" y="240" font-family="monospace" font-size="9" fill="#a5d6a7">degrade:snapshot:api:user:list</text>
  <text x="1070" y="253" font-family="monospace" font-size="9" fill="#a5d6a7">degrade:snapshot:sms:send</text>

  <rect x="750" y="280" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="890" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">配置参数</text>
  <text x="760" y="323" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">apex.degrade.snapshot:</text>
  <text x="770" y="338" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">• enabled: true (总开关)</text>
  <text x="770" y="353" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">• redis-throttle-seconds: 5</text>
  <text x="770" y="368" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">• local-max-entries: 256</text>
  <text x="760" y="383" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">未配置时使用默认值</text>

  <rect x="1050" y="280" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1190" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">使用示例</text>
  <text x="1060" y="323" font-family="monospace" font-size="9" fill="#a5d6a7">// 正常响应后保存快照</text>
  <text x="1060" y="338" font-family="monospace" font-size="9" fill="#a5d6a7">degradeService.saveSnapshot(</text>
  <text x="1070" y="353" font-family="monospace" font-size="9" fill="#a5d6a7">  "api:user:list", result);</text>
  <text x="1060" y="370" font-family="monospace" font-size="9" fill="#a5d6a7">// 降级时获取快照</text>
  <text x="1060" y="385" font-family="monospace" font-size="9" fill="#a5d6a7">degradeService.getSnapshot(resource)</text>

  <rect x="730" y="430" width="620" height="310" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="460" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">应用场景与效果</text>

  <rect x="750" y="480" width="280" height="110" rx="6" fill="#2e7d32" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="890" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">典型场景</text>
  <text x="760" y="523" font-family="Arial, sans-serif" font-size="10" fill="#e8f5e9">1. Sentinel 限流触发</text>
  <text x="770" y="538" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">→ 查询接口返回缓存列表</text>
  <text x="760" y="553" font-family="Arial, sans-serif" font-size="10" fill="#e8f5e9">2. 后端服务熔断</text>
  <text x="770" y="568" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">→ 用户看到上次成功数据</text>
  <text x="760" y="583" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">比统一错误码体验更好</text>

  <rect x="1050" y="480" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1190" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">降级效果对比</text>
  <text x="1060" y="523" font-family="Arial, sans-serif" font-size="10" fill="#ef5350">无快照: "服务暂时不可用"</text>
  <text x="1070" y="538" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2">→ 用户体验差，完全不可用</text>
  <text x="1060" y="553" font-family="Arial, sans-serif" font-size="10" fill="#66bb6a">有快照: 返回缓存数据</text>
  <text x="1070" y="568" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">→ 数据稍旧但可用</text>
  <text x="1070" y="583" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">→ 用户可继续浏览</text>

  <rect x="750" y="610" width="580" height="110" rx="6" fill="#0d47a1" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1040" y="635" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffd54f" text-anchor="middle">设计亮点</text>
  <text x="760" y="653" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">1. Redis 写入节流: 高频更新场景下减少 80% 的 Redis 写入压力</text>
  <text x="760" y="668" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">2. 本地缓存始终更新: 保证降级时能获取到最新成功的本地数据</text>
  <text x="760" y="683" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">3. 容量淘汰 + 惰性过期: 防止内存积攒，自动清理过期条目</text>
  <text x="760" y="698" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">4. 读写分离策略: 读接口返回快照，写接口返回排队状态，符合业务语义</text>
  <text x="760" y="713" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">5. 可选依赖: ReactiveRedisTemplate 未配置时自动降级为纯本地缓存</text>

  <text x="700" y="770" font-family="Arial, sans-serif" font-size="11" fill="#546e7a" text-anchor="middle">© 2026 Apex Team · 缓存快照降级流程 v1.0 · apex-interfaces/exception/DegradeFallbackService.java</text>
</svg>
