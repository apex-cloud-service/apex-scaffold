<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 13px sans-serif;fill:#64748b;text-anchor:middle}
      .grp{font:600 13px sans-serif;fill:#fff}
      .box-title{font:600 12px sans-serif;fill:#0f172a}
      .box-desc{font:400 10px sans-serif;fill:#475569}
      .code{font:500 9.5px monospace;fill:#2563eb}
      .note{font:500 11px sans-serif;fill:#64748b}
      .legend{font:500 11px sans-serif;fill:#475569}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="700" y="40" class="title">模块结构：apex-system</text>
  <text x="700" y="64" class="subtitle">com.apex.scaffold.application · 应用层 · 用例编排 / DTO / 装配器 · v1.3.1</text>

  <rect x="40" y="92" width="430" height="740" rx="10" fill="#0891b2" opacity="0.06" stroke="#0891b2" stroke-width="2"/>
  <rect x="40" y="92" width="430" height="40" rx="10" fill="#0891b2"/>
  <text x="60" y="118" class="grp">包结构（com.apex.scaffold.application.*）</text>
  <text x="60" y="148" class="code">├─ service（扁平用例 + service.impl）</text>
  <text x="60" y="170" class="code">│  ├─ service.auth（认证票据/注册渠道）</text>
  <text x="60" y="192" class="code">│  └─ service.login（登录策略族）</text>
  <text x="60" y="214" class="code">├─ dto / dto.admin / dto.internal / dto.log</text>
  <text x="60" y="236" class="code">│  └─ dto.search / dto.usage</text>
  <text x="60" y="258" class="code">├─ assembler / factory</text>
  <text x="60" y="280" class="code">├─ security / support / support.sso</text>
  <text x="60" y="302" class="code">├─ event / listener</text>
  <text x="60" y="324" class="code">├─ job / scheduler</text>
  <text x="60" y="346" class="code">├─ capability / openplatform / config</text>
  <text x="60" y="374" class="note">注：office / workflow 子域已迁至独立 apex-office、apex-workflow 库</text>

  <text x="60" y="416" class="legend" font-weight="600">职责定位</text>
  <text x="60" y="442" class="box-desc">• 编排领域对象完成用例（事务边界在此）</text>
  <text x="60" y="464" class="box-desc">• 提供应用服务供 interfaces 包调用</text>
  <text x="60" y="486" class="box-desc">• DTO 转换 / 装配（assembler / factory）</text>
  <text x="60" y="508" class="box-desc">• 登录策略与认证票据编排（service.auth / service.login）</text>
  <text x="60" y="530" class="box-desc">• 无 Web 细节，不直接暴露 HTTP</text>

  <text x="60" y="578" class="legend" font-weight="600">依赖</text>
  <text x="60" y="604" class="box-desc">→ 同库 domain 包 + 共享 apex-domain / apex-common</text>
  <text x="60" y="626" class="box-desc">→ 模块级随 apex-system 依赖 api-contract、五个 infrastructure 能力 JAR、license-starter</text>
  <text x="60" y="648" class="box-desc">← 调用方：apex-system interfaces 包 / apex-system-service 装配扫描</text>

  <!-- right: use cases -->
  <rect x="500" y="92" width="860" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="120" class="box-title" font-size="14">用例编排（service）</text>
  <rect x="520" y="136" width="270" height="190" rx="6" fill="#fff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="533" y="158" class="box-title">核心业务</text>
  <text x="533" y="178" class="code">service（扁平）+ service.impl</text>
  <text x="533" y="196" class="box-desc">用户/角色/菜单/租户/字典用例</text>
  <text x="533" y="214" class="box-desc">配置/日志/代码生成/SSO 用例</text>
  <text x="533" y="232" class="code">事务边界（@Transactional）</text>
  <text x="533" y="258" class="box-title">认证编排</text>
  <text x="533" y="278" class="code">service.auth / service.login</text>
  <text x="533" y="296" class="box-desc">登录策略：密码/短信/微信</text>
  <rect x="800" y="136" width="270" height="190" rx="6" fill="#fff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="813" y="158" class="box-title">开放平台</text>
  <text x="813" y="178" class="code">openplatform</text>
  <text x="813" y="196" class="box-desc">OpenAppAdminService 等</text>
  <text x="813" y="214" class="box-desc">开放应用管理与 Scope 注册</text>
  <text x="813" y="240" class="box-title">能力度量</text>
  <text x="813" y="260" class="code">capability（CapabilityCatalog）</text>
  <text x="813" y="280" class="box-desc">能力目录与用量上报</text>
  <rect x="1080" y="136" width="270" height="190" rx="6" fill="#fff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="1093" y="158" class="box-title">调度 / 事件</text>
  <text x="1093" y="178" class="code">job / scheduler</text>
  <text x="1093" y="196" class="code">event / listener</text>
  <text x="1093" y="214" class="box-desc">定时任务与事件处理</text>
  <text x="1093" y="232" class="box-desc">触发领域用例</text>
  <text x="1093" y="258" class="box-title">安全 / 守卫</text>
  <text x="1093" y="278" class="code">security · TenantGuard</text>
  <text x="1093" y="296" class="box-desc">租户与数据范围守卫</text>

  <rect x="500" y="362" width="860" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="390" class="box-title" font-size="14">数据传输与装配</text>
  <rect x="520" y="406" width="270" height="190" rx="6" fill="#fff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="533" y="428" class="box-title">DTO</text>
  <text x="533" y="448" class="code">dto（扁平请求/响应）</text>
  <text x="533" y="468" class="code">dto.admin / dto.internal</text>
  <text x="533" y="488" class="code">dto.log / dto.search / dto.usage</text>
  <text x="533" y="514" class="box-title">应用层入参/出参</text>
  <text x="533" y="534" class="box-desc">与 interfaces 层 DTO 解耦</text>
  <text x="533" y="552" class="box-desc">按域拆分子包</text>
  <rect x="800" y="406" width="270" height="190" rx="6" fill="#fff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="813" y="428" class="box-title">装配器</text>
  <text x="813" y="448" class="code">assembler</text>
  <text x="813" y="468" class="box-desc">DTO ↔ 领域对象转换</text>
  <text x="813" y="488" class="box-desc">聚合多领域数据为视图</text>
  <text x="813" y="514" class="box-title">工厂</text>
  <text x="813" y="534" class="code">factory</text>
  <text x="813" y="552" class="box-desc">复杂对象构造封装</text>
  <rect x="1080" y="406" width="270" height="190" rx="6" fill="#fff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="1093" y="428" class="box-title">支撑</text>
  <text x="1093" y="448" class="code">support / support.sso</text>
  <text x="1093" y="468" class="box-desc">SSO 票据 / 连接池 / 元数据</text>
  <text x="1093" y="488" class="box-desc">代码模板引擎 / 类型映射</text>
  <text x="1093" y="514" class="box-title">配置</text>
  <text x="1093" y="534" class="code">config</text>
  <text x="1093" y="552" class="box-desc">应用层装配配置</text>

  <rect x="500" y="632" width="860" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="660" class="box-title" font-size="14">设计约束</text>
  <text x="520" y="690" class="box-desc">1. 事务边界置于应用服务，领域层保持无事务语义。</text>
  <text x="520" y="718" class="box-desc">2. 沿用 Reactor 响应式（Mono/Flux）与 WebClient 外呼，不承载 HTTP 路由与协议适配。</text>
  <text x="520" y="746" class="box-desc">3. 用例服务只编排、不实现领域规则，规则下沉至 domain。</text>
  <text x="1040" y="660" class="box-title" font-size="14">典型引用方</text>
  <text x="1040" y="690" class="box-desc">apex-system interfaces 包（Router/Handler 调用）</text>
  <text x="1040" y="718" class="box-desc">apex-system-service（运行装配扫描）</text>
  <text x="1040" y="746" class="note">office/workflow 用例已拆至独立 apex-office / apex-workflow 库</text>

  <text x="700" y="872" class="note" text-anchor="middle">apex-system 的 application 包承载 system 域用例编排与事务边界，是领域能力对外的应用门面；随 apex-system 库发布</text>
</svg>
