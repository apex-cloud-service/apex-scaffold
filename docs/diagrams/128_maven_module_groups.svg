<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" role="img" aria-labelledby="title desc">
  <title id="title">Maven 七组聚合关系（第一阶段）</title>
  <desc id="desc">根聚合七个管理 POM，六个新增和现有 services-bom。九、六、四、十、二、四、零个叶子 JAR，共三十五个 JAR、四十二个后代、含根四十三个 reactor 项目。箭头是 modules，不是 parent 或 compile。</desc>
  <!-- Semantic pair: 128_maven_module_groups.mmd; hand-maintained SVG, not Mermaid output. -->
  <defs>
    <style>
      text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .title{font-size:30px;font-weight:700;text-anchor:middle}.sub{font-size:15px;fill:#475569;text-anchor:middle}
      .head{font-size:21px;font-weight:700}.meta{font-size:16px;fill:#475569}.code{font-size:17px}
      .note{font-size:17px;fill:#475569}.small{font-size:15px;fill:#475569}
      .edge{fill:none;stroke:#4f46e5;stroke-width:2.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="1600" height="1390" fill="#fff"/>
  <text x="800" y="44" class="title">Maven 七组聚合关系 · 第一阶段</text>
  <text x="800" y="74" class="sub">只画 &lt;modules&gt;：根 → 管理组；卡内为成员清单，不是物理目录树、parent 继承或生产依赖</text>
  <rect x="440" y="98" width="720" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="800" y="128" class="head" text-anchor="middle">apex-scaffold · 总父 POM / 总聚合入口</text>
  <text x="800" y="154" class="meta" text-anchor="middle">7 个直接管理组 · 42 个后代 · 43 个 reactor 项目含根</text>
  <text x="800" y="179" class="meta" text-anchor="middle">8 个 POM 含根 + 35 个 JAR（business 第一阶段为空）</text>
  <!-- Bundled modules edges all originate from the root, not from another management group. -->
  <path class="edge" d="M800 190V218H24V990H800V1010" marker-end="url(#arrow)"/>
  <path class="edge" d="M24 218H1310M290 218V248M800 218V248M1310 218V248"/>
  <path class="edge" d="M290 234V248" marker-end="url(#arrow)"/>
  <path class="edge" d="M800 234V248" marker-end="url(#arrow)"/>
  <path class="edge" d="M1310 234V248" marker-end="url(#arrow)"/>
  <path class="edge" d="M24 606H1310M290 606V636M800 606V636M1310 606V636"/>
  <path class="edge" d="M290 622V636" marker-end="url(#arrow)"/>
  <path class="edge" d="M800 622V636" marker-end="url(#arrow)"/>
  <path class="edge" d="M1310 622V636" marker-end="url(#arrow)"/>
  <text x="62" y="208" class="small">modules · 根聚合</text>
  <rect x="50" y="248" width="480" height="328" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="70" y="284" class="head">apex-shared-parent</text><text x="70" y="313" class="meta">新增 POM · 9 个 JAR · 共享底座</text>
  <text x="70" y="350" class="code">apex-common / apex-domain</text>
  <text x="70" y="378" class="code">apex-api-contract</text>
  <text x="70" y="406" class="code">apex-infrastructure-persistence</text>
  <text x="70" y="434" class="code">apex-infrastructure-cache</text>
  <text x="70" y="462" class="code">apex-infrastructure-messaging</text>
  <text x="70" y="490" class="code">apex-infrastructure-remote</text>
  <text x="70" y="518" class="code">apex-infrastructure-integration</text>
  <text x="70" y="546" class="code">apex-infrastructure（兼容 JAR，非 POM）</text>
  <rect x="560" y="248" width="480" height="328" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="580" y="284" class="head">apex-components-parent</text><text x="580" y="313" class="meta">新增 POM · 6 个 JAR · 脚手架能力库</text>
  <text x="580" y="350" class="code">apex-system</text><text x="580" y="382" class="code">apex-auth</text>
  <text x="580" y="414" class="code">apex-workflow</text><text x="580" y="446" class="code">apex-file</text>
  <text x="580" y="478" class="code">apex-office</text><text x="580" y="510" class="code">apex-integration</text>
  <text x="580" y="550" class="small">不与项目业务 business 组混用</text>
  <rect x="1070" y="248" width="480" height="328" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1090" y="284" class="head">apex-starters-parent</text><text x="1090" y="313" class="meta">新增 POM · 4 个 JAR · 自动装配能力</text>
  <text x="1090" y="361" class="code">apex-storage-spring-boot-starter</text>
  <text x="1090" y="405" class="code">apex-license-spring-boot-starter</text>
  <text x="1090" y="449" class="code">apex-job-spring-boot-starter</text>
  <text x="1090" y="493" class="code">apex-seata-spring-boot-starter</text>
  <rect x="50" y="636" width="480" height="326" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="70" y="672" class="head">apex-services-bom</text><text x="70" y="701" class="meta">复用 POM · 10 个 JAR · 运行装配</text>
  <text x="70" y="737" class="code">apex-gateway</text><text x="70" y="764" class="code">apex-system-service / apex-auth-service</text>
  <text x="70" y="791" class="code">apex-workflow-service / apex-file-service</text>
  <text x="70" y="818" class="code">apex-office-service / apex-integration-service</text>
  <text x="70" y="845" class="code">apex-aggregation-service</text>
  <text x="70" y="882" class="code">apex-job-service / apex-masking-service</text>
  <text x="70" y="921" class="small">八个发布运行模块 + 两个可选运行模块</text>
  <rect x="560" y="636" width="480" height="326" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="580" y="672" class="head">apex-applications-parent</text><text x="580" y="701" class="meta">新增 POM · 2 个 JAR · 示例与组合装配</text>
  <text x="580" y="753" class="code">apex-example</text><text x="580" y="798" class="code">apex-boot-all</text>
  <text x="580" y="856" class="note">只调整管理结构，不复制业务实现。</text>
  <text x="580" y="886" class="note">叶子打包行为继续由原模块维护。</text>
  <rect x="1070" y="636" width="480" height="326" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1090" y="672" class="head">apex-tools-parent</text><text x="1090" y="701" class="meta">新增 POM · 4 个 JAR · 开发与运维工具</text>
  <text x="1090" y="753" class="code">apex-license-tools</text><text x="1090" y="798" class="code">apex-generator</text>
  <text x="1090" y="843" class="code">apex-tools-deployment</text><text x="1090" y="888" class="code">apex-tools-build</text>
  <rect x="50" y="1010" width="1500" height="156" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="70" y="1046" class="head">apex-business-parent · 新增 POM · 0 个子模块</text>
  <text x="70" y="1076" class="note">只管理项目业务库及业务专属配置 / 资源；第一阶段为空，不制造业务 JAR、服务或数据库。</text>
  <text x="70" y="1106" class="note">通用框架实现位于其他组，business 按需复用；后续业务库另行批准加入。</text>
  <text x="70" y="1136" class="note">未来独立 business-domain-service 仅聚合 / 继承 services-bom，不重复登记到 business。</text>
  <rect x="50" y="1194" width="1500" height="164" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="1228" class="head">读图边界</text>
  <text x="70" y="1258" class="note">6 个新增 POM + 现有 services-bom；全部既有叶子物理目录仍在仓库根，分组通过 ../apex-xxx 聚合同级模块。</text>
  <text x="70" y="1288" class="note">聚合归属 ≠ 直接 parent：api-contract / integration / boot-all 保留 services-bom 继承；继承关系见 129。</text>
  <text x="70" y="1318" class="note">生产直接内部依赖见 95；运行拓扑见 docs/architecture/system-architecture.md。管理组不是新运行服务。</text>
  <text x="70" y="1344" class="small">计数口径：根以下 7 个 POM + 35 个 JAR = 42 个后代；加根 POM = 43 个 reactor 项目。</text>
</svg>
