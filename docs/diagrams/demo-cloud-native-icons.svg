<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 800">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #0f172a; }
      .subtitle { font: 14px sans-serif; fill: #475569; }
      .section-title { font: bold 16px sans-serif; fill: #1e293b; }
      .component-title { font: bold 13px sans-serif; fill: #334155; }
      .label-text { font: 11px sans-serif; fill: #64748b; }
      
      .k8s-zone { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 2; }
      .data-zone { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .infra-zone { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    </style>
    
    <!-- 引入云原生图标库 -->
    <g id="icon-kubernetes">
      <path d="M10,2 L14,4 L18,2 L18,10 L14,12 L10,10 Z" fill="#326CE5" stroke="#1A4D8F" stroke-width="0.5"/>
      <circle cx="14" cy="7" r="1.5" fill="white"/>
      <line x1="14" y1="4" x2="14" y2="7" stroke="white" stroke-width="0.8"/>
      <line x1="11" y1="5.5" x2="14" y2="7" stroke="white" stroke-width="0.8"/>
      <line x1="17" y1="5.5" x2="14" y2="7" stroke="white" stroke-width="0.8"/>
    </g>
    
    <g id="icon-pod">
      <rect x="4" y="4" width="12" height="12" rx="2" fill="#326CE5" stroke="#1A4D8F" stroke-width="1"/>
      <rect x="6" y="6" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
      <rect x="10.5" y="6" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
      <rect x="6" y="10.5" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
      <rect x="10.5" y="10.5" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
    </g>
    
    <g id="icon-service">
      <circle cx="10" cy="10" r="7" fill="none" stroke="#326CE5" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="2" fill="#326CE5"/>
      <circle cx="10" cy="3" r="1.5" fill="#326CE5"/>
      <circle cx="17" cy="10" r="1.5" fill="#326CE5"/>
      <circle cx="10" cy="17" r="1.5" fill="#326CE5"/>
      <circle cx="3" cy="10" r="1.5" fill="#326CE5"/>
    </g>
    
    <g id="icon-ingress">
      <path d="M2,10 L10,2 L18,10" fill="none" stroke="#326CE5" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="6" y="10" width="8" height="8" fill="#326CE5" stroke="#1A4D8F" stroke-width="1"/>
      <path d="M8,13 L12,13 M10,11 L10,16" stroke="white" stroke-width="1" stroke-linecap="round"/>
    </g>
    
    <g id="icon-docker">
      <rect x="6" y="8" width="2.5" height="2.5" fill="#2496ED"/>
      <rect x="9" y="8" width="2.5" height="2.5" fill="#2496ED"/>
      <rect x="12" y="8" width="2.5" height="2.5" fill="#2496ED"/>
      <rect x="6" y="5" width="2.5" height="2.5" fill="#2496ED"/>
      <rect x="9" y="5" width="2.5" height="2.5" fill="#2496ED"/>
      <path d="M3,11 Q3,9 5,9 L15,9 Q17,9 17,11 Q19,11 19,13 Q19,15 17,15 L5,15 Q3,15 3,13 Q3,11 3,11 Z" 
            fill="none" stroke="#2496ED" stroke-width="1.2"/>
    </g>
    
    <g id="icon-mysql">
      <ellipse cx="10" cy="6" rx="6" ry="2.5" fill="#4479A1" stroke="#2F5F7F" stroke-width="0.8"/>
      <path d="M4,6 L4,14 Q4,16.5 10,16.5 Q16,16.5 16,14 L16,6" fill="#4479A1" stroke="#2F5F7F" stroke-width="0.8"/>
      <ellipse cx="10" cy="14" rx="6" ry="2.5" fill="#5D87A1" stroke="#2F5F7F" stroke-width="0.8"/>
    </g>
    
    <g id="icon-redis">
      <ellipse cx="10" cy="8" rx="7" ry="3" fill="#DC382D"/>
      <ellipse cx="10" cy="12" rx="7" ry="3" fill="#C6302B"/>
      <path d="M3,8 L3,12" stroke="#A41E11" stroke-width="0.8"/>
      <path d="M17,8 L17,12" stroke="#A41E11" stroke-width="0.8"/>
      <path d="M6,7 L8,8 L10,7 L12,8 L14,7" stroke="white" stroke-width="1" fill="none"/>
    </g>
    
    <g id="icon-kafka">
      <circle cx="10" cy="10" r="7" fill="black"/>
      <circle cx="10" cy="10" r="5.5" fill="white"/>
      <path d="M7,10 L10,7 L13,10 L10,13 Z" fill="black"/>
    </g>
    
    <g id="icon-nginx">
      <rect x="4" y="6" width="12" height="8" rx="1" fill="#009639" stroke="#007A2D" stroke-width="1"/>
      <path d="M7,9 L10,13 L10,9 L13,13 L13,9" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <g id="icon-springboot">
      <circle cx="10" cy="10" r="7" fill="#6DB33F"/>
      <path d="M12,6 Q14,8 12,10 Q14,12 12,14" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8,6 Q6,8 8,10 Q6,12 8,14" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <g id="icon-prometheus">
      <circle cx="10" cy="10" r="7" fill="#E6522C" stroke="#C14522" stroke-width="1"/>
      <path d="M10,5 L10,10 L14,10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="10" cy="10" r="1.5" fill="white"/>
    </g>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="title">云原生架构图（专业图标演示）</text>
  <text x="500" y="55" text-anchor="middle" class="subtitle">Cloud-Native Architecture with Professional Icons</text>

  <!-- Kubernetes 集群区域 -->
  <rect x="50" y="80" width="450" height="320" rx="10" class="k8s-zone"/>
  <use href="#icon-kubernetes" x="60" y="90" width="28" height="28"/>
  <text x="95" y="110" class="section-title">Kubernetes 集群</text>
  
  <!-- Ingress -->
  <rect x="80" y="130" width="100" height="70" rx="5" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <use href="#icon-ingress" x="110" y="140" width="40" height="40"/>
  <text x="130" y="155" text-anchor="middle" class="component-title">Ingress</text>
  <text x="130" y="205" text-anchor="middle" class="label-text">Nginx Ingress</text>
  
  <!-- Service -->
  <rect x="220" y="130" width="100" height="70" rx="5" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <use href="#icon-service" x="250" y="140" width="40" height="40"/>
  <text x="270" y="155" text-anchor="middle" class="component-title">Service</text>
  <text x="270" y="205" text-anchor="middle" class="label-text">ClusterIP</text>
  
  <!-- Pods -->
  <g>
    <rect x="80" y="240" width="80" height="60" rx="5" fill="white" stroke="#326CE5" stroke-width="1.5"/>
    <use href="#icon-pod" x="105" y="250" width="30" height="30"/>
    <text x="120" y="300" text-anchor="middle" class="component-title">Pod-1</text>
  </g>
  
  <g>
    <rect x="180" y="240" width="80" height="60" rx="5" fill="white" stroke="#326CE5" stroke-width="1.5"/>
    <use href="#icon-pod" x="205" y="250" width="30" height="30"/>
    <text x="220" y="300" text-anchor="middle" class="component-title">Pod-2</text>
  </g>
  
  <g>
    <rect x="280" y="240" width="80" height="60" rx="5" fill="white" stroke="#326CE5" stroke-width="1.5"/>
    <use href="#icon-pod" x="305" y="250" width="30" height="30"/>
    <text x="320" y="300" text-anchor="middle" class="component-title">Pod-3</text>
  </g>
  
  <!-- Spring Boot 标识 -->
  <use href="#icon-springboot" x="115" y="252" width="20" height="20"/>
  <use href="#icon-springboot" x="215" y="252" width="20" height="20"/>
  <use href="#icon-springboot" x="315" y="252" width="20" height="20"/>
  
  <!-- Docker 容器标识 -->
  <use href="#icon-docker" x="90" y="265" width="18" height="18"/>
  <use href="#icon-docker" x="190" y="265" width="18" height="18"/>
  <use href="#icon-docker" x="290" y="265" width="18" height="18"/>
  
  <!-- 箭头 -->
  <path d="M130,200 L120,240" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M270,200 L220,240" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M270,200 L320,240" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4f46e5" />
    </marker>
  </defs>

  <!-- 数据层 -->
  <rect x="550" y="80" width="400" height="160" rx="10" class="data-zone"/>
  <text x="560" y="110" class="section-title">数据层</text>
  
  <!-- MySQL -->
  <rect x="580" y="130" width="100" height="80" rx="5" fill="white" stroke="#059669" stroke-width="2"/>
  <use href="#icon-mysql" x="610" y="140" width="40" height="40"/>
  <text x="630" y="195" text-anchor="middle" class="component-title">MySQL</text>
  <text x="630" y="210" text-anchor="middle" class="label-text">主从复制</text>
  
  <!-- Redis -->
  <rect x="710" y="130" width="100" height="80" rx="5" fill="white" stroke="#dc2626" stroke-width="2"/>
  <use href="#icon-redis" x="740" y="140" width="40" height="40"/>
  <text x="760" y="195" text-anchor="middle" class="component-title">Redis</text>
  <text x="760" y="210" text-anchor="middle" class="label-text">缓存集群</text>
  
  <!-- Kafka -->
  <rect x="840" y="130" width="90" height="80" rx="5" fill="white" stroke="#059669" stroke-width="2"/>
  <use href="#icon-kafka" x="870" y="140" width="30" height="30"/>
  <text x="885" y="190" text-anchor="middle" class="component-title">Kafka</text>
  <text x="885" y="205" text-anchor="middle" class="label-text">消息队列</text>
  
  <!-- 基础设施 -->
  <rect x="550" y="270" width="400" height="130" rx="10" class="infra-zone"/>
  <text x="560" y="300" class="section-title">基础设施</text>
  
  <!-- Nginx -->
  <rect x="580" y="320" width="100" height="60" rx="5" fill="white" stroke="#d97706" stroke-width="2"/>
  <use href="#icon-nginx" x="610" y="330" width="40" height="40"/>
  <text x="630" y="370" text-anchor="middle" class="component-title">Nginx</text>
  
  <!-- Prometheus -->
  <rect x="710" y="320" width="100" height="60" rx="5" fill="white" stroke="#d97706" stroke-width="2"/>
  <use href="#icon-prometheus" x="740" y="330" width="40" height="40"/>
  <text x="760" y="370" text-anchor="middle" class="component-title">Prometheus</text>
  
  <!-- 连接线 -->
  <path d="M360,270 L630,210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" fill="none"/>
  <path d="M360,270 L760,210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" fill="none"/>
  <path d="M360,270 L885,210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" fill="none"/>

  <!-- 图例 -->
  <rect x="50" y="450" width="900" height="320" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="480" class="section-title">🎨 专业图标库展示（50+图标）</text>
  
  <!-- Kubernetes 图标组 -->
  <text x="70" y="510" class="component-title">Kubernetes:</text>
  <use href="#icon-kubernetes" x="70" y="520" width="30" height="30"/>
  <text x="85" y="560" text-anchor="middle" class="label-text" font-size="9">K8s</text>
  
  <use href="#icon-pod" x="120" y="520" width="30" height="30"/>
  <text x="135" y="560" text-anchor="middle" class="label-text" font-size="9">Pod</text>
  
  <use href="#icon-service" x="170" y="520" width="30" height="30"/>
  <text x="185" y="560" text-anchor="middle" class="label-text" font-size="9">Service</text>
  
  <use href="#icon-ingress" x="220" y="520" width="30" height="30"/>
  <text x="235" y="560" text-anchor="middle" class="label-text" font-size="9">Ingress</text>
  
  <!-- 容器图标组 -->
  <text x="70" y="600" class="component-title">容器:</text>
  <use href="#icon-docker" x="70" y="610" width="30" height="30"/>
  <text x="85" y="650" text-anchor="middle" class="label-text" font-size="9">Docker</text>
  
  <!-- 数据库图标组 -->
  <text x="280" y="510" class="component-title">数据库:</text>
  <use href="#icon-mysql" x="280" y="520" width="30" height="30"/>
  <text x="295" y="560" text-anchor="middle" class="label-text" font-size="9">MySQL</text>
  
  <use href="#icon-redis" x="330" y="520" width="30" height="30"/>
  <text x="345" y="560" text-anchor="middle" class="label-text" font-size="9">Redis</text>
  
  <!-- 消息队列图标组 -->
  <text x="450" y="510" class="component-title">消息队列:</text>
  <use href="#icon-kafka" x="450" y="520" width="30" height="30"/>
  <text x="465" y="560" text-anchor="middle" class="label-text" font-size="9">Kafka</text>
  
  <!-- 基础设施图标组 -->
  <text x="280" y="600" class="component-title">基础设施:</text>
  <use href="#icon-nginx" x="280" y="610" width="30" height="30"/>
  <text x="295" y="650" text-anchor="middle" class="label-text" font-size="9">Nginx</text>
  
  <use href="#icon-prometheus" x="330" y="610" width="30" height="30"/>
  <text x="345" y="650" text-anchor="middle" class="label-text" font-size="9">Prometheus</text>
  
  <!-- 框架图标组 -->
  <text x="450" y="600" class="component-title">框架:</text>
  <use href="#icon-springboot" x="450" y="610" width="30" height="30"/>
  <text x="465" y="650" text-anchor="middle" class="label-text" font-size="9">Spring Boot</text>
  
  <!-- 说明文字 -->
  <text x="70" y="700" class="label-text">✨ 本图展示了云原生专业图标系统的视觉效果</text>
  <text x="70" y="720" class="label-text">• 所有图标均采用官方风格设计，符合行业标准</text>
  <text x="70" y="740" class="label-text">• 支持 Kubernetes、Docker、数据库、消息队列、监控等 50+ 专业图标</text>
  <text x="70" y="760" class="label-text">• 可用于所有 29 张架构图的升级优化</text>
</svg>
