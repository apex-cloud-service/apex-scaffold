<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs><style>.title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}.subtitle{font:500 14px sans-serif;fill:#64748b;text-anchor:middle}.box-title{font:600 14px sans-serif;fill:#0f172a}.text{font:400 11px sans-serif;fill:#475569}.code{font:400 10px monospace;fill:#2563eb}</style></defs>
  <rect width="1400" height="700" fill="#fff"/>
  <text x="700" y="40" class="title">26. 容灾与高可用架构</text>
  <text x="700" y="65" class="subtitle">多副本部署 · 故障自愈 · 异地多活 · RPO/RTO v3.0</text>
  <rect x="50" y="90" width="430" height="280" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="120" class="box-title">多副本与故障转移</text>
  <text x="70" y="150" class="code">应用层: K8s Deployment replicas=3</text>
  <text x="80" y="168" class="text">跨可用区部署(AZ-A/B/C)</text>
  <text x="70" y="196" class="code">数据库: MySQL主从复制 (1主2从)</text>
  <text x="80" y="214" class="text">ProxySQL故障切换&lt;30秒</text>
  <text x="70" y="242" class="code">Redis: Cluster模式 (3主3从)</text>
  <text x="80" y="260" class="text">哈希槽自动迁移</text>
  <text x="70" y="288" class="code">Nacos: 3节点Raft集群</text>
  <text x="80" y="306" class="text">配置CP模式,一致性优先</text>
  <text x="70" y="334" class="text">健康检查: livenessProbe探测失败</text>
  <text x="70" y="352" class="text">→ K8s自动重启Pod → 流量切换</text>
  <rect x="500" y="90" width="430" height="280" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="520" y="120" class="box-title">数据备份与恢复</text>
  <text x="520" y="150" class="code">MySQL全量备份: 每日凌晨2点</text>
  <text x="530" y="168" class="text">mysqldump → OSS存储保留30天</text>
  <text x="520" y="196" class="code">MySQL增量备份: binlog实时同步</text>
  <text x="530" y="214" class="text">RPO &lt; 5分钟 (最多丢失5分钟数据)</text>
  <text x="520" y="242" class="code">Redis RDB快照: 每小时</text>
  <text x="530" y="260" class="text">AOF持久化: appendfsync everysec</text>
  <text x="520" y="288" class="code">文件存储: MinIO三副本存储</text>
  <text x="530" y="306" class="text">跨可用区复制,任一AZ故障不丢失</text>
  <text x="520" y="334" class="text">灾难恢复演练: 季度一次</text>
  <text x="520" y="352" class="text">RTO &lt; 1小时 (1小时内恢复服务)</text>
  <rect x="950" y="90" width="400" height="280" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="970" y="120" class="box-title">异地多活 (企业版)</text>
  <text x="970" y="150" class="code">双活数据中心: 北京 + 上海</text>
  <text x="970" y="178" class="text">DNS GeoDNS智能解析:</text>
  <text x="980" y="196" class="code">华北用户 → 北京DC</text>
  <text x="980" y="214" class="code">华东用户 → 上海DC</text>
  <text x="970" y="242" class="text">数据同步:</text>
  <text x="980" y="260" class="code">MySQL双向复制 (GTID)</text>
  <text x="980" y="278" class="code">Redis CRD跨DC同步</text>
  <text x="970" y="306" class="text">冲突解决: LWW (Last Write Wins)</text>
  <text x="970" y="334" class="text">故障切换: 北京DC宕机</text>
  <text x="970" y="352" class="text">→ 全部流量切到上海DC</text>
  <rect x="50" y="400" width="1300" height="250" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="70" y="430" class="box-title">可用性保障措施</text>
  <text x="70" y="460" class="code">1. 限流降级: Sentinel流量控制,过载自动拒绝请求,保护核心服务</text>
  <text x="70" y="490" class="code">2. 熔断隔离: Resilience4j熔断器,依赖服务故障不影响主流程</text>
  <text x="70" y="520" class="code">3. 超时控制: 所有外部调用设置超时(10秒),防止雪崩</text>
  <text x="70" y="550" class="code">4. 资源隔离: 线程池隔离(JDBC/Redis/MQ独立线程池),故障域隔离</text>
  <text x="70" y="580" class="code">5. 灰度发布: Canary部署(5%流量试探),有问题快速回滚</text>
  <text x="70" y="610" class="code">6. 监控告警: 核心指标告警(API P99&gt;500ms, 错误率&gt;1%, 可用性&lt;99.9%)</text>
  <text x="70" y="640" class="text">目标SLA: 99.95%可用性 (年停机时间&lt;4.38小时)</text>
  <text x="700" y="685" class="code" text-anchor="middle">© 2026 Apex Team · 容灾与高可用 v3.0</text>
</svg>
