<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Scaffold DDD 四层逻辑架构图</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-10</dc:date>
        <dc:version>3.0</dc:version>
        <dc:description>展示DDD领域驱动设计的四层架构:接口层、应用层、领域层、基础设施层</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main {
        font: 700 36px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .title-version {
        font: 500 16px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
      .layer-title {
        font: 600 22px system-ui, sans-serif;
        fill: #ffffff;
      }
      .layer-desc {
        font: 400 14px system-ui, sans-serif;
        fill: #ffffff;
        opacity: 0.9;
      }
      .module-title {
        font: 600 16px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .module-item {
        font: 400 13px system-ui, sans-serif;
        fill: #475569;
      }
      .tech-label {
        font: 400 12px 'SF Mono', Monaco, monospace;
        fill: #64748b;
      }
      .arrow-label {
        font: 500 13px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="1400" fill="#ffffff"/>

  <text x="800" y="50" class="title-main">Apex Scaffold DDD 四层逻辑架构</text>
  <text x="800" y="80" class="title-version">基于 Spring Boot 3.5.15 · Java 21 · WebFlux 响应式架构 · v3.0</text>

  <g id="interfaces-layer">
    <rect x="100" y="140" width="1400" height="220" rx="12" fill="#4f46e5" stroke="#3730a3" stroke-width="2"/>
    <text x="120" y="175" class="layer-title">接口层 (apex-system)</text>
    <text x="120" y="200" class="layer-desc">协议适配 · 请求校验 · 安全入口 · OpenAPI</text>

    <rect x="130" y="220" width="280" height="120" rx="8" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="270" y="245" class="module-title">WebFlux 函数式路由</text>
    <text x="150" y="270" class="module-item">• ApiRouter - 业务路由</text>
    <text x="150" y="290" class="module-item">• WorkflowRouter - 工作流路由</text>
    <text x="150" y="310" class="module-item">• RouterOpenApiConfig</text>
    <text x="150" y="330" class="tech-label">RouterFunction + ServerRequest</text>

    <rect x="440" y="220" width="280" height="120" rx="8" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="580" y="245" class="module-title">Handler 处理器</text>
    <text x="460" y="270" class="module-item">• AuthHandler - 认证处理</text>
    <text x="460" y="290" class="module-item">• UserHandler - 用户管理</text>
    <text x="460" y="310" class="module-item">• FileHandler - 文件上传</text>
    <text x="460" y="330" class="tech-label">86个Handler (权限注解+校验)</text>

    <rect x="750" y="220" width="280" height="120" rx="8" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="890" y="245" class="module-title">安全与过滤</text>
    <text x="770" y="270" class="module-item">• SecurityConfig - 安全配置</text>
    <text x="770" y="290" class="module-item">• JwtConfig - JWT令牌</text>
    <text x="770" y="310" class="module-item">• WebFilter - 过滤器链</text>
    <text x="770" y="330" class="tech-label">Spring Security 6.5.0</text>

    <rect x="1060" y="220" width="280" height="120" rx="8" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="1200" y="245" class="module-title">AOP 切面</text>
    <text x="1080" y="270" class="module-item">• @RequirePermission 权限</text>
    <text x="1080" y="290" class="module-item">• @RateLimiter 限流</text>
    <text x="1080" y="310" class="module-item">• @IdempotentApi 幂等</text>
    <text x="1080" y="330" class="tech-label">@AntiReplay 防重放</text>
  </g>

  <line x1="800" y1="360" x2="800" y2="400" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="385" class="arrow-label">调用应用服务</text>

  <g id="application-layer">
    <rect x="100" y="410" width="1400" height="220" rx="12" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
    <text x="120" y="445" class="layer-title">应用层 (apex-system)</text>
    <text x="120" y="470" class="layer-desc">用例编排 · 事务边界 · DTO转换 · 跨聚合协作</text>

    <rect x="130" y="490" width="320" height="120" rx="8" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="290" y="515" class="module-title">核心应用服务</text>
    <text x="150" y="540" class="module-item">• AuthService - 认证服务</text>
    <text x="150" y="560" class="module-item">• UserService - 用户服务</text>
    <text x="150" y="580" class="module-item">• DeptService - 部门服务</text>
    <text x="150" y="600" class="tech-label">159个应用服务 (用例编排)</text>

    <rect x="480" y="490" width="320" height="120" rx="8" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="640" y="515" class="module-title">工作流服务</text>
    <text x="500" y="540" class="module-item">• WorkflowService - 流程服务</text>
    <text x="500" y="560" class="module-item">• ModerationService - 审核服务</text>
    <text x="500" y="580" class="module-item">• SearchService - 搜索服务</text>
    <text x="500" y="600" class="tech-label">DAG JSON 工作流 + 全文搜索</text>

    <rect x="830" y="490" width="320" height="120" rx="8" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="990" y="515" class="module-title">日志与监控服务</text>
    <text x="850" y="540" class="module-item">• RuntimeLogService - 运行日志</text>
    <text x="850" y="560" class="module-item">• AuditLogQueryService - 审计</text>
    <text x="850" y="580" class="module-item">• ApiCallLogQueryService - API</text>
    <text x="850" y="600" class="tech-label">日志查询 + 操作审计</text>

    <rect x="1180" y="490" width="320" height="120" rx="8" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="1340" y="515" class="module-title">DTO与转换器</text>
    <text x="1200" y="540" class="module-item">• Request DTO (接收)</text>
    <text x="1200" y="560" class="module-item">• Response DTO (返回)</text>
    <text x="1200" y="580" class="module-item">• Assembler (转换器)</text>
    <text x="1200" y="600" class="tech-label">DTO ↔ 领域实体</text>
  </g>

  <line x1="800" y1="630" x2="800" y2="670" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="655" class="arrow-label">依赖领域端口</text>

  <g id="domain-layer">
    <rect x="100" y="680" width="1400" height="220" rx="12" fill="#059669" stroke="#047857" stroke-width="2"/>
    <text x="120" y="715" class="layer-title">领域层 (apex-domain)</text>
    <text x="120" y="740" class="layer-desc">聚合根 · 领域模型 · 业务规则 · Repository接口定义</text>

    <rect x="130" y="760" width="320" height="120" rx="8" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="290" y="785" class="module-title">领域模型</text>
    <text x="150" y="810" class="module-item">• User - 用户聚合根</text>
    <text x="150" y="830" class="module-item">• Role - 角色实体</text>
    <text x="150" y="850" class="module-item">• Department - 部门实体</text>
    <text x="150" y="870" class="tech-label">实体 + 值对象 + 业务规则</text>

    <rect x="480" y="760" width="320" height="120" rx="8" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="640" y="785" class="module-title">Repository接口</text>
    <text x="500" y="810" class="module-item">• UserRepository</text>
    <text x="500" y="830" class="module-item">• RoleRepository</text>
    <text x="500" y="850" class="module-item">• DeptRepository</text>
    <text x="500" y="870" class="tech-label">90个Repository接口定义</text>

    <rect x="830" y="760" width="320" height="120" rx="8" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="990" y="785" class="module-title">领域服务</text>
    <text x="850" y="810" class="module-item">• 跨聚合业务规则</text>
    <text x="850" y="830" class="module-item">• 领域事件定义</text>
    <text x="850" y="850" class="module-item">• 工作流领域服务</text>
    <text x="850" y="870" class="tech-label">领域逻辑封装</text>

    <rect x="1180" y="760" width="320" height="120" rx="8" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="1340" y="785" class="module-title">技术端口</text>
    <text x="1200" y="810" class="module-item">• CacheService 接口</text>
    <text x="1200" y="830" class="module-item">• StorageService 接口</text>
    <text x="1200" y="850" class="module-item">• SearchRepository 接口</text>
    <text x="1200" y="870" class="tech-label">技术能力抽象</text>
  </g>

  <line x1="800" y1="900" x2="800" y2="940" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8,4"/>
  <text x="820" y="925" class="arrow-label">实现领域接口</text>

  <g id="infrastructure-layer">
    <rect x="100" y="950" width="1400" height="220" rx="12" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <text x="120" y="985" class="layer-title">基础设施层 (apex-infrastructure-* 五个能力 JAR)</text>
    <text x="120" y="1010" class="layer-desc">数据持久化 · 缓存实现 · 消息队列 · 对象存储 · 外部服务适配</text>

    <rect x="130" y="1030" width="280" height="120" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="270" y="1055" class="module-title">持久化实现</text>
    <text x="150" y="1080" class="module-item">• UserRepositoryImpl</text>
    <text x="150" y="1100" class="module-item">• MyBatis-Plus Mapper</text>
    <text x="150" y="1120" class="module-item">• PO + Converter</text>
    <text x="150" y="1140" class="tech-label">MySQL 9.x + Druid连接池</text>

    <rect x="440" y="1030" width="280" height="120" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="580" y="1055" class="module-title">缓存实现</text>
    <text x="460" y="1080" class="module-item">• CacheServiceImpl</text>
    <text x="460" y="1100" class="module-item">• Caffeine L1本地缓存</text>
    <text x="460" y="1120" class="module-item">• Redis L2分布式缓存</text>
    <text x="460" y="1140" class="tech-label">Redisson 3.36.0</text>

    <rect x="750" y="1030" width="280" height="120" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="890" y="1055" class="module-title">消息队列</text>
    <text x="770" y="1080" class="module-item">• RocketMQ Producer</text>
    <text x="770" y="1100" class="module-item">• RocketMQ Consumer</text>
    <text x="770" y="1120" class="module-item">• Outbox发件箱模式</text>
    <text x="770" y="1140" class="tech-label">RocketMQ 5.x (企业版)</text>

    <rect x="1060" y="1030" width="280" height="120" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <text x="1200" y="1055" class="module-title">对象存储 + 搜索</text>
    <text x="1080" y="1080" class="module-item">• MinIO / TOS 实现</text>
    <text x="1080" y="1100" class="module-item">• Meilisearch 适配器</text>
    <text x="1080" y="1120" class="module-item">• 第三方API客户端</text>
    <text x="1080" y="1140" class="tech-label">策略模式 + SPI扩展</text>
  </g>

  <g id="common-module">
    <rect x="1370" y="680" width="200" height="490" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1470" y="715" class="module-title">apex-common</text>
    <text x="1390" y="745" class="module-item">公共模块</text>
    <line x1="1390" y1="755" x2="1550" y2="755" stroke="#cbd5e1" stroke-width="1"/>

    <text x="1390" y="780" class="module-item">• Result&lt;T&gt;</text>
    <text x="1390" y="800" class="module-item">• ResultCode</text>
    <text x="1390" y="820" class="module-item">• BusinessException</text>
    <text x="1390" y="840" class="module-item">• BaseEntity</text>
    <text x="1390" y="860" class="module-item">• 工具类</text>
    <text x="1390" y="880" class="module-item">• 常量定义</text>
    <text x="1390" y="900" class="module-item">• 上下文</text>
    <text x="1390" y="920" class="module-item">• 注解</text>
    <text x="1390" y="940" class="module-item">• SPI扩展点</text>
    <text x="1390" y="960" class="module-item">• 状态机</text>

    <text x="1390" y="1000" class="tech-label">被所有层依赖</text>
    <text x="1390" y="1020" class="tech-label">无业务依赖</text>
  </g>

  <g id="legend">
    <rect x="100" y="1210" width="1400" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="120" y="1240" class="layer-title" fill="#0f172a">架构约束与规则</text>

    <text x="120" y="1270" class="module-item">1. 依赖方向: interfaces → application → domain ← infrastructure (依赖倒置原则)</text>
    <text x="120" y="1295" class="module-item">2. 领域层不得依赖 MyBatis-Plus、Spring Web 等具体技术实现</text>
    <text x="120" y="1320" class="module-item">3. 阻塞IO (JDBC/文件) 必须调度到专用线程池 (Schedulers.boundedElastic())</text>
    <text x="120" y="1345" class="module-item">4. 架构规则由 LayeringArchTest 强制校验,构建期违反规则将导致编译失败</text>

    <text x="900" y="1270" class="module-item">Maven模块: 全仓 31 个（共享基础/领域/设施/契约 + 5 业务库 + 6 运行模块 + 增强/工具）</text>
    <text x="900" y="1295" class="module-item">Handler: 86个 | 应用服务: 159个 | Router: 50个</text>
    <text x="900" y="1320" class="module-item">Repository接口: 90个 | 工作流引擎: DAG JSON (非 BPMN)</text>
    <text x="900" y="1345" class="module-item">全文搜索: Meilisearch | 消息队列: RocketMQ</text>
  </g>

  <text x="800" y="1390" class="tech-label" text-anchor="middle">© 2026 Apex Team · DDD四层逻辑架构 v3.0 · 基于实际代码结构生成</text>
</svg>
