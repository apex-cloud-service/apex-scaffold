<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Auth Center 认证中心架构全景</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-25</dc:date>
        <dc:version>1.0</dc:version>
        <dc:description>展示apex-auth独立认证中心的DDD四层架构、核心功能模块和技术选型</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main {
        font: 700 36px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .title-version {
        font: 500 15px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
      .layer-title {
        font: 600 20px system-ui, sans-serif;
        fill: #ffffff;
      }
      .layer-desc {
        font: 400 13px system-ui, sans-serif;
        fill: #ffffff;
        opacity: 0.95;
      }
      .module-title {
        font: 600 15px system-ui, sans-serif;
        fill: #0f172a;
      }
      .module-item {
        font: 400 12px system-ui, sans-serif;
        fill: #475569;
      }
      .tech-label {
        font: 500 11px 'SF Mono', monospace;
        fill: #2563eb;
      }
      .badge {
        font: 600 10px system-ui, sans-serif;
        fill: #ffffff;
        text-anchor: middle;
      }
      .arrow-label {
        font: 500 12px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="1400" fill="#ffffff"/>

  <text x="800" y="45" class="title-main">Apex Auth Center 认证授权中心架构</text>
  <text x="800" y="73" class="title-version">独立认证中心 · 端口 8081 · DDD 四层架构 · Spring Boot 3.5.15 · v1.0</text>

  <!-- 独立部署标识 -->
  <rect x="1350" y="30" width="180" height="30" rx="15" fill="#f59e0b"/>
  <text x="1440" y="50" class="badge">独立部署模块</text>

  <!-- 接口层 -->
  <g id="interfaces-layer">
    <rect x="80" y="120" width="1440" height="200" rx="10" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
    <text x="100" y="150" class="layer-title">接口层 (interfaces)</text>
    <text x="100" y="172" class="layer-desc">WebFlux 函数式路由 · Handler 处理器 · 15+ Handler</text>

    <rect x="110" y="190" width="260" height="110" rx="6" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="130" y="213" class="module-title">认证 Handler</text>
    <text x="130" y="233" class="module-item">• AuthHandler - 登录/登出</text>
    <text x="130" y="251" class="module-item">• TokenHandler - Token管理</text>
    <text x="130" y="269" class="module-item">• MfaHandler - 多因素认证</text>
    <text x="130" y="287" class="tech-label">POST /auth/v1/login</text>

    <rect x="390" y="190" width="260" height="110" rx="6" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="410" y="213" class="module-title">用户 Handler</text>
    <text x="410" y="233" class="module-item">• UserHandler - 用户管理</text>
    <text x="410" y="251" class="module-item">• ProfileHandler - 个人信息</text>
    <text x="410" y="269" class="module-item">• PasswordHandler - 密码管理</text>
    <text x="410" y="287" class="tech-label">GET /users/profile</text>

    <rect x="670" y="190" width="260" height="110" rx="6" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="690" y="213" class="module-title">权限 Handler</text>
    <text x="690" y="233" class="module-item">• RoleHandler - 角色管理</text>
    <text x="690" y="251" class="module-item">• PermissionHandler - 权限管理</text>
    <text x="690" y="269" class="module-item">• AccessControlHandler - 访问控制</text>
    <text x="690" y="287" class="tech-label">RBAC 模型</text>

    <rect x="950" y="190" width="260" height="110" rx="6" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="970" y="213" class="module-title">会话 Handler</text>
    <text x="970" y="233" class="module-item">• SessionHandler - 会话管理</text>
    <text x="970" y="251" class="module-item">• DeviceHandler - 设备管理</text>
    <text x="970" y="269" class="module-item">• OnlineUserHandler - 在线用户</text>
    <text x="970" y="287" class="tech-label">强制下线/踢人</text>

    <rect x="1230" y="190" width="260" height="110" rx="6" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <text x="1250" y="213" class="module-title">审计 Handler</text>
    <text x="1250" y="233" class="module-item">• AuditLogHandler - 审计日志</text>
    <text x="1250" y="251" class="module-item">• LoginLogHandler - 登录日志</text>
    <text x="1250" y="269" class="module-item">• OperationLogHandler - 操作日志</text>
    <text x="1250" y="287" class="tech-label">安全审计</text>
  </g>

  <line x1="800" y1="320" x2="800" y2="355" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="342" class="arrow-label">调用应用服务</text>

  <!-- 应用层 -->
  <g id="application-layer">
    <rect x="80" y="365" width="1440" height="200" rx="10" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
    <text x="100" y="395" class="layer-title">应用层 (application)</text>
    <text x="100" y="417" class="layer-desc">用例编排 · 事务边界 · DTO转换 · 10+ Service</text>

    <rect x="110" y="435" width="280" height="110" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="130" y="458" class="module-title">认证服务</text>
    <text x="130" y="478" class="module-item">• LoginService - 登录服务</text>
    <text x="130" y="496" class="module-item">• TokenService - Token管理</text>
    <text x="130" y="514" class="module-item">• MfaService - MFA验证</text>
    <text x="130" y="532" class="tech-label">登录策略 + Token生成</text>

    <rect x="410" y="435" width="280" height="110" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="430" y="458" class="module-title">用户服务</text>
    <text x="430" y="478" class="module-item">• UserQueryService - 用户查询</text>
    <text x="430" y="496" class="module-item">• UserManagementService - 用户管理</text>
    <text x="430" y="514" class="module-item">• PasswordService - 密码服务</text>
    <text x="430" y="532" class="tech-label">BCrypt加密 + 锁定策略</text>

    <rect x="710" y="435" width="280" height="110" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="730" y="458" class="module-title">权限服务</text>
    <text x="730" y="478" class="module-item">• RoleService - 角色服务</text>
    <text x="730" y="496" class="module-item">• PermissionService - 权限服务</text>
    <text x="730" y="514" class="module-item">• AccessControlService - 访问控制</text>
    <text x="730" y="532" class="tech-label">RBAC权限模型</text>

    <rect x="1010" y="435" width="280" height="110" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="1030" y="458" class="module-title">会话服务</text>
    <text x="1030" y="478" class="module-item">• SessionManagementService</text>
    <text x="1030" y="496" class="module-item">• OnlineUserService</text>
    <text x="1030" y="514" class="module-item">• DeviceBindingService</text>
    <text x="1030" y="532" class="tech-label">Redis会话存储</text>

    <rect x="1310" y="435" width="180" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1330" y="458" class="module-title">DTO</text>
    <text x="1330" y="478" class="module-item">• LoginRequest</text>
    <text x="1330" y="496" class="module-item">• LoginResponse</text>
    <text x="1330" y="514" class="module-item">• TokenResponse</text>
    <text x="1330" y="532" class="tech-label">数据传输对象</text>
  </g>

  <line x1="800" y1="565" x2="800" y2="600" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="587" class="arrow-label">依赖领域端口</text>

  <!-- 领域层 -->
  <g id="domain-layer">
    <rect x="80" y="610" width="1440" height="200" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
    <text x="100" y="640" class="layer-title">领域层 (domain)</text>
    <text x="100" y="662" class="layer-desc">聚合根 · 领域模型 · 业务规则 · Repository接口</text>

    <rect x="110" y="680" width="300" height="110" rx="6" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="130" y="703" class="module-title">领域模型</text>
    <text x="130" y="723" class="module-item">• User - 用户聚合根</text>
    <text x="130" y="741" class="module-item">• Role - 角色实体</text>
    <text x="130" y="759" class="module-item">• Permission - 权限实体</text>
    <text x="130" y="777" class="tech-label">JPA注解 + 业务方法</text>

    <rect x="430" y="680" width="300" height="110" rx="6" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="450" y="703" class="module-title">值对象</text>
    <text x="450" y="723" class="module-item">• Password - 密码值对象</text>
    <text x="450" y="741" class="module-item">• Email - 邮箱值对象</text>
    <text x="450" y="759" class="module-item">• PhoneNumber - 手机号</text>
    <text x="450" y="777" class="tech-label">不可变 + 校验逻辑</text>

    <rect x="750" y="680" width="300" height="110" rx="6" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="770" y="703" class="module-title">Repository接口</text>
    <text x="770" y="723" class="module-item">• UserRepository</text>
    <text x="770" y="741" class="module-item">• RoleRepository</text>
    <text x="770" y="759" class="module-item">• PermissionRepository</text>
    <text x="770" y="777" class="tech-label">领域端口定义</text>

    <rect x="1070" y="680" width="420" height="110" rx="6" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="1090" y="703" class="module-title">领域服务</text>
    <text x="1090" y="723" class="module-item">• PasswordEncryptionService - 密码加密</text>
    <text x="1090" y="741" class="module-item">• TokenGeneratorService - Token生成</text>
    <text x="1090" y="759" class="module-item">• LoginFailureLockingService - 登录锁定</text>
    <text x="1090" y="777" class="tech-label">5次失败锁定30分钟</text>
  </g>

  <line x1="800" y1="810" x2="800" y2="845" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="832" class="arrow-label">Repository实现</text>

  <!-- 基础设施层 -->
  <g id="infrastructure-layer">
    <rect x="80" y="855" width="1440" height="200" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
    <text x="100" y="885" class="layer-title">基础设施层 (infrastructure)</text>
    <text x="100" y="907" class="layer-desc">持久化 · 缓存 · 外部服务集成</text>

    <rect x="110" y="925" width="280" height="110" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/>
    <text x="130" y="948" class="module-title">数据库持久化</text>
    <text x="130" y="968" class="module-item">• UserRepositoryImpl</text>
    <text x="130" y="986" class="module-item">• RoleRepositoryImpl</text>
    <text x="130" y="1004" class="module-item">• PermissionRepositoryImpl</text>
    <text x="130" y="1022" class="tech-label">MyBatis-Plus + MySQL</text>

    <rect x="410" y="925" width="280" height="110" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/>
    <text x="430" y="948" class="module-title">缓存实现</text>
    <text x="430" y="968" class="module-item">• TokenCacheService</text>
    <text x="430" y="986" class="module-item">• SessionCacheService</text>
    <text x="430" y="1004" class="module-item">• UserCacheService</text>
    <text x="430" y="1022" class="tech-label">Redis + Caffeine</text>

    <rect x="710" y="925" width="280" height="110" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/>
    <text x="730" y="948" class="module-title">数据库迁移</text>
    <text x="730" y="968" class="module-item">• Flyway Migration</text>
    <text x="730" y="986" class="module-item">• V1__init_auth_center.sql</text>
    <text x="730" y="1004" class="module-item">• V2__add_mfa_support.sql</text>
    <text x="730" y="1022" class="tech-label">版本化数据库脚本</text>

    <rect x="1010" y="925" width="230" height="110" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/>
    <text x="1030" y="948" class="module-title">安全实现</text>
    <text x="1030" y="968" class="module-item">• JwtTokenProvider</text>
    <text x="1030" y="986" class="module-item">• BCryptPasswordEncoder</text>
    <text x="1030" y="1004" class="module-item">• TOTPGenerator</text>
    <text x="1030" y="1022" class="tech-label">JWT + TOTP</text>

    <rect x="1260" y="925" width="230" height="110" rx="6" fill="#ffffff" stroke="#ede9fe" stroke-width="2"/>
    <text x="1280" y="948" class="module-title">消息发送</text>
    <text x="1280" y="968" class="module-item">• EmailService</text>
    <text x="1280" y="986" class="module-item">• SmsService</text>
    <text x="1280" y="1004" class="module-item">• NotificationService</text>
    <text x="1280" y="1022" class="tech-label">MFA验证码</text>
  </g>

  <!-- 核心特性标签 -->
  <g id="feature-badges">
    <rect x="80" y="1095" width="1440" height="125" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="1125" class="module-title">核心特性</text>
    
    <rect x="110" y="1145" width="200" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="130" y="1168" class="module-item">✅ JWT Token管理</text>
    <text x="130" y="1186" class="module-item">Access + Refresh Token</text>
    <text x="130" y="1200" class="tech-label">15分钟 + 7天</text>

    <rect x="330" y="1145" width="200" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="350" y="1168" class="module-item">✅ 登录失败锁定</text>
    <text x="350" y="1186" class="module-item">5次失败锁定30分钟</text>
    <text x="350" y="1200" class="tech-label">BCrypt加密</text>

    <rect x="550" y="1145" width="200" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="570" y="1168" class="module-item">✅ 多因素认证(MFA)</text>
    <text x="570" y="1186" class="module-item">TOTP + 短信验证码</text>
    <text x="570" y="1200" class="tech-label">30秒滚动窗口</text>

    <rect x="770" y="1145" width="200" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="790" y="1168" class="module-item">✅ 租户隔离</text>
    <text x="790" y="1186" class="module-item">tenant_id 数据隔离</text>
    <text x="790" y="1200" class="tech-label">多租户支持</text>

    <rect x="990" y="1145" width="200" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1010" y="1168" class="module-item">✅ 会话管理</text>
    <text x="1010" y="1186" class="module-item">在线用户 + 强制下线</text>
    <text x="1010" y="1200" class="tech-label">Redis存储</text>

    <rect x="1210" y="1145" width="280" height="60" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1230" y="1168" class="module-item">⏳ OAuth2/SSO (开发中)</text>
    <text x="1230" y="1186" class="module-item">OAuth2授权码模式 + SSO单点登录</text>
    <text x="1230" y="1200" class="tech-label">Spring Authorization Server</text>
  </g>

  <!-- 技术栈说明 -->
  <g id="tech-stack">
    <rect x="80" y="1250" width="720" height="110" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <text x="100" y="1280" class="module-title">技术栈</text>
    <text x="100" y="1305" class="tech-label">Spring Boot: 3.5.15 | Spring WebFlux (响应式)</text>
    <text x="100" y="1325" class="tech-label">MyBatis-Plus: 3.5.10.1 | Flyway: 10.15.0</text>
    <text x="100" y="1345" class="tech-label">Redis: 7.4.2 | MySQL: 8.0.40</text>

    <rect x="820" y="1250" width="700" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="840" y="1280" class="module-title">部署信息</text>
    <text x="840" y="1305" class="tech-label">端口: 8081 (独立于主应用8080)</text>
    <text x="840" y="1325" class="tech-label">启动: mvnd -pl :apex-auth -am spring-boot:run</text>
    <text x="840" y="1345" class="tech-label">API文档: http://localhost:8081/doc.html</text>
  </g>

  <text x="800" y="1385" class="tech-label" text-anchor="middle">© 2026 Apex Team · Auth Center 架构 v1.0 · 完整94张SVG架构图集合</text>
</svg>
