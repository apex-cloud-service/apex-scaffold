<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Scaffold 工作流审批流程图</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-10</dc:date>
        <dc:version>3.0</dc:version>
        <dc:description>展示DAG JSON 轻量工作流引擎的三级审批流程:发起→部门主管→分管领导→总经理</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main { font: 700 36px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .title-version { font: 500 16px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .node-title { font: 600 15px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-desc { font: 400 12px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .step-label { font: 500 13px system-ui, sans-serif; fill: #475569; }
      .code-label { font: 400 11px 'SF Mono', monospace; fill: #2563eb; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1600" height="1400" fill="#ffffff"/>

  <text x="800" y="50" class="title-main">Apex Scaffold 工作流审批流程</text>
  <text x="800" y="80" class="title-version">DAG JSON 轻量引擎 · 三级审批 · 回退/转办/委派/挂起 · v3.0</text>

  <!-- Start节点 -->
  <circle cx="800" cy="150" r="40" fill="#10b981" stroke="#059669" stroke-width="3"/>
  <text x="800" y="157" class="node-title" fill="white">开始</text>

  <text x="800" y="210" class="step-label" text-anchor="middle">员工发起流程</text>
  <text x="800" y="228" class="code-label" text-anchor="middle">startProcessInstance()</text>

  <line x1="800" y1="190" x2="800" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 任务1: 部门主管审批 -->
  <rect x="680" y="260" width="240" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="800" y="290" class="node-title">任务1: 部门主管审批</text>
  <text x="800" y="310" class="node-desc">DEPT_MANAGER_APPROVAL</text>
  <text x="690" y="330" class="code-label">assigneeId: 2001</text>
  <text x="690" y="348" class="code-label">status: PENDING</text>

  <line x1="800" y1="360" x2="800" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策节点1 -->
  <path d="M800 400 L870 450 L800 500 L730 450 Z" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <text x="800" y="458" class="node-title">审批通过?</text>

  <!-- 驳回分支 -->
  <line x1="730" y1="450" x2="580" y2="450" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-error)" stroke-dasharray="6,4"/>
  <text x="630" y="442" class="step-label" fill="#dc2626">驳回</text>

  <rect x="450" y="410" width="130" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="515" y="435" class="node-title" fill="#dc2626">回退到发起人</text>
  <text x="515" y="455" class="code-label">rollbackToNode()</text>
  <text x="460" y="475" class="code-label">重新修改后提交</text>

  <line x1="515" y1="490" x2="680" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,4"/>

  <!-- 通过分支 -->
  <line x1="800" y1="500" x2="800" y2="560" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="820" y="530" class="step-label" fill="#059669">通过</text>

  <!-- 任务2: 分管领导审批 -->
  <rect x="680" y="560" width="240" height="100" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="3"/>
  <text x="800" y="590" class="node-title">任务2: 分管领导审批</text>
  <text x="800" y="610" class="node-desc">LEADER_APPROVAL</text>
  <text x="690" y="630" class="code-label">assigneeId: 3001</text>
  <text x="690" y="648" class="code-label">status: PENDING</text>

  <line x1="800" y1="660" x2="800" y2="700" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策节点2 -->
  <path d="M800 700 L870 750 L800 800 L730 750 Z" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <text x="800" y="758" class="node-title">审批通过?</text>

  <!-- 驳回到任务1 -->
  <line x1="730" y1="750" x2="630" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-error)" stroke-dasharray="6,4"/>
  <text x="590" y="520" class="step-label" fill="#dc2626">驳回到部门主管</text>

  <!-- 通过分支 -->
  <line x1="800" y1="800" x2="800" y2="860" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="820" y="830" class="step-label" fill="#059669">通过</text>

  <!-- 任务3: 总经理审批 -->
  <rect x="680" y="860" width="240" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="800" y="890" class="node-title">任务3: 总经理审批</text>
  <text x="800" y="910" class="node-desc">CEO_APPROVAL</text>
  <text x="690" y="930" class="code-label">assigneeId: 9999</text>
  <text x="690" y="948" class="code-label">status: PENDING</text>

  <line x1="800" y1="960" x2="800" y2="1000" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策节点3 -->
  <path d="M800 1000 L870 1050 L800 1100 L730 1050 Z" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <text x="800" y="1058" class="node-title">审批通过?</text>

  <!-- 驳回到任务2 -->
  <line x1="730" y1="1050" x2="590" y2="610" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-error)" stroke-dasharray="6,4"/>
  <text x="550" y="820" class="step-label" fill="#dc2626">驳回到分管领导</text>

  <!-- 通过分支 -->
  <line x1="800" y1="1100" x2="800" y2="1150" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="820" y="1125" class="step-label" fill="#059669">通过</text>

  <!-- End节点 -->
  <circle cx="800" cy="1190" r="40" fill="#ef4444" stroke="#dc2626" stroke-width="3"/>
  <text x="800" y="1197" class="node-title" fill="white">结束</text>
  <text x="800" y="1250" class="step-label" text-anchor="middle" fill="#059669">流程完成 COMPLETED</text>

  <!-- 高级功能说明 -->
  <rect x="1000" y="260" width="550" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1020" y="290" class="node-title" text-anchor="start">高级功能</text>

  <rect x="1020" y="310" width="250" height="80" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="1030" y="333" class="node-title" text-anchor="start">转办 transferTask()</text>
  <text x="1030" y="353" class="code-label">将任务转给他人处理</text>
  <text x="1030" y="370" class="code-label">转办后原审批人失去权限</text>
  <text x="1030" y="387" class="code-label">示例: 主管出差转给副主管</text>

  <rect x="1290" y="310" width="250" height="80" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="1300" y="333" class="node-title" text-anchor="start">委派 delegateTask()</text>
  <text x="1300" y="353" class="code-label">委派他人代理审批</text>
  <text x="1300" y="370" class="code-label">完成后任务回到委派人</text>
  <text x="1300" y="387" class="code-label">适用: 需要专家意见时</text>

  <rect x="1020" y="410" width="250" height="80" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="1030" y="433" class="node-title" text-anchor="start">挂起 suspendInstance()</text>
  <text x="1030" y="453" class="code-label">暂停流程实例执行</text>
  <text x="1030" y="470" class="code-label">挂起期间不可审批</text>
  <text x="1030" y="487" class="code-label">resumeInstance() 恢复</text>

  <rect x="1290" y="410" width="250" height="80" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1300" y="433" class="node-title" text-anchor="start">超时处理 TimeoutHandler</text>
  <text x="1300" y="453" class="code-label">ESCALATE: 升级到上级</text>
  <text x="1300" y="470" class="code-label">AUTO_COMPLETE: 自动通过</text>
  <text x="1300" y="487" class="code-label">NOTIFY: 仅通知不流转</text>

  <rect x="1020" y="510" width="520" height="100" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="1030" y="535" class="node-title" text-anchor="start">流程实例状态机</text>
  <text x="1030" y="558" class="code-label">PENDING → IN_PROGRESS → COMPLETED</text>
  <text x="1030" y="575" class="code-label">                    ↓</text>
  <text x="1030" y="592" class="code-label">              REJECTED / CANCELLED / SUSPENDED</text>

  <!-- 数据模型 -->
  <rect x="1000" y="650" width="550" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1020" y="680" class="node-title" text-anchor="start">核心数据模型</text>

  <rect x="1020" y="700" width="240" height="120" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1030" y="723" class="node-title" text-anchor="start">wf_definition (流程定义)</text>
  <text x="1030" y="745" class="code-label">id, workflow_code, name</text>
  <text x="1030" y="762" class="code-label">dag_json (DAG流程图JSON)</text>
  <text x="1030" y="779" class="code-label">version, enabled</text>
  <text x="1030" y="796" class="code-label">V20__create_workflow_tables</text>
  <text x="1030" y="813" class="code-label">V21__enhance_workflow_tables</text>

  <rect x="1280" y="700" width="260" height="120" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="1290" y="723" class="node-title" text-anchor="start">wf_process_instance (实例)</text>
  <text x="1290" y="745" class="code-label">id, definition_id, business_key</text>
  <text x="1290" y="762" class="code-label">initiator_id, status</text>
  <text x="1290" y="779" class="code-label">start_time, end_time</text>
  <text x="1290" y="796" class="code-label">current_node, context_json</text>
  <text x="1290" y="813" class="code-label">RUNNING / COMPLETED / REJECTED</text>

  <rect x="1020" y="840" width="240" height="160" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1030" y="863" class="node-title" text-anchor="start">wf_task (任务)</text>
  <text x="1030" y="885" class="code-label">id, instance_id, task_key</text>
  <text x="1030" y="902" class="code-label">task_name, task_type</text>
  <text x="1030" y="919" class="code-label">assignee_id, status</text>
  <text x="1030" y="936" class="code-label">claim_time, complete_time</text>
  <text x="1030" y="953" class="code-label">comment (审批意见)</text>
  <text x="1030" y="970" class="code-label">timeout_strategy</text>
  <text x="1030" y="987" class="code-label">PENDING → COMPLETED</text>

  <rect x="1280" y="840" width="260" height="160" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="1290" y="863" class="node-title" text-anchor="start">wf_history (历史)</text>
  <text x="1290" y="885" class="code-label">id, instance_id, task_id</text>
  <text x="1290" y="902" class="code-label">action_type (COMPLETE/REJECT)</text>
  <text x="1290" y="919" class="code-label">actor_id, action_time</text>
  <text x="1290" y="936" class="code-label">comment, old_status, new_status</text>
  <text x="1290" y="953" class="code-label">审计追踪记录</text>
  <text x="1290" y="970" class="code-label">支持流程回放</text>
  <text x="1290" y="987" class="code-label">完整操作历史</text>

  <!-- API接口 -->
  <rect x="50" y="650" width="920" height="710" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="680" class="node-title" text-anchor="start">WebFlux Handler API (WorkflowHandler.java)</text>

  <rect x="70" y="700" width="420" height="280" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="90" y="723" class="node-title" text-anchor="start">流程实例管理</text>
  <text x="90" y="748" class="code-label">POST /admin-api/v1/workflows/instances</text>
  <text x="90" y="765" class="step-label">发起流程实例 - startProcessInstance()</text>
  <text x="90" y="790" class="code-label">GET /admin-api/v1/workflows/instances/{id}</text>
  <text x="90" y="807" class="step-label">查询流程实例详情</text>
  <text x="90" y="832" class="code-label">PUT /admin-api/v1/workflows/instances/{id}/suspend</text>
  <text x="90" y="849" class="step-label">挂起流程实例</text>
  <text x="90" y="874" class="code-label">PUT /admin-api/v1/workflows/instances/{id}/resume</text>
  <text x="90" y="891" class="step-label">恢复流程实例</text>
  <text x="90" y="916" class="code-label">POST /admin-api/v1/workflows/instances/{id}/rollback</text>
  <text x="90" y="933" class="step-label">回退到指定节点</text>
  <text x="90" y="958" class="code-label">@RequirePermission("workflow:instance:*")</text>

  <rect x="520" y="700" width="420" height="280" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="540" y="723" class="node-title" text-anchor="start">任务管理</text>
  <text x="540" y="748" class="code-label">GET /admin-api/v1/workflows/tasks/pending</text>
  <text x="540" y="765" class="step-label">查询我的待办任务 - getPendingTasks()</text>
  <text x="540" y="790" class="code-label">POST /admin-api/v1/workflows/tasks/{id}/complete</text>
  <text x="540" y="807" class="step-label">完成任务(审批通过)</text>
  <text x="540" y="832" class="code-label">POST /admin-api/v1/workflows/tasks/{id}/reject</text>
  <text x="540" y="849" class="step-label">驳回任务</text>
  <text x="540" y="874" class="code-label">POST /admin-api/v1/workflows/tasks/{id}/transfer</text>
  <text x="540" y="891" class="step-label">转办任务 - transferTask()</text>
  <text x="540" y="916" class="code-label">POST /admin-api/v1/workflows/tasks/{id}/delegate</text>
  <text x="540" y="933" class="step-label">委派任务 - delegateTask()</text>
  <text x="540" y="958" class="code-label">@RequirePermission("workflow:task:*")</text>

  <rect x="70" y="1000" width="870" height="340" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="90" y="1025" class="node-title" text-anchor="start">测试覆盖 (WorkflowServiceTest.java · 19个测试用例)</text>
  <text x="90" y="1050" class="code-label">✅ 创建流程定义成功</text>
  <text x="90" y="1067" class="code-label">✅ 发起流程实例成功 - 自动创建第一个任务节点</text>
  <text x="90" y="1084" class="code-label">✅ 查询待办任务成功 - 返回 PENDING 状态任务列表</text>
  <text x="90" y="1101" class="code-label">✅ 完成任务成功 - 状态流转到 COMPLETED,创建下一节点任务</text>
  <text x="90" y="1118" class="code-label">✅ 驳回任务成功 - rejectTask() 标记 REJECTED</text>
  <text x="90" y="1135" class="code-label">✅ 回退到指定节点成功 - rollbackToNode() 取消当前任务,重建目标节点任务</text>
  <text x="90" y="1152" class="code-label">✅ 转办任务成功 - transferTask() 更新 assignee_id</text>
  <text x="90" y="1169" class="code-label">✅ 转办非待办任务失败 - 只能转办 PENDING 状态任务</text>
  <text x="90" y="1186" class="code-label">✅ 转办他人任务失败 - 只能转办自己的任务</text>
  <text x="90" y="1203" class="code-label">✅ 委派任务成功 - delegateTask() 设置委派人,完成后回到原审批人</text>
  <text x="90" y="1220" class="code-label">✅ 挂起流程实例成功 - suspendInstance() 状态 SUSPENDED</text>
  <text x="90" y="1237" class="code-label">✅ 挂起已完成流程失败 - 只能挂起 RUNNING 状态流程</text>
  <text x="90" y="1254" class="code-label">✅ 恢复流程实例成功 - resumeInstance() 恢复到 RUNNING</text>
  <text x="90" y="1271" class="code-label">✅ 恢复非挂起流程失败 - 只能恢复 SUSPENDED 状态流程</text>
  <text x="90" y="1288" class="code-label">✅ 超时处理测试 - WorkflowTimeoutHandlerTest (9个测试用例)</text>
  <text x="90" y="1305" class="code-label">   ESCALATE 策略:升级到上级 | AUTO_COMPLETE 策略:自动通过 | NOTIFY 策略:仅通知</text>
  <text x="90" y="1322" class="code-label">✅ 集成测试 - WorkflowHandlerIntegrationTest (8个测试用例,含权限校验和异常处理)</text>

  <text x="800" y="1390" class="code-label" text-anchor="middle">© 2026 Apex Team · 工作流审批流程 v3.0 · 基于 WorkflowService 实际代码生成 · Enterprise License</text>
</svg>
