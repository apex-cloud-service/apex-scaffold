<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Scaffold 安全防护体系图</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-10</dc:date>
        <dc:version>3.0</dc:version>
        <dc:description>展示7层安全防护:防重放/幂等/输入校验/XSS/SQL注入/扫描拦截/审计日志</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main { font: 700 36px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .title-version { font: 500 14px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .layer-title { font: 600 18px system-ui, sans-serif; fill: #ffffff; }
      .box-title { font: 600 14px system-ui, sans-serif; fill: #0f172a; }
      .code-label { font: 400 11px 'SF Mono', monospace; fill: #2563eb; }
      .note-text { font: 400 11px system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>

  <text x="800" y="50" class="title-main">Apex Scaffold 安全防护体系</text>
  <text x="800" y="80" class="title-version">7层防护 · @AntiReplay防重放 · @IdempotentApi幂等 · XSS/SQL注入过滤 · 审计追踪 · v3.0</text>

  <!-- L1 防重放攻击 -->
  <rect x="50" y="110" width="740" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <rect x="50" y="110" width="740" height="40" rx="12" fill="#ef4444"/>
  <text x="80" y="138" class="layer-title">L1: 防重放攻击 @AntiReplay</text>

  <rect x="80" y="170" width="330" height="120" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="193" class="box-title">时间戳校验</text>
  <text x="100" y="215" class="code-label">X-Timestamp: 1726012345678</text>
  <text x="100" y="230" class="note-text">请求时间戳 (毫秒)</text>
  <text x="100" y="245" class="note-text">时间窗口: 5分钟 (300秒)</text>
  <text x="100" y="260" class="note-text">超时拒绝: ResultCode.REPLAY_ATTACK (5001)</text>
  <text x="100" y="275" class="note-text">✅ 防止重放历史请求</text>

  <rect x="440" y="170" width="330" height="120" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="460" y="193" class="box-title">Nonce唯一性校验</text>
  <text x="460" y="215" class="code-label">X-Nonce: uuid-random-string</text>
  <text x="460" y="230" class="note-text">随机字符串 (UUID)</text>
  <text x="460" y="245" class="note-text">Redis存储: apex:nonce:{nonce}</text>
  <text x="460" y="260" class="note-text">TTL: 5分钟 (与时间窗口一致)</text>
  <text x="460" y="275" class="note-text">✅ 同一nonce仅能使用一次</text>

  <!-- L2 接口幂等 -->
  <rect x="830" y="110" width="720" height="200" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <rect x="830" y="110" width="720" height="40" rx="12" fill="#f59e0b"/>
  <text x="860" y="138" class="layer-title">L2: 接口幂等 @IdempotentApi</text>

  <rect x="860" y="170" width="330" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="880" y="193" class="box-title">幂等键机制</text>
  <text x="880" y="215" class="code-label">X-Idempotent-Key: biz-key-123</text>
  <text x="880" y="230" class="note-text">业务幂等键 (前端生成)</text>
  <text x="880" y="245" class="note-text">Redis存储: apex:idempotent:{key}</text>
  <text x="880" y="260" class="note-text">TTL: 10分钟</text>
  <text x="880" y="275" class="note-text">✅ 防止重复提交 (下单/支付)</text>

  <rect x="1220" y="170" width="310" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1240" y="193" class="box-title">状态校验</text>
  <text x="1240" y="215" class="code-label">PROCESSING → 返回5002</text>
  <text x="1240" y="230" class="note-text">重复请求返回"处理中"</text>
  <text x="1240" y="245" class="code-label">COMPLETED → 返回5003</text>
  <text x="1240" y="260" class="note-text">重复请求返回"已完成"</text>
  <text x="1240" y="275" class="note-text">✅ 幂等保障</text>

  <!-- L3 输入校验 -->
  <rect x="50" y="340" width="740" height="200" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <rect x="50" y="340" width="740" height="40" rx="12" fill="#3b82f6"/>
  <text x="80" y="368" class="layer-title">L3: 输入校验 Bean Validation + 自定义</text>

  <rect x="80" y="400" width="330" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="423" class="box-title">JSR-303参数校验</text>
  <text x="100" y="445" class="code-label">@NotBlank @Email @Size(max=50)</text>
  <text x="100" y="460" class="note-text">Spring Validation自动校验</text>
  <text x="100" y="475" class="note-text">校验失败: ResultCode.PARAM_INVALID (4000)</text>
  <text x="100" y="490" class="note-text">国际化错误消息</text>
  <text x="100" y="505" class="note-text">✅ 格式/长度/范围校验</text>

  <rect x="440" y="400" width="330" height="120" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="423" class="box-title">业务规则校验</text>
  <text x="460" y="445" class="code-label">用户名重复检查</text>
  <text x="460" y="460" class="note-text">唯一性约束校验</text>
  <text x="460" y="475" class="code-label">角色权限校验</text>
  <text x="460" y="490" class="note-text">业务逻辑合法性</text>
  <text x="460" y="505" class="note-text">✅ Service层校验</text>

  <!-- L4 XSS防护 -->
  <rect x="830" y="340" width="720" height="200" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="3"/>
  <rect x="830" y="340" width="720" height="40" rx="12" fill="#059669"/>
  <text x="860" y="368" class="layer-title">L4: XSS跨站脚本防护</text>

  <rect x="860" y="400" width="330" height="120" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="880" y="423" class="box-title">输入过滤</text>
  <text x="880" y="445" class="code-label">XssFilter 全局过滤器</text>
  <text x="880" y="460" class="note-text">转义: &lt; → &amp;lt; &gt; → &amp;gt;</text>
  <text x="880" y="475" class="note-text">移除: &lt;script&gt; onclick= onerror=</text>
  <text x="880" y="490" class="note-text">白名单: 富文本编辑器字段</text>
  <text x="880" y="505" class="note-text">✅ 防止JS注入</text>

  <rect x="1220" y="400" width="310" height="120" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="1240" y="423" class="box-title">响应头防护</text>
  <text x="1240" y="445" class="code-label">X-Content-Type-Options: nosniff</text>
  <text x="1240" y="460" class="code-label">X-Frame-Options: DENY</text>
  <text x="1240" y="475" class="code-label">X-XSS-Protection: 1; mode=block</text>
  <text x="1240" y="490" class="note-text">CSP: Content-Security-Policy</text>
  <text x="1240" y="505" class="note-text">✅ 浏览器端防护</text>

  <!-- L5 SQL注入防护 -->
  <rect x="50" y="570" width="740" height="200" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="3"/>
  <rect x="50" y="570" width="740" height="40" rx="12" fill="#a855f7"/>
  <text x="80" y="598" class="layer-title">L5: SQL注入防护</text>

  <rect x="80" y="630" width="330" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  <text x="100" y="653" class="box-title">预编译语句</text>
  <text x="100" y="675" class="code-label">MyBatis-Plus PreparedStatement</text>
  <text x="100" y="690" class="note-text">参数化查询,自动转义</text>
  <text x="100" y="705" class="code-label">WHERE username = ?</text>
  <text x="100" y="720" class="note-text">禁止拼接SQL字符串</text>
  <text x="100" y="735" class="note-text">✅ JDBC原生防护</text>

  <rect x="440" y="630" width="330" height="120" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  <text x="460" y="653" class="box-title">输入校验</text>
  <text x="460" y="675" class="code-label">危险字符检测: ' " ; -- /*</text>
  <text x="460" y="690" class="note-text">拦截SQL关键字: UNION SELECT DROP</text>
  <text x="460" y="705" class="note-text">SqlInjectionValidator校验器</text>
  <text x="460" y="720" class="code-label">@Valid @SqlSafe String username</text>
  <text x="460" y="735" class="note-text">✅ 双重防护</text>

  <!-- L6 扫描流量拦截 -->
  <rect x="830" y="570" width="720" height="200" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <rect x="830" y="570" width="720" height="40" rx="12" fill="#dc2626"/>
  <text x="860" y="598" class="layer-title">L6: 扫描流量拦截 SecurityGuardFilter</text>

  <rect x="860" y="630" width="330" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="880" y="653" class="box-title">恶意路径拦截</text>
  <text x="880" y="675" class="code-label">/.git /phpmyadmin /.env</text>
  <text x="880" y="690" class="code-label">/actuator/env /druid/index.html</text>
  <text x="880" y="705" class="note-text">探测路径黑名单</text>
  <text x="880" y="720" class="note-text">返回: 404 Not Found</text>
  <text x="880" y="735" class="note-text">✅ 隐藏敏感端点</text>

  <rect x="1220" y="630" width="310" height="120" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="1240" y="653" class="box-title">UA检查</text>
  <text x="1240" y="675" class="code-label">拦截扫描器UA:</text>
  <text x="1240" y="690" class="note-text">sqlmap, nmap, nikto, burp</text>
  <text x="1240" y="705" class="note-text">masscan, metasploit</text>
  <text x="1240" y="720" class="note-text">返回: 403 Forbidden</text>
  <text x="1240" y="735" class="note-text">✅ 阻断自动化攻击</text>

  <!-- L7 审计日志 -->
  <rect x="50" y="800" width="1500" height="250" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <rect x="50" y="800" width="1500" height="40" rx="12" fill="#f59e0b"/>
  <text x="80" y="828" class="layer-title">L7: 审计日志 @OperationLog 可追溯可回溯</text>

  <rect x="80" y="860" width="340" height="160" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="100" y="883" class="box-title">操作审计 (sys_operation_log)</text>
  <text x="100" y="905" class="code-label">@OperationLog("删除用户")</text>
  <text x="100" y="920" class="note-text">记录: 操作人/时间/IP/UA</text>
  <text x="100" y="935" class="note-text">请求参数/响应结果</text>
  <text x="100" y="950" class="note-text">异步批量落库 (50条/批)</text>
  <text x="100" y="965" class="note-text">保留180天</text>
  <text x="100" y="980" class="note-text">租户隔离: tenant_id</text>
  <text x="100" y="995" class="note-text">✅ 操作可追溯</text>

  <rect x="450" y="860" width="340" height="160" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="470" y="883" class="box-title">登录日志 (sys_login_log)</text>
  <text x="470" y="905" class="code-label">登录成功/失败记录</text>
  <text x="470" y="920" class="note-text">用户名/IP/地理位置</text>
  <text x="470" y="935" class="note-text">登录方式: 密码/微信/短信</text>
  <text x="470" y="950" class="note-text">失败原因: 密码错误/账号冻结</text>
  <text x="470" y="965" class="note-text">登录保护: 失败3次需验证码</text>
  <text x="470" y="980" class="note-text">失败5次锁定15分钟</text>
  <text x="470" y="995" class="note-text">✅ 暴力破解防护</text>

  <rect x="820" y="860" width="340" height="160" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="840" y="883" class="box-title">API调用日志 (sys_api_call_log)</text>
  <text x="840" y="905" class="code-label">API路径/方法/状态码</text>
  <text x="840" y="920" class="note-text">响应时间/请求体大小</text>
  <text x="840" y="935" class="note-text">慢查询: &gt;3秒</text>
  <text x="840" y="950" class="note-text">错误追踪: 5xx错误</text>
  <text x="840" y="965" class="note-text">Prometheus指标暴露</text>
  <text x="840" y="980" class="note-text">Meilisearch全文索引</text>
  <text x="840" y="995" class="note-text">✅ 性能可观测</text>

  <rect x="1190" y="860" width="340" height="160" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1210" y="883" class="box-title">运行时日志 (sys_runtime_log)</text>
  <text x="1210" y="905" class="code-label">业务异常/系统错误</text>
  <text x="1210" y="920" class="note-text">ERROR/WARN级别日志</text>
  <text x="1210" y="935" class="note-text">堆栈跟踪 + traceId</text>
  <text x="1210" y="950" class="note-text">Loki日志聚合</text>
  <text x="1210" y="965" class="note-text">LogQL查询: {app="apex"}</text>
  <text x="1210" y="980" class="note-text">告警规则: ERROR&gt;10/min</text>
  <text x="1210" y="995" class="note-text">✅ 故障可排查</text>

  <text x="800" y="1090" class="code-label" text-anchor="middle">© 2026 Apex Team · 安全防护体系 v3.0 · 7层防护 · 纵深防御 · 审计追踪</text>
</svg>
