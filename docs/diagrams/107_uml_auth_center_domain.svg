<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940">
  <defs>
    <style>
      .title{font:700 30px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 13px sans-serif;fill:#64748b;text-anchor:middle}
      .cls-name{font:700 13px sans-serif;fill:#0f172a;text-anchor:middle}
      .cls-stereo{font:500 10px sans-serif;fill:#64748b;text-anchor:middle}
      .field{font:400 10px monospace;fill:#334155}
      .method{font:400 10px monospace;fill:#4338ca}
      .rel{font:500 10px sans-serif;fill:#64748b}
      .pkg{font:700 12px sans-serif;fill:#fff}
      .legend{font:500 11px sans-serif;fill:#475569}
      .note{font:500 11px sans-serif;fill:#64748b}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/></marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" stroke="#94a3b8"/></marker>
    <marker id="diamond" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M 0 6 L 6 1 L 12 6 L 6 11 z" fill="#ffffff" stroke="#4f46e5"/></marker>
  </defs>
  <rect width="1400" height="940" fill="#fff"/>
  <text x="700" y="38" class="title">UML 类图：apex-auth 领域模型</text>
  <text x="700" y="60" class="subtitle">com.apex.scaffold.auth.domain.model · 认证/授权领域实体 · 聚合与领域服务 · v1.3.1</text>

  <!-- package boundary -->
  <rect x="40" y="84" width="1320" height="790" rx="10" fill="#4f46e5" opacity="0.04" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="40" y="84" width="260" height="30" rx="8" fill="#4f46e5"/>
  <text x="58" y="104" class="pkg">domain.model (+ entity / vo / service)</text>

  <!-- UserEntity -->
  <rect x="70" y="140" width="250" height="230" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="195" y="162" class="cls-stereo">«aggregate root»</text>
  <text x="195" y="180" class="cls-name">UserEntity</text>
  <line x1="70" y1="190" x2="320" y2="190" stroke="#c7d2fe"/>
  <text x="82" y="208" class="field">- id / tenantId / username</text>
  <text x="82" y="224" class="field">- email / phone / openId</text>
  <text x="82" y="240" class="field">- accountId: Long (sys_user)</text>
  <text x="82" y="256" class="field">- passwordHash: String</text>
  <text x="82" y="272" class="field">- status / failedLoginAttempts</text>
  <text x="82" y="288" class="field">- lastLoginAt / lastLoginIp</text>
  <text x="82" y="304" class="field">- lockedUntil: LocalDateTime</text>
  <line x1="70" y1="314" x2="320" y2="314" stroke="#c7d2fe"/>
  <text x="82" y="332" class="method">+ isActive(): boolean</text>
  <text x="82" y="348" class="method">+ isLocked(): boolean</text>
  <text x="82" y="364" class="method">+ recordLoginSuccess(ip)</text>

  <!-- RoleEntity -->
  <rect x="380" y="140" width="250" height="230" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="505" y="162" class="cls-stereo">«entity»</text>
  <text x="505" y="180" class="cls-name">RoleEntity</text>
  <line x1="380" y1="190" x2="630" y2="190" stroke="#c7d2fe"/>
  <text x="392" y="208" class="field">- id: Long</text>
  <text x="392" y="224" class="field">- tenantId: String</text>
  <text x="392" y="240" class="field">- code: String</text>
  <text x="392" y="256" class="field">- name: String</text>
  <text x="392" y="272" class="field">- dataScope: String</text>
  <text x="392" y="288" class="field">- enabled: Boolean</text>
  <text x="392" y="304" class="field">- permissionIds: Set&lt;Long&gt;</text>
  <line x1="380" y1="314" x2="630" y2="314" stroke="#c7d2fe"/>
  <text x="392" y="332" class="method">+ addPermission(id)</text>
  <text x="392" y="348" class="method">+ hasPermission(id): boolean</text>
  <text x="392" y="364" class="method">+ isSuperRole(): boolean</text>

  <!-- PermissionEntity -->
  <rect x="690" y="140" width="250" height="230" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="815" y="162" class="cls-stereo">«entity»</text>
  <text x="815" y="180" class="cls-name">PermissionEntity</text>
  <line x1="690" y1="190" x2="940" y2="190" stroke="#c7d2fe"/>
  <text x="702" y="208" class="field">- id: Long</text>
  <text x="702" y="224" class="field">- tenantId: String</text>
  <text x="702" y="240" class="field">- code: String</text>
  <text x="702" y="256" class="field">- name: String</text>
  <text x="702" y="272" class="field">- resourceType: String</text>
  <text x="702" y="288" class="field">- resourceIdentifier: String</text>
  <text x="702" y="304" class="field">- action: String</text>
  <line x1="690" y1="314" x2="940" y2="314" stroke="#c7d2fe"/>
  <text x="702" y="332" class="method">+ matchesAction(action)</text>
  <text x="702" y="348" class="method">+ matchesResource(res)</text>
  <text x="702" y="364" class="method">+ isValid(): boolean</text>

  <!-- TokenEntity -->
  <rect x="1000" y="140" width="290" height="230" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="1145" y="162" class="cls-stereo">«aggregate root»</text>
  <text x="1145" y="180" class="cls-name">TokenEntity</text>
  <line x1="1000" y1="190" x2="1290" y2="190" stroke="#c7d2fe"/>
  <text x="1012" y="208" class="field">- id: Long</text>
  <text x="1012" y="224" class="field">- tenantId / userId</text>
  <text x="1012" y="240" class="field">- tokenType: String</text>
  <text x="1012" y="256" class="field">- jti / tokenFamily: String</text>
  <text x="1012" y="272" class="field">- expiresAt: LocalDateTime</text>
  <text x="1012" y="288" class="field">- revoked: Integer</text>
  <text x="1012" y="304" class="field">- rotationCount: Integer</text>
  <line x1="1000" y1="314" x2="1290" y2="314" stroke="#c7d2fe"/>
  <text x="1012" y="332" class="method">+ isValid(): boolean</text>
  <text x="1012" y="348" class="method">+ revoke(by, reason)</text>
  <text x="1012" y="364" class="method">+ recordUsage()</text>

  <!-- SessionEntity -->
  <rect x="70" y="400" width="250" height="180" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="195" y="422" class="cls-stereo">«entity»</text>
  <text x="195" y="440" class="cls-name">SessionEntity</text>
  <line x1="70" y1="450" x2="320" y2="450" stroke="#c7d2fe"/>
  <text x="82" y="468" class="field">- id / tenantId / userId</text>
  <text x="82" y="484" class="field">- sessionId / deviceType</text>
  <text x="82" y="500" class="field">- deviceId / ipAddress</text>
  <text x="82" y="516" class="field">- status / expiresAt</text>
  <line x1="70" y1="526" x2="320" y2="526" stroke="#c7d2fe"/>
  <text x="82" y="544" class="method">+ isActive() / isExpired()</text>
  <text x="82" y="560" class="method">+ terminate() / kickOut()</text>

  <!-- JwtKeyEntity -->
  <rect x="380" y="400" width="250" height="180" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="505" y="422" class="cls-stereo">«entity · @Table(jwt_keys)»</text>
  <text x="505" y="440" class="cls-name">JwtKeyEntity</text>
  <line x1="380" y1="450" x2="630" y2="450" stroke="#c7d2fe"/>
  <text x="392" y="468" class="field">- keyVersion: String</text>
  <text x="392" y="484" class="field">- encryptedSecret: String</text>
  <text x="392" y="500" class="field">- algorithm / status</text>
  <text x="392" y="516" class="field">- activatedAt / expiresAt</text>
  <line x1="380" y1="526" x2="630" y2="526" stroke="#c7d2fe"/>
  <text x="392" y="544" class="method">+ isActive() / isExpired()</text>
  <text x="392" y="560" class="method">+ isUsableForVerification()</text>

  <!-- MfaConfigEntity + TotpEntity -->
  <rect x="690" y="400" width="250" height="180" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="815" y="422" class="cls-stereo">«entity»</text>
  <text x="815" y="440" class="cls-name">MfaConfigEntity</text>
  <line x1="690" y1="450" x2="940" y2="450" stroke="#c7d2fe"/>
  <text x="702" y="468" class="field">- userId / tenantId</text>
  <text x="702" y="484" class="field">- mfaType: String</text>
  <text x="702" y="500" class="field">- enabled: Boolean</text>
  <text x="702" y="516" class="field">- required / priority</text>
  <line x1="690" y1="526" x2="940" y2="526" stroke="#c7d2fe"/>
  <text x="702" y="544" class="method">+ enable() / disable()</text>
  <text x="702" y="560" class="method">+ isMfaType(type): boolean</text>

  <rect x="1000" y="400" width="290" height="180" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="1145" y="422" class="cls-stereo">«entity»</text>
  <text x="1145" y="440" class="cls-name">TotpEntity</text>
  <line x1="1000" y1="450" x2="1290" y2="450" stroke="#c7d2fe"/>
  <text x="1012" y="468" class="field">- userId: Long</text>
  <text x="1012" y="484" class="field">- secret: String</text>
  <text x="1012" y="500" class="field">- backupCodes: String</text>
  <text x="1012" y="516" class="field">- verified / enabled</text>
  <line x1="1000" y1="526" x2="1290" y2="526" stroke="#c7d2fe"/>
  <text x="1012" y="544" class="method">+ verify(code): boolean</text>
  <text x="1012" y="560" class="method">+ useBackupCode(code)</text>

  <!-- AuditLogEntity -->
  <rect x="70" y="620" width="250" height="150" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="195" y="642" class="cls-stereo">«entity»</text>
  <text x="195" y="660" class="cls-name">AuditLogEntity</text>
  <line x1="70" y1="670" x2="320" y2="670" stroke="#c7d2fe"/>
  <text x="82" y="688" class="field">- eventType / eventStatus</text>
  <text x="82" y="704" class="field">- userId / tenantId</text>
  <text x="82" y="720" class="field">- details / riskLevel</text>
  <line x1="70" y1="730" x2="320" y2="730" stroke="#c7d2fe"/>
  <text x="82" y="748" class="method">+ isSuccess() / isHighRisk()</text>

  <!-- AuthConfigEntity -->
  <rect x="380" y="620" width="250" height="150" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="505" y="642" class="cls-stereo">«entity»</text>
  <text x="505" y="660" class="cls-name">AuthConfigEntity</text>
  <line x1="380" y1="670" x2="630" y2="670" stroke="#c7d2fe"/>
  <text x="392" y="688" class="field">- tenantId: String</text>
  <text x="392" y="704" class="field">- configType / configKey</text>
  <text x="392" y="720" class="field">- configValue / enabled</text>
  <line x1="380" y1="730" x2="630" y2="730" stroke="#c7d2fe"/>
  <text x="392" y="748" class="method">+ isPasswordPolicy() 等</text>

  <!-- value objects -->
  <rect x="690" y="620" width="250" height="150" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.4"/>
  <text x="815" y="642" class="cls-stereo" fill="#059669">«value object» · vo</text>
  <text x="815" y="660" class="cls-name">TokenPair</text>
  <line x1="690" y1="670" x2="940" y2="670" stroke="#bbf7d0"/>
  <text x="702" y="688" class="field">+ accessToken: String</text>
  <text x="702" y="704" class="field">+ refreshToken: String</text>
  <text x="702" y="720" class="field">+ expiresIn: Long</text>
  <line x1="690" y1="730" x2="940" y2="730" stroke="#bbf7d0"/>
  <text x="702" y="748" class="field">AuthenticationResult · TokenValidationResult</text>

  <!-- domain services -->
  <rect x="1000" y="620" width="290" height="150" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="1145" y="642" class="cls-stereo" fill="#b45309">«domain service»</text>
  <text x="1145" y="660" class="cls-name">认证/安全领域服务</text>
  <line x1="1000" y1="670" x2="1290" y2="670" stroke="#fde68a"/>
  <text x="1012" y="688" class="field">AuthenticationProtocol / MfaService</text>
  <text x="1012" y="704" class="field">TokenService / TokenTtlStrategy</text>
  <text x="1012" y="720" class="field">JwtKeyRotationService / JwtKeyMaterialService</text>
  <text x="1012" y="736" class="field">BruteForceProtection / IpAccessControl</text>
  <text x="1012" y="752" class="field">DeviceTrust / Biometric / PasswordPolicy</text>

  <!-- relationship connectors -->
  <!-- Role 持有 Permission (聚合): Role -> Permission -->
  <line x1="630" y1="295" x2="690" y2="295" stroke="#4f46e5" stroke-width="1.4" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
  <text x="660" y="286" class="rel">*..*</text>

  <!-- User -> Token (1..*) -->
  <line x1="320" y1="255" x2="1000" y2="255" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="640" y="248" class="rel">1 拥有 *</text>

  <!-- User -> Session -->
  <line x1="195" y1="370" x2="195" y2="400" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="205" y="392" class="rel">1..*</text>

  <!-- User -> MfaConfig / Totp -->
  <line x1="505" y1="370" x2="700" y2="400" stroke="#4f46e5" stroke-width="1.2" marker-end="url(#arrow-o)"/>
  <text x="540" y="392" class="rel">1 启用 0..1</text>
  <line x1="815" y1="370" x2="1000" y2="420" stroke="#4f46e5" stroke-width="1.2" marker-end="url(#arrow-o)"/>

  <!-- Token uses JwtKey -->
  <line x1="1145" y1="370" x2="505" y2="440" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-o)"/>
  <text x="830" y="392" class="rel">«use» 签发/校验</text>

  <!-- legend -->
  <rect x="40" y="894" width="1320" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="916" class="legend">图例： ◆—▸ 聚合（含 collect）　—▸ 关联/依赖（1..*）　⇢ «use» 领域服务引用</text>
  <text x="700" y="916" class="note" text-anchor="middle">10 张核心实体 + 值对象/领域服务；含 PasswordRecoveryEntity 状态机（REQUESTED→VERIFIED→CONSUMED）</text>
</svg>
