<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 14px sans-serif;fill:#64748b;text-anchor:middle}
      .actor-title{font:600 12px sans-serif;fill:#0f172a;text-anchor:middle}
      .text{font:400 10px sans-serif;fill:#475569}
      .code{font:400 9px monospace;fill:#2563eb}
      .step-text{font:500 10px sans-serif;fill:#1e293b}
      .actor-box{fill:#4f46e5;stroke:#4338ca;stroke-width:2;rx:6}
      .lifeline{fill:none;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:5,5}
      .activation{fill:#e0e7ff;stroke:#6366f1;stroke-width:1.5}
      .arrow{fill:none;stroke:#4f46e5;stroke-width:2;marker-end:url(#arrowhead)}
      .return-arrow{fill:none;stroke:#059669;stroke-width:2;stroke-dasharray:4,3;marker-end:url(#arrowhead-return)}
      .note-box{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5;rx:4}
      .phase-box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:6}
      .error-box{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5;rx:4}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4f46e5"/>
    </marker>
    <marker id="arrowhead-return" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <text x="700" y="35" class="title">OAuth 2.0 Token交换流程时序图 (Authorization Code → Access Token)</text>
  <text x="700" y="58" class="subtitle">PKCE验证 · Token颁发 · Refresh Token机制 · 基于Apex Scaffold实现</text>

  <rect x="80" y="90" width="130" height="50" class="actor-box"/>
  <text x="145" y="110" class="actor-title" fill="#ffffff">客户端应用</text>
  <text x="145" y="125" class="text" fill="#e0e7ff">已获得code</text>

  <rect x="280" y="90" width="160" height="50" class="actor-box"/>
  <text x="360" y="110" class="actor-title" fill="#ffffff">授权服务器</text>
  <text x="360" y="125" class="text" fill="#e0e7ff">/oauth2/token</text>

  <rect x="510" y="90" width="140" height="50" class="actor-box"/>
  <text x="580" y="110" class="actor-title" fill="#ffffff">Token服务</text>
  <text x="580" y="125" class="text" fill="#e0e7ff">TokenService</text>

  <rect x="720" y="90" width="140" height="50" class="actor-box"/>
  <text x="790" y="110" class="actor-title" fill="#ffffff">授权数据</text>
  <text x="790" y="125" class="text" fill="#e0e7ff">Redis + MySQL</text>

  <rect x="930" y="90" width="140" height="50" class="actor-box"/>
  <text x="1000" y="110" class="actor-title" fill="#ffffff">黑名单服务</text>
  <text x="1000" y="125" class="text" fill="#e0e7ff">TokenBlacklistService</text>

  <rect x="1140" y="90" width="140" height="50" class="actor-box"/>
  <text x="1210" y="110" class="actor-title" fill="#ffffff">客户端应用</text>
  <text x="1210" y="125" class="text" fill="#e0e7ff">收到Token</text>

  <path d="M 145,140 L 145,900" class="lifeline"/>
  <path d="M 360,140 L 360,900" class="lifeline"/>
  <path d="M 580,140 L 580,900" class="lifeline"/>
  <path d="M 790,140 L 790,900" class="lifeline"/>
  <path d="M 1000,140 L 1000,900" class="lifeline"/>
  <path d="M 1210,140 L 1210,900" class="lifeline"/>

  <rect x="40" y="170" width="1300" height="40" class="phase-box"/>
  <text x="690" y="195" class="step-text" text-anchor="middle">阶段1: 发起Token请求 (携带授权码和PKCE验证器)</text>

  <rect x="120" y="225" width="50" height="80" class="activation"/>
  <path d="M 145,245 L 360,245" class="arrow"/>
  <text x="252" y="233" class="step-text">POST /oauth2/token</text>
  <rect x="180" y="250" width="150" height="90" class="note-box"/>
  <text x="187" y="263" class="code">grant_type=authorization_code</text>
  <text x="187" y="275" class="code">code=AUTH_CODE_XYZ</text>
  <text x="187" y="287" class="code">client_id=web_app_123</text>
  <text x="187" y="299" class="code">client_secret=xxx</text>
  <text x="187" y="311" class="code">redirect_uri=https://...</text>
  <text x="187" y="323" class="code">code_verifier=原始随机串</text>
  <text x="187" y="335" class="code">Content-Type: application/</text>
  <text x="187" y="347" class="code">x-www-form-urlencoded</text>

  <rect x="40" y="370" width="1300" height="40" class="phase-box"/>
  <text x="690" y="395" class="step-text" text-anchor="middle">阶段2: 验证授权码和PKCE</text>

  <rect x="335" y="425" width="50" height="200" class="activation"/>
  <path d="M 360,445 L 790,445" class="arrow"/>
  <text x="575" y="433" class="step-text">查询授权码数据</text>
  <rect x="560" y="450" width="180" height="20" class="note-box"/>
  <text x="567" y="463" class="code">auth_code:{code} from Redis</text>

  <rect x="765" y="445" width="50" height="60" class="activation"/>
  <path d="M 790,485 L 360,485" class="return-arrow"/>
  <rect x="520" y="490" width="220" height="65" class="note-box"/>
  <text x="527" y="503" class="code">返回: {</text>
  <text x="532" y="515" class="code">userId: 123,</text>
  <text x="532" y="527" class="code">clientId: "web_app_123",</text>
  <text x="532" y="539" class="code">code_challenge: "E9Melhoa...",</text>
  <text x="532" y="551" class="code">redirect_uri, scope }</text>

  <rect x="280" y="570" width="160" height="40" class="note-box"/>
  <text x="290" y="583" class="code">PKCE验证:</text>
  <text x="290" y="595" class="code">SHA256(code_verifier)</text>
  <text x="290" y="607" class="code">== code_challenge ? ✅</text>

  <rect x="40" y="645" width="1300" height="40" class="phase-box"/>
  <text x="690" y="670" class="step-text" text-anchor="middle">阶段3: 生成Access Token和Refresh Token</text>

  <path d="M 360,700 L 580,700" class="arrow"/>
  <text x="470" y="688" class="step-text">请求生成Token</text>

  <rect x="555" y="700" width="50" height="120" class="activation"/>
  <rect x="480" y="710" width="190" height="100" class="note-box"/>
  <text x="487" y="723" class="code">生成 Access Token (JWT):</text>
  <text x="492" y="735" class="code">{</text>
  <text x="497" y="747" class="code">"sub": "user_openid",</text>
  <text x="497" y="759" class="code">"scope": "read write",</text>
  <text x="497" y="771" class="code">"exp": now + 7200s,</text>
  <text x="497" y="783" class="code">"iat": now</text>
  <text x="492" y="795" class="code">}</text>
  <text x="487" y="807" class="code">使用 RS256 签名</text>

  <path d="M 580,830 L 790,830" class="arrow"/>
  <text x="685" y="818" class="code">保存Token元数据</text>

  <rect x="765" y="830" width="50" height="40" class="activation"/>
  <rect x="700" y="840" width="180" height="50" class="note-box"/>
  <text x="707" y="853" class="code">oauth2_authorization表:</text>
  <text x="707" y="865" class="code">access_token, refresh_token</text>
  <text x="707" y="877" class="code">issued_at, expires_at</text>
  <text x="707" y="889" class="code">TTL: 7天(Refresh Token)</text>

  <rect x="1190" y="225" width="40" height="685" fill="#f0fdf4" stroke="#10b981" stroke-width="2" opacity="0.3"/>

  <path d="M 580,920 L 360,920" class="return-arrow"/>
  <rect x="420" y="885" width="120" height="50" class="note-box"/>
  <text x="427" y="898" class="code">返回Token对:</text>
  <text x="427" y="910" class="code">access_token</text>
  <text x="427" y="922" class="code">refresh_token</text>
  <text x="427" y="934" class="code">expires_in: 7200</text>

  <text x="700" y="935" class="code" text-anchor="middle">© 2026 Apex Team · OAuth 2.0 Token交换流程时序图 v3.0</text>
</svg>
