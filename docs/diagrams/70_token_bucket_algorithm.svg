<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>令牌桶限流算法</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-17</dc:date>
        <dc:version>1.0</dc:version>
        <dc:description>TokenBucket 令牌桶限流算法 - 固定速率补充令牌,支持突发流量,惰性计算模式</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main { font: 700 32px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .title-version { font: 500 14px system-ui, sans-serif; fill: #64748b; text-anchor: middle; }
      .section-title { font: 600 18px system-ui, sans-serif; fill: #ffffff; }
      .step-label { font: 500 14px system-ui, sans-serif; fill: #0f172a; }
      .code-label { font: 400 10px 'SF Mono', monospace; fill: #2563eb; }
      .note-text { font: 400 11px system-ui, sans-serif; fill: #64748b; }
      .param-text { font: 500 11px system-ui, sans-serif; fill: #0891b2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-refill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#ffffff"/>

  <text x="700" y="40" class="title-main">令牌桶限流算法 (Token Bucket)</text>
  <text x="700" y="65" class="title-version">固定速率补充令牌 · 支持突发流量 · 惰性计算 · ReentrantLock 线程安全</text>

  <!-- 核心参数区 -->
  <rect x="50" y="100" width="450" height="180" rx="12" fill="#eff6ff" stroke="#4f46e5" stroke-width="3"/>
  <rect x="50" y="100" width="450" height="45" rx="12" fill="#4f46e5"/>
  <text x="70" y="130" class="section-title">核心参数配置</text>

  <rect x="70" y="165" width="200" height="95" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="90" y="190" class="step-label">桶容量 (capacity)</text>
  <text x="90" y="210" class="param-text">最大令牌数: 100</text>
  <text x="90" y="228" class="note-text">决定突发流量上限</text>
  <text x="90" y="244" class="note-text">桶满时可一次性消耗多个令牌</text>

  <rect x="290" y="165" width="200" height="95" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="310" y="190" class="step-label">补充速率 (refillRate)</text>
  <text x="310" y="210" class="param-text">令牌/秒: 10.0</text>
  <text x="310" y="228" class="note-text">控制平均速率</text>
  <text x="310" y="244" class="note-text">惰性计算: 请求时补充</text>

  <!-- 令牌桶可视化 -->
  <rect x="550" y="100" width="350" height="400" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="3"/>
  <rect x="550" y="100" width="350" height="45" rx="12" fill="#059669"/>
  <text x="570" y="130" class="section-title">令牌桶状态</text>

  <!-- 桶的形状 -->
  <path d="M 650 200 L 650 430 Q 650 440 660 440 L 790 440 Q 800 440 800 430 L 800 200 Q 800 190 790 190 L 660 190 Q 650 190 650 200 Z" fill="#e0f2fe" stroke="#0891b2" stroke-width="3"/>
  
  <!-- 容量刻度 -->
  <line x1="630" y1="200" x2="650" y2="200" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="205" class="note-text" text-anchor="end">100</text>
  <line x1="630" y1="260" x2="650" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="620" y="265" class="note-text" text-anchor="end">75</text>
  <line x1="630" y1="320" x2="650" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="620" y="325" class="note-text" text-anchor="end">50</text>
  <line x1="630" y1="380" x2="650" y2="380" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="620" y="385" class="note-text" text-anchor="end">25</text>
  <line x1="630" y1="440" x2="650" y2="440" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="445" class="note-text" text-anchor="end">0</text>

  <!-- 当前令牌数 (水位线) -->
  <rect x="655" y="260" width="140" height="175" fill="#0891b2" opacity="0.8"/>
  <text x="725" y="355" class="section-title" text-anchor="middle">70 tokens</text>
  
  <!-- 补充箭头 -->
  <line x1="725" y1="170" x2="725" y2="190" stroke="#0891b2" stroke-width="4" marker-end="url(#arrow-refill)"/>
  <text x="725" y="165" class="param-text" text-anchor="middle">+10/秒</text>

  <!-- 时间轴 -->
  <text x="725" y="470" class="code-label" text-anchor="middle">availableTokens: 70</text>
  <text x="725" y="485" class="code-label" text-anchor="middle">lastRefillTime: T0</text>

  <!-- 算法流程区 -->
  <rect x="50" y="300" width="450" height="200" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <rect x="50" y="300" width="450" height="45" rx="12" fill="#d97706"/>
  <text x="70" y="330" class="section-title">tryAcquire() 算法流程</text>

  <rect x="70" y="365" width="200" height="120" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="388" class="step-label">Step 1: 惰性补充令牌</text>
  <text x="90" y="408" class="code-label">long now = System.nanoTime();</text>
  <text x="90" y="423" class="code-label">long elapsed = now - lastRefillTime;</text>
  <text x="90" y="438" class="code-label">long tokensToAdd = </text>
  <text x="95" y="453" class="code-label">  elapsed * refillRate / 1e9;</text>
  <text x="90" y="468" class="code-label">availableTokens = min(capacity,</text>
  <text x="95" y="480" class="code-label">  current + tokensToAdd);</text>

  <rect x="290" y="365" width="200" height="120" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="310" y="388" class="step-label">Step 2: 检查并消耗</text>
  <text x="310" y="408" class="code-label">if (availableTokens >= required) {</text>
  <text x="315" y="423" class="code-label">  availableTokens -= required;</text>
  <text x="315" y="438" class="code-label">  return true; // 成功</text>
  <text x="310" y="453" class="code-label">} else {</text>
  <text x="315" y="468" class="code-label">  return false; // 拒绝</text>
  <text x="310" y="480" class="code-label">}</text>

  <!-- 时序示例 -->
  <rect x="950" y="100" width="400" height="400" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <rect x="950" y="100" width="400" height="45" rx="12" fill="#dc2626"/>
  <text x="970" y="130" class="section-title">请求处理时序图</text>

  <!-- 时间轴 -->
  <line x1="970" y1="180" x2="1330" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <text x="970" y="175" class="note-text">时间 →</text>

  <!-- T0: 初始状态 -->
  <circle cx="1000" cy="180" r="5" fill="#4f46e5"/>
  <text x="1000" y="200" class="note-text" text-anchor="middle">T0</text>
  <text x="1000" y="215" class="code-label" text-anchor="middle">令牌: 100</text>

  <!-- T1: 请求5个令牌 -->
  <circle cx="1100" cy="180" r="5" fill="#059669"/>
  <line x1="1000" y1="180" x2="1100" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="1100" y="200" class="note-text" text-anchor="middle">T1 (+100ms)</text>
  <text x="1100" y="215" class="code-label" text-anchor="middle">请求: 5</text>
  <text x="1100" y="230" class="code-label" text-anchor="middle" fill="#059669">✓ 通过</text>
  <text x="1100" y="245" class="param-text" text-anchor="middle">令牌: 96 (100+1-5)</text>

  <!-- T2: 请求100个令牌 -->
  <circle cx="1200" cy="180" r="5" fill="#dc2626"/>
  <line x1="1100" y1="180" x2="1200" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-reject)"/>
  <text x="1200" y="200" class="note-text" text-anchor="middle">T2 (+200ms)</text>
  <text x="1200" y="215" class="code-label" text-anchor="middle">请求: 100</text>
  <text x="1200" y="230" class="code-label" text-anchor="middle" fill="#dc2626">✗ 拒绝</text>
  <text x="1200" y="245" class="param-text" text-anchor="middle">令牌: 98 (96+2<100)</text>

  <!-- T3: 补充后再请求 -->
  <circle cx="1300" cy="180" r="5" fill="#059669"/>
  <line x1="1200" y1="180" x2="1300" y2="180" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
  <text x="1300" y="200" class="note-text" text-anchor="middle">T3 (+1s)</text>
  <text x="1300" y="215" class="code-label" text-anchor="middle">请求: 50</text>
  <text x="1300" y="230" class="code-label" text-anchor="middle" fill="#059669">✓ 通过</text>
  <text x="1300" y="245" class="param-text" text-anchor="middle">令牌: 58 (100+8-50)</text>

  <!-- 特性说明 -->
  <rect x="970" y="270" width="360" height="215" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="990" y="295" class="step-label">算法特性</text>
  
  <text x="990" y="318" class="param-text">✓ 支持突发流量</text>
  <text x="1000" y="333" class="note-text">桶满时可一次性消耗大量令牌</text>
  
  <text x="990" y="356" class="param-text">✓ 控制平均速率</text>
  <text x="1000" y="371" class="note-text">refillRate 限制长期平均 QPS</text>
  
  <text x="990" y="394" class="param-text">✓ 惰性计算高效</text>
  <text x="1000" y="409" class="note-text">无后台线程, 请求时按时间差补充</text>
  
  <text x="990" y="432" class="param-text">✓ 线程安全</text>
  <text x="1000" y="447" class="note-text">ReentrantLock 保证原子性</text>
  
  <text x="990" y="470" class="code-label">适用场景: API限流 / 缓存回源 / 发送频控</text>

  <!-- 代码示例 -->
  <rect x="50" y="520" width="1300" height="220" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="550" class="step-label">使用示例与核心代码</text>

  <text x="70" y="575" class="code-label">// 创建令牌桶: 容量100, 每秒补充10个令牌</text>
  <text x="70" y="590" class="code-label">TokenBucket bucket = new TokenBucket(100, 10);</text>
  
  <text x="70" y="610" class="code-label">// 尝试获取1个令牌</text>
  <text x="70" y="625" class="code-label">if (bucket.tryAcquire()) {</text>
  <text x="85" y="640" class="code-label">    // 处理请求</text>
  <text x="70" y="655" class="code-label">}</text>
  
  <text x="70" y="675" class="code-label">// 尝试获取5个令牌 (批量操作)</text>
  <text x="70" y="690" class="code-label">if (bucket.tryAcquire(5)) {</text>
  <text x="85" y="705" class="code-label">    // 批量处理</text>
  <text x="70" y="720" class="code-label">}</text>

  <text x="700" y="575" class="code-label">// 惰性补充令牌核心算法</text>
  <text x="700" y="590" class="code-label">private void refillTokens() {</text>
  <text x="715" y="605" class="code-label">    long now = System.nanoTime();</text>
  <text x="715" y="620" class="code-label">    long elapsedNanos = now - lastRefillTimeNanos.get();</text>
  <text x="715" y="635" class="code-label">    long tokensToAdd = (long)(elapsedNanos * refillRate / 1e9);</text>
  <text x="715" y="650" class="code-label">    if (tokensToAdd > 0 && lastRefillTimeNanos.compareAndSet(last, now)) {</text>
  <text x="730" y="665" class="code-label">        long newTokens = Math.min(capacity, current + tokensToAdd);</text>
  <text x="730" y="680" class="code-label">        availableTokens.set(newTokens);</text>
  <text x="715" y="695" class="code-label">    }</text>
  <text x="700" y="710" class="code-label">}</text>

  <text x="700" y="770" class="code-label" text-anchor="middle">© 2026 Apex Team · 令牌桶限流算法 v1.0 · com.apex.scaffold.common.util.ratelimit.algorithm.TokenBucket</text>
</svg>
