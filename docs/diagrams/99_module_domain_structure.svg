<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 13px sans-serif;fill:#64748b;text-anchor:middle}
      .grp{font:600 13px sans-serif;fill:#fff}
      .box-title{font:600 12px sans-serif;fill:#0f172a}
      .box-desc{font:400 10px sans-serif;fill:#475569}
      .code{font:500 9.5px monospace;fill:#2563eb}
      .note{font:500 11px sans-serif;fill:#64748b}
      .legend{font:500 11px sans-serif;fill:#475569}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="700" y="40" class="title">模块结构：apex-domain</text>
  <text x="700" y="64" class="subtitle">com.apex.scaffold.domain · 共享领域 · 基础实体 / 通用事件 / 服务端口与 Gateway 契约 · v1.3.1</text>

  <rect x="40" y="92" width="430" height="740" rx="10" fill="#059669" opacity="0.06" stroke="#059669" stroke-width="2"/>
  <rect x="40" y="92" width="430" height="40" rx="10" fill="#059669"/>
  <text x="60" y="118" class="grp">包结构（com.apex.scaffold.domain.*）</text>
  <text x="60" y="148" class="code">├─ model.entity（基础实体基类）</text>
  <text x="60" y="170" class="code">├─ event（通用领域事件契约）</text>
  <text x="60" y="192" class="code">├─ gateway（外部平台 Gateway 契约）</text>
  <text x="60" y="214" class="code">└─ service（跨域服务端口与契约）</text>
  <text x="60" y="248" class="note">注：system 专属实体/仓储在 apex-system 内的 domain 包，</text>
  <text x="60" y="270" class="note">workflow / office 领域模型在各自业务库；本模块只容纳</text>
  <text x="60" y="292" class="note">可跨域复用的契约。</text>

  <text x="60" y="340" class="legend" font-weight="600">职责定位</text>
  <text x="60" y="366" class="box-desc">• 基础实体基类（BaseEntity）</text>
  <text x="60" y="388" class="box-desc">• 领域事件总线 / 处理器契约与通用事件</text>
  <text x="60" y="410" class="box-desc">• 外部平台 Gateway 契约（短信/微信/熔断端口）</text>
  <text x="60" y="432" class="box-desc">• 跨域服务端口（缓存一致性/指标/令牌/短信码）</text>
  <text x="60" y="454" class="box-desc">• 无业务实体、无基础设施实现</text>

  <text x="60" y="502" class="legend" font-weight="600">依赖</text>
  <text x="60" y="528" class="box-desc">→ 仅依赖 apex-common（L0 基础）</text>
  <text x="60" y="550" class="box-desc">→ 不依赖任何 infrastructure / 业务库</text>
  <text x="60" y="572" class="box-desc">← 被 19 个模块直接依赖（五个 infrastructure 能力 JAR、</text>
  <text x="60" y="594" class="box-desc">    六个业务库、六个 *-service、boot-all/example 等，依赖深度 L1）</text>

  <!-- right: contract cards -->
  <rect x="500" y="92" width="860" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="120" class="box-title" font-size="14">模型与事件（model.entity / event）</text>
  <rect x="520" y="136" width="410" height="190" rx="6" fill="#fff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="533" y="158" class="box-title">基础实体</text>
  <text x="533" y="178" class="code">model.entity.BaseEntity</text>
  <text x="533" y="198" class="box-desc">业务实体公共字段与行为的基类</text>
  <text x="533" y="224" class="box-title">通用领域事件</text>
  <text x="533" y="244" class="code">event.TokenRevokedEvent</text>
  <text x="533" y="264" class="code">event.DomainEventBus · DomainEventHandler</text>
  <text x="533" y="284" class="box-desc">事件总线与处理器契约，供各域复用</text>
  <rect x="950" y="136" width="390" height="190" rx="6" fill="#fff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="963" y="158" class="box-title">定位边界</text>
  <text x="963" y="178" class="box-desc">只容纳可跨域复用的契约</text>
  <text x="963" y="198" class="box-desc">system 专属实体/仓储端口在 apex-system</text>
  <text x="963" y="216" class="box-desc">workflow 领域模型在 apex-workflow</text>
  <text x="963" y="234" class="box-desc">office 领域模型在 apex-office</text>
  <text x="963" y="260" class="box-desc">本模块不随业务域膨胀，保持轻量</text>

  <rect x="500" y="362" width="860" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="390" class="box-title" font-size="14">端口与 Gateway 契约（gateway / service）</text>
  <rect x="520" y="406" width="410" height="190" rx="6" fill="#fff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="533" y="428" class="box-title">外部平台 Gateway（gateway）</text>
  <text x="533" y="448" class="code">ChuanglanGateway（创蓝短信）</text>
  <text x="533" y="468" class="code">WeChatGateway（微信平台）</text>
  <text x="533" y="488" class="code">CircuitBreakerPort · Remote* 异常契约</text>
  <text x="533" y="508" class="box-desc">由 infrastructure-integration / remote 实现</text>
  <rect x="950" y="406" width="390" height="190" rx="6" fill="#fff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="963" y="428" class="box-title">跨域服务端口（service）</text>
  <text x="963" y="448" class="code">DomainEventPublisher · CacheConsistencyPort</text>
  <text x="963" y="468" class="code">BusinessMetricsPort · CacheService</text>
  <text x="963" y="488" class="code">TokenService · TokenBlacklistService</text>
  <text x="963" y="508" class="code">SmsCodeService · SmsCodePurposeService</text>

  <rect x="500" y="632" width="860" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="660" class="box-title" font-size="14">设计约束</text>
  <text x="520" y="690" class="box-desc">1. 纯契约层：端口/Gateway 为接口与轻量模型，实现全部在基础设施或业务库。</text>
  <text x="520" y="718" class="box-desc">2. 依赖倒置：基础设施依赖并实现领域端口，领域不反向依赖具体实现。</text>
  <text x="520" y="746" class="box-desc">3. 不容纳具体业务实体；业务域专属模型下沉至对应业务库。</text>
  <text x="1040" y="660" class="box-title" font-size="14">典型引用方</text>
  <text x="1040" y="690" class="box-desc">五个 infrastructure 能力 JAR（实现端口）</text>
  <text x="1040" y="718" class="box-desc">六个业务库与各 *-service（复用契约）</text>
  <text x="1040" y="746" class="note">apex-common 提供通用基础，本模块扩展领域契约</text>

  <text x="700" y="872" class="note" text-anchor="middle">apex-domain 是跨域复用的领域契约层：基础实体 + 通用事件 + 服务端口/Gateway（依赖深度 L1）</text>
</svg>
