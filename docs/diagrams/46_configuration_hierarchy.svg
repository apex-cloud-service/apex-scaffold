<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><style>.t{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.h{font:700 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.l{font:14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.c{font:12px 'Courier New',monospace;fill:#334155}.b{fill:#fff;stroke:#4f46e5;stroke-width:2;rx:14}.i{fill:#eef2ff;stroke:#6366f1;stroke-width:2;rx:14}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}.w{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.line{stroke:#4f46e5;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#4f46e5"/></marker></defs><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="48" text-anchor="middle" class="t">配置层级图 (Configuration Hierarchy)</text><text x="800" y="76" text-anchor="middle" class="s">基础配置、环境 Profile 与运行时变量共同决定最终配置</text><rect x="90" y="150" width="300" height="180" class="b"/><text x="240" y="190" text-anchor="middle" class="h">基础配置</text><text x="115" y="235" class="c">application.yml</text><text x="115" y="270" class="l">通用服务端口与组件开关</text><text x="115" y="300" class="l">默认日志、缓存、WebFlux</text><rect x="500" y="120" width="330" height="240" class="i"/><text x="665" y="160" text-anchor="middle" class="h">环境配置</text><text x="525" y="205" class="c">application-dev.yml</text><text x="525" y="235" class="c">application-test.yml</text><text x="525" y="265" class="c">application-prod.yml</text><text x="525" y="315" class="l">数据库、Redis、监控等环境差异</text><path d="M390 240H500" class="line"/><rect x="940" y="150" width="300" height="180" class="w"/><text x="1090" y="190" text-anchor="middle" class="h">Profile 激活</text><text x="965" y="235" class="c">spring.profiles.active</text><text x="965" y="270" class="l">dev / test / prod</text><text x="965" y="300" class="l">选择当前环境覆盖项</text><path d="M830 240H940" class="line"/><rect x="1350" y="120" width="180" height="240" class="g"/><text x="1440" y="160" text-anchor="middle" class="h">最终配置</text><text x="1370" y="210" class="l">Spring</text><text x="1370" y="240" class="l">Bean</text><text x="1370" y="270" class="l">组件</text><text x="1370" y="300" class="l">运行时</text><path d="M1240 240H1350" class="line"/><rect x="250" y="500" width="330" height="180" class="w"/><text x="415" y="540" text-anchor="middle" class="h">环境变量 / Secret</text><text x="275" y="585" class="c">JWT_SECRET</text><text x="275" y="615" class="c">DB_MASTER_PASSWORD</text><text x="275" y="645" class="c">DB_SLAVE_PASSWORD</text><rect x="730" y="500" width="330" height="180" class="b"/><text x="895" y="540" text-anchor="middle" class="h">安全配置原则</text><text x="755" y="585" class="l">生产密钥不少于 32 字符</text><text x="755" y="615" class="l">敏感信息不写入仓库</text><text x="755" y="645" class="l">签发与校验使用同一密钥</text><rect x="1210" y="500" width="300" height="180" class="i"/><text x="1360" y="540" text-anchor="middle" class="h">运行时组件</text><text x="1235" y="585" class="l">DataSource · Redis</text><text x="1235" y="615" class="l">JWT · Actuator</text><text x="1235" y="645" class="l">Prometheus · Grafana</text><path d="M415 500V410H1090V330" class="line"/><path d="M1060 590H1210" class="line"/><text x="800" y="780" text-anchor="middle" class="s">优先级原则：通用默认值 → 环境文件 → Profile 选择 → 环境变量覆盖</text></svg>
