  <rect x="925" y="540" width="419" height="52" rx="6" fill="#fff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="940" y="560" class="box-title">Token 生命周期</text>
  <text x="940" y="578" class="box-desc">Access 3600s / Refresh 2592000s · PKCE(S256) · 撤销与轮换</text>

  <line x1="700" y1="606" x2="700" y2="624" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Observability -->
