<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <style>
      .title-main { font: 700 28px system-ui, sans-serif; fill: #f8fafc; }
      .title-sub { font: 500 13px system-ui, sans-serif; fill: #94a3b8; }
      .layer-title { font: 600 16px system-ui, sans-serif; fill: #ffffff; }
      .section-title { font: 600 14px system-ui, sans-serif; fill: #f8fafc; }
      .label-text { font: 500 12px system-ui, sans-serif; fill: #e2e8f0; }
      .code-text { font: 400 11px 'SF Mono', monospace; fill: #38bdf8; }
      .note-text { font: 400 11px system-ui, sans-serif; fill: #cbd5e1; }
      .highlight { font: 600 12px system-ui, sans-serif; fill: #fbbf24; }
      .error-text { font: 600 12px system-ui, sans-serif; fill: #f87171; }
      .success-text { font: 600 12px system-ui, sans-serif; fill: #34d399; }
    </style>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-success" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-error" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-warning" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#0f172a"/>

  <text x="700" y="35" class="title-main" text-anchor="middle">幂等API机制架构 (@IdempotentApi)</text>
  <text x="700" y="55" class="title-sub" text-anchor="middle">Redis SETNX原子操作 · SHA256幂等键 · 并发保护 · 失败语义 · TTL过期 · Fail-Open降级</text>

  <rect x="40" y="80" width="450" height="290" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="80" width="450" height="35" rx="8" fill="url(#grad-primary)"/>
  <text x="60" y="103" class="layer-title">1. 注解配置与幂等键生成</text>

  <rect x="60" y="130" width="410" height="220" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="80" y="152" class="section-title">@IdempotentApi 注解参数</text>
  <text x="80" y="168" class="code-text">header: "Idempotency-Key" (默认)</text>
  <text x="90" y="184" class="note-text">客户端为每个写操作生成唯一UUID</text>
  <text x="80" y="202" class="code-text">expireTime: 600秒 (默认)</text>
  <text x="90" y="218" class="note-text">幂等窗口覆盖完整重试周期</text>
  <text x="80" y="236" class="code-text">required: true (默认)</text>
  <text x="90" y="252" class="note-text">严格模式: 缺少幂等键直接拒绝</text>
  <text x="90" y="268" class="note-text">渐进模式: false时缺头放行</text>
  <line x1="80" y1="278" x2="440" y2="278" stroke="#334155" stroke-width="1"/>
  <text x="80" y="296" class="section-title">幂等键合成 (SHA256)</text>
  <text x="80" y="312" class="highlight">apex:idem:{sha256Hex(路径|键值|IP)}</text>
  <text x="90" y="328" class="note-text">• 路径隔离不同接口</text>
  <text x="90" y="344" class="note-text">• IP防止客户端复用键值</text>

  <rect x="510" y="80" width="420" height="290" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="510" y="80" width="420" height="35" rx="8" fill="url(#grad-success)"/>
  <text x="530" y="103" class="layer-title">2. Redis SETNX 原子去重</text>

  <rect x="530" y="130" width="380" height="220" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="550" y="152" class="section-title">并发保护机制</text>
  <text x="550" y="168" class="code-text">redisTemplate.opsForValue()</text>
  <text x="560" y="184" class="code-text">.setIfAbsent(key, "1", Duration)</text>
  <text x="550" y="200" class="success-text">✓ 首次请求: acquired = true</text>
  <text x="560" y="216" class="label-text">→ 执行业务方法</text>
  <text x="550" y="234" class="error-text">✗ 重复请求: acquired = false</text>
  <text x="560" y="250" class="label-text">→ 返回 REPEAT_SUBMIT (40102)</text>
  <line x1="550" y1="260" x2="880" y2="260" stroke="#334155" stroke-width="1"/>
  <text x="550" y="278" class="section-title">原子性保证</text>
  <text x="560" y="294" class="note-text">• SETNX是Redis单线程原子操作</text>
  <text x="560" y="310" class="note-text">• 同一键并发到达仅一个获得执行权</text>
  <text x="560" y="326" class="note-text">• 其余请求立即收到拒绝响应</text>

  <rect x="960" y="80" width="400" height="290" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="960" y="80" width="400" height="35" rx="8" fill="url(#grad-warning)"/>
  <text x="980" y="103" class="layer-title">3. 失败语义与键释放策略</text>

  <rect x="980" y="130" width="360" height="220" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="1000" y="152" class="section-title">5xx 异常 → 保留键</text>
  <text x="1000" y="168" class="error-text">IllegalStateException / DAO / IO异常</text>
  <text x="1010" y="184" class="note-text">• 数据库写入可能已部分落盘</text>
  <text x="1010" y="200" class="highlight">• 绝不删除幂等键</text>
  <text x="1010" y="216" class="note-text">• 由TTL兜底保证窗口内不可重入</text>
  <text x="1010" y="232" class="note-text">• 避免竞态: 写落盘→删键→再次穿透</text>
  <line x1="1000" y1="242" x2="1310" y2="242" stroke="#334155" stroke-width="1"/>
  <text x="1000" y="260" class="section-title">4xx 异常 → 释放键</text>
  <text x="1000" y="276" class="code-text">BusinessException (客户端错误)</text>
  <text x="1010" y="292" class="note-text">• 参数错误、业务规则校验失败</text>
  <text x="1010" y="308" class="success-text">• 删除幂等键允许合法重试</text>
  <text x="1010" y="324" class="note-text">• 客户端可换参/换键重新提交</text>

  <line x1="265" y1="370" x2="265" y2="395" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="370" x2="720" y2="395" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="395" width="420" height="330" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="395" width="420" height="35" rx="8" fill="url(#grad-success)"/>
  <text x="60" y="418" class="layer-title">4. 成功路径 - 键保留至TTL过期</text>

  <rect x="60" y="445" width="380" height="260" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="80" y="467" class="section-title">业务成功后行为</text>
  <text x="80" y="483" class="code-text">try {</text>
  <text x="90" y="499" class="code-text">Object result = joinPoint.proceed();</text>
  <text x="90" y="515" class="success-text">// 业务方法执行成功</text>
  <text x="90" y="531" class="highlight">// 幂等键保留不删除</text>
  <text x="90" y="547" class="code-text">return Mono.just(result);</text>
  <text x="80" y="563" class="code-text">}</text>
  <line x1="80" y1="573" x2="410" y2="573" stroke="#334155" stroke-width="1"/>
  <text x="80" y="591" class="section-title">窗口内重复请求</text>
  <text x="90" y="607" class="note-text">• TTL窗口内: 重复请求被拒绝</text>
  <text x="90" y="623" class="note-text">• 操作已生效不应重复执行</text>
  <text x="90" y="639" class="note-text">• 客户端应查询结果而非重放</text>
  <line x1="80" y1="649" x2="410" y2="649" stroke="#334155" stroke-width="1"/>
  <text x="80" y="667" class="section-title">TTL过期后</text>
  <text x="90" y="683" class="note-text">• Redis自动清理过期键</text>
  <text x="90" y="699" class="note-text">• 允许相同业务动作再次提交</text>

  <rect x="480" y="395" width="450" height="330" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="480" y="395" width="450" height="35" rx="8" fill="url(#grad-error)"/>
  <text x="500" y="418" class="layer-title">5. Redis降级与监控</text>

  <rect x="500" y="445" width="410" height="130" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="467" class="section-title">Fail-Open 降级策略</text>
  <text x="520" y="483" class="code-text">.onErrorResume(redisError → {</text>
  <text x="530" y="499" class="error-text">log.error("Redis不可用");</text>
  <text x="530" y="515" class="highlight">return joinPoint.proceed();</text>
  <text x="530" y="531" class="note-text">// 放行请求避免写接口整体不可用</text>
  <text x="520" y="547" class="code-text">})</text>
  <text x="520" y="563" class="note-text">• 数据库唯一约束作为最终兜底</text>

  <rect x="500" y="590" width="410" height="115" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="612" class="section-title">Prometheus 指标记录</text>
  <text x="520" y="628" class="code-text">securityMetricsRecorder</text>
  <text x="530" y="644" class="code-text">.recordRepeatSubmitRejected()</text>
  <text x="520" y="660" class="note-text">• 重复提交拒绝次数统计</text>
  <text x="520" y="676" class="note-text">• 幂等键命中率监控</text>
  <text x="520" y="692" class="note-text">• Redis降级事件告警</text>

  <rect x="960" y="395" width="400" height="330" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="960" y="395" width="400" height="35" rx="8" fill="url(#grad-primary)"/>
  <text x="980" y="418" class="layer-title">6. 响应式适配与请求解析</text>

  <rect x="980" y="445" width="360" height="260" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="1000" y="467" class="section-title">双模式请求解析</text>
  <text x="1000" y="483" class="code-text">resolveRequestContext(args)</text>
  <text x="1010" y="499" class="label-text">▸ ServerRequest (函数式端点)</text>
  <text x="1010" y="515" class="label-text">▸ ServerWebExchange (注解式端点)</text>
  <text x="1010" y="531" class="note-text">提取: path, headers, clientIp</text>
  <line x1="1000" y1="541" x2="1310" y2="541" stroke="#334155" stroke-width="1"/>
  <text x="1000" y="559" class="section-title">Mono 响应流串联</text>
  <text x="1000" y="575" class="code-text">if (result instanceof Mono) {</text>
  <text x="1010" y="591" class="code-text">return mono.onErrorResume(error →</text>
  <text x="1020" y="607" class="highlight">isClientError(error)</text>
  <text x="1030" y="623" class="code-text">? release(key).then(Mono.error)</text>
  <text x="1030" y="639" class="code-text">: Mono.error(error)</text>
  <text x="1010" y="655" class="code-text">);</text>
  <text x="1000" y="671" class="code-text">}</text>
  <text x="1000" y="687" class="note-text">• 客户端错误释放键允许重试</text>

  <line x1="490" y1="250" x2="510" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="250" x2="960" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="20" y="785" class="note-text">© 2026 Apex Team · 幂等API机制架构 v1.0</text>
</svg>
