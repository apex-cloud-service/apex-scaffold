<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 14px sans-serif;fill:#64748b;text-anchor:middle}
      .actor-title{font:600 12px sans-serif;fill:#0f172a;text-anchor:middle}
      .text{font:400 10px sans-serif;fill:#475569}
      .code{font:400 9px monospace;fill:#2563eb}
      .step-text{font:500 10px sans-serif;fill:#1e293b}
      .note-text{font:400 9px sans-serif;fill:#64748b}
      .actor-box{fill:#4f46e5;stroke:#4338ca;stroke-width:2;rx:6}
      .lifeline{fill:none;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:5,5}
      .activation{fill:#e0e7ff;stroke:#6366f1;stroke-width:1.5}
      .arrow{fill:none;stroke:#4f46e5;stroke-width:2;marker-end:url(#arrowhead)}
      .return-arrow{fill:none;stroke:#059669;stroke-width:2;stroke-dasharray:4,3;marker-end:url(#arrowhead-return)}
      .note-box{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5;rx:4}
      .phase-box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:6}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4f46e5"/>
    </marker>
    <marker id="arrowhead-return" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <text x="700" y="35" class="title">OAuth 2.0 授权码模式时序图 (Authorization Code + PKCE)</text>
  <text x="700" y="58" class="subtitle">完整交互流程 · 包含PKCE安全增强 · 基于Apex Scaffold实现</text>

  <!-- Actors -->
  <rect x="70" y="90" width="120" height="50" class="actor-box"/>
  <text x="130" y="110" class="actor-title" fill="#ffffff">用户浏览器</text>
  <text x="130" y="125" class="text" fill="#e0e7ff">Resource Owner</text>

  <rect x="280" y="90" width="140" height="50" class="actor-box"/>
  <text x="350" y="110" class="actor-title" fill="#ffffff">客户端应用</text>
  <text x="350" y="125" class="text" fill="#e0e7ff">SPA / Mobile App</text>

  <rect x="510" y="90" width="160" height="50" class="actor-box"/>
  <text x="590" y="110" class="actor-title" fill="#ffffff">授权服务器</text>
  <text x="590" y="125" class="text" fill="#e0e7ff">OAuth2AuthorizationHandler</text>

  <rect x="760" y="90" width="140" height="50" class="actor-box"/>
  <text x="830" y="110" class="actor-title" fill="#ffffff">用户认证</text>
  <text x="830" y="125" class="text" fill="#e0e7ff">JwtAuthenticationFilter</text>

  <rect x="990" y="90" width="140" height="50" class="actor-box"/>
  <text x="1060" y="110" class="actor-title" fill="#ffffff">Token服务</text>
  <text x="1060" y="125" class="text" fill="#e0e7ff">TokenService</text>

  <rect x="1220" y="90" width="130" height="50" class="actor-box"/>
  <text x="1285" y="110" class="actor-title" fill="#ffffff">数据库</text>
  <text x="1285" y="125" class="text" fill="#e0e7ff">MySQL + Redis</text>

  <!-- Lifelines -->
  <path d="M 130,140 L 130,1050" class="lifeline"/>
  <path d="M 350,140 L 350,1050" class="lifeline"/>
  <path d="M 590,140 L 590,1050" class="lifeline"/>
  <path d="M 830,140 L 830,1050" class="lifeline"/>
  <path d="M 1060,140 L 1060,1050" class="lifeline"/>
  <path d="M 1285,140 L 1285,1050" class="lifeline"/>

  <!-- Phase 1: Initialization -->
  <rect x="40" y="170" width="1310" height="40" class="phase-box"/>
  <text x="695" y="195" class="step-text" text-anchor="middle">阶段1: 客户端初始化 (PKCE准备)</text>

  <rect x="325" y="225" width="50" height="80" class="activation"/>
  <rect x="280" y="230" width="140" height="70" class="note-box"/>
  <text x="290" y="245" class="code">1. 生成随机字符串</text>
  <text x="290" y="257" class="code">code_verifier</text>
  <text x="290" y="269" class="code">= base64url(random(32))</text>
  <text x="290" y="285" class="code">2. 计算挑战码</text>
  <text x="290" y="297" class="code">code_challenge = base64url(</text>
  <text x="295" y="309" class="code">SHA256(code_verifier))</text>

  <!-- Phase 2: Authorization Request -->
  <rect x="40" y="320" width="1310" height="40" class="phase-box"/>
  <text x="695" y="345" class="step-text" text-anchor="middle">阶段2: 发起授权请求</text>

  <path d="M 350,380 L 590,380" class="arrow"/>
  <text x="470" y="368" class="step-text">GET /oauth2/authorize?</text>
  <rect x="430" y="385" width="130" height="90" class="note-box"/>
  <text x="437" y="398" class="code">response_type=code</text>
  <text x="437" y="410" class="code">client_id=web_app_123</text>
  <text x="437" y="422" class="code">redirect_uri=https://</text>
  <text x="437" y="434" class="code">app.example.com/callback</text>
  <text x="437" y="446" class="code">scope=read write user:profile</text>
  <text x="437" y="458" class="code">state=xyz123 (防CSRF)</text>
  <text x="437" y="470" class="code">code_challenge=E9Melhoa...</text>
  <text x="437" y="482" class="code">code_challenge_method=S256</text>

  <rect x="565" y="380" width="50" height="130" class="activation"/>

  <!-- Phase 3: User Authentication -->
  <rect x="40" y="525" width="1310" height="40" class="phase-box"/>
  <text x="695" y="550" class="step-text" text-anchor="middle">阶段3: 用户认证</text>

  <path d="M 590,590 L 830,590" class="arrow"/>
  <text x="710" y="578" class="step-text">检查用户登录状态</text>

  <rect x="805" y="590" width="50" height="80" class="activation"/>
  <path d="M 830,610 L 1285,610" class="arrow"/>
  <text x="1057" y="598" class="code">查询用户Session</text>

  <path d="M 1285,630 L 830,630" class="return-arrow"/>
  <text x="1057" y="618" class="code">返回用户信息 或 未登录</text>

  <path d="M 830,650 L 590,650" class="return-arrow"/>
  <text x="710" y="638" class="step-text">认证结果</text>

  <path d="M 590,680 L 130,680" class="return-arrow"/>
  <text x="360" y="668" class="step-text">302 重定向到登录页</text>

  <path d="M 130,710 L 590,710" class="arrow"/>
  <text x="360" y="698" class="step-text">POST /api/v1/auth/login</text>
  <rect x="240" y="715" width="140" height="30" class="note-box"/>
  <text x="247" y="728" class="code">username + password</text>
  <text x="247" y="740" class="code">或 微信code (社交登录)</text>

  <rect x="565" y="710" width="50" height="60" class="activation"/>
  <path d="M 590,730 L 830,730" class="arrow"/>
  <text x="710" y="718" class="code">验证凭证</text>

  <rect x="805" y="730" width="50" height="40" class="activation"/>
  <path d="M 830,750 L 590,750" class="return-arrow"/>
  <text x="710" y="738" class="code">生成Session + JWT</text>

  <path d="M 590,770 L 130,770" class="return-arrow"/>
  <text x="360" y="758" class="step-text">登录成功,重定向回授权页</text>

  <!-- Phase 4: Authorization Consent -->
  <rect x="40" y="800" width="1310" height="40" class="phase-box"/>
  <text x="695" y="825" class="step-text" text-anchor="middle">阶段4: 用户授权同意</text>

  <path d="M 130,860 L 590,860" class="arrow"/>
  <text x="360" y="848" class="step-text">用户查看授权页面</text>

  <rect x="565" y="860" width="50" height="80" class="activation"/>
  <rect x="500" y="870" width="180" height="60" class="note-box"/>
  <text x="510" y="885" class="text" font-weight="600">授权范围 (Scopes):</text>
  <text x="510" y="898" class="code">✓ read: 读取基础资源</text>
  <text x="510" y="910" class="code">✓ write: 创建和修改资源</text>
  <text x="510" y="922" class="code">✓ user:profile: 访问用户资料</text>

  <path d="M 130,950 L 590,950" class="arrow"/>
  <text x="360" y="938" class="step-text">POST /oauth2/consent (用户点击"同意")</text>

  <path d="M 590,970 L 1285,970" class="arrow"/>
  <text x="937" y="958" class="code">保存授权同意记录</text>
  <rect x="837" y="975" width="260" height="20" class="note-box"/>
  <text x="844" y="988" class="code">oauth2_authorization_consent表</text>

  <rect x="1260" y="970" width="50" height="30" class="activation"/>

  <!-- Phase 5: Authorization Code Issuance -->
  <rect x="40" y="1015" width="1310" height="40" class="phase-box"/>
  <text x="695" y="1040" class="step-text" text-anchor="middle">阶段5: 颁发授权码</text>

  <path d="M 1285,1070 L 590,1070" class="return-arrow"/>
  <text x="937" y="1058" class="code">保存成功</text>

  <rect x="565" y="1065" width="50" height="100" class="activation"/>
  <rect x="480" y="1075" width="220" height="85" class="note-box"/>
  <text x="490" y="1090" class="code">1. 生成授权码 (authorization_code)</text>
  <text x="490" y="1102" class="code">code = UUID.randomUUID()</text>
  <text x="490" y="1114" class="code">有效期: 10分钟</text>
  <text x="490" y="1126" class="code">2. 保存到Redis:</text>
  <text x="495" y="1138" class="code">auth_code:{code} → {</text>
  <text x="500" y="1150" class="code">userId, clientId, scope,</text>
  <text x="500" y="1162" class="code">code_challenge, redirect_uri }</text>

  <path d="M 590,1175 L 350,1175" class="return-arrow"/>
  <text x="470" y="1163" class="step-text">302 重定向</text>
  <rect x="360" y="1180" width="220" height="30" class="note-box"/>
  <text x="367" y="1193" class="code">https://app.example.com/callback?</text>
  <text x="367" y="1205" class="code">code=AUTH_CODE_XYZ&amp;state=xyz123</text>

  <rect x="325" y="1175" width="50" height="60" class="activation"/>

  <path d="M 350,1225 L 130,1225" class="return-arrow"/>
  <text x="240" y="1213" class="step-text">浏览器跳转到客户端回调地址</text>

  <rect x="105" y="1225" width="50" height="40" class="activation"/>

  <text x="700" y="1280" class="text" text-anchor="middle" font-weight="600" fill="#d97706">⚠️ 授权码阶段结束,此时客户端拿到code,接下来需要用code换取access_token ⚠️</text>

  <text x="700" y="1085" class="code" text-anchor="middle">© 2026 Apex Team · OAuth 2.0 授权码流程时序图 (第1部分) v3.0</text>
</svg>
