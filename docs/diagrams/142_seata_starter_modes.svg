ht="44"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">apex.seata.enabled（默认 false，须显式开启）<br />类名字符串守卫：缺 seata 依赖时零 Bean</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-MODE-1" data-node="true" data-id="MODE" transform="translate(789.734375, 195.34375)"><polygon points="86.34375,0 172.6875,-86.34375 86.34375,-172.6875 0,-86.34375" class="label-container" transform="translate(-86.34375,86.34375)" style=""/><g class="label" style="" transform="translate(-61.84375, -9.5)"><rect/><foreignObject width="123.6875" height="19"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">apex.seata.mode</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-AT-5" data-node="true" data-id="AT" transform="translate(153.90625, 414.6875)"><rect class="basic label-container" style="" rx="0" ry="0" x="-153.90625" y="-51.5" width="307.8125" height="103"/><g class="label" style="" transform="translate(-146.40625, -44)"><rect/><foreignObject width="292.8125" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">AT 模式<br />数据源包装 DataSourceProxy<br />要求各业务库 undo_log（宿主 V3 建表）<br />与既有接入行为兼容</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-XA-7" data-node="true" data-id="XA" transform="translate(514.078125, 414.6875)"><rect class="basic label-container" style="" rx="0" ry="0" x="-156.265625" y="-39" width="312.53125" height="78"/><g class="label" style="" transform="translate(-148.765625, -31.5)"><rect/><foreignObject width="297.53125" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">XA 模式<br />DataSourceProxyXA + ResourceManagerXA<br />依赖数据库 XA 能力，无 undo_log</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-SAGA-9" data-node="true" data-id="SAGA" transform="translate(1065.390625, 414.6875)"><rect class="basic label-container" style="" rx="0" ry="0" x="-345.046875" y="-61" width="690.09375" height="122"/><g class="label" style="" transform="translate(-337.546875, -53.5)"><rect/><foreignObject width="675.09375" height="107"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">SAGA 模式<br />DbStateMachineConfig + ProcessCtrlStateMachineEngine<br />SagaResourceManager；JSON 定义 apex.seata.saga.state-machine-resources<br />需存储三表：seata_state_machine_def / _inst / seata_state_inst（建表脚本随 starter 发布）<br />表前缀 apex.seata.saga.table-prefix 默认 seata_</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-TCC-11" data-node="true" data-id="TCC" transform="translate(1639.3359375, 414.6875)"><rect class="basic label-container" style="" rx="0" ry="0" x="-178.8984375" y="-40.5" width="357.796875" height="81"/><g class="label" style="" transform="translate(-171.3984375, -33)"><rect/><foreignObject width="342.796875" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">TCC 模式<br />GlobalTransactionScanner 代理 @LocalTCC 动作<br />不包装数据源</span></div></foreignObject></g></g><g class="node default default flowchart-label" id="flowchart-CONS-12" data-node="true" data-id="CONS" transform="translate(789.734375, 610.1875)"><rect class="basic label-container" style="" rx="0" ry="0" x="-279.203125" y="-84.5" width="558.40625" height="169"/><g class="label" style="" transform="translate(-271.703125, -77)"><rect/><foreignObject width="543.40625" height="154"><div xmlns="http://www.w3.org/1999/xhtml" style="display: inline-block; white-space: nowrap;"><span class="nodeLabel">通用约束（四种模式共用）<br />要求同步单 JDBC 数据源：动态路由数据源或已有代理直接抛异常<br />AT/XA 代理不支持 H2（须真实 MySQL/PostgreSQL）<br />TCC/SAGA 不包装数据源<br />全局事务内拒绝 Outbox 写入：SeataOutboxGuard 拦截<br />TransactionalOutboxExecutor.execute 与 DomainEventOutboxStore.append*<br />活动全局事务中抛 IllegalStateException</span></div></foreignObject></g></g></g></g></g></svg>