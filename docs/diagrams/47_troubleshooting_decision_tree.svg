<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100"><defs><style>.t{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.h{font:700 17px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.l{font:13px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.c{font:11px 'Courier New',monospace;fill:#334155}.q{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:14}.fix{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}.warn{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.bad{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#64748b"/></marker></defs><rect width="1600" height="1100" fill="#f8fafc"/><text x="800" y="48" text-anchor="middle" class="t">故障排查决策树 (Troubleshooting Decision Tree)</text><text x="800" y="76" text-anchor="middle" class="s">按现象定位端口、依赖、构建、认证和权限问题</text><rect x="650" y="120" width="300" height="90" class="bad"/><text x="800" y="158" text-anchor="middle" class="h">应用异常或接口不可用？</text><text x="800" y="185" text-anchor="middle" class="l">先查看启动日志与健康端点</text><rect x="80" y="300" width="250" height="110" class="q"/><text x="205" y="340" text-anchor="middle" class="h">端口被占用？</text><text x="105" y="375" class="c">lsof -i :8080</text><rect x="40" y="500" width="330" height="135" class="fix"/><text x="205" y="540" text-anchor="middle" class="h">释放端口或改端口</text><text x="65" y="580" class="c">kill -9 &lt;PID&gt;</text><text x="65" y="610" class="l">或修改 server.port 后重启</text><rect x="430" y="300" width="250" height="110" class="q"/><text x="555" y="340" text-anchor="middle" class="h">MySQL 连接失败？</text><text x="455" y="375" class="l">检查容器、端口、账号密码</text><rect x="390" y="500" width="330" height="135" class="fix"/><text x="555" y="540" text-anchor="middle" class="h">启动并测试 MySQL</text><text x="415" y="580" class="c">docker compose ... up -d mysql</text><text x="415" y="610" class="c">mysql -h localhost -P 3306</text><rect x="780" y="300" width="250" height="110" class="q"/><text x="905" y="340" text-anchor="middle" class="h">Redis 连接失败？</text><text x="805" y="375" class="l">检查容器与 PING 响应</text><rect x="740" y="500" width="330" height="135" class="fix"/><text x="905" y="540" text-anchor="middle" class="h">启动并验证 Redis</text><text x="765" y="580" class="c">docker exec ... redis-cli ping</text><text x="765" y="610" class="l">期望返回 PONG</text><rect x="1130" y="300" width="250" height="110" class="q"/><text x="1255" y="340" text-anchor="middle" class="h">构建或依赖失败？</text><text x="1155" y="375" class="l">清理本地缓存并强制更新</text><rect x="1090" y="500" width="330" height="135" class="fix"/><text x="1255" y="540" text-anchor="middle" class="h">刷新依赖后重新构建</text><text x="1115" y="580" class="c">mvnd dependency:purge-...</text><text x="1115" y="610" class="c">mvnd clean install -U</text><path d="M800 210V250H205V300" class="line"/><path d="M800 250H555V300" class="line"/><path d="M800 250H905V300" class="line"/><path d="M800 250H1255V300" class="line"/><path d="M205 410V500" class="line"/><path d="M555 410V500" class="line"/><path d="M905 410V500" class="line"/><path d="M1255 410V500" class="line"/><rect x="330" y="780" width="300" height="120" class="warn"/><text x="480" y="820" text-anchor="middle" class="h">JWT 签名无效？</text><text x="355" y="855" class="l">检查 JWT_SECRET 是否一致</text><rect x="970" y="780" width="300" height="120" class="warn"/><text x="1120" y="820" text-anchor="middle" class="warn h">403 Forbidden？</text><text x="995" y="855" class="l">检查 Token、角色与权限注解</text><path d="M555 635V720H480V780" class="line"/><path d="M905 635V720H1120V780" class="line"/><text x="800" y="1010" text-anchor="middle" class="s">修复后统一重启应用，并再次访问 /actuator/health 与目标 API 验证结果</text></svg>
