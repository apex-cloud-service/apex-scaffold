<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1590" viewBox="0 0 1600 1590" role="img" aria-labelledby="title desc">
  <title id="title">Maven 直接 parent 继承关系（第二阶段）</title>
  <desc id="desc">箭头子项目指向直接 parent，七个管理 POM 指向根。二十二个叶子迁移 parent，十一个运行模块及 api-contract、integration、boot-all 共十四个保留 services-bom parent。business 聚合 apex-knowledge。</desc>
  <!-- Semantic pair: 129_maven_parent_inheritance.mmd; hand-maintained SVG, not Mermaid output. -->
  <defs>
    <style>
      text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .title{font-size:30px;font-weight:700;text-anchor:middle}.sub{font-size:15px;fill:#475569;text-anchor:middle}
      .head{font-size:21px;font-weight:700}.meta{font-size:16px;fill:#475569}.code{font-size:17px}
      .note{font-size:17px;fill:#475569}.small{font-size:15px;fill:#475569}
      .edge{fill:none;stroke:#4f46e5;stroke-width:2.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="1600" height="1590" fill="#fff"/>
  <text x="800" y="44" class="title">Maven 直接 parent 继承关系 · 第二阶段</text>
  <text x="800" y="74" class="sub">箭头：子项目 → 直接 parent；集合卡片不是单一模块。此图不画 &lt;modules&gt;、生产依赖或运行网络</text>
  <rect x="410" y="98" width="780" height="92" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="800" y="128" class="head" text-anchor="middle">apex-scaffold · 总父 POM</text>
  <text x="800" y="154" class="meta" text-anchor="middle">继承外部 Spring Boot parent 3.5.15；七个管理 POM 均直接继承根</text>
  <text x="800" y="179" class="meta" text-anchor="middle">统一版本、构建档位与质量门禁继续由根治理</text>
  <!-- Shared parent bus: all seven group POMs point to the root. -->
  <path class="edge" d="M290 248V220H1310V248M800 248V220"/>
  <path class="edge" d="M290 700V670H1310V700M800 700V670"/>
  <path class="edge" d="M800 1300V1280H24V220H800V190" marker-end="url(#arrow)"/>
  <path class="edge" d="M24 670H290M24 220H290"/>
  <text x="64" y="210" class="small">7 个管理 POM → 根 parent</text>
  <!-- First row: three sets of migrated leaves. -->
  <rect x="50" y="248" width="480" height="392" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="70" y="284" class="head">apex-shared-parent</text><text x="70" y="312" class="meta">新增 POM · 直接 parent 为根</text>
  <path class="edge" d="M290 356V325" marker-end="url(#arrow)"/><text x="312" y="346" class="small">parent</text>
  <rect x="68" y="366" width="444" height="254" rx="9" fill="#fff" stroke="#c7d2fe"/>
  <text x="88" y="398" class="head">8 个叶子迁移 parent</text>
  <text x="88" y="434" class="code">apex-common / apex-domain</text>
  <text x="88" y="468" class="code">五个 apex-infrastructure-* 能力 JAR</text>
  <text x="88" y="502" class="code">apex-infrastructure 兼容 JAR</text>
  <text x="88" y="552" class="note">不含 apex-api-contract</text><text x="88" y="584" class="small">契约库是 services-bom 继承例外</text>
  <rect x="560" y="248" width="480" height="392" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="580" y="284" class="head">apex-components-parent</text><text x="580" y="312" class="meta">新增 POM · 直接 parent 为根</text>
  <path class="edge" d="M800 356V325" marker-end="url(#arrow)"/><text x="822" y="346" class="small">parent</text>
  <rect x="578" y="366" width="444" height="254" rx="9" fill="#fff" stroke="#a7f3d0"/>
  <text x="598" y="398" class="head">5 个叶子迁移 parent</text>
  <text x="598" y="434" class="code">apex-system / apex-auth</text>
  <text x="598" y="468" class="code">apex-workflow / apex-file / apex-office</text>
  <text x="598" y="552" class="note">不含 apex-integration</text><text x="598" y="584" class="small">集成库是 services-bom 继承例外</text>
  <rect x="1070" y="248" width="480" height="392" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1090" y="284" class="head">apex-starters-parent</text><text x="1090" y="312" class="meta">新增 POM · 直接 parent 为根</text>
  <path class="edge" d="M1310 356V325" marker-end="url(#arrow)"/><text x="1332" y="346" class="small">parent</text>
  <rect x="1088" y="366" width="444" height="254" rx="9" fill="#fff" stroke="#fde68a"/>
  <text x="1108" y="398" class="head">4 个叶子迁移 parent</text>
  <text x="1108" y="434" class="code">apex-storage-spring-boot-starter</text>
  <text x="1108" y="472" class="code">apex-license-spring-boot-starter</text>
  <text x="1108" y="510" class="code">apex-job-spring-boot-starter</text>
  <text x="1108" y="548" class="code">apex-seata-spring-boot-starter</text>
  <!-- Second row: applications, tools, and thirteen unchanged services-bom children. -->
  <rect x="50" y="700" width="480" height="560" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="70" y="736" class="head">apex-applications-parent</text><text x="70" y="764" class="meta">新增 POM · 直接 parent 为根</text>
  <path class="edge" d="M290 808V777" marker-end="url(#arrow)"/><text x="312" y="798" class="small">parent</text>
  <rect x="68" y="818" width="444" height="246" rx="9" fill="#fff" stroke="#a5f3fc"/>
  <text x="88" y="854" class="head">1 个叶子迁移 parent</text><text x="88" y="897" class="code">apex-example</text>
  <text x="88" y="984" class="note">不含 apex-boot-all</text><text x="88" y="1018" class="small">组合装配是 services-bom 继承例外</text>
  <text x="70" y="1140" class="note">Boot 插件继续留在实际使用叶子。</text>
  <text x="70" y="1174" class="note">不改变组合装配的薄 JAR 行为。</text>
  <rect x="560" y="700" width="480" height="560" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="580" y="736" class="head">apex-tools-parent</text><text x="580" y="764" class="meta">新增 POM · 直接 parent 为根</text>
  <path class="edge" d="M800 808V777" marker-end="url(#arrow)"/><text x="822" y="798" class="small">parent</text>
  <rect x="578" y="818" width="444" height="246" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="598" y="854" class="head">4 个叶子迁移 parent</text>
  <text x="598" y="897" class="code">apex-license-tools</text><text x="598" y="935" class="code">apex-generator</text>
  <text x="598" y="973" class="code">apex-tools-deployment</text><text x="598" y="1011" class="code">apex-tools-build</text>
  <text x="580" y="1140" class="note">Shade 等打包插件留在实际使用者。</text>
  <text x="580" y="1174" class="note">不向叶子注入新运行依赖。</text>
  <rect x="1070" y="700" width="480" height="560" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1090" y="736" class="head">apex-services-bom</text><text x="1090" y="764" class="meta">现有 POM · 保留依赖管理 · parent 为根</text>
  <path class="edge" d="M1310 808V777" marker-end="url(#arrow)"/><text x="1332" y="798" class="small">parent 不变</text>
  <rect x="1088" y="818" width="444" height="218" rx="9" fill="#fff" stroke="#c7d2fe"/>
  <text x="1108" y="850" class="head">11 个运行模块保留 parent</text>
  <text x="1108" y="884" class="code">apex-gateway + 六个业务 service</text>
  <text x="1108" y="918" class="code">apex-aggregation-service</text>
  <text x="1108" y="952" class="code">apex-job-service / apex-masking-service / apex-knowledge-service</text>
  <text x="1108" y="1001" class="small">聚合与继承均归 services-bom</text>
  <path class="edge" d="M1514 1054H1538V785H1450" marker-end="url(#arrow)"/>
  <rect x="1088" y="1054" width="426" height="184" rx="9" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="1108" y="1086" class="head">3 个继承例外保留 parent</text>
  <text x="1108" y="1120" class="code">apex-api-contract：聚合在 shared</text>
  <text x="1108" y="1154" class="code">apex-integration：聚合在 components</text>
  <text x="1108" y="1188" class="code">apex-boot-all：聚合在 applications</text>
  <text x="1108" y="1220" class="small">parent 仍为 services-bom，不是 compile 边</text>
  <rect x="50" y="1300" width="1500" height="88" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="70" y="1336" class="head">apex-business-parent · 新增 POM · 直接 parent 为根 · 聚合 apex-knowledge</text>
  <text x="70" y="1367" class="note">未来项目业务库继承 business-parent；独立 business-domain-service 只聚合 / 继承 services-bom。</text>
  <rect x="50" y="1416" width="1500" height="144" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="70" y="1450" class="head">继承核对口径</text>
  <text x="70" y="1480" class="note">22 个叶子迁移 parent = 8 + 5 + 4 + 1 + 4；13 个 services-bom 子项目保持 parent = 10 + 3。</text>
  <text x="70" y="1510" class="note">聚合（128）/ parent（本图）/ 生产 dependencies（95）是三种关系；dependencyManagement 不自动引入依赖。</text>
  <text x="70" y="1540" class="note">第二阶段（2026-11-14）叶子物理位于各分组父目录；坐标、Java 包、打包行为、生产依赖与运行拓扑不变。</text>
</svg>
