<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><style>.t{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.h{font:700 18px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.l{font:14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.c{font:12px 'Courier New',monospace;fill:#334155}.box{fill:#fff;stroke:#4f46e5;stroke-width:2;rx:14}.infra{fill:#eef2ff;stroke:#6366f1;stroke-width:2;rx:14}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}.warn{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.line{stroke:#4f46e5;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#4f46e5"/></marker></defs><rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="48" text-anchor="middle" class="t">部署流程图 (Deployment Flow)</text><text x="800" y="76" text-anchor="middle" class="s">从构建、依赖启动到健康检查与上线运维</text><rect x="70" y="140" width="260" height="150" class="box"/><text x="200" y="180" text-anchor="middle" class="h">1. 构建应用</text><text x="95" y="215" class="c">mvnd clean package</text><text x="95" y="245" class="l">• 选择 dev / it / prod</text><text x="95" y="270" class="l">• 生成可执行 JAR</text><rect x="430" y="140" width="260" height="150" class="infra"/><text x="560" y="180" text-anchor="middle" class="h">2. 选择部署方式</text><text x="455" y="220" class="l">java -jar</text><text x="455" y="248" class="l">Podman 单容器</text><text x="455" y="276" class="l">Podman Compose</text><path d="M330 215H430" class="line"/><rect x="790" y="110" width="260" height="110" class="ok"/><text x="920" y="150" text-anchor="middle" class="h">基础依赖</text><text x="815" y="185" class="l">MySQL 9.x · Redis 6/7</text><rect x="790" y="250" width="260" height="110" class="warn"/><text x="920" y="290" text-anchor="middle" class="h">可选依赖</text><text x="815" y="325" class="l">RocketMQ · Nacos · 监控</text><path d="M690 190H750V165H790" class="line"/><path d="M690 240H750V305H790" class="line"/><rect x="1140" y="140" width="330" height="150" class="box"/><text x="1305" y="180" text-anchor="middle" class="h">3. 启动应用</text><text x="1165" y="220" class="l">应用端口 :8080</text><text x="1165" y="248" class="l">管理端口 :8081</text><text x="1165" y="276" class="l">激活 Profile 与环境变量</text><path d="M1050 190H1140" class="line"/><rect x="260" y="470" width="300" height="150" class="infra"/><text x="410" y="510" text-anchor="middle" class="h">Flyway 数据迁移</text><text x="285" y="550" class="l">执行版本化迁移</text><text x="285" y="580" class="l">校验数据库连接与权限</text><rect x="700" y="470" width="300" height="150" class="ok"/><text x="850" y="510" text-anchor="middle" class="h">健康检查</text><text x="725" y="550" class="l">/actuator/health</text><text x="725" y="580" class="l">Swagger / API 冒烟测试</text><rect x="1140" y="470" width="300" height="150" class="warn"/><text x="1290" y="510" text-anchor="middle" class="h">上线运维</text><text x="1165" y="550" class="l">Prometheus · Grafana</text><text x="1165" y="580" class="l">备份、升级、回滚</text><path d="M1305 290V400H410V470" class="line"/><path d="M560 545H700" class="line"/><path d="M1000 545H1140" class="line"/><text x="800" y="760" text-anchor="middle" class="s">配置体系在三种部署方式间保持一致，生产环境通过环境变量注入敏感信息</text></svg>
