<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 13px sans-serif;fill:#64748b;text-anchor:middle}
      .grp{font:600 13px sans-serif;fill:#fff}
      .box-title{font:600 12px sans-serif;fill:#0f172a}
      .box-desc{font:400 10px sans-serif;fill:#475569}
      .code{font:500 9.5px monospace;fill:#2563eb}
      .note{font:500 11px sans-serif;fill:#64748b}
      .legend{font:500 11px sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="700" y="40" class="title">模块结构：apex-common</text>
  <text x="700" y="64" class="subtitle">com.apex.scaffold.common · 通用基础能力 · 无启动入口 · 被 9 个模块依赖 · v1.3.1</text>

  <rect x="40" y="92" width="430" height="740" rx="10" fill="#4f46e5" opacity="0.06" stroke="#4f46e5" stroke-width="2"/>
  <rect x="40" y="92" width="430" height="40" rx="10" fill="#4f46e5"/>
  <text x="60" y="118" class="grp">包结构（com.apex.scaffold.common.*）</text>
  <text x="60" y="162" class="code">├─ dto / result / context / enums</text>
  <text x="60" y="186" class="code">├─ exception / error / constant</text>
  <text x="60" y="210" class="code">├─ util / util.ratelimit / util.ratelimit.algorithm</text>
  <text x="60" y="234" class="code">├─ util.id / id</text>
  <text x="60" y="258" class="code">├─ config / security / annotation</text>
  <text x="60" y="282" class="code">├─ scheduler / state / spi</text>
  <text x="60" y="306" class="code">├─ audit / event</text>
  <text x="60" y="330" class="code">├─ persistence / persistence.util / persistence.po</text>
  <text x="60" y="354" class="code">├─ governance</text>
  <text x="60" y="378" class="code">├─ license</text>
  <text x="60" y="402" class="code">└─ ...</text>

  <text x="60" y="450" class="legend" font-weight="600">职责定位</text>
  <text x="60" y="476" class="box-desc">• 跨模块复用的通用能力，零业务耦合</text>
  <text x="60" y="498" class="box-desc">• 统一响应体 / 错误码 / 分页 DTO</text>
  <text x="60" y="520" class="box-desc">• 上下文（租户/用户/TraceId）传递</text>
  <text x="60" y="542" class="box-desc">• 限流算法族（令牌桶/漏桶/滑动窗口）</text>
  <text x="60" y="564" class="box-desc">• SPI 扩展点 / 领域事件基类 / Outbox 抽象</text>
  <text x="60" y="586" class="box-desc">• 无 Spring Web 依赖，可被任意层引用</text>

  <text x="60" y="634" class="legend" font-weight="600">依赖</text>
  <text x="60" y="660" class="box-desc">→ 仅依赖 Spring 基础 / 工具库（无内部模块）</text>
  <text x="60" y="682" class="box-desc">← 被除 generator 外所有模块依赖（依赖深度 L0）</text>

  <!-- right: key capability boxes -->
  <rect x="500" y="92" width="860" height="170" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="120" class="box-title" font-size="14">核心能力域</text>
  <rect x="520" y="136" width="195" height="106" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="533" y="158" class="box-title">统一模型</text>
  <text x="533" y="176" class="box-desc">dto / result / enums</text>
  <text x="533" y="194" class="box-desc">exception / error</text>
  <text x="533" y="212" class="code">R&lt;T&gt; · PageResult · ErrorCode</text>
  <text x="533" y="230" class="code">BizException</text>
  <rect x="725" y="136" width="195" height="106" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="738" y="158" class="box-title">上下文 / 安全</text>
  <text x="738" y="176" class="box-desc">context / security</text>
  <text x="738" y="194" class="box-desc">annotation</text>
  <text x="738" y="212" class="code">TenantContext · UserContext</text>
  <text x="738" y="230" class="code">@DataScope · @Idempotent</text>
  <rect x="930" y="136" width="195" height="106" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="943" y="158" class="box-title">限流算法</text>
  <text x="943" y="176" class="box-desc">util.ratelimit.algorithm</text>
  <text x="943" y="194" class="box-desc">util.id / id</text>
  <text x="943" y="212" class="code">TokenBucket · LeakyBucket</text>
  <text x="943" y="230" class="code">SlidingWindow · Snowflake</text>
  <rect x="1135" y="136" width="205" height="106" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="1148" y="158" class="box-title">事件 / SPI / 治理</text>
  <text x="1148" y="176" class="box-desc">event / spi / governance</text>
  <text x="1148" y="194" class="box-desc">state / scheduler</text>
  <text x="1148" y="212" class="code">DomainEvent · ExtensionPoint</text>
  <text x="1148" y="230" class="code">StateMachine · RetryPolicy</text>

  <rect x="500" y="282" width="860" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="310" class="box-title" font-size="14">通用支撑组件</text>
  <rect x="520" y="326" width="270" height="140" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="533" y="348" class="box-title">persistence</text>
  <text x="533" y="368" class="box-desc">持久化基类与工具</text>
  <text x="533" y="388" class="code">BasePO · BaseMapper 约定</text>
  <text x="533" y="408" class="code">persistence.util</text>
  <text x="533" y="428" class="box-desc">多租户 / 数据权限 SQL 注入支持</text>
  <text x="533" y="448" class="box-desc">字段自动填充（审计字段）</text>
  <rect x="800" y="326" width="270" height="140" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="813" y="348" class="box-title">audit</text>
  <text x="813" y="368" class="box-desc">审计日志抽象</text>
  <text x="813" y="388" class="code">OperationLog · AuditEvent</text>
  <text x="813" y="408" class="code">异步批量落库契约</text>
  <text x="813" y="428" class="box-desc">配合 interfaces 层 OperationLogAspect</text>
  <rect x="1080" y="326" width="260" height="140" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="1093" y="348" class="box-title">license（模型）</text>
  <text x="1093" y="368" class="box-desc">License 数据模型 / 校验契约</text>
  <text x="1093" y="388" class="code">LicenseInfo · LicenseStatus</text>
  <text x="1093" y="408" class="box-desc">与 license-starter 配合</text>
  <text x="1093" y="428" class="box-desc">（本模块仅定义，不含自动配置）</text>

  <rect x="500" y="502" width="860" height="330" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="530" class="box-title" font-size="14">设计约束</text>
  <text x="520" y="560" class="box-desc">1. 无业务语义：不得出现 User/Role/Workflow 等领域概念，保证可被所有层安全引用。</text>
  <text x="520" y="588" class="box-desc">2. 无 Web 层依赖：不引入 spring-boot-starter-web/webflux，避免污染反应式栈。</text>
  <text x="520" y="616" class="box-desc">3. 限流算法为纯函数式实现，可被本地限流与 Sentinel 自适应策略共同复用。</text>
  <text x="520" y="644" class="box-desc">4. 上下文使用 ThreadLocal + Reactor Context 双通道，兼容 WebFlux 异步链路。</text>
  <text x="520" y="672" class="box-desc">5. 事件/SPI 作为领域与基础设施的解耦契约，不含具体实现。</text>
  <text x="520" y="712" class="box-title" font-size="14">典型引用方</text>
  <text x="520" y="742" class="box-desc">apex-domain · apex-infrastructure · apex-application · apex-workflow · apex-interfaces</text>
  <text x="520" y="768" class="box-desc">apex-auth-center · apex-example · apex-license-spring-boot-starter</text>
  <text x="520" y="806" class="note">唯一不依赖 apex-common 的内部模块：apex-generator（独立模板引擎）</text>

  <text x="700" y="872" class="note" text-anchor="middle">apex-common 是全局依赖根（L0），承载通用能力/上下文/限流算法/持久化与事件契约</text>
</svg>
