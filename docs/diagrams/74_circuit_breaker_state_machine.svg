<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="closedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43a047;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="openGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e53935;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="halfOpenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef6c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb8c00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#66bb6a" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef5350" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffa726" />
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#0a0e27"/>

  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">熔断器状态机 (CircuitBreaker State Machine)</text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="14" fill="#64b5f6" text-anchor="middle">基于 Resilience4j 的三状态自适应故障隔离</text>

  <ellipse cx="320" cy="250" rx="140" ry="100" fill="url(#closedGrad)" stroke="#66bb6a" stroke-width="3" filter="url(#shadow)"/>
  <text x="320" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">CLOSED</text>
  <text x="320" y="265" font-family="Arial, sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">关闭状态</text>
  <text x="320" y="285" font-family="Arial, sans-serif" font-size="11" fill="#c8e6c9" text-anchor="middle">✓ 所有请求正常通过</text>
  <text x="320" y="300" font-family="Arial, sans-serif" font-size="11" fill="#c8e6c9" text-anchor="middle">✓ 记录成功/失败次数</text>

  <ellipse cx="1080" cy="250" rx="140" ry="100" fill="url(#openGrad)" stroke="#ef5350" stroke-width="3" filter="url(#shadow)"/>
  <text x="1080" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">OPEN</text>
  <text x="1080" y="265" font-family="Arial, sans-serif" font-size="13" fill="#ffebee" text-anchor="middle">打开状态</text>
  <text x="1080" y="285" font-family="Arial, sans-serif" font-size="11" fill="#ffcdd2" text-anchor="middle">✗ 所有请求快速失败</text>
  <text x="1080" y="300" font-family="Arial, sans-serif" font-size="11" fill="#ffcdd2" text-anchor="middle">✗ 不调用外部服务</text>

  <ellipse cx="700" cy="550" rx="140" ry="100" fill="url(#halfOpenGrad)" stroke="#ffa726" stroke-width="3" filter="url(#shadow)"/>
  <text x="700" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">HALF_OPEN</text>
  <text x="700" y="565" font-family="Arial, sans-serif" font-size="13" fill="#fff3e0" text-anchor="middle">半开状态</text>
  <text x="700" y="585" font-family="Arial, sans-serif" font-size="11" fill="#ffe0b2" text-anchor="middle">⚡ 允许探测请求</text>
  <text x="700" y="600" font-family="Arial, sans-serif" font-size="11" fill="#ffe0b2" text-anchor="middle">⚡ 测试服务恢复</text>

  <path d="M 450 230 Q 700 150 940 230" stroke="#ef5350" stroke-width="3" fill="none" marker-end="url(#arrowRed)" stroke-dasharray="5,5"/>
  <rect x="630" y="155" width="140" height="60" rx="6" fill="#1a237e" stroke="#ef5350" stroke-width="2"/>
  <text x="700" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef5350" text-anchor="middle">失败率超阈值</text>
  <text x="700" y="192" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2" text-anchor="middle">failureRate &gt; threshold</text>
  <text x="700" y="207" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2" text-anchor="middle">AND calls ≥ minCalls</text>

  <path d="M 1030 350 Q 850 450 780 510" stroke="#ffa726" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="850" y="400" width="150" height="60" rx="6" fill="#1a237e" stroke="#ffa726" stroke-width="2"/>
  <text x="925" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffa726" text-anchor="middle">等待时间到期</text>
  <text x="925" y="437" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2" text-anchor="middle">waitDuration 后</text>
  <text x="925" y="452" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2" text-anchor="middle">自动转换</text>

  <path d="M 620 510 Q 470 450 370 350" stroke="#66bb6a" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="420" y="400" width="150" height="60" rx="6" fill="#1a237e" stroke="#66bb6a" stroke-width="2"/>
  <text x="495" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#66bb6a" text-anchor="middle">探测成功</text>
  <text x="495" y="437" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9" text-anchor="middle">探测请求成功</text>
  <text x="495" y="452" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9" text-anchor="middle">服务已恢复</text>

  <path d="M 780 600 Q 900 600 1000 350" stroke="#ef5350" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="840" y="580" width="120" height="45" rx="6" fill="#1a237e" stroke="#ef5350" stroke-width="2"/>
  <text x="900" y="600" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef5350" text-anchor="middle">探测失败</text>
  <text x="900" y="617" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2" text-anchor="middle">重新打开</text>

  <rect x="50" y="420" width="280" height="320" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">配置参数</text>
  
  <rect x="70" y="465" width="240" height="115" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="190" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffd54f" text-anchor="middle">默认模式 (default)</text>
  <text x="80" y="503" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">failureRateThreshold: 50%</text>
  <text x="80" y="518" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">waitDuration: 60s</text>
  <text x="80" y="533" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">slidingWindowSize: 100</text>
  <text x="80" y="548" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">minimumCalls: 10</text>
  <text x="80" y="563" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">permittedCallsInHalfOpen: 5</text>
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="9" fill="#90caf9">排除 BusinessException</text>

  <rect x="70" y="590" width="240" height="65" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="190" y="610" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800" text-anchor="middle">严格模式 (strict)</text>
  <text x="80" y="628" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">failureRateThreshold: 30%</text>
  <text x="80" y="643" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">waitDuration: 120s</text>
  <text x="80" y="653" font-family="Arial, sans-serif" font-size="9" fill="#ffab91">更敏感，更长等待</text>

  <rect x="70" y="665" width="240" height="65" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="190" y="685" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50" text-anchor="middle">宽松模式 (lenient)</text>
  <text x="80" y="703" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">failureRateThreshold: 70%</text>
  <text x="80" y="718" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">waitDuration: 30s</text>
  <text x="80" y="728" font-family="Arial, sans-serif" font-size="9" fill="#a5d6a7">更宽容，快速恢复</text>

  <rect x="1070" y="420" width="280" height="320" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1210" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">核心指标</text>
  
  <rect x="1090" y="465" width="240" height="100" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1210" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">滑动窗口统计</text>
  <text x="1100" y="503" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">• totalCalls: 总调用次数</text>
  <text x="1100" y="518" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">• failedCalls: 失败次数</text>
  <text x="1100" y="533" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">• slowCalls: 慢调用次数</text>
  <text x="1100" y="548" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">• failureRate: 失败率 (%)</text>
  <text x="1100" y="560" font-family="Arial, sans-serif" font-size="9" fill="#90caf9">基于最近 N 次调用</text>

  <rect x="1090" y="575" width="240" height="80" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1210" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">状态查询</text>
  <text x="1100" y="613" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">getCircuitBreakerState(name)</text>
  <text x="1100" y="628" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">→ 返回实时状态快照</text>
  <text x="1100" y="643" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">→ 监控面板数据源</text>

  <rect x="1090" y="665" width="240" height="65" rx="6" fill="#0d47a1" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1210" y="685" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffd54f" text-anchor="middle">手动控制</text>
  <text x="1100" y="703" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">• forceOpen() - 强制打开</text>
  <text x="1100" y="718" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">• forceClosed() - 强制关闭</text>

  <rect x="360" y="420" width="320" height="150" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">使用示例</text>
  
  <rect x="375" y="455" width="290" height="105" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="385" y="475" font-family="monospace" font-size="9" fill="#a5d6a7">circuitBreakerService</text>
  <text x="385" y="490" font-family="monospace" font-size="9" fill="#a5d6a7">  .withCircuitBreaker(</text>
  <text x="395" y="505" font-family="monospace" font-size="9" fill="#a5d6a7">    "chuanglan-api",</text>
  <text x="395" y="520" font-family="monospace" font-size="9" fill="#a5d6a7">    remoteApiMono)</text>
  <text x="385" y="535" font-family="monospace" font-size="9" fill="#a5d6a7">  .onErrorResume(e -></text>
  <text x="395" y="550" font-family="monospace" font-size="9" fill="#a5d6a7">    Mono.just(fallbackResult));</text>

  <rect x="720" y="420" width="320" height="150" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">状态转换触发条件</text>
  
  <rect x="735" y="455" width="290" height="105" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="745" y="475" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef5350" text-anchor="start">CLOSED → OPEN:</text>
  <text x="755" y="490" font-family="Arial, sans-serif" font-size="9" fill="#ffcdd2">失败率 ≥ failureRateThreshold</text>
  <text x="755" y="503" font-family="Arial, sans-serif" font-size="9" fill="#ffcdd2">且调用次数 ≥ minimumNumberOfCalls</text>
  
  <text x="745" y="521" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffa726" text-anchor="start">OPEN → HALF_OPEN:</text>
  <text x="755" y="536" font-family="Arial, sans-serif" font-size="9" fill="#ffe0b2">等待 waitDurationInOpenState 后自动</text>
  
  <text x="745" y="551" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#66bb6a" text-anchor="start">HALF_OPEN → CLOSED/OPEN:</text>

  <rect x="360" y="590" width="320" height="150" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="615" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">设计目标</text>
  
  <rect x="375" y="625" width="290" height="105" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="385" y="645" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">✓ 故障隔离 - 防止级联失败</text>
  <text x="385" y="662" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">✓ 快速失败 - 避免资源浪费</text>
  <text x="385" y="679" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">✓ 自动恢复 - 探测服务可用性</text>
  <text x="385" y="696" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">✓ 降级兜底 - 返回缓存/默认值</text>
  <text x="385" y="713" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">✓ 可观测性 - 实时状态监控</text>

  <rect x="720" y="590" width="320" height="150" rx="8" fill="#0d47a1" stroke="#64b5f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="880" y="615" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd54f" text-anchor="middle">关键特性</text>
  
  <rect x="735" y="625" width="290" height="105" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="745" y="645" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">• 异常过滤: 排除 BusinessException</text>
  <text x="745" y="662" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">• 响应式集成: CircuitBreakerOperator</text>
  <text x="745" y="679" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">• 多实例管理: CircuitBreakerRegistry</text>
  <text x="745" y="696" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">• 指标暴露: Metrics + 状态查询</text>
  <text x="745" y="713" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">• 配置热更: 三种预设模式</text>

  <text x="700" y="770" font-family="Arial, sans-serif" font-size="11" fill="#546e7a" text-anchor="middle">© 2026 Apex Team · 熔断器状态机 v1.0 · apex-infrastructure/circuitbreaker/CircuitBreakerService.java</text>
</svg>
