  <text x="70" y="430" class="box-title">版本管理策略</text>
  <text x="70" y="460" class="code">统一版本管理: &lt;properties&gt;定义版本号,全局引用 ${spring-boot.version}</text>
  <text x="70" y="490" class="code">BOM依赖管理: Spring Boot BOM → 传递依赖自动对齐,避免版本冲突</text>
  <text x="70" y="520" class="code">依赖冲突解决: mvn dependency:tree 查看依赖树 → &lt;exclusions&gt;排除冲突版本</text>
  <text x="70" y="550" class="code">安全更新: Dependabot自动检测漏洞 → 定期升级补丁版本 (每月一次)</text>
  <text x="70" y="580" class="code">LTS版本选择: JDK 17 LTS (至2029年支持) · Spring Boot 3.x (至2026年支持)</text>
  <text x="70" y="610" class="text">✅ 升级策略: 主版本保守(经过充分测试) · 补丁版本激进(及时修复CVE)</text>
  <text x="70" y="640" class="text">完整技术栈清单: docs/architecture/technology-stack.md (60+组件详细说明)</text>
