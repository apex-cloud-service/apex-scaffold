<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 14px sans-serif;fill:#64748b;text-anchor:middle}
      .st{font:600 15px sans-serif;fill:#0f172a;text-anchor:middle}
      .text{font:400 10px sans-serif;fill:#475569}
      .code{font:400 9px monospace;fill:#2563eb}
      .layer{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:8}
      .comp{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;rx:6}
      .p{fill:#4f46e5;stroke:#4338ca;stroke-width:2;rx:6}
      .s{fill:#059669;stroke:#047857;stroke-width:2;rx:6}
      .w{fill:#d97706;stroke:#b45309;stroke-width:2;rx:6}
      .i{fill:#0891b2;stroke:#0e7490;stroke-width:2;rx:6}
      .arrow{fill:none;stroke:#4f46e5;stroke-width:2.5;marker-end:url(#ah)}
      .darrow{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:5,3;marker-end:url(#ahg)}
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#4f46e5"/></marker>
    <marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#64748b"/></marker>
  </defs>
  <text x="700" y="35" class="title">Token 刷新与续期机制</text>
  <text x="700" y="58" class="subtitle">Access Token过期检测 · 自动续期 · Refresh Token轮换 · 安全防护</text>

  <!-- Scenario 1: Token过期检测 -->
  <rect x="50" y="90" width="640" height="280" class="layer"/>
  <text x="370" y="115" class="st">场景1: Access Token 过期检测</text>

  <rect x="70" y="135" width="290" height="220" class="p"/>
  <text x="215" y="155" style="font:700 14px sans-serif;fill:#ffffff" text-anchor="middle">前端拦截器 (Axios)</text>
  <rect x="85" y="170" width="260" height="180" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" rx="4"/>
  <text x="92" y="188" class="code" fill="#e0e7ff">axios.interceptors.response</text>
  <text x="92" y="200" class="code" fill="#e0e7ff">.use(response => response,</text>
  <text x="97" y="212" class="code" fill="#e0e7ff">async error => {</text>
  <text x="102" y="224" class="code" fill="#e0e7ff">if (status === 401 &amp;&amp;</text>
  <text x="107" y="236" class="code" fill="#e0e7ff">    code === 40101) {</text>
  <text x="112" y="248" class="code" fill="#e0e7ff">// Token已过期</text>
  <text x="112" y="260" class="code" fill="#e0e7ff">return refreshAndRetry(</text>
  <text x="117" y="272" class="code" fill="#e0e7ff">  error.config)</text>
  <text x="107" y="284" class="code" fill="#e0e7ff">}</text>
  <text x="102" y="296" class="code" fill="#e0e7ff">return Promise.reject(error)</text>
  <text x="97" y="308" class="code" fill="#e0e7ff">})</text>
  <text x="92" y="320" class="code" fill="#e0e7ff">})</text>

  <rect x="380" y="135" width="290" height="220" class="s"/>
  <text x="525" y="155" style="font:700 14px sans-serif;fill:#ffffff" text-anchor="middle">后端错误码定义</text>
  <rect x="395" y="170" width="260" height="180" fill="#059669" stroke="#047857" stroke-width="1.5" rx="4"/>
  <text x="402" y="188" class="code" fill="#d1fae5">HTTP 401 Unauthorized</text>
  <text x="397" y="203" class="text" fill="#d1fae5" font-weight="600">情况1: Token过期</text>
  <text x="402" y="218" class="code" fill="#d1fae5">{"code": 40101,</text>
  <text x="407" y="230" class="code" fill="#d1fae5"> "msg": "Token已过期"}</text>
  <text x="397" y="248" class="text" fill="#d1fae5" font-weight="600">情况2: Refresh Token过期</text>
  <text x="402" y="263" class="code" fill="#d1fae5">{"code": 40102,</text>
  <text x="407" y="275" class="code" fill="#d1fae5"> "msg": "请重新登录"}</text>
  <text x="397" y="293" class="text" fill="#d1fae5" font-weight="600">情况3: Token无效/黑名单</text>
  <text x="402" y="308" class="code" fill="#d1fae5">{"code": 401,</text>
  <text x="407" y="320" class="code" fill="#d1fae5"> "msg": "需重新登录"}</text>

  <path d="M 360,245 L 380,245" class="arrow"/>
  <text x="370" y="239" class="code" font-size="9">检测40101</text>

  <!-- Scenario 2: 自动刷新流程 -->
  <rect x="710" y="90" width="640" height="280" class="layer"/>
  <text x="1030" y="115" class="st">场景2: 自动刷新流程</text>

  <rect x="730" y="135" width="300" height="220" class="i"/>
  <text x="880" y="155" style="font:700 14px sans-serif;fill:#ffffff" text-anchor="middle">前端: refreshAndRetry()</text>
  <rect x="745" y="170" width="270" height="180" fill="#0891b2" stroke="#0e7490" stroke-width="1.5" rx="4"/>
  <text x="752" y="188" class="code" fill="#cffafe">const refreshToken =</text>
  <text x="757" y="200" class="code" fill="#cffafe">  localStorage.getItem('refreshToken')</text>
  <text x="752" y="212" class="code" fill="#cffafe">const res = await axios.post(</text>
  <text x="757" y="224" class="code" fill="#cffafe">  '/api/v1/auth/refresh',</text>
  <text x="757" y="236" class="code" fill="#cffafe">  null, {</text>
  <text x="762" y="248" class="code" fill="#cffafe">    headers: {</text>
  <text x="767" y="260" class="code" fill="#cffafe">      Authorization:</text>
  <text x="772" y="272" class="code" fill="#cffafe">      'Bearer ' + refreshToken</text>
  <text x="762" y="284" class="code" fill="#cffafe">    }})</text>
  <text x="757" y="296" class="code" fill="#cffafe">localStorage.setItem(</text>
  <text x="762" y="308" class="code" fill="#cffafe">  'accessToken',</text>
  <text x="767" y="320" class="code" fill="#cffafe">  res.data.accessToken)</text>
  <text x="762" y="332" class="code" fill="#cffafe">  res.data.refreshToken)</text>
  <text x="757" y="344" class="code" fill="#cffafe">return axios(originalConfig)</text>

  <rect x="1050" y="135" width="280" height="220" class="w"/>
  <text x="1190" y="155" style="font:700 14px sans-serif;fill:#ffffff" text-anchor="middle">后端: POST /auth/refresh</text>
  <rect x="1065" y="170" width="250" height="180" fill="#d97706" stroke="#b45309" stroke-width="1.5" rx="4"/>
  <text x="1072" y="188" class="code" fill="#fef3c7">1. 提取Refresh Token</text>
  <text x="1072" y="200" class="code" fill="#fef3c7">2. 黑名单检查</text>
  <text x="1077" y="212" class="code" fill="#fef3c7">   (Redis, 30min TTL)</text>
  <text x="1072" y="224" class="code" fill="#fef3c7">3. 验证未过期 (7天)</text>
  <text x="1072" y="236" class="code" fill="#fef3c7">4. 检查用户状态</text>
  <text x="1072" y="248" class="code" fill="#fef3c7">5. 生成新Access Token</text>
  <text x="1072" y="260" class="code" fill="#fef3c7">6. 判断是否续期Refresh</text>
  <text x="1077" y="272" class="code" fill="#fef3c7">   (剩余&lt;30分钟)</text>
  <text x="1072" y="284" class="code" fill="#fef3c7">7. 旧Token加入黑名单</text>
  <text x="1072" y="296" class="code" fill="#fef3c7">8. 返回新Token对</text>
  <text x="1072" y="308" class="code" fill="#fef3c7">返回: {accessToken,</text>
  <text x="1077" y="320" class="code" fill="#fef3c7">  refreshToken?, expiresIn}</text>

  <path d="M 1030,245 L 1050,245" class="arrow"/>
  <text x="1040" y="239" class="code" font-size="9">刷新请求</text>

  <!-- Scenario 3: 前端无感知续期 -->
  <rect x="50" y="400" width="640" height="220" class="layer"/>
  <text x="370" y="425" class="st">场景3: 前端无感知续期 (定时检查)</text>

  <rect x="70" y="445" width="290" height="165" class="i"/>
  <text x="215" y="465" style="font:700 14px sans-serif;fill:#ffffff" text-anchor="middle">定时检查机制</text>
  <rect x="85" y="480" width="260" height="125" fill="#0891b2" stroke="#0e7490" stroke-width="1.5" rx="4"/>
  <text x="92" y="498" class="code" fill="#cffafe">setInterval(() => {</text>
  <text x="97" y="510" class="code" fill="#cffafe">  const exp = getTokenExp(</text>
  <text x="102" y="522" class="code" fill="#cffafe">    accessToken)</text>
  <text x="97" y="534" class="code" fill="#cffafe">  const now = Date.now()/1000</text>
  <text x="97" y="546" class="code" fill="#cffafe">  if (exp - now &lt; 300) {</text>
  <text x="102" y="558" class="code" fill="#cffafe">    // 提前5分钟刷新</text>
  <text x="102" y="570" class="code" fill="#cffafe">    refreshAccessToken()</text>
  <text x="97" y="582" class="code" fill="#cffafe">  }</text>
  <text x="92" y="594" class="code" fill="#cffafe">}, 60000) // 每分钟</text>
  <text x="92" y="605" class="text" fill="#cffafe" font-size="9">效果: 用户操作期间Token永不过期</text>

  <rect x="380" y="445" width="290" height="165" class="s"/>
  <text x="525" y="465" style="font:700 14px sans-serif;fill:#ffffff" text-anchor="middle">并发请求锁机制</text>
  <rect x="395" y="480" width="260" height="125" fill="#059669" stroke="#047857" stroke-width="1.5" rx="4"/>
  <text x="402" y="498" class="code" fill="#d1fae5">let isRefreshing = false</text>
  <text x="402" y="510" class="code" fill="#d1fae5">let refreshQueue = []</text>
  <text x="397" y="525" class="text" fill="#d1fae5" font-weight="600">流程:</text>
  <text x="402" y="540" class="code" fill="#d1fae5">1. 多个请求同时401</text>
  <text x="402" y="552" class="code" fill="#d1fae5">2. 只有一个请求触发刷新</text>
  <text x="402" y="564" class="code" fill="#d1fae5">3. 其他请求加入队列</text>
  <text x="402" y="576" class="code" fill="#d1fae5">4. 刷新成功后批量重试</text>
  <text x="397" y="591" class="text" fill="#d1fae5" font-size="9">避免重复刷新和Token竞争</text>

  <!-- Scenario 4: Token Rotation -->
  <rect x="710" y="400" width="640" height="220" class="layer"/>
  <text x="1030" y="425" class="st">场景4: Refresh Token 轮换 (Token Rotation)</text>

  <rect x="730" y="445" width="600" height="165" class="p"/>
  <text x="1030" y="465" style="font:700 14px sans-serif;fill:#ffffff" text-anchor="middle">轮换策略 (防止Refresh Token泄露后长期滥用)</text>
  <rect x="745" y="480" width="570" height="125" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" rx="4"/>
  <text x="752" y="498" class="code" fill="#e0e7ff">// 后端刷新逻辑 (TokenService.refreshToken)</text>
  <text x="752" y="510" class="code" fill="#e0e7ff">// 1. 验证旧Refresh Token有效</text>
  <text x="752" y="522" class="code" fill="#e0e7ff">// 2. 判断剩余时间:</text>
  <text x="757" y="534" class="code" fill="#e0e7ff">//    if (remaining &lt; 30分钟) {</text>
  <text x="762" y="546" class="code" fill="#e0e7ff">//      newRefresh = UUID.randomUUID()</text>
  <text x="762" y="558" class="code" fill="#e0e7ff">//      save(newRefresh, 7天)</text>
  <text x="762" y="570" class="code" fill="#e0e7ff">//      blacklist(oldRefresh, 30min)</text>
  <text x="762" y="582" class="code" fill="#e0e7ff">//      return newRefresh</text>
  <text x="757" y="594" class="code" fill="#e0e7ff">//    } else { return null } // 不续期</text>
  <text x="752" y="606" class="code" fill="#e0e7ff">// 3. 生成新Access Token (每次都生成)</text>
  <text x="745" y="618" class="text" fill="#e0e7ff" font-size="9">策略: 滑动窗口续期 + 一次性使用旧Token + 黑名单防重放</text>

  <!-- Token生命周期对比表 -->
  <rect x="50" y="650" width="1300" height="170" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  <text x="700" y="673" class="st">Token 生命周期对比表</text>

  <rect x="70" y="690" width="240" height="35" fill="#4f46e5"/>
  <text x="190" y="713" style="font:600 12px sans-serif;fill:#ffffff" text-anchor="middle">Token类型</text>
  <rect x="310" y="690" width="200" height="35" fill="#4f46e5"/>
  <text x="410" y="713" style="font:600 12px sans-serif;fill:#ffffff" text-anchor="middle">初始有效期</text>
  <rect x="510" y="690" width="200" height="35" fill="#4f46e5"/>
  <text x="610" y="713" style="font:600 12px sans-serif;fill:#ffffff" text-anchor="middle">续期策略</text>
  <rect x="710" y="690" width="200" height="35" fill="#4f46e5"/>
  <text x="810" y="713" style="font:600 12px sans-serif;fill:#ffffff" text-anchor="middle">最长有效期</text>
  <rect x="910" y="690" width="200" height="35" fill="#4f46e5"/>
  <text x="1010" y="713" style="font:600 12px sans-serif;fill:#ffffff" text-anchor="middle">黑名单TTL</text>
  <rect x="1110" y="690" width="220" height="35" fill="#4f46e5"/>
  <text x="1220" y="713" style="font:600 12px sans-serif;fill:#ffffff" text-anchor="middle">存储位置</text>

  <rect x="70" y="725" width="240" height="45" class="comp"/>
  <text x="190" y="745" class="text" text-anchor="middle" font-weight="600">Access Token (JWT)</text>
  <text x="190" y="760" class="code" text-anchor="middle" font-size="9">RS256签名</text>
  <rect x="310" y="725" width="200" height="45" class="comp"/>
  <text x="410" y="750" class="code" text-anchor="middle">2小时</text>
  <rect x="510" y="725" width="200" height="45" class="comp"/>
  <text x="610" y="750" class="text" text-anchor="middle" font-size="10">不可续期,用Refresh换新</text>
  <rect x="710" y="725" width="200" height="45" class="comp"/>
  <text x="810" y="750" class="code" text-anchor="middle">2小时</text>
  <rect x="910" y="725" width="200" height="45" class="comp"/>
  <text x="1010" y="750" class="code" text-anchor="middle">30分钟</text>
  <rect x="1110" y="725" width="220" height="45" class="comp"/>
  <text x="1220" y="745" class="text" text-anchor="middle" font-size="10">LocalStorage</text>
  <text x="1220" y="758" class="text" text-anchor="middle" font-size="9">+ 内存(变量)</text>

  <rect x="70" y="770" width="240" height="45" class="comp"/>
  <text x="190" y="790" class="text" text-anchor="middle" font-weight="600">Refresh Token (UUID)</text>
  <text x="190" y="805" class="code" text-anchor="middle" font-size="9">不透明随机串</text>
  <rect x="310" y="770" width="200" height="45" class="comp"/>
  <text x="410" y="795" class="code" text-anchor="middle">7天</text>
  <rect x="510" y="770" width="200" height="45" class="comp"/>
  <text x="610" y="790" class="text" text-anchor="middle" font-size="10">剩余&lt;30分钟触发</text>
  <text x="610" y="803" class="text" text-anchor="middle" font-size="9">滑动窗口续期</text>
  <rect x="710" y="770" width="200" height="45" class="comp"/>
  <text x="810" y="795" class="text" text-anchor="middle" font-size="10">无限(持续使用)</text>
  <rect x="910" y="770" width="200" height="45" class="comp"/>
  <text x="1010" y="795" class="code" text-anchor="middle">30分钟</text>
  <rect x="1110" y="770" width="220" height="45" class="comp"/>
  <text x="1220" y="785" class="text" text-anchor="middle" font-size="10">LocalStorage</text>
  <text x="1220" y="798" class="text" text-anchor="middle" font-size="9">+ Redis(服务端校验)</text>

  <text x="700" y="860" class="code" text-anchor="middle">© 2026 Apex Team · Token刷新与续期机制 v3.0</text>
</svg>
