<title id="title">直接内部生产依赖图（35 个 JAR 模块）</title>
<desc id="desc">每行以箭头从依赖方指向完整的直接内部 compile 依赖集合。无依赖行以无表示。排除 parent、modules、dependencyManagement、传递依赖、test 和第三方依赖。</desc>
