<text x="800" y="44" class="title" >直接内部生产依赖图 · 35 个 JAR 模块</text>
<text x="800" y="74" class="sub" >数据源：各叶子 pom.xml 的 dependencies · v1.3.1 · 第二阶段管理分组与物理归位不改变生产依赖</text>
<text x="800" y="102" class="sub" >每行：依赖方 → 全部直接内部 compile 依赖；箭头不是 Maven 聚合、parent 或 HTTP 调用</text>
