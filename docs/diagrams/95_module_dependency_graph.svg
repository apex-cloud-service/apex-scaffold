<text x="70" y="2453" class="note" >排除 test：infra-integration→cache、auth-service→system、office-service→gateway、aggregation-service→gateway。</text>
<text x="70" y="2483" class="note" >第三方 MQTT 客户端 optional 不在内部依赖图中；parent / modules / dependencyManagement 不会被画为 compile 边。</text>
<text x="70" y="2513" class="note" >aggregation 仅依赖 common / contract，HTTP 聚合 workflow 与 office 不等于依赖它们的业务 JAR；内部依赖无环。</text>
