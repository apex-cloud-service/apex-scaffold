<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e53935;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef6c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb8c00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a1b9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e24aa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64b5f6" />
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#0a0e27"/>

  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">自适应限流器 (Adaptive Rate Limiter)</text>
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="14" fill="#64b5f6" text-anchor="middle">基于系统负载动态调整 QPS 的自我保护机制</text>

  <rect x="50" y="100" width="320" height="620" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">系统指标采样</text>
  
  <rect x="70" y="150" width="280" height="110" rx="6" fill="url(#cpuGrad)" stroke="#ef5350" stroke-width="2"/>
  <text x="210" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. CPU 使用率</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="11" fill="#ffebee">• osBean.getCpuLoad()</text>
  <text x="80" y="210" font-family="Arial, sans-serif" font-size="11" fill="#ffcdd2">• 阈值: cpuThreshold (70%)</text>
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="11" fill="#ffcdd2">• 降级公式:</text>
  <text x="90" y="240" font-family="monospace" font-size="9" fill="#ffcdd2">factor = (load - 0.7) / 0.3</text>
  <text x="80" y="253" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">CPU 负载越高限流越严格</text>

  <rect x="70" y="275" width="280" height="110" rx="6" fill="url(#memGrad)" stroke="#ffa726" stroke-width="2"/>
  <text x="210" y="300" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 内存使用率</text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="11" fill="#fff3e0">• heapUsage.getUsed() / max</text>
  <text x="80" y="335" font-family="Arial, sans-serif" font-size="11" fill="#ffe0b2">• 阈值: memoryThreshold (85%)</text>
  <text x="80" y="350" font-family="Arial, sans-serif" font-size="11" fill="#ffe0b2">• 降级公式:</text>
  <text x="90" y="365" font-family="monospace" font-size="9" fill="#ffe0b2">factor = (usage - 0.85) / 0.15</text>
  <text x="80" y="378" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">堆内存紧张时降低准入</text>

  <rect x="70" y="400" width="280" height="110" rx="6" fill="url(#threadGrad)" stroke="#ab47bc" stroke-width="2"/>
  <text x="210" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 线程使用率</text>
  <text x="80" y="445" font-family="Arial, sans-serif" font-size="11" fill="#f3e5f5">• activeThreads / maxThreads</text>
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="11" fill="#e1bee7">• 阈值: threadThreshold (80%)</text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="11" fill="#e1bee7">• 估算:</text>
  <text x="90" y="490" font-family="monospace" font-size="9" fill="#e1bee7">max = processors × 25</text>
  <text x="80" y="503" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">线程接近上限时收紧</text>

  <rect x="70" y="525" width="280" height="175" rx="6" fill="#0d47a1" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="210" y="550" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffd54f" text-anchor="middle">采样优化</text>
  <text x="80" y="570" font-family="Arial, sans-serif" font-size="11" fill="#fff9c4">• 采样间隔: 2秒 (SAMPLING_INTERVAL_MS)</text>
  <text x="80" y="587" font-family="Arial, sans-serif" font-size="11" fill="#fff9c4">• 间隔内使用缓存值</text>
  <text x="80" y="604" font-family="Arial, sans-serif" font-size="11" fill="#fff9c4">• CAS 保证单线程采样</text>
  <text x="80" y="621" font-family="Arial, sans-serif" font-size="11" fill="#fff9c4">• 减少系统调用开销</text>
  <text x="80" y="638" font-family="Arial, sans-serif" font-size="11" fill="#fff9c4">• lastSampleTime: AtomicLong</text>
  <text x="80" y="655" font-family="Arial, sans-serif" font-size="11" fill="#fff9c4">• cachedAllowedQps: AtomicInteger</text>
  <text x="80" y="672" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">避免高频采样导致性能下降</text>
  <text x="80" y="687" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">2秒内复用计算结果</text>

  <rect x="400" y="100" width="320" height="300" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">动态调整算法</text>
  
  <rect x="420" y="150" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="560" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 计算降级系数</text>
  <text x="430" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">取三个指标中最严格的:</text>
  <text x="430" y="210" font-family="monospace" font-size="9" fill="#90caf9">maxFactor = max(cpuFactor,</text>
  <text x="430" y="223" font-family="monospace" font-size="9" fill="#90caf9">                 memoryFactor,</text>
  <text x="430" y="236" font-family="monospace" font-size="9" fill="#90caf9">                 threadFactor)</text>
  <text x="430" y="251" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">→ 多维度保护，避免单点失守</text>

  <rect x="420" y="275" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="560" y="300" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 应用降级公式</text>
  <text x="430" y="320" font-family="monospace" font-size="10" fill="#a5d6a7">degradeAmount =</text>
  <text x="440" y="335" font-family="monospace" font-size="10" fill="#a5d6a7">  baseQps × maxFactor × 0.2</text>
  <text x="430" y="352" font-family="monospace" font-size="10" fill="#a5d6a7">newQps = baseQps - degradeAmount</text>
  <text x="430" y="369" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">degradeFactor: 0.2 (可配置)</text>
  <text x="430" y="382" font-family="Arial, sans-serif" font-size="9" fill="#ffab91">负载越高降级幅度越大</text>

  <rect x="400" y="420" width="320" height="300" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">平滑调整机制</text>
  
  <rect x="420" y="470" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="560" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">衰减系数 (DECAY_FACTOR)</text>
  <text x="430" y="515" font-family="monospace" font-size="10" fill="#a5d6a7">smoothedQps =</text>
  <text x="440" y="530" font-family="monospace" font-size="10" fill="#a5d6a7">  cached × 0.7 + newQps × 0.3</text>
  <text x="430" y="547" font-family="Arial, sans-serif" font-size="10" fill="#90caf9">DECAY_FACTOR = 0.3</text>
  <text x="430" y="562" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">防止阈值剧烈抖动</text>
  <text x="430" y="575" font-family="Arial, sans-serif" font-size="10" fill="#ffab91">负载恢复时平滑上升</text>

  <rect x="420" y="595" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="560" y="620" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">边界保护</text>
  <text x="430" y="640" font-family="monospace" font-size="10" fill="#a5d6a7">MIN_QPS = 10</text>
  <text x="430" y="655" font-family="monospace" font-size="10" fill="#a5d6a7">MAX_QPS = 10000</text>
  <text x="430" y="672" font-family="monospace" font-size="10" fill="#a5d6a7">allowedQps = clamp(smoothedQps,</text>
  <text x="440" y="687" font-family="monospace" font-size="10" fill="#a5d6a7">                   MIN_QPS, baseQps)</text>

  <rect x="750" y="100" width="600" height="300" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">调整效果示例</text>
  
  <rect x="770" y="150" width="560" height="65" rx="6" fill="#2e7d32" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="1050" y="173" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">正常负载 (CPU 50%, Mem 60%, Thread 50%)</text>
  <text x="780" y="191" font-family="Arial, sans-serif" font-size="10" fill="#e8f5e9">所有指标均未超阈值 → maxFactor = 0 → allowedQps = baseQps (100 QPS)</text>
  <text x="780" y="206" font-family="Arial, sans-serif" font-size="10" fill="#c8e6c9">✓ 不限流，全速运行</text>

  <rect x="770" y="230" width="560" height="65" rx="6" fill="#ef6c00" stroke="#ffa726" stroke-width="1.5"/>
  <text x="1050" y="253" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">中等负载 (CPU 80%, Mem 70%, Thread 60%)</text>
  <text x="780" y="271" font-family="Arial, sans-serif" font-size="10" fill="#fff3e0">CPU 超阈值 → cpuFactor = (0.8-0.7)/0.3 = 0.33 → degradeAmount = 100×0.33×0.2 = 6.6</text>
  <text x="780" y="286" font-family="Arial, sans-serif" font-size="10" fill="#ffe0b2">⚠ allowedQps ≈ 93 QPS (降低 7%)</text>

  <rect x="770" y="310" width="560" height="75" rx="6" fill="#c62828" stroke="#ef5350" stroke-width="1.5"/>
  <text x="1050" y="333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">高负载 (CPU 95%, Mem 90%, Thread 85%)</text>
  <text x="780" y="351" font-family="Arial, sans-serif" font-size="10" fill="#ffebee">CPU 95% → cpuFactor = 0.83, Mem 90% → memFactor = 0.33, Thread 85% → threadFactor = 0.25</text>
  <text x="780" y="366" font-family="Arial, sans-serif" font-size="10" fill="#ffebee">maxFactor = 0.83 → degradeAmount = 100×0.83×0.2 = 16.6</text>
  <text x="780" y="378" font-family="Arial, sans-serif" font-size="10" fill="#ffcdd2">✗ allowedQps ≈ 83 QPS (降低 17%，严格保护)</text>

  <rect x="750" y="420" width="600" height="300" rx="8" fill="url(#grad1)" stroke="#42a5f5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">使用方式</text>
  
  <rect x="770" y="470" width="280" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="910" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">API 调用</text>
  <text x="780" y="513" font-family="monospace" font-size="9" fill="#a5d6a7">int allowedQps =</text>
  <text x="785" y="526" font-family="monospace" font-size="9" fill="#a5d6a7">  adaptiveRateLimiter</text>
  <text x="790" y="539" font-family="monospace" font-size="9" fill="#a5d6a7">    .getAllowedQps("default", 100);</text>
  <text x="780" y="556" font-family="monospace" font-size="9" fill="#a5d6a7">if (!tryAcquire(allowedQps)) {</text>
  <text x="785" y="569" font-family="monospace" font-size="9" fill="#a5d6a7">  reject();</text>
  <text x="780" y="575" font-family="monospace" font-size="9" fill="#a5d6a7">}</text>

  <rect x="1070" y="470" width="260" height="110" rx="6" fill="#1565c0" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1200" y="495" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">配置参数</text>
  <text x="1080" y="513" font-family="Arial, sans-serif" font-size="10" fill="#e3f2fd">apex.ratelimit.adaptive:</text>
  <text x="1085" y="528" font-family="Arial, sans-serif" font-size="9" fill="#90caf9">cpu-threshold: 0.7</text>
  <text x="1085" y="541" font-family="Arial, sans-serif" font-size="9" fill="#90caf9">memory-threshold: 0.85</text>
  <text x="1085" y="554" font-family="Arial, sans-serif" font-size="9" fill="#90caf9">thread-threshold: 0.8</text>
  <text x="1085" y="567" font-family="Arial, sans-serif" font-size="9" fill="#90caf9">degrade-factor: 0.2</text>

  <rect x="770" y="595" width="560" height="110" rx="6" fill="#0d47a1" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="1050" y="620" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffd54f" text-anchor="middle">设计目标与优势</text>
  <text x="780" y="638" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">✓ 自我保护: 系统负载越高，限流越严格，防止雪崩</text>
  <text x="780" y="653" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">✓ 多维度监控: CPU/内存/线程三个维度联合判断，全面防御</text>
  <text x="780" y="668" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">✓ 平滑调整: 衰减系数防止阈值抖动，避免限流策略剧烈波动</text>
  <text x="780" y="683" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">✓ 采样优化: 2秒间隔 + CAS，减少系统调用开销，提升性能</text>
  <text x="780" y="698" font-family="Arial, sans-serif" font-size="10" fill="#fff9c4">✓ 配置灵活: 阈值、降级系数、采样间隔均可配置，适应不同场景</text>

  <path d="M 370 255 L 400 255" stroke="#64b5f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="385" y="250" font-family="Arial, sans-serif" font-size="10" fill="#64b5f6" text-anchor="middle">采样</text>
  
  <path d="M 560 400 L 560 420" stroke="#64b5f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="590" y="415" font-family="Arial, sans-serif" font-size="10" fill="#64b5f6">平滑</text>

  <text x="700" y="770" font-family="Arial, sans-serif" font-size="11" fill="#546e7a" text-anchor="middle">© 2026 Apex Team · 自适应限流器 v1.0 · apex-infrastructure/ratelimit/adaptive/AdaptiveRateLimiter.java</text>
</svg>
