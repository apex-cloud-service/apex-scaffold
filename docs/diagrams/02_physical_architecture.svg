<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" width="1600" height="1400">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Scaffold 网络物理部署架构图</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-10</dc:date>
        <dc:version>3.0</dc:version>
        <dc:description>展示生产环境的物理部署拓扑:Podman Compose默认栈与Kubernetes扩展方案</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main {
        font: 700 36px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .title-version {
        font: 500 16px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
      .layer-title {
        font: 600 20px system-ui, sans-serif;
        fill: #0f172a;
      }
      .layer-desc {
        font: 400 13px system-ui, sans-serif;
        fill: #64748b;
      }
      .node-title {
        font: 600 15px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .node-port {
        font: 500 12px 'SF Mono', monospace;
        fill: #dc2626;
        text-anchor: middle;
      }
      .node-desc {
        font: 400 12px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
      .tech-label {
        font: 400 11px system-ui, sans-serif;
        fill: #94a3b8;
      }
      .flow-label {
        font: 500 12px system-ui, sans-serif;
        fill: #475569;
        text-anchor: middle;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

    <linearGradient id="grad-client" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-dmz" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-data" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-monitor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1400" fill="#ffffff"/>

  <text x="800" y="50" class="title-main">Apex Scaffold 网络物理部署架构</text>
  <text x="800" y="80" class="title-version">Podman Compose 默认栈 + Kubernetes 生产扩展 · v3.0</text>

  <g id="client-layer">
    <rect x="100" y="120" width="1400" height="150" rx="8" fill="url(#grad-client)" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="150" class="layer-title" fill="#3b82f6">客户端层 (Internet)</text>
    <text x="120" y="170" class="layer-desc">用户浏览器 · 移动端APP · 第三方系统 · 运维人员</text>

    <rect x="130" y="190" width="180" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="220" y="215" class="node-title">Web 浏览器</text>
    <text x="220" y="233" class="node-port">HTTPS :443</text>
    <text x="220" y="248" class="node-desc">Vue 3 前端</text>

    <rect x="340" y="190" width="180" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="430" y="215" class="node-title">移动端 APP</text>
    <text x="430" y="233" class="node-port">HTTPS :443</text>
    <text x="430" y="248" class="node-desc">H5 / 小程序</text>

    <rect x="550" y="190" width="180" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="640" y="215" class="node-title">第三方系统</text>
    <text x="640" y="233" class="node-port">HTTPS :443</text>
    <text x="640" y="248" class="node-desc">OpenAPI 对接</text>

    <rect x="760" y="190" width="180" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="850" y="215" class="node-title">CDN 加速</text>
    <text x="850" y="233" class="node-port">HTTPS :443</text>
    <text x="850" y="248" class="node-desc">静态资源缓存</text>

    <rect x="970" y="190" width="180" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="1060" y="215" class="node-title">运维人员</text>
    <text x="1060" y="233" class="node-port">SSH :22</text>
    <text x="1060" y="248" class="node-desc">kubectl / podman</text>
  </g>

  <line x1="800" y1="270" x2="800" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="290" class="flow-label">HTTPS请求</text>

  <g id="dmz-layer">
    <rect x="100" y="310" width="1400" height="150" rx="8" fill="url(#grad-dmz)" opacity="0.1" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="340" class="layer-title" fill="#ef4444">网络安全层 (DMZ)</text>
    <text x="120" y="360" class="layer-desc">流量过滤 · 负载均衡 · 认证鉴权 · SSL终止</text>

    <rect x="130" y="380" width="220" height="60" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="240" y="405" class="node-title">WAF 防火墙</text>
    <text x="240" y="423" class="node-port">:443 → :80</text>
    <text x="240" y="438" class="node-desc">SQL注入/XSS防护</text>

    <rect x="380" y="380" width="220" height="60" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="405" class="node-title">Nginx / ALB</text>
    <text x="490" y="423" class="node-port">:80 → :8080</text>
    <text x="490" y="438" class="node-desc">负载均衡 + SSL终止</text>

    <rect x="630" y="380" width="220" height="60" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="740" y="405" class="node-title">API Gateway</text>
    <text x="740" y="423" class="node-port">WebFlux内置</text>
    <text x="740" y="438" class="node-desc">限流/熔断/鉴权</text>

    <rect x="880" y="380" width="220" height="60" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="990" y="405" class="node-title">Sentinel Dashboard</text>
    <text x="990" y="423" class="node-port">:8858 (可选)</text>
    <text x="990" y="438" class="node-desc">流量治理中心</text>
  </g>

  <line x1="800" y1="460" x2="800" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="480" class="flow-label">路由转发</text>

  <g id="app-layer">
    <rect x="100" y="500" width="1400" height="200" rx="8" fill="url(#grad-app)" opacity="0.1" stroke="#059669" stroke-width="2"/>
    <text x="120" y="530" class="layer-title" fill="#059669">应用服务层 (Podman / Kubernetes Pods)</text>
    <text x="120" y="550" class="layer-desc">Spring Boot WebFlux 响应式应用 · 多实例部署 · HPA自动伸缩</text>

    <rect x="130" y="570" width="280" height="110" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="270" y="595" class="node-title">Apex Application #1</text>
    <text x="150" y="620" class="node-port">:8080 业务端口</text>
    <text x="150" y="638" class="node-port">:8081 管理端口 (Actuator)</text>
    <text x="150" y="656" class="tech-label">Spring Boot 3.5.15 + WebFlux</text>
    <text x="150" y="672" class="tech-label">Profile: prod,enterprise</text>

    <rect x="440" y="570" width="280" height="110" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="580" y="595" class="node-title">Apex Application #2</text>
    <text x="460" y="620" class="node-port">:8080 业务端口</text>
    <text x="460" y="638" class="node-port">:8081 管理端口</text>
    <text x="460" y="656" class="tech-label">K8s HPA 水平扩展</text>
    <text x="460" y="672" class="tech-label">滚动发布 (建议)</text>

    <rect x="750" y="570" width="280" height="110" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="890" y="595" class="node-title">Apex Application #N</text>
    <text x="770" y="620" class="node-port">动态扩展实例</text>
    <text x="770" y="638" class="tech-label">Deployment 多副本</text>
    <text x="770" y="656" class="tech-label">资源: 512m-1024m Memory</text>
    <text x="770" y="672" class="tech-label">健康检查: /actuator/health</text>

    <rect x="1060" y="570" width="280" height="110" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="1200" y="595" class="node-title">消息消费者</text>
    <text x="1080" y="620" class="node-port">RocketMQ Consumer</text>
    <text x="1080" y="638" class="tech-label">企业版功能(可选)</text>
    <text x="1080" y="656" class="tech-label">APEX_MQ_CONSUMER_ENABLED</text>
    <text x="1080" y="672" class="tech-label">幂等消费 + 死信队列</text>
  </g>

  <line x1="800" y1="700" x2="800" y2="730" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="720" class="flow-label">数据读写</text>

  <g id="data-layer">
    <rect x="100" y="740" width="1400" height="200" rx="8" fill="url(#grad-data)" opacity="0.1" stroke="#d97706" stroke-width="2"/>
    <text x="120" y="770" class="layer-title" fill="#d97706">数据存储层 (Stateful)</text>
    <text x="120" y="790" class="layer-desc">MySQL 主从复制 · Redis 集群 · RocketMQ · MinIO 对象存储 · Meilisearch 全文搜索</text>

    <rect x="130" y="810" width="240" height="110" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="250" y="835" class="node-title">MySQL Primary</text>
    <text x="150" y="860" class="node-port">:3306 (写)</text>
    <text x="150" y="878" class="tech-label">MySQL 8.x</text>
    <text x="150" y="894" class="tech-label">DB: apex_data</text>
    <text x="150" y="910" class="tech-label">Flyway迁移 V1-V22</text>

    <rect x="400" y="810" width="240" height="110" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="520" y="835" class="node-title">MySQL Replica</text>
    <text x="420" y="860" class="node-port">:3307 (读)</text>
    <text x="420" y="878" class="tech-label">主从复制 (可选)</text>
    <text x="420" y="894" class="tech-label">读写分离</text>
    <text x="420" y="910" class="tech-label">Druid连接池</text>

    <rect x="670" y="810" width="240" height="110" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="790" y="835" class="node-title">Redis</text>
    <text x="690" y="860" class="node-port">:6379</text>
    <text x="690" y="878" class="tech-label">Redisson 3.36.0</text>
    <text x="690" y="894" class="tech-label">L2分布式缓存</text>
    <text x="690" y="910" class="tech-label">分布式锁 + 令牌桶</text>

    <rect x="940" y="810" width="240" height="110" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="1060" y="835" class="node-title">RocketMQ</text>
    <text x="960" y="860" class="node-port">:9876 NameServer</text>
    <text x="960" y="878" class="tech-label">消息队列 (企业版)</text>
    <text x="960" y="894" class="tech-label">Outbox发件箱模式</text>
    <text x="960" y="910" class="tech-label">--profile rocketmq</text>

    <rect x="1210" y="810" width="240" height="110" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="1330" y="835" class="node-title">MinIO / Meilisearch</text>
    <text x="1230" y="860" class="node-port">:9000 / :7700</text>
    <text x="1230" y="878" class="tech-label">对象存储 (可选)</text>
    <text x="1230" y="894" class="tech-label">全文搜索 (可选)</text>
    <text x="1230" y="910" class="tech-label">策略模式扩展</text>
  </g>

  <line x1="800" y1="940" x2="800" y2="970" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="960" class="flow-label">指标采集</text>

  <g id="monitor-layer">
    <rect x="100" y="980" width="1400" height="150" rx="8" fill="url(#grad-monitor)" opacity="0.1" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="1010" class="layer-title" fill="#7c3aed">监控可观测层 (Observability)</text>
    <text x="120" y="1030" class="layer-desc">Metrics · Logs · Traces · 66个Grafana面板 · 告警规则</text>

    <rect x="130" y="1050" width="280" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="270" y="1075" class="node-title">Prometheus</text>
    <text x="150" y="1093" class="node-port">:9090 (采集 :8081/actuator/prometheus)</text>

    <rect x="440" y="1050" width="280" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="580" y="1075" class="node-title">Grafana</text>
    <text x="460" y="1093" class="node-port">:3000 (66个监控面板)</text>

    <rect x="750" y="1050" width="280" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="890" y="1075" class="node-title">Zipkin</text>
    <text x="770" y="1093" class="node-port">:9411 (链路追踪, 采样率10%)</text>

    <rect x="1060" y="1050" width="280" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1200" y="1075" class="node-title">Loki</text>
    <text x="1080" y="1093" class="node-port">:3100 (日志聚合 LogQL查询)</text>
  </g>

  <g id="deployment-modes">
    <rect x="100" y="1160" width="680" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="120" y="1190" class="layer-title">Podman Compose 默认栈 (开发/测试)</text>
    <text x="120" y="1215" class="tech-label">启动命令: podman-compose -f podman-compose.yml up -d --build</text>
    <text x="120" y="1233" class="tech-label">服务清单:</text>
    <text x="140" y="1253" class="tech-label">• apex-scaffold (应用, :8080/:8081)</text>
    <text x="140" y="1271" class="tech-label">• mysql (数据库, :3306)</text>
    <text x="140" y="1289" class="tech-label">• redis (缓存, :6379)</text>
    <text x="140" y="1307" class="tech-label">• rocketmq-namesrv/broker (--profile rocketmq 可选)</text>
    <text x="140" y="1325" class="tech-label">• apex-admin-web (前端Nginx, :80 可选)</text>

    <rect x="820" y="1160" width="680" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="840" y="1190" class="layer-title">Kubernetes 生产扩展 (建议)</text>
    <text x="840" y="1215" class="tech-label">特性:</text>
    <text x="860" y="1235" class="tech-label">• HPA 水平自动伸缩 (min: 2, max: 10)</text>
    <text x="860" y="1253" class="tech-label">• 滚动发布 (maxUnavailable: 25%, maxSurge: 25%)</text>
    <text x="860" y="1271" class="tech-label">• Liveness/Readiness 健康检查</text>
    <text x="860" y="1289" class="tech-label">• ConfigMap 配置注入 + Secret 敏感数据</text>
    <text x="860" y="1307" class="tech-label">• Ingress 路由 + Service 负载均衡</text>
    <text x="860" y="1325" class="tech-label">• PVC 持久化存储 (MySQL/Redis数据卷)</text>
  </g>

  <text x="800" y="1380" class="tech-label" text-anchor="middle">© 2026 Apex Team · 网络物理部署架构 v3.0 · 基于 podman-compose.yml 实际配置生成</text>
</svg>
