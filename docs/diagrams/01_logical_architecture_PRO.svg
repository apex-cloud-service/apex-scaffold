<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <defs>
    <style>
      .title { font: bold 24px sans-serif; fill: #0f172a; text-anchor: middle; }
      .subtitle { font: 14px sans-serif; fill: #64748b; text-anchor: middle; }
      .layer-box { rx: 10; stroke-width: 3; }
      .layer-title { font: bold 18px sans-serif; fill: white; text-anchor: middle; }
      .layer-subtitle { font: 12px sans-serif; fill: white; text-anchor: middle; opacity: 0.9; }
      .component { rx: 6; fill: white; stroke-width: 2; }
      .comp-title { font: 600 13px sans-serif; fill: #0f172a; text-anchor: middle; }
      .comp-desc { font: 10px sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
    
    <!-- 图标定义 -->
    <g id="icon-api">
      <rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7,7 L7,13 M10,7 L10,13 M13,7 L13,13" stroke="currentColor" stroke-width="1.2"/>
    </g>
    
    <g id="icon-service">
      <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="2" fill="currentColor"/>
      <circle cx="10" cy="3" r="1.5" fill="currentColor"/>
      <circle cx="17" cy="10" r="1.5" fill="currentColor"/>
      <circle cx="10" cy="17" r="1.5" fill="currentColor"/>
      <circle cx="3" cy="10" r="1.5" fill="currentColor"/>
    </g>
    
    <g id="icon-domain">
      <rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/>
      <circle cx="10" cy="10" r="3" fill="white"/>
      <circle cx="10" cy="10" r="1" fill="currentColor"/>
    </g>
    
    <g id="icon-database">
      <ellipse cx="10" cy="6" rx="6" ry="2.5" fill="currentColor"/>
      <path d="M4,6 L4,14 Q4,16.5 10,16.5 Q16,16.5 16,14 L16,6" fill="currentColor"/>
      <ellipse cx="10" cy="14" rx="6" ry="2.5" fill="currentColor" opacity="0.8"/>
    </g>
    
    <defs>
      <linearGradient id="grad-interfaces" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="grad-application" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0e7490;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="grad-domain" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
      </linearGradient>
      <linearGradient id="grad-infrastructure" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
      </linearGradient>
    </defs>
  </defs>

  <!-- Title -->
  <text x="400" y="35" class="title">领域驱动设计 · 四层架构</text>
  <text x="400" y="55" class="subtitle">Domain-Driven Design · Layered Architecture · Professional Icons</text>

  <!-- 接口层 (Interfaces Layer) -->
  <rect class="layer-box" x="50" y="90" width="700" height="160" fill="url(#grad-interfaces)" stroke="#4f46e5"/>
  <use href="#icon-api" x="60" y="100" width="24" height="24" color="white"/>
  <text class="layer-title" x="400" y="120">用户接口层 (User Interfaces)</text>
  <text class="layer-subtitle" x="400" y="138">API网关 · 路由 · 认证鉴权 · 全局异常处理</text>
  
  <g>
    <rect class="component" x="80" y="160" width="150" height="65" stroke="#4f46e5"/>
    <use href="#icon-api" x="145" y="170" width="20" height="20" color="#4f46e5"/>
    <text class="comp-title" x="155" y="205">REST Controller</text>
    <text class="comp-desc" x="155" y="220">@RestController</text>
  </g>
  
  <g>
    <rect class="component" x="260" y="160" width="150" height="65" stroke="#4f46e5"/>
    <text x="335" y="188" style="font:bold 14px sans-serif;fill:#4f46e5">WS</text>
    <text class="comp-title" x="335" y="205">WebSocket Handler</text>
    <text class="comp-desc" x="335" y="220">实时通信</text>
  </g>
  
  <g>
    <rect class="component" x="440" y="160" width="140" height="65" stroke="#4f46e5"/>
    <text x="510" y="188" style="font:bold 14px sans-serif;fill:#4f46e5">DTO</text>
    <text class="comp-title" x="510" y="205">数据传输对象</text>
    <text class="comp-desc" x="510" y="220">Request/Response</text>
  </g>
  
  <g>
    <rect class="component" x="610" y="160" width="120" height="65" stroke="#4f46e5"/>
    <text x="670" y="188" style="font:bold 14px sans-serif;fill:#4f46e5">🔒</text>
    <text class="comp-title" x="670" y="205">安全拦截器</text>
    <text class="comp-desc" x="670" y="220">JWT · RBAC</text>
  </g>

  <!-- 应用层 (Application Layer) -->
  <rect class="layer-box" x="50" y="280" width="700" height="160" fill="url(#grad-application)" stroke="#0891b2"/>
  <use href="#icon-service" x="60" y="290" width="24" height="24" color="white"/>
  <text class="layer-title" x="400" y="310">应用服务层 (Application Services)</text>
  <text class="layer-subtitle" x="400" y="328">业务流程编排 · 事务管理 · 应用逻辑</text>
  
  <g>
    <rect class="component" x="80" y="350" width="140" height="65" stroke="#0891b2"/>
    <use href="#icon-service" x="140" y="360" width="20" height="20" color="#0891b2"/>
    <text class="comp-title" x="150" y="395">Application Service</text>
    <text class="comp-desc" x="150" y="410">@Service</text>
  </g>
  
  <g>
    <rect class="component" x="250" y="350" width="140" height="65" stroke="#0891b2"/>
    <text x="320" y="378" style="font:bold 14px sans-serif;fill:#0891b2">CMD</text>
    <text class="comp-title" x="320" y="395">Command Handler</text>
    <text class="comp-desc" x="320" y="410">CQRS写模型</text>
  </g>
  
  <g>
    <rect class="component" x="420" y="350" width="140" height="65" stroke="#0891b2"/>
    <text x="490" y="378" style="font:bold 14px sans-serif;fill:#0891b2">Q</text>
    <text class="comp-title" x="490" y="395">Query Handler</text>
    <text class="comp-desc" x="490" y="410">CQRS读模型</text>
  </g>
  
  <g>
    <rect class="component" x="590" y="350" width="140" height="65" stroke="#0891b2"/>
    <text x="660" y="378" style="font:bold 14px sans-serif;fill:#0891b2">🔄</text>
    <text class="comp-title" x="660" y="395">Event Bus</text>
    <text class="comp-desc" x="660" y="410">事件发布订阅</text>
  </g>

  <!-- 领域层 (Domain Layer) -->
  <rect class="layer-box" x="50" y="470" width="700" height="180" fill="url(#grad-domain)" stroke="#059669"/>
  <use href="#icon-domain" x="60" y="480" width="24" height="24" color="white"/>
  <text class="layer-title" x="400" y="500">领域模型层 (Domain Model)</text>
  <text class="layer-subtitle" x="400" y="518">核心业务逻辑 · 领域实体 · 值对象 · 聚合根</text>
  
  <g>
    <rect class="component" x="80" y="540" width="130" height="85" stroke="#059669"/>
    <use href="#icon-domain" x="135" y="550" width="20" height="20" color="#059669"/>
    <text class="comp-title" x="145" y="585">Entity</text>
    <text class="comp-desc" x="145" y="600">领域实体</text>
    <text class="comp-desc" x="145" y="615">有唯一标识</text>
  </g>
  
  <g>
    <rect class="component" x="240" y="540" width="130" height="85" stroke="#059669"/>
    <text x="305" y="568" style="font:bold 14px sans-serif;fill:#059669">VO</text>
    <text class="comp-title" x="305" y="585">Value Object</text>
    <text class="comp-desc" x="305" y="600">值对象</text>
    <text class="comp-desc" x="305" y="615">不可变</text>
  </g>
  
  <g>
    <rect class="component" x="400" y="540" width="130" height="85" stroke="#059669"/>
    <text x="465" y="568" style="font:bold 14px sans-serif;fill:#059669">AR</text>
    <text class="comp-title" x="465" y="585">Aggregate Root</text>
    <text class="comp-desc" x="465" y="600">聚合根</text>
    <text class="comp-desc" x="465" y="615">一致性边界</text>
  </g>
  
  <g>
    <rect class="component" x="560" y="540" width="160" height="85" stroke="#059669"/>
    <text x="640" y="568" style="font:bold 14px sans-serif;fill:#059669">DS</text>
    <text class="comp-title" x="640" y="585">Domain Service</text>
    <text class="comp-desc" x="640" y="600">领域服务</text>
    <text class="comp-desc" x="640" y="615">跨聚合业务</text>
  </g>

  <!-- 基础设施层 (Infrastructure Layer) -->
  <rect class="layer-box" x="50" y="680" width="700" height="180" fill="url(#grad-infrastructure)" stroke="#d97706"/>
  <use href="#icon-database" x="60" y="690" width="24" height="24" color="white"/>
  <text class="layer-title" x="400" y="710">基础设施层 (Infrastructure)</text>
  <text class="layer-subtitle" x="400" y="728">数据持久化 · 消息队列 · 缓存 · 外部服务集成</text>
  
  <g>
    <rect class="component" x="80" y="750" width="130" height="85" stroke="#d97706"/>
    <use href="#icon-database" x="135" y="760" width="20" height="20" color="#d97706"/>
    <text class="comp-title" x="145" y="795">Repository Impl</text>
    <text class="comp-desc" x="145" y="810">仓储实现</text>
    <text class="comp-desc" x="145" y="825">MyBatis-Plus</text>
  </g>
  
  <g>
    <rect class="component" x="240" y="750" width="130" height="85" stroke="#d97706"/>
    <text x="305" y="778" style="font:bold 14px sans-serif;fill:#d97706">MQ</text>
    <text class="comp-title" x="305" y="795">Message Producer</text>
    <text class="comp-desc" x="305" y="810">消息发送</text>
    <text class="comp-desc" x="305" y="825">RocketMQ</text>
  </g>
  
  <g>
    <rect class="component" x="400" y="750" width="130" height="85" stroke="#d97706"/>
    <text x="465" y="778" style="font:bold 14px sans-serif;fill:#d97706">⚡</text>
    <text class="comp-title" x="465" y="795">Cache Manager</text>
    <text class="comp-desc" x="465" y="810">缓存管理</text>
    <text class="comp-desc" x="465" y="825">Redis</text>
  </g>
  
  <g>
    <rect class="component" x="560" y="750" width="160" height="85" stroke="#d97706"/>
    <text x="640" y="778" style="font:bold 14px sans-serif;fill:#d97706">🔌</text>
    <text class="comp-title" x="640" y="795">External Service</text>
    <text class="comp-desc" x="640" y="810">第三方集成</text>
    <text class="comp-desc" x="640" y="825">HTTP Client</text>
  </g>

  <!-- 箭头和数据流 -->
  <defs>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#64748b" />
    </marker>
  </defs>
  
  <path d="M400,250 L400,280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="5,5"/>
  <path d="M400,440 L400,470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="5,5"/>
  <path d="M400,650 L400,680" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-down)" stroke-dasharray="5,5"/>
  
  <text x="410" y="268" style="font:11px sans-serif;fill:#64748b">调用</text>
  <text x="410" y="458" style="font:11px sans-serif;fill:#64748b">调用</text>
  <text x="410" y="668" style="font:11px sans-serif;fill:#64748b">依赖</text>
</svg>
