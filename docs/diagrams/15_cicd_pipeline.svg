<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs><style>.title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}.subtitle{font:500 14px sans-serif;fill:#64748b;text-anchor:middle}.box-title{font:600 14px sans-serif;fill:#0f172a}.text{font:400 11px sans-serif;fill:#475569}.code{font:400 10px monospace;fill:#2563eb}</style></defs>
  <rect width="1400" height="800" fill="#fff"/>
  <text x="700" y="40" class="title">15. CI/CD流水线架构</text>
  <text x="700" y="65" class="subtitle">GitHub Actions · 自动构建测试部署 · 多环境发布 v3.0</text>

  <rect x="50" y="90" width="430" height="320" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="120" class="box-title">构建阶段 (Build)</text>
  <text x="70" y="145" class="text">触发条件: push/pull_request</text>
  <text x="70" y="170" class="code">1. checkout代码</text>
  <text x="70" y="188" class="code">2. setup JDK 17 + Node 20</text>
  <text x="70" y="206" class="code">3. mvn clean package</text>
  <text x="80" y="224" class="text">-DskipTests=false</text>
  <text x="80" y="242" class="text">-Dmaven.test.failure.ignore=false</text>
  <text x="70" y="270" class="code">4. 单元测试 (JUnit 5)</text>
  <text x="80" y="288" class="text">coverage &gt; 70%要求</text>
  <text x="70" y="316" class="code">5. 集成测试 (TestContainers)</text>
  <text x="70" y="344" class="code">6. SonarQube代码扫描</text>
  <text x="80" y="362" class="text">质量门禁: bugs=0, 可维护性A</text>
  <text x="70" y="390" class="text">产物: apex-scaffold-1.0.0.jar</text>

  <rect x="500" y="90" width="430" height="320" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="520" y="120" class="box-title">镜像构建 (Podman)</text>
  <text x="520" y="145" class="text">多阶段构建 Containerfile:</text>
  <text x="520" y="170" class="code">FROM eclipse-temurin:17-jre-alpine AS base</text>
  <text x="520" y="188" class="code">COPY *.jar /app.jar</text>
  <text x="520" y="206" class="code">EXPOSE 8080 8081</text>
  <text x="520" y="224" class="code">ENTRYPOINT ["java","-jar","/app.jar"]</text>
  <text x="520" y="252" class="text">镜像优化:</text>
  <text x="520" y="270" class="code">• Alpine Linux (体积150MB)</text>
  <text x="520" y="288" class="code">• 分层缓存 (依赖层复用)</text>
  <text x="520" y="306" class="code">• .containerignore (排除.git等)</text>
  <text x="520" y="334" class="text">推送到Registry:</text>
  <text x="520" y="352" class="code">podman push ghcr.io/apex/scaffold:1.0.0</text>
  <text x="520" y="370" class="code">podman push ghcr.io/apex/scaffold:latest</text>

  <rect x="950" y="90" width="400" height="320" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="970" y="120" class="box-title">部署阶段 (Deploy)</text>
  <text x="970" y="145" class="text">环境矩阵:</text>
  <text x="970" y="170" class="code">• dev: 自动部署 (每次push)</text>
  <text x="980" y="188" class="text">→ kubectl apply -f k8s/dev/</text>
  <text x="970" y="216" class="code">• staging: 手动审批</text>
  <text x="980" y="234" class="text">→ kubectl apply -f k8s/staging/</text>
  <text x="970" y="262" class="code">• prod: 打Tag触发</text>
  <text x="980" y="280" class="text">→ kubectl set image deployment</text>
  <text x="980" y="298" class="text">→ 滚动发布策略</text>
  <text x="970" y="326" class="text">部署后验证:</text>
  <text x="970" y="344" class="code">curl /actuator/health</text>
  <text x="970" y="362" class="code">smoke test (冒烟测试)</text>
  <text x="970" y="380" class="code">回滚策略: kubectl rollout undo</text>

  <rect x="50" y="440" width="1300" height="310" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="70" y="470" class="box-title">安全扫描 &amp; 制品管理</text>
  <text x="70" y="500" class="text">安全扫描:</text>
  <text x="80" y="520" class="code">• Trivy镜像漏洞扫描 (HIGH/CRITICAL阻断)</text>
  <text x="80" y="538" class="code">• OWASP Dependency-Check (依赖漏洞检测)</text>
  <text x="80" y="556" class="code">• Snyk代码安全分析</text>
  <text x="70" y="586" class="text">制品管理:</text>
  <text x="80" y="606" class="code">• Maven Nexus Repository (私有仓库)</text>
  <text x="80" y="624" class="code">• GitHub Packages (容器镜像仓库)</text>
  <text x="80" y="642" class="code">• 语义化版本: v1.2.3 (major.minor.patch)</text>
  <text x="70" y="672" class="text">流水线加速:</text>
  <text x="80" y="692" class="code">• GitHub Actions缓存 (Maven .m2, 容器镜像层)</text>
  <text x="80" y="710" class="code">• 并行任务: 前端构建 || 后端构建</text>
  <text x="80" y="728" class="code">• 矩阵构建: JDK 17/21 × MySQL 8.0/8.4</text>

  <text x="700" y="785" class="code" text-anchor="middle">© 2026 Apex Team · CI/CD流水线 v3.0 · GitHub Actions</text>
</svg>
