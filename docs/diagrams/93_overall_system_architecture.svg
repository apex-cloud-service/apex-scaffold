  <rect x="1049" y="104" width="295" height="60" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="1064" y="126" class="box-title">第三方 / OpenAPI</text>
  <text x="1064" y="145" class="box-desc">REST · OAuth2 · Webhook 回调</text>

