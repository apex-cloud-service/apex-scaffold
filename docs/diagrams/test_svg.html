<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG测试页面</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .svg-container {
            border: 1px solid #ddd;
            margin: 20px 0;
            padding: 10px;
        }
        h2 {
            color: #333;
        }
        img, object {
            max-width: 100%;
            height: auto;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>
    <h1>Apex Scaffold SVG 图表测试</h1>
    
    <div class="svg-container">
        <h2>14. 网络架构图</h2>
        <object data="14_network_architecture.svg" type="image/svg+xml" width="100%"></object>
    </div>
    
    <div class="svg-container">
        <h2>15. 数据流转架构图</h2>
        <object data="15_data_flow_architecture.svg" type="image/svg+xml" width="100%"></object>
    </div>
    
    <div class="svg-container">
        <h2>16. RocketMQ消息队列架构图</h2>
        <object data="16_mq_architecture.svg" type="image/svg+xml" width="100%"></object>
    </div>
    
    <div class="svg-container">
        <h2>17. 监控体系架构图</h2>
        <object data="17_monitoring_architecture.svg" type="image/svg+xml" width="100%"></object>
    </div>
    
    <div class="svg-container">
        <h2>18. 微服务治理架构图</h2>
        <object data="18_microservice_governance.svg" type="image/svg+xml" width="100%"></object>
    </div>
</body>
</html>
