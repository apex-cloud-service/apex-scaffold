<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400">
  <defs>
    <style>
      .title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #475569; }
      .section-title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .label { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #0f172a; }
      .small-label { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
      .code { font-family: "Courier New", monospace; font-size: 12px; fill: #0f172a; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4f46e5" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#059669" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#d97706" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="800" y="40" text-anchor="middle" class="title">多数据源动态切换架构图 (Dynamic DataSource Switch)</text>
  <text x="800" y="65" text-anchor="middle" class="subtitle">基于 @DataSource 注解 + AOP 切面实现读写分离与多数据源路由</text>

  <!-- 第一层:应用层注解 -->
  <text x="50" y="110" class="section-title">1️⃣ 应用层 - 注解声明</text>

  <rect x="100" y="130" width="1400" height="160" rx="8" fill="#f0f9ff" stroke="#0891b2" stroke-width="2"/>

  <!-- Service类 -->
  <rect x="150" y="160" width="300" height="110" rx="6" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="300" y="185" text-anchor="middle" class="section-title">ReportService</text>
  <text x="170" y="210" class="code">@Service</text>
  <text x="170" y="230" class="code">public class ReportService {</text>
  <text x="190" y="250" class="code" fill="#d97706" font-weight="bold">@DataSource("slave")</text>
  <text x="190" y="265" class="code">public Mono&lt;Report&gt; getReport() {...}</text>

  <!-- 方法级注解说明 -->
  <rect x="500" y="160" width="280" height="110" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="640" y="185" text-anchor="middle" class="label" fill="#059669" font-weight="bold">方法级注解</text>
  <text x="520" y="210" class="small-label">• 优先级最高</text>
  <text x="520" y="230" class="small-label">• 覆盖类级配置</text>
  <text x="520" y="250" class="small-label">• 支持动态数据源名</text>

  <!-- 类级注解说明 -->
  <rect x="830" y="160" width="280" height="110" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="970" y="185" text-anchor="middle" class="label" fill="#d97706" font-weight="bold">类级注解</text>
  <text x="850" y="210" class="small-label">• 整个类默认数据源</text>
  <text x="850" y="230" class="small-label">• 可被方法级覆盖</text>
  <text x="850" y="250" class="small-label">• 统一读写分离配置</text>

  <!-- 响应式适配 -->
  <rect x="1160" y="160" width="300" height="110" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1310" y="185" text-anchor="middle" class="label" fill="#d97706" font-weight="bold">响应式适配</text>
  <text x="1180" y="210" class="small-label">• doFirst(): 订阅时切换</text>
  <text x="1180" y="230" class="small-label">• doFinally(): 终止时释放</text>
  <text x="1180" y="250" class="small-label">• 避免 ThreadLocal 泄漏</text>

  <!-- 第二层:切面拦截 -->
  <text x="50" y="330" class="section-title">2️⃣ AOP 切面 - 切换逻辑</text>

  <rect x="100" y="350" width="1400" height="180" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="800" y="380" text-anchor="middle" class="section-title">DataSourceSwitchAspect (切面拦截器)</text>

  <!-- 切面流程 -->
  <rect x="150" y="400" width="200" height="60" rx="30" fill="#4f46e5" stroke="#4f46e5" stroke-width="2"/>
  <text x="250" y="435" text-anchor="middle" class="label" fill="white">方法拦截</text>

  <line x1="350" y1="430" x2="430" y2="430" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 解析注解 -->
  <rect x="430" y="400" width="200" height="60" rx="8" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="530" y="425" text-anchor="middle" class="label">解析 @DataSource</text>
  <text x="530" y="445" text-anchor="middle" class="small-label">方法级 > 类级</text>

  <line x1="630" y1="430" x2="710" y2="430" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 切换数据源 -->
  <rect x="710" y="400" width="220" height="60" rx="8" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="820" y="425" text-anchor="middle" class="label">设置数据源标识</text>
  <text x="820" y="445" text-anchor="middle" class="small-label">ThreadLocal 存储</text>

  <line x1="930" y1="430" x2="1010" y2="430" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 执行方法 -->
  <rect x="1010" y="400" width="200" height="60" rx="8" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="1110" y="425" text-anchor="middle" class="label">执行业务方法</text>
  <text x="1110" y="445" text-anchor="middle" class="small-label">JDBC 查询</text>

  <line x1="1210" y1="430" x2="1290" y2="430" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 清理 -->
  <rect x="1290" y="400" width="180" height="60" rx="8" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="1380" y="425" text-anchor="middle" class="label">清理标识</text>
  <text x="1380" y="445" text-anchor="middle" class="small-label">防止泄漏</text>

  <!-- 切面顺序说明 -->
  <rect x="150" y="480" width="1320" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="810" y="502" text-anchor="middle" class="small-label">⚠️ 切面顺序: @Order(HIGHEST_PRECEDENCE) 确保优先于 @Transactional,保证从正确数据源获取连接</text>

  <!-- 第三层:动态路由 -->
  <text x="50" y="570" class="section-title">3️⃣ 路由层 - 动态选择</text>

  <rect x="100" y="590" width="1400" height="200" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="620" text-anchor="middle" class="section-title">DynamicRoutingDataSource (Baomidou)</text>

  <!-- 路由逻辑 -->
  <rect x="200" y="650" width="200" height="60" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="675" text-anchor="middle" class="label">读取 ThreadLocal</text>
  <text x="300" y="695" text-anchor="middle" class="small-label">当前数据源标识</text>

  <line x1="400" y1="680" x2="480" y2="680" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead-orange)"/>

  <!-- 判断节点 -->
  <path d="M 580 650 L 680 680 L 580 710 L 480 680 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="580" y="685" text-anchor="middle" class="label">数据源存在?</text>

  <!-- 不存在分支 -->
  <line x1="580" y1="650" x2="580" y2="600" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <text x="600" y="620" class="small-label">否 (strict=false)</text>

  <!-- 存在分支 -->
  <line x1="680" y1="680" x2="760" y2="680" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead-orange)"/>
  <text x="710" y="670" class="small-label">是</text>

  <!-- 返回数据源 -->
  <rect x="760" y="650" width="200" height="60" rx="8" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="860" y="675" text-anchor="middle" class="label">返回目标数据源</text>
  <text x="860" y="695" text-anchor="middle" class="small-label">master / slave</text>

  <!-- 默认数据源 -->
  <rect x="480" y="580" width="200" height="35" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="580" y="602" text-anchor="middle" class="label">返回 primary (master)</text>

  <!-- 路由配置说明 -->
  <rect x="1050" y="650" width="400" height="120" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="1250" y="675" text-anchor="middle" class="label" font-weight="bold">配置项</text>
  <text x="1070" y="700" class="code">spring.datasource.dynamic:</text>
  <text x="1090" y="720" class="code">primary: master</text>
  <text x="1090" y="740" class="code">strict: false  # 回退主库</text>
  <text x="1090" y="760" class="code">datasource: {master, slave}</text>

  <!-- 第四层:数据源池 -->
  <text x="50" y="830" class="section-title">4️⃣ 连接池 - 物理数据源</text>

  <rect x="100" y="850" width="1400" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Master数据源 -->
  <rect x="200" y="880" width="500" height="170" rx="8" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="910" text-anchor="middle" class="section-title" fill="#4f46e5">Master (主库)</text>

  <rect x="220" y="930" width="460" height="30" rx="4" fill="#eff6ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="240" y="950" class="code">jdbc:mysql://master-host:3306/apex_data</text>

  <text x="240" y="980" class="small-label">• 处理所有写操作 (INSERT/UPDATE/DELETE)</text>
  <text x="240" y="1000" class="small-label">• 默认数据源 (primary)</text>
  <text x="240" y="1020" class="small-label">• Druid 连接池 (初始5,最大20)</text>
  <text x="240" y="1040" class="small-label">• 支持事务管理</text>

  <!-- Slave数据源 -->
  <rect x="800" y="880" width="500" height="170" rx="8" fill="white" stroke="#059669" stroke-width="2"/>
  <text x="1050" y="910" text-anchor="middle" class="section-title" fill="#059669">Slave (从库)</text>

  <rect x="820" y="930" width="460" height="30" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="1"/>
  <text x="840" y="950" class="code">jdbc:mysql://slave-host:3306/apex_data</text>

  <text x="840" y="980" class="small-label">• 处理只读操作 (SELECT)</text>
  <text x="840" y="1000" class="small-label">• 减轻主库压力</text>
  <text x="840" y="1020" class="small-label">• Druid 连接池 (初始5,最大20)</text>
  <text x="840" y="1040" class="small-label">• 主从延迟约 100-500ms</text>

  <!-- 第五层:使用场景 -->
  <text x="50" y="1110" class="section-title">5️⃣ 典型使用场景</text>

  <rect x="100" y="1130" width="1400" height="220" rx="8" fill="#f0f9ff" stroke="#0891b2" stroke-width="2"/>

  <!-- 场景1:读写分离 -->
  <rect x="150" y="1160" width="420" height="160" rx="6" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="360" y="1185" text-anchor="middle" class="label" font-weight="bold">场景1: 读写分离</text>
  <text x="170" y="1210" class="code">// 写操作 → master</text>
  <text x="170" y="1230" class="code">@DataSource("master")  // 显式</text>
  <text x="170" y="1250" class="code">public Mono&lt;Void&gt; createOrder() {...}</text>
  <text x="170" y="1280" class="code">// 读操作 → slave</text>
  <text x="170" y="1300" class="code">@DataSource("slave")</text>
  <text x="170" y="1320" class="code">public Mono&lt;Order&gt; getOrder() {...}</text>

  <!-- 场景2:报表查询 -->
  <rect x="610" y="1160" width="420" height="160" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="820" y="1185" text-anchor="middle" class="label" font-weight="bold">场景2: 报表查询隔离</text>
  <text x="630" y="1210" class="code">// 大数据量报表 → slave</text>
  <text x="630" y="1230" class="code">@DataSource("slave")</text>
  <text x="630" y="1250" class="code">public Mono&lt;Report&gt; generate() {</text>
  <text x="650" y="1270" class="code">// 复杂聚合查询</text>
  <text x="650" y="1290" class="code">// 不影响主库性能</text>
  <text x="630" y="1310" class="code">}</text>

  <!-- 场景3:多租户 -->
  <rect x="1070" y="1160" width="400" height="160" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="1270" y="1185" text-anchor="middle" class="label" font-weight="bold">场景3: 多租户路由</text>
  <text x="1090" y="1210" class="code">// 租户A → db_tenant_a</text>
  <text x="1090" y="1230" class="code">@DataSource("tenant_a")</text>
  <text x="1090" y="1250" class="code">public Mono&lt;Data&gt; query() {...}</text>
  <text x="1090" y="1280" class="code">// 租户B → db_tenant_b</text>
  <text x="1090" y="1300" class="code">@DataSource("tenant_b")</text>

  <!-- 底部说明 -->
  <rect x="50" y="1360" width="1500" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="1380" text-anchor="middle" class="small-label">⚠️ 响应式注意: 切换在订阅时生效(doFirst),查询必须延迟到订阅期执行 | 主从延迟场景写后立即读建议走主库</text>
</svg>
