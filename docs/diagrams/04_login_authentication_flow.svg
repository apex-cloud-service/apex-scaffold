<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1600" width="1400" height="1600">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Apex Scaffold JWT登录认证流程图</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-10</dc:date>
        <dc:version>3.0</dc:version>
        <dc:description>展示JWT双Token认证流程:登录策略、Token生成、Redis存储、自动续期</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main {
        font: 700 36px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .title-version {
        font: 500 16px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
      .actor-label {
        font: 600 18px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .step-number {
        font: 700 16px system-ui, sans-serif;
        fill: #ffffff;
        text-anchor: middle;
      }
      .step-desc {
        font: 500 14px system-ui, sans-serif;
        fill: #0f172a;
      }
      .code-label {
        font: 400 12px 'SF Mono', monospace;
        fill: #2563eb;
      }
      .note-text {
        font: 400 13px system-ui, sans-serif;
        fill: #475569;
      }
      .highlight-text {
        font: 600 14px system-ui, sans-serif;
        fill: #dc2626;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>

    <marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>

    <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1400" height="1600" fill="#ffffff"/>

  <text x="700" y="50" class="title-main">Apex Scaffold JWT 登录认证流程</text>
  <text x="700" y="80" class="title-version">双Token机制 · AccessToken + RefreshToken · 自动续期 · 黑名单机制 · v3.0</text>

  <g id="actors">
    <rect x="50" y="120" width="140" height="80" rx="40" fill="#4f46e5" stroke="#3730a3" stroke-width="2"/>
    <text x="120" y="165" class="actor-label" fill="#ffffff">客户端</text>
    <text x="120" y="185" class="note-text" fill="#e0e7ff">Vue 3 / 移动端</text>

    <rect x="280" y="120" width="180" height="80" rx="8" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
    <text x="370" y="165" class="actor-label">AuthHandler</text>
    <text x="370" y="185" class="code-label">WebFlux端点</text>

    <rect x="550" y="120" width="180" height="80" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
    <text x="640" y="165" class="actor-label">AuthService</text>
    <text x="640" y="185" class="code-label">应用服务</text>

    <rect x="820" y="120" width="180" height="80" rx="8" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <text x="910" y="165" class="actor-label">TokenService</text>
    <text x="910" y="185" class="code-label">令牌服务</text>

    <rect x="1090" y="120" width="180" height="80" rx="8" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
    <text x="1180" y="165" class="actor-label">Redis</text>
    <text x="1180" y="185" class="code-label">Redisson 3.36</text>
  </g>

  <line x1="120" y1="200" x2="120" y2="1550" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="370" y1="200" x2="370" y2="1550" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="640" y1="200" x2="640" y2="1550" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="910" y1="200" x2="910" y2="1550" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="1180" y1="200" x2="1180" y2="1550" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <g id="step1-login-request">
    <circle cx="50" cy="250" r="18" fill="#4f46e5"/>
    <text x="50" y="257" class="step-number">1</text>
    <line x1="120" y1="250" x2="350" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="180" y="240" class="step-desc">POST /api/v1/auth/login</text>
    <text x="180" y="270" class="code-label">{ loginType, code/phone, ... }</text>
  </g>

  <g id="step2-validate">
    <circle cx="50" cy="330" r="18" fill="#4f46e5"/>
    <text x="50" y="337" class="step-number">2</text>
    <rect x="280" y="300" width="180" height="60" rx="6" fill="#f0f9ff" stroke="#0891b2" stroke-width="2"/>
    <text x="290" y="325" class="step-desc">参数校验 + 限流</text>
    <text x="290" y="345" class="code-label">@RateLimiter(60, 10)</text>
  </g>

  <g id="step3-route-strategy">
    <circle cx="50" cy="410" r="18" fill="#4f46e5"/>
    <text x="50" y="417" class="step-number">3</text>
    <line x1="370" y1="380" x2="620" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="430" y="370" class="step-desc">路由到登录策略</text>
    <text x="430" y="400" class="code-label">LoginStrategyProvider</text>
  </g>

  <rect x="550" y="440" width="480" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="570" y="465" class="actor-label">多种登录策略 (Strategy Pattern)</text>

  <rect x="570" y="480" width="200" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="580" y="505" class="step-desc">WeChatCodeLogin</text>
  <text x="580" y="525" class="code-label">微信授权码登录</text>
  <text x="580" y="543" class="note-text">换取access_token</text>

  <rect x="790" y="480" width="220" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="800" y="505" class="step-desc">PasswordLogin</text>
  <text x="800" y="525" class="code-label">账号密码登录</text>
  <text x="800" y="543" class="note-text">BCrypt密码验证</text>

  <rect x="570" y="570" width="200" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="580" y="595" class="step-desc">SmsCodeLogin</text>
  <text x="580" y="615" class="code-label">短信验证码登录</text>
  <text x="580" y="633" class="note-text">Redis验证码校验</text>

  <rect x="790" y="570" width="220" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <text x="800" y="595" class="step-desc">WeChatPhoneLogin</text>
  <text x="800" y="615" class="code-label">微信一键登录</text>
  <text x="800" y="633" class="note-text">获取手机号绑定</text>

  <g id="step4-authenticate">
    <circle cx="50" cy="720" r="18" fill="#4f46e5"/>
    <text x="50" y="727" class="step-number">4</text>
    <rect x="550" y="690" width="180" height="60" rx="6" fill="#f0f9ff" stroke="#059669" stroke-width="2"/>
    <text x="560" y="715" class="step-desc">认证用户身份</text>
    <text x="560" y="735" class="code-label">UserRepository</text>
  </g>

  <g id="step5-generate-tokens">
    <circle cx="50" cy="810" r="18" fill="#4f46e5"/>
    <text x="50" y="817" class="step-number">5</text>
    <line x1="640" y1="780" x2="890" y2="780" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="700" y="770" class="step-desc">生成双Token</text>
    <text x="700" y="800" class="code-label">generateAccessToken()</text>
  </g>

  <rect x="820" y="830" width="370" height="180" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="840" y="855" class="actor-label">JWT Token 生成</text>
  <text x="840" y="885" class="code-label">AccessToken (2小时)</text>
  <text x="850" y="905" class="note-text">• subject: openId / userId</text>
  <text x="850" y="925" class="note-text">• type: "access"</text>
  <text x="850" y="945" class="note-text">• deviceId: 设备标识</text>

  <text x="840" y="975" class="code-label">RefreshToken (7天)</text>
  <text x="850" y="995" class="note-text">• type: "refresh"</text>

  <g id="step6-store-redis">
    <circle cx="50" cy="1070" r="18" fill="#4f46e5"/>
    <text x="50" y="1077" class="step-number">6</text>
    <line x1="910" y1="1040" x2="1160" y2="1040" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="960" y="1030" class="step-desc">存储Token到Redis</text>
    <text x="960" y="1060" class="code-label">storeToken(subject, access, refresh)</text>
  </g>

  <rect x="1090" y="1090" width="180" height="100" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1100" y="1115" class="code-label">Key格式:</text>
  <text x="1100" y="1135" class="note-text">auth:token:{subject}</text>
  <text x="1100" y="1155" class="note-text">TTL: 7天</text>
  <text x="1100" y="1175" class="note-text">JSON: {access, refresh}</text>

  <g id="step7-update-login-info">
    <circle cx="50" cy="1240" r="18" fill="#4f46e5"/>
    <text x="50" y="1247" class="step-number">7</text>
    <rect x="550" y="1210" width="180" height="60" rx="6" fill="#f0f9ff" stroke="#059669" stroke-width="2"/>
    <text x="560" y="1235" class="step-desc">更新登录信息</text>
    <text x="560" y="1255" class="code-label">lastLoginTime/IP</text>
  </g>

  <g id="step8-response">
    <circle cx="50" cy="1330" r="18" fill="#4f46e5"/>
    <text x="50" y="1337" class="step-number">8</text>
    <line x1="640" y1="1300" x2="390" y2="1300" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
    <text x="450" y="1290" class="step-desc">返回LoginResponse</text>

    <line x1="370" y1="1320" x2="140" y2="1320" stroke="#059669" stroke-width="2" marker-end="url(#arrow-success)"/>
    <text x="180" y="1350" class="code-label">Result&lt;LoginResponse&gt;</text>
  </g>

  <rect x="50" y="1380" width="270" height="140" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="70" y="1405" class="actor-label">LoginResponse 结构</text>
  <text x="70" y="1430" class="code-label">accessToken: String</text>
  <text x="70" y="1450" class="code-label">refreshToken: String</text>
  <text x="70" y="1470" class="code-label">user: UserDTO</text>
  <text x="70" y="1490" class="code-label">isNewUser: Boolean</text>
  <text x="70" y="1510" class="code-label">nextAction: String</text>

  <rect x="360" y="1380" width="510" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="1405" class="highlight-text">异常处理流程</text>
  <text x="380" y="1430" class="note-text">• 参数校验失败 → ResultCode.PARAM_INVALID (4000)</text>
  <text x="380" y="1450" class="note-text">• 用户不存在 → ResultCode.USER_NOT_EXIST (1010)</text>
  <text x="380" y="1470" class="note-text">• 密码错误 → ResultCode.PASSWORD_ERROR (1011)</text>
  <text x="380" y="1490" class="note-text">• 验证码错误 → ResultCode.VERIFY_CODE_ERROR (1015)</text>
  <text x="380" y="1510" class="note-text">• 微信授权失败 → ResultCode.WECHAT_AUTH_FAILED</text>
  <text x="380" y="1530" class="note-text">• 限流触发 → ResultCode.TOO_MANY_REQUESTS (2001)</text>

  <rect x="920" y="1380" width="330" height="160" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="940" y="1405" class="actor-label">安全防护机制</text>
  <text x="940" y="1430" class="note-text">• IP限流: 60秒/120次</text>
  <text x="940" y="1450" class="note-text">• 用户限流: 60秒/10次</text>
  <text x="940" y="1470" class="note-text">• 登录保护: 失败3次需验证码</text>
  <text x="940" y="1490" class="note-text">• Token黑名单: 注销后立即失效</text>
  <text x="940" y="1510" class="note-text">• 防重放: @AntiReplay注解</text>
  <text x="940" y="1530" class="note-text">• 扫描流量拦截: UA检查</text>

  <text x="700" y="1590" class="note-text" text-anchor="middle">© 2026 Apex Team · JWT登录认证流程 v3.0 · 基于 AuthHandler/AuthService 实际代码生成</text>
</svg>
