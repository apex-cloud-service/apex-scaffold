<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1400" viewBox="0 0 1400 1400">
  <defs>
    <style type="text/css">
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #e5e7eb; }
      .title { font-size: 18px; font-weight: bold; fill: #f9fafb; }
      .participant { font-size: 13px; font-weight: 600; fill: #f9fafb; }
      .message { font-size: 12px; fill: #d1d5db; }
      .note { font-size: 11px; fill: #9ca3af; }
      .copyright { font-size: 10px; fill: #6b7280; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#60a5fa" />
    </marker>
    <marker id="arrowhead-async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34d399" />
    </marker>
    <marker id="arrowhead-queue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#a78bfa" />
    </marker>
  </defs>
  
  <rect width="1400" height="1400" fill="#0f172a"/>
  
  <text x="700" y="30" text-anchor="middle" class="title">操作审计日志异步批量落库流程</text>
  
  <g id="participants">
    <rect x="50" y="60" width="100" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="100" y="90" text-anchor="middle" class="participant">客户端</text>
    
    <rect x="180" y="60" width="120" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="240" y="90" text-anchor="middle" class="participant">UserHandler</text>
    
    <rect x="330" y="60" width="160" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="410" y="90" text-anchor="middle" class="participant">OperationLogAspect</text>
    
    <rect x="520" y="60" width="120" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="580" y="90" text-anchor="middle" class="participant">UserService</text>
    
    <rect x="670" y="60" width="140" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="740" y="80" text-anchor="middle" class="participant">BlockingQueue</text>
    <text x="740" y="100" text-anchor="middle" class="participant" font-size="11px">阻塞队列</text>
    
    <rect x="840" y="60" width="140" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="910" y="80" text-anchor="middle" class="participant">消费者线程池</text>
    <text x="910" y="100" text-anchor="middle" class="participant" font-size="11px">Consumer</text>
    
    <rect x="1010" y="60" width="160" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="1090" y="80" text-anchor="middle" class="participant">OperationLogService</text>
    <text x="1090" y="100" text-anchor="middle" class="participant" font-size="11px">LogService</text>
    
    <rect x="1200" y="60" width="150" height="50" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="1275" y="80" text-anchor="middle" class="participant">MySQL</text>
    <text x="1275" y="100" text-anchor="middle" class="participant" font-size="11px">sys_operation_log</text>
  </g>
  
  <g id="lifelines">
    <line x1="100" y1="110" x2="100" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="240" y1="110" x2="240" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="410" y1="110" x2="410" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="580" y1="110" x2="580" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="740" y1="110" x2="740" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="910" y1="110" x2="910" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="1090" y1="110" x2="1090" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="1275" y1="110" x2="1275" y2="1320" stroke="#374151" stroke-width="1" stroke-dasharray="5,5"/>
  </g>
  
  <rect x="80" y="140" width="1000" height="480" fill="#1a2332" stroke="#3b82f6" stroke-width="2" rx="5" opacity="0.2"/>
  <text x="90" y="160" class="message" fill="#60a5fa" font-weight="bold">阶段1: 主业务流程 - 异步入队 (不阻塞用户响应)</text>
  
  <g id="messages-phase1">
    <line x1="100" y1="180" x2="240" y2="180" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="170" y="175" text-anchor="middle" class="message">POST /admin-api/v1/users</text>
    
    <line x1="240" y1="210" x2="410" y2="210" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="325" y="205" text-anchor="middle" class="message">AOP拦截 @OperationLog</text>
    
    <rect x="425" y="225" width="240" height="45" fill="#1e3a4a" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="545" y="242" text-anchor="middle" class="note">记录操作开始时间</text>
    <text x="545" y="260" text-anchor="middle" class="note">提取请求信息 (IP、URI、参数)</text>
    
    <line x1="410" y1="290" x2="580" y2="290" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="495" y="285" text-anchor="middle" class="message">createUser(request)</text>
    
    <rect x="595" y="305" width="200" height="35" fill="#1e3a4a" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="695" y="322" text-anchor="middle" class="note">执行业务逻辑 数据库写入</text>
    
    <line x1="580" y1="360" x2="410" y2="360" stroke="#34d399" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-async)"/>
    <text x="495" y="355" text-anchor="middle" class="message" fill="#34d399">返回 UserDTO</text>
    
    <rect x="425" y="375" width="280" height="65" fill="#1e3a4a" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="565" y="392" text-anchor="middle" class="note">计算执行时间</text>
    <text x="565" y="410" text-anchor="middle" class="note">构建审计日志对象:</text>
    <text x="565" y="428" text-anchor="middle" class="note" font-size="10px">operationTime, executionTime, requestParams, responseResult</text>
    
    <line x1="410" y1="460" x2="740" y2="460" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowhead-queue)"/>
    <text x="575" y="455" text-anchor="middle" class="message" fill="#a78bfa">入队 offer(logEntity)</text>
    
    <rect x="755" y="475" width="200" height="65" fill="#2d1b4e" stroke="#a78bfa" stroke-width="1" rx="3"/>
    <text x="855" y="492" text-anchor="middle" class="note" fill="#c4b5fd">异步队列</text>
    <text x="855" y="510" text-anchor="middle" class="note" fill="#c4b5fd">容量: 10000</text>
    <text x="855" y="528" text-anchor="middle" class="note" fill="#c4b5fd">非阻塞入队 (offer)</text>
    
    <line x1="410" y1="560" x2="240" y2="560" stroke="#34d399" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-async)"/>
    <text x="325" y="555" text-anchor="middle" class="message" fill="#34d399">继续执行 (不等待日志写入)</text>
    
    <line x1="240" y1="590" x2="100" y2="590" stroke="#34d399" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-async)"/>
    <text x="170" y="585" text-anchor="middle" class="message" fill="#34d399">200 OK + UserDTO</text>
  </g>
  
  <rect x="650" y="640" width="720" height="630" fill="#1a3322" stroke="#10b981" stroke-width="2" rx="5" opacity="0.2"/>
  <text x="660" y="660" class="message" fill="#10b981" font-weight="bold">阶段2: 后台消费线程 - 批量写入数据库</text>
  
  <g id="messages-phase2">
    <line x1="910" y1="690" x2="740" y2="690" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowhead-queue)"/>
    <text x="825" y="685" text-anchor="middle" class="message" fill="#a78bfa">批量取出 drainTo(batch, 100)</text>
    
    <line x1="740" y1="720" x2="910" y2="720" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-queue)"/>
    <text x="825" y="715" text-anchor="middle" class="message" fill="#c4b5fd">List&lt;OperationLogEntity&gt;</text>
    
    <line x1="910" y1="750" x2="1090" y2="750" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="1000" y="745" text-anchor="middle" class="message">saveBatch(logList)</text>
    
    <rect x="1105" y="765" width="180" height="35" fill="#1e3a4a" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="1195" y="782" text-anchor="middle" class="note">批量保存 最多100条/次</text>
    
    <rect x="1105" y="815" width="200" height="65" fill="#1e3a4a" stroke="#f59e0b" stroke-width="1" rx="3"/>
    <text x="1205" y="832" text-anchor="middle" class="note" fill="#fbbf24">subscribeOn(boundedElastic)</text>
    <text x="1205" y="850" text-anchor="middle" class="note" fill="#fbbf24">JDBC阻塞操作隔离</text>
    <text x="1205" y="868" text-anchor="middle" class="note" fill="#fbbf24">避免阻塞事件循环线程</text>
    
    <line x1="1090" y1="900" x2="1275" y2="900" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="1182" y="895" text-anchor="middle" class="message">INSERT INTO sys_operation_log</text>
    
    <rect x="1215" y="915" width="120" height="80" fill="#1e3a4a" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="1275" y="932" text-anchor="middle" class="note" font-size="10px">批量插入SQL:</text>
    <text x="1275" y="948" text-anchor="middle" class="note" font-size="10px">user_id</text>
    <text x="1275" y="964" text-anchor="middle" class="note" font-size="10px">module, type</text>
    <text x="1275" y="980" text-anchor="middle" class="note" font-size="10px">description, ip</text>
    <text x="1275" y="996" text-anchor="middle" class="note" font-size="10px">trace_id, tenant_id</text>
    
    <line x1="1275" y1="1020" x2="1090" y2="1020" stroke="#34d399" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-async)"/>
    <text x="1182" y="1015" text-anchor="middle" class="message" fill="#34d399">插入成功</text>
    
    <line x1="1090" y1="1050" x2="910" y2="1050" stroke="#34d399" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-async)"/>
    <text x="1000" y="1045" text-anchor="middle" class="message" fill="#34d399">Mono&lt;Void&gt; 保存完成</text>
    
    <rect x="925" y="1065" width="240" height="45" fill="#1e3a4a" stroke="#10b981" stroke-width="1" rx="3"/>
    <text x="1045" y="1082" text-anchor="middle" class="note" fill="#34d399">继续下一批次</text>
    <text x="1045" y="1100" text-anchor="middle" class="note" fill="#34d399">循环消费队列中的日志</text>
    
    <line x1="910" y1="1130" x2="740" y2="1130" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="825" y="1125" text-anchor="middle" class="message" fill="#a78bfa" font-size="11px">下一批次 drainTo...</text>
  </g>
  
  <g id="key-points">
    <rect x="100" y="1180" width="1200" height="120" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="700" y="1210" text-anchor="middle" class="message" font-weight="bold" fill="#60a5fa">关键设计要点</text>
    
    <text x="120" y="1240" class="note">• <tspan fill="#60a5fa" font-weight="bold">AOP切面 (OperationLogAspect)</tspan>: 不阻塞主业务,异步入队,记录操作时间、IP、参数、响应结果</text>
    <text x="120" y="1260" class="note">• <tspan fill="#a78bfa" font-weight="bold">阻塞队列 (BlockingQueue)</tspan>: 生产者-消费者模式,容量10000,削峰填谷,保护数据库</text>
    <text x="120" y="1280" class="note">• <tspan fill="#10b981" font-weight="bold">批量消费 (Consumer)</tspan>: 合并写入,每批最多100条,降低数据库压力,提升吞吐量</text>
    <text x="120" y="1300" class="note">• <tspan fill="#fbbf24" font-weight="bold">线程隔离 (boundedElastic)</tspan>: JDBC阻塞操作调度到专用线程池,避免阻塞WebFlux事件循环</text>
  </g>
  
  <text x="700" y="1360" text-anchor="middle" class="copyright">© 2026 Apex Scaffold Team | Audit Log Async Batch Sequence Diagram</text>
</svg>
