<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300">
  <defs>
    <style>
      .title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #475569; }
      .section-title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
      .label { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #0f172a; }
      .small-label { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #475569; }
      .code { font-family: "Courier New", monospace; font-size: 12px; fill: #0f172a; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4f46e5" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#059669" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="800" y="40" text-anchor="middle" class="title">SPI插件扩展架构图 (SPI Plugin Architecture)</text>
  <text x="800" y="65" text-anchor="middle" class="subtitle">基于 Java ServiceLoader 实现存储后端动态扩展</text>

  <!-- 第一层:应用层 -->
  <text x="50" y="110" class="section-title">1️⃣ 应用层 (Application Layer)</text>

  <rect x="100" y="130" width="1400" height="100" rx="8" fill="#f0f9ff" stroke="#0891b2" stroke-width="2"/>

  <!-- 业务服务 -->
  <rect x="200" y="160" width="480" height="50" rx="6" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="440" y="185" text-anchor="middle" class="label" font-weight="bold">业务服务 (Service Layer)</text>
  <text x="220" y="200" class="code">storageService.upload(file) → 调用统一存储接口</text>

  <!-- 箭头 -->
  <line x1="680" y1="185" x2="780" y2="185" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 存储服务 -->
  <rect x="780" y="160" width="480" height="50" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="1020" y="185" text-anchor="middle" class="label" font-weight="bold">统一存储服务</text>
  <text x="800" y="200" class="code">StorageService → 屏蔽底层存储差异,提供统一API</text>

  <!-- 第二层:服务提供者管理 -->
  <text x="50" y="270" class="section-title">2️⃣ 服务提供者管理 (Provider Manager)</text>

  <rect x="100" y="290" width="1400" height="140" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
  <text x="800" y="320" text-anchor="middle" class="section-title">StorageServiceProvider (Spring Bean)</text>

  <!-- 初始化 -->
  <rect x="150" y="340" width="300" height="70" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="300" y="365" text-anchor="middle" class="label" font-weight="bold">初始化流程</text>
  <text x="170" y="385" class="small-label">1. 读取 storage.default-type 配置</text>
  <text x="170" y="400" class="small-label">2. ServiceLoader 扫描加载实现</text>

  <!-- 路由选择 -->
  <rect x="500" y="340" width="300" height="70" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="650" y="365" text-anchor="middle" class="label" font-weight="bold">路由选择</text>
  <text x="520" y="385" class="small-label">按配置动态选择存储提供者</text>
  <text x="520" y="400" class="small-label">支持运行时切换 (热切换)</text>

  <!-- 生命周期 -->
  <rect x="850" y="340" width="300" height="70" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="1000" y="365" text-anchor="middle" class="label" font-weight="bold">生命周期管理</text>
  <text x="870" y="385" class="small-label">initialize() → 初始化资源</text>
  <text x="870" y="400" class="small-label">shutdown() → 释放资源</text>

  <!-- 扩展点 -->
  <rect x="1200" y="340" width="280" height="70" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1340" y="365" text-anchor="middle" class="label" font-weight="bold">扩展点</text>
  <text x="1220" y="385" class="small-label">支持第三方 JAR 扩展</text>
  <text x="1220" y="400" class="small-label">无需修改核心代码</text>

  <!-- 第三层:SPI接口层 -->
  <text x="50" y="470" class="section-title">3️⃣ SPI 接口层 (Interface)</text>

  <rect x="100" y="490" width="1400" height="160" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="520" text-anchor="middle" class="section-title">StorageProvider (SPI Interface)</text>

  <!-- 接口方法 -->
  <rect x="150" y="540" width="1320" height="90" rx="6" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="565" class="code">public interface StorageProvider {</text>
  <text x="190" y="585" class="code">String getProviderName();                  // 提供者名称 (local/minio/tos/oss/s3...)</text>
  <text x="190" y="605" class="code">void initialize();                         // 初始化资源 (客户端连接等)</text>
  <text x="190" y="625" class="code">Mono&lt;String&gt; upload(InputStream, path);    // 上传文件,返回访问URL</text>

  <!-- 第四层:实现层 -->
  <text x="50" y="690" class="section-title">4️⃣ 实现层 (Implementations)</text>

  <rect x="100" y="710" width="1400" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 内置实现 -->
  <text x="800" y="740" text-anchor="middle" class="label" font-weight="bold">内置实现 (Spring Bean 方式)</text>

  <rect x="150" y="760" width="340" height="120" rx="6" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <text x="320" y="785" text-anchor="middle" class="section-title" fill="#4f46e5">MinIO (内置)</text>
  <text x="170" y="810" class="small-label">• MinioServiceImpl</text>
  <text x="170" y="830" class="small-label">• Spring Bean 注册</text>
  <text x="170" y="850" class="small-label">• storage.minio.enabled=true</text>
  <text x="170" y="870" class="small-label">• S3 兼容协议</text>

  <rect x="530" y="760" width="340" height="120" rx="6" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <text x="700" y="785" text-anchor="middle" class="section-title" fill="#4f46e5">火山引擎 TOS (内置)</text>
  <text x="550" y="810" class="small-label">• VolcEngineStorageServiceImpl</text>
  <text x="550" y="830" class="small-label">• Spring Bean 注册</text>
  <text x="550" y="850" class="small-label">• storage.volcengine.enabled=true</text>
  <text x="550" y="870" class="small-label">• 火山引擎 SDK</text>

  <rect x="910" y="760" width="340" height="120" rx="6" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <text x="1080" y="785" text-anchor="middle" class="section-title" fill="#4f46e5">Local (内置)</text>
  <text x="930" y="810" class="small-label">• LocalStorageServiceImpl</text>
  <text x="930" y="830" class="small-label">• Spring Bean 注册</text>
  <text x="930" y="850" class="small-label">• storage.local.enabled=true</text>
  <text x="930" y="870" class="small-label">• 本地文件系统</text>

  <!-- SPI扩展实现 -->
  <text x="800" y="920" text-anchor="middle" class="label" font-weight="bold">SPI 扩展实现 (第三方 JAR)</text>

  <rect x="150" y="940" width="340" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="965" text-anchor="middle" class="label" fill="#d97706" font-weight="bold">阿里云 OSS</text>
  <text x="170" y="990" class="small-label">• AliOssStorageProvider</text>
  <text x="170" y="1010" class="small-label">• META-INF/services/注册</text>
  <text x="170" y="1025" class="small-label">• 独立 JAR 打包</text>

  <rect x="530" y="940" width="340" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="965" text-anchor="middle" class="label" fill="#d97706" font-weight="bold">AWS S3</text>
  <text x="550" y="990" class="small-label">• AwsS3StorageProvider</text>
  <text x="550" y="1010" class="small-label">• META-INF/services/注册</text>
  <text x="550" y="1025" class="small-label">• 独立 JAR 打包</text>

  <rect x="910" y="940" width="340" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1080" y="965" text-anchor="middle" class="label" fill="#d97706" font-weight="bold">腾讯云 COS</text>
  <text x="930" y="990" class="small-label">• TencentCosStorageProvider</text>
  <text x="930" y="1010" class="small-label">• META-INF/services/注册</text>
  <text x="930" y="1025" class="small-label">• 独立 JAR 打包</text>

  <!-- 第五层:SPI加载机制 -->
  <text x="50" y="1090" class="section-title">5️⃣ SPI 加载机制 (ServiceLoader)</text>

  <rect x="100" y="1110" width="1400" height="140" rx="8" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>

  <!-- 步骤1 -->
  <rect x="150" y="1140" width="300" height="60" rx="6" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="300" y="1165" text-anchor="middle" class="label">1. 扫描 META-INF/services</text>
  <text x="300" y="1185" text-anchor="middle" class="code">StorageProvider 文件</text>

  <!-- 箭头 -->
  <line x1="450" y1="1170" x2="530" y2="1170" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 步骤2 -->
  <rect x="530" y="1140" width="300" height="60" rx="6" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="680" y="1165" text-anchor="middle" class="label">2. 反射实例化</text>
  <text x="680" y="1185" text-anchor="middle" class="code">Class.forName().newInstance()</text>

  <!-- 箭头 -->
  <line x1="830" y1="1170" x2="910" y2="1170" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 步骤3 -->
  <rect x="910" y="1140" width="280" height="60" rx="6" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="1050" y="1165" text-anchor="middle" class="label">3. 初始化</text>
  <text x="1050" y="1185" text-anchor="middle" class="code">provider.initialize()</text>

  <!-- 箭头 -->
  <line x1="1190" y1="1170" x2="1270" y2="1170" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 步骤4 -->
  <rect x="1270" y="1140" width="200" height="60" rx="6" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="1370" y="1165" text-anchor="middle" class="label">4. 注册可用</text>
  <text x="1370" y="1185" text-anchor="middle" class="code">Map&lt;name, provider&gt;</text>

  <!-- 底部说明 -->
  <rect x="50" y="1270" width="1500" height="25" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="1288" text-anchor="middle" class="small-label">⚠️ 扩展步骤: 1.实现 StorageProvider 接口 | 2.创建 META-INF/services/StorageProvider 文件 | 3.打包为 JAR | 4.放入 classpath</text>
</svg>
