<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950">
  <defs>
    <style>
      .title{font:700 32px sans-serif;fill:#0f172a;text-anchor:middle}
      .subtitle{font:500 14px sans-serif;fill:#64748b;text-anchor:middle}
      .st{font:600 15px sans-serif;fill:#0f172a;text-anchor:middle}
      .text{font:400 10px sans-serif;fill:#475569}
      .code{font:400 9px monospace;fill:#2563eb}
      .layer{fill:#eff6ff;stroke:#3b82f6;stroke-width:2;rx:8}
      .comp{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;rx:6}
      .p{fill:#4f46e5;stroke:#4338ca;stroke-width:2;rx:6}
      .s{fill:#059669;stroke:#047857;stroke-width:2;rx:6}
      .w{fill:#d97706;stroke:#b45309;stroke-width:2;rx:6}
      .i{fill:#0891b2;stroke:#0e7490;stroke-width:2;rx:6}
      .arrow{fill:none;stroke:#4f46e5;stroke-width:2.5;marker-end:url(#ah)}
      .darrow{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:5,3;marker-end:url(#ahg)}
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#4f46e5"/></marker>
    <marker id="ahg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#64748b"/></marker>
  </defs>
  <text x="700" y="35" class="title">统一权限认证整体架构</text>
  <text x="700" y="58" class="subtitle">JWT 本地认证 · OAuth2 开放平台 · Keycloak 企业统一认证 · 三合一策略路由</text>

  <!-- Client Layer -->
  <rect x="50" y="90" width="1300" height="120" class="layer"/>
  <text x="700" y="115" class="st">客户端层</text>
  <rect x="70" y="130" width="200" height="70" class="comp"/>
  <text x="170" y="150" class="text" text-anchor="middle" font-weight="600">Web前端 (Vue 3)</text>
  <text x="77" y="167" class="code">/api/v1/** → JWT</text>
  <text x="77" y="180" class="code">/oauth2/authorization/keycloak</text>

  <rect x="290" y="130" width="200" height="70" class="comp"/>
  <text x="390" y="150" class="text" text-anchor="middle" font-weight="600">移动端 (微信小程序)</text>
  <text x="297" y="167" class="code">wx.login → /api/v1/auth</text>
  <text x="297" y="180" class="code">JWT Token</text>

  <rect x="510" y="130" width="200" height="70" class="comp"/>
  <text x="610" y="150" class="text" text-anchor="middle" font-weight="600">第三方应用</text>
  <text x="517" y="167" class="code">/oauth2/authorize</text>
  <text x="517" y="180" class="code">/oauth2/api/** (OAuth2 Token)</text>

  <rect x="730" y="130" width="200" height="70" class="comp"/>
  <text x="830" y="150" class="text" text-anchor="middle" font-weight="600">服务端/微服务</text>
  <text x="737" y="167" class="code">Client Credentials</text>
  <text x="737" y="180" class="code">/oauth2/token → M2M</text>

  <rect x="950" y="130" width="200" height="70" class="comp"/>
  <text x="1050" y="150" class="text" text-anchor="middle" font-weight="600">企业SSO用户</text>
  <text x="957" y="167" class="code">Keycloak OIDC</text>
  <text x="957" y="180" class="code">统一身份认证</text>

  <rect x="1170" y="130" width="160" height="70" class="comp"/>
  <text x="1250" y="150" class="text" text-anchor="middle" font-weight="600">定时任务</text>
  <text x="1177" y="167" class="code">Service Account</text>
  <text x="1177" y="180" class="code">JWT / Client Credentials</text>

  <!-- Spring Security Filter Chain -->
  <rect x="50" y="240" width="1300" height="160" class="i"/>
  <text x="700" y="265" style="font:700 17px sans-serif;fill:#ffffff">Spring Security WebFlux 过滤器链 (SecurityConfig)</text>

  <rect x="70" y="285" width="280" height="100" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="4"/>
  <text x="210" y="305" class="text" text-anchor="middle" font-weight="600">JwtAuthenticationFilter</text>
  <text x="77" y="322" class="code">路径: /api/v1/**, /admin-api/v1/**</text>
  <text x="77" y="334" class="code">Token类型: Apex JWT (RS256)</text>
  <text x="77" y="346" class="code">校验: 签名 + 过期 + 黑名单</text>
  <text x="77" y="358" class="code">权限来源: RBAC角色 + 数据权限</text>
  <text x="77" y="370" class="code">Authorities: ROLE_ADMIN, ROLE_USER</text>

  <rect x="370" y="285" width="280" height="100" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="4"/>
  <text x="510" y="305" class="text" text-anchor="middle" font-weight="600">OAuth2ResourceServerFilter</text>
  <text x="377" y="322" class="code">路径: /oauth2/api/**</text>
  <text x="377" y="334" class="code">Token类型: OAuth2 Access Token</text>
  <text x="377" y="346" class="code">校验: /oauth2/introspect</text>
  <text x="377" y="358" class="code">权限来源: Scope (客户端声明)</text>
  <text x="377" y="370" class="code">Authorities: SCOPE_READ, SCOPE_WRITE</text>

  <rect x="670" y="285" width="280" height="100" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="4"/>
  <text x="810" y="305" class="text" text-anchor="middle" font-weight="600">OAuth2 Client Filter</text>
  <text x="677" y="322" class="code">路径: /oauth2/authorization/**</text>
  <text x="677" y="334" class="code">协议: OIDC (Keycloak)</text>
  <text x="677" y="346" class="code">处理器: OidcAuthSuccessHandler</text>
  <text x="677" y="358" class="code">用户同步: keycloak_sub映射</text>
  <text x="677" y="370" class="code">输出: Apex JWT Token对</text>

  <rect x="970" y="285" width="360" height="100" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" rx="4"/>
  <text x="1150" y="305" class="text" text-anchor="middle" font-weight="600">授权规则 (authorizeExchange)</text>
  <text x="977" y="322" class="code">PUBLIC_PATHS → permitAll (登录/健康检查)</text>
  <text x="977" y="334" class="code">/admin-api/v1/** → hasRole(ADMIN)</text>
  <text x="977" y="346" class="code">auth_paths → authenticated</text>
  <text x="977" y="358" class="code">@RequirePermission 细粒度权限</text>
  <text x="977" y="370" class="code">@DataScope 数据权限过滤</text>

  <!-- Three Auth Strategies -->
  <rect x="50" y="430" width="1300" height="320" class="layer"/>
  <text x="700" y="455" class="st">三种认证策略</text>

  <!-- Strategy 1: JWT -->
  <rect x="70" y="475" width="380" height="260" class="p"/>
  <text x="260" y="500" style="font:700 16px sans-serif;fill:#ffffff" text-anchor="middle">策略1: JWT 本地认证</text>
  <rect x="85" y="515" width="350" height="70" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" rx="4"/>
  <text x="260" y="533" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">适用场景</text>
  <text x="92" y="548" class="code" fill="#e0e7ff">• 普通业务接口 (/api/v1/**)</text>
  <text x="92" y="560" class="code" fill="#e0e7ff">• 管理后台接口 (/admin-api/v1/**)</text>
  <text x="92" y="572" class="code" fill="#e0e7ff">• 微信小程序登录后所有请求</text>

  <rect x="85" y="595" width="350" height="70" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" rx="4"/>
  <text x="260" y="613" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">Token规格</text>
  <text x="92" y="628" class="code" fill="#e0e7ff">格式: JWT (RS256签名)</text>
  <text x="92" y="640" class="code" fill="#e0e7ff">有效期: 2小时 | Refresh: 7天</text>
  <text x="92" y="652" class="code" fill="#e0e7ff">Claims: sub, roles, exp, iat</text>

  <rect x="85" y="675" width="350" height="55" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5" rx="4"/>
  <text x="260" y="693" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">权限体系</text>
  <text x="92" y="708" class="code" fill="#e0e7ff">RBAC: ROLE_* + Permission码 + DataScope</text>

  <!-- Strategy 2: OAuth2 -->
  <rect x="470" y="475" width="380" height="260" class="s"/>
  <text x="660" y="500" style="font:700 16px sans-serif;fill:#ffffff" text-anchor="middle">策略2: OAuth2 开放平台</text>
  <rect x="485" y="515" width="350" height="70" fill="#059669" stroke="#047857" stroke-width="1.5" rx="4"/>
  <text x="660" y="533" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">适用场景</text>
  <text x="492" y="548" class="code" fill="#d1fae5">• 开放平台API (/oauth2/api/**)</text>
  <text x="492" y="560" class="code" fill="#d1fae5">• 第三方应用接入</text>
  <text x="492" y="572" class="code" fill="#d1fae5">• 服务间M2M调用</text>

  <rect x="485" y="595" width="350" height="70" fill="#059669" stroke="#047857" stroke-width="1.5" rx="4"/>
  <text x="660" y="613" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">Token规格</text>
  <text x="492" y="628" class="code" fill="#d1fae5">Access: JWT (RS256) 2小时</text>
  <text x="492" y="640" class="code" fill="#d1fae5">Refresh: UUID 7天 (一次性)</text>
  <text x="492" y="652" class="code" fill="#d1fae5">授权模式: code+PKCE / client_credentials</text>

  <rect x="485" y="675" width="350" height="55" fill="#059669" stroke="#047857" stroke-width="1.5" rx="4"/>
  <text x="660" y="693" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">权限体系</text>
  <text x="492" y="708" class="code" fill="#d1fae5">Scope: SCOPE_READ / SCOPE_WRITE / SCOPE_ADMIN</text>

  <!-- Strategy 3: Keycloak -->
  <rect x="870" y="475" width="460" height="260" class="w"/>
  <text x="1100" y="500" style="font:700 16px sans-serif;fill:#ffffff" text-anchor="middle">策略3: Keycloak OIDC 企业统一认证</text>
  <rect x="885" y="515" width="430" height="70" fill="#d97706" stroke="#b45309" stroke-width="1.5" rx="4"/>
  <text x="1100" y="533" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">适用场景</text>
  <text x="892" y="548" class="code" fill="#fef3c7">• 企业SSO (多个应用统一登录)</text>
  <text x="892" y="560" class="code" fill="#fef3c7">• 已有Keycloak/AD/LDAP用户池</text>
  <text x="892" y="572" class="code" fill="#fef3c7">• 社交登录 (GitHub/Google)</text>

  <rect x="885" y="595" width="430" height="70" fill="#d97706" stroke="#b45309" stroke-width="1.5" rx="4"/>
  <text x="1100" y="613" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">Token规格</text>
  <text x="892" y="628" class="code" fill="#fef3c7">Keycloak ID Token → 验证身份</text>
  <text x="892" y="640" class="code" fill="#fef3c7">转换为 Apex JWT (2h) + Refresh (7d)</text>
  <text x="892" y="652" class="code" fill="#fef3c7">业务API使用Apex JWT,不用ID Token</text>

  <rect x="885" y="675" width="430" height="55" fill="#d97706" stroke="#b45309" stroke-width="1.5" rx="4"/>
  <text x="1100" y="693" class="text" fill="#ffffff" text-anchor="middle" font-weight="600">权限体系</text>
  <text x="892" y="708" class="code" fill="#fef3c7">Keycloak Role → Apex RBAC Role (映射表)</text>

  <!-- Routing Strategy Table -->
  <rect x="50" y="780" width="1300" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  <text x="700" y="803" class="st">路由策略表 (按路径前缀选择认证方式)</text>

  <rect x="70" y="820" width="300" height="100" class="comp"/>
  <text x="220" y="838" class="text" text-anchor="middle" font-weight="600">/api/v1/** &amp; /admin-api/v1/**</text>
  <text x="77" y="855" class="code">认证: JwtAuthenticationFilter</text>
  <text x="77" y="867" class="code">Token: Apex JWT (本地生成)</text>
  <text x="77" y="879" class="code">权限: RBAC + 数据权限</text>
  <text x="77" y="891" class="code">用途: 业务接口 + 管理后台</text>

  <rect x="390" y="820" width="300" height="100" class="comp"/>
  <text x="540" y="838" class="text" text-anchor="middle" font-weight="600">/oauth2/api/**</text>
  <text x="397" y="855" class="code">认证: OAuth2ResourceServerFilter</text>
  <text x="397" y="867" class="code">Token: OAuth2 Access Token</text>
  <text x="397" y="879" class="code">权限: Scope (SCOPE_*)</text>
  <text x="397" y="891" class="code">用途: 开放平台API</text>

  <rect x="710" y="820" width="300" height="100" class="comp"/>
  <text x="860" y="838" class="text" text-anchor="middle" font-weight="600">/oauth2/authorization/keycloak</text>
  <text x="717" y="855" class="code">认证: OAuth2 Client Filter</text>
  <text x="717" y="867" class="code">协议: OIDC (Keycloak)</text>
  <text x="717" y="879" class="code">输出: Apex JWT Token对</text>
  <text x="717" y="891" class="code">用途: 企业SSO登录入口</text>

  <rect x="1030" y="820" width="300" height="100" class="comp"/>
  <text x="1180" y="838" class="text" text-anchor="middle" font-weight="600">/api/v1/auth/** (公开)</text>
  <text x="1037" y="855" class="code">认证: 无需认证 (permitAll)</text>
  <text x="1037" y="867" class="code">用途: 登录/注册/刷新Token</text>
  <text x="1037" y="879" class="code">登录方式: 密码/微信/短信/一键</text>
  <text x="1037" y="891" class="code">返回: Apex JWT + Refresh Token</text>

  <text x="700" y="940" class="code" text-anchor="middle">© 2026 Apex Team · 统一权限认证整体架构 v3.0</text>
</svg>
