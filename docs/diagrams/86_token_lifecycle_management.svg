<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Token 全生命周期管理流程</dc:title>
        <dc:creator>Apex Team</dc:creator>
        <dc:date>2026-09-25</dc:date>
        <dc:version>1.0</dc:version>
        <dc:description>展示JWT Token从签发、验证、刷新、撤销到轮转的完整生命周期管理</dc:description>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <style>
      .title-main {
        font: 700 34px system-ui, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .title-version {
        font: 500 14px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
      .phase-title {
        font: 600 20px system-ui, sans-serif;
        fill: #ffffff;
      }
      .step-title {
        font: 600 15px system-ui, sans-serif;
        fill: #0f172a;
      }
      .step-desc {
        font: 400 12px system-ui, sans-serif;
        fill: #475569;
      }
      .code-label {
        font: 500 11px 'SF Mono', monospace;
        fill: #2563eb;
      }
      .time-label {
        font: 600 11px system-ui, sans-serif;
        fill: #dc2626;
      }
      .status-label {
        font: 600 10px system-ui, sans-serif;
        fill: #ffffff;
        text-anchor: middle;
      }
      .arrow-label {
        font: 500 11px system-ui, sans-serif;
        fill: #64748b;
        text-anchor: middle;
      }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1600" height="1200" fill="#ffffff"/>

  <text x="800" y="45" class="title-main">JWT Token 全生命周期管理流程</text>
  <text x="800" y="70" class="title-version">签发 → 验证 → 刷新 → 撤销 → 轮转 · Access Token (15分钟) + Refresh Token (7天) · v1.0</text>

  <!-- Phase 1: Token 签发 -->
  <g id="phase-1-issuance">
    <rect x="60" y="110" width="480" height="200" rx="10" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
    <rect x="60" y="110" width="480" height="45" rx="10" fill="#3b82f6"/>
    <text x="80" y="140" class="phase-title">阶段 1: Token 签发</text>

    <rect x="80" y="175" width="440" height="120" rx="6" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="100" y="198" class="step-title">1. 用户登录</text>
    <text x="100" y="218" class="step-desc">POST /auth/v1/login</text>
    <text x="100" y="235" class="code-label">{"username": "admin", "password": "***", "tenantId": "default"}</text>
    
    <text x="100" y="260" class="step-title">2. 验证凭证</text>
    <text x="100" y="277" class="step-desc">• BCrypt 验证密码</text>
    <text x="100" y="290" class="step-desc">• 检查账户状态(启用/锁定)</text>

    <rect x="350" y="250" width="150" height="35" rx="4" fill="#10b981"/>
    <text x="425" y="272" class="status-label">验证成功 ✓</text>
  </g>

  <line x1="300" y1="310" x2="300" y2="345" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="320" y="332" class="arrow-label">生成Token</text>

  <g id="phase-1-generate">
    <rect x="80" y="355" width="440" height="180" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="380" class="step-title">3. 生成 Token Pair</text>
    
    <rect x="100" y="395" width="400" height="65" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="120" y="415" class="step-desc">Access Token (访问令牌)</text>
    <text x="120" y="432" class="code-label">• 有效期: 15 分钟</text>
    <text x="120" y="447" class="code-label">• 用途: API 调用鉴权</text>
    
    <rect x="100" y="470" width="400" height="55" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="120" y="490" class="step-desc">Refresh Token (刷新令牌)</text>
    <text x="120" y="507" class="code-label">• 有效期: 7 天</text>
    <text x="120" y="520" class="code-label">• 用途: 刷新 Access Token</text>
  </g>

  <!-- Phase 2: Token 验证 -->
  <g id="phase-2-validation">
    <rect x="580" y="110" width="480" height="425" rx="10" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2"/>
    <rect x="580" y="110" width="480" height="45" rx="10" fill="#10b981"/>
    <text x="600" y="140" class="phase-title">阶段 2: Token 验证</text>

    <rect x="600" y="175" width="440" height="90" rx="6" fill="#ffffff" stroke="#d1fae5" stroke-width="2"/>
    <text x="620" y="198" class="step-title">4. API 调用</text>
    <text x="620" y="218" class="step-desc">GET /api/users/profile</text>
    <text x="620" y="235" class="code-label">Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5...</text>
    <text x="620" y="255" class="step-desc">请求头携带 Access Token</text>

    <line x1="820" y1="265" x2="820" y2="290" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="600" y="300" width="440" height="220" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="620" y="323" class="step-title">5. Token 验证流程</text>
    
    <text x="620" y="345" class="step-desc">① 签名验证 (HMAC-SHA256)</text>
    <text x="640" y="362" class="code-label">验证 Token 未被篡改</text>
    
    <text x="620" y="382" class="step-desc">② 有效期检查</text>
    <text x="640" y="399" class="code-label">当前时间 &lt; exp (过期时间)</text>
    
    <text x="620" y="419" class="step-desc">③ 黑名单检查</text>
    <text x="640" y="436" class="code-label">Redis: NOT EXISTS blacklist:{jti}</text>
    
    <text x="620" y="456" class="step-desc">④ 权限验证</text>
    <text x="640" y="473" class="code-label">检查用户角色和资源权限</text>

    <rect x="850" y="490" width="170" height="25" rx="4" fill="#10b981"/>
    <text x="935" y="508" class="status-label">验证通过 ✓</text>
  </g>

  <!-- Phase 3: Token 刷新 -->
  <g id="phase-3-refresh">
    <rect x="1100" y="110" width="440" height="310" rx="10" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2"/>
    <rect x="1100" y="110" width="440" height="45" rx="10" fill="#f59e0b"/>
    <text x="1120" y="140" class="phase-title">阶段 3: Token 刷新</text>

    <rect x="1120" y="175" width="400" height="75" rx="6" fill="#ffffff" stroke="#fef3c7" stroke-width="2"/>
    <text x="1140" y="198" class="step-title">6. Access Token 过期</text>
    <text x="1140" y="218" class="time-label">⏱ 15 分钟后过期</text>
    <text x="1140" y="238" class="step-desc">客户端收到 401 Unauthorized 响应</text>

    <line x1="1320" y1="250" x2="1320" y2="275" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="1120" y="285" width="400" height="120" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1140" y="308" class="step-title">7. 使用 Refresh Token</text>
    <text x="1140" y="328" class="step-desc">POST /auth/v1/refresh</text>
    <text x="1140" y="345" class="code-label">{"refreshToken": "eyJhbGc..."}</text>
    
    <text x="1140" y="370" class="step-desc">验证 Refresh Token 有效性</text>
    <text x="1140" y="387" class="step-desc">签发新的 Access Token (15分钟)</text>

    <rect x="1300" y="365" width="200" height="25" rx="4" fill="#10b981"/>
    <text x="1400" y="383" class="status-label">刷新成功 ✓</text>
  </g>

  <!-- Phase 4: Token 撤销 -->
  <g id="phase-4-revocation">
    <rect x="60" y="580" width="480" height="230" rx="10" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="2"/>
    <rect x="60" y="580" width="480" height="45" rx="10" fill="#ef4444"/>
    <text x="80" y="610" class="phase-title">阶段 4: Token 撤销</text>

    <rect x="80" y="645" width="460" height="150" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="668" class="step-title">8. Token 撤销场景</text>
    
    <text x="100" y="690" class="step-desc">① 用户主动登出</text>
    <text x="120" y="707" class="code-label">POST /auth/v1/logout</text>
    
    <text x="100" y="727" class="step-desc">② 管理员强制下线</text>
    <text x="120" y="744" class="code-label">POST /admin/sessions/{userId}/revoke</text>
    
    <text x="100" y="764" class="step-desc">③ 安全事件触发</text>
    <text x="120" y="781" class="code-label">异常登录/密码修改/权限变更</text>

    <rect x="320" y="655" width="200" height="130" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="340" y="678" class="step-desc">Token 黑名单机制</text>
    <text x="340" y="700" class="code-label">Redis SET</text>
    <text x="340" y="717" class="code-label">blacklist:{jti}</text>
    <text x="340" y="734" class="code-label">TTL = 剩余有效期</text>
    <text x="340" y="758" class="step-desc">JTI: JWT ID 唯一标识</text>
    <text x="340" y="775" class="time-label">自动过期清理</text>
  </g>

  <!-- Phase 5: Token 轮转 -->
  <g id="phase-5-rotation">
    <rect x="580" y="580" width="480" height="230" rx="10" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="580" y="580" width="480" height="45" rx="10" fill="#8b5cf6"/>
    <text x="600" y="610" class="phase-title">阶段 5: 密钥轮转</text>

    <rect x="600" y="645" width="440" height">150" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="620" y="668" class="step-title">9. JWT 密钥定期轮转</text>
    
    <text x="620" y="690" class="step-desc">轮转策略</text>
    <text x="620" y="707" class="code-label">• 定时任务: 每 90 天轮转一次</text>
    <text x="620" y="724" class="code-label">• 生成新密钥对 (RSA 2048位)</text>
    <text x="620" y="741" class="code-label">• 新Token使用新密钥签发</text>
    <text x="620" y="758" class="code-label">• 旧Token在过期前仍可验证</text>
    
    <text x="620" y="780" class="time-label">⏱ 宽限期: 允许新旧密钥共存 24 小时</text>
  </g>

  <!-- 安全最佳实践 -->
  <g id="security-best-practices">
    <rect x="1100" y="460" width="440" height="350" rx="10" fill="#0891b2" opacity="0.1" stroke="#0891b2" stroke-width="2"/>
    <rect x="1100" y="460" width="440" height="45" rx="10" fill="#0891b2"/>
    <text x="1120" y="490" class="phase-title">安全最佳实践</text>

    <rect x="1120" y="525" width="400" height="270" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="2"/>
    <text x="1140" y="548" class="step-title">10. 安全增强措施</text>
    
    <text x="1140" y="570" class="step-desc">① Refresh Token 单次使用</text>
    <text x="1160" y="587" class="code-label">每次刷新后立即失效旧Token (Token Rotation)</text>
    
    <text x="1140" y="607" class="step-desc">② Token 指纹绑定</text>
    <text x="1160" y="624" class="code-label">绑定 User-Agent + IP 防止 Token 被盗用</text>
    
    <text x="1140" y="644" class="step-desc">③ 设备绑定</text>
    <text x="1160" y="661" class="code-label">Token 与设备ID绑定,防止跨设备滥用</text>
    
    <text x="1140" y="681" class="step-desc">④ 审计日志</text>
    <text x="1160" y="698" class="code-label">记录所有Token签发/验证/撤销事件</text>
    
    <text x="1140" y="718" class="step-desc">⑤ 速率限制</text>
    <text x="1160" y="735" class="code-label">限制Token刷新频率 (1分钟最多3次)</text>
    
    <text x="1140" y="755" class="step-desc">⑥ 异常检测</text>
    <text x="1160" y="772" class="code-label">检测异地登录/并发使用并自动撤销Token</text>
  </g>

  <!-- Token 结构说明 -->
  <g id="token-structure">
    <rect x="60" y="850" width="1000" height="310" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="880" class="step-title">JWT Token 结构详解</text>

    <rect x="80" y="900" width="960" height="245" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    
    <text x="100" y="925" class="step-title">Header (头部)</text>
    <text x="100" y="945" class="code-label">{"alg": "HS256", "typ": "JWT"}</text>
    
    <text x="100" y="975" class="step-title">Payload (载荷)</text>
    <text x="100" y="995" class="code-label">{</text>
    <text x="120" y="1012" class="code-label">"sub": "1",                    // 用户ID</text>
    <text x="120" y="1029" class="code-label">"username": "admin",           // 用户名</text>
    <text x="120" y="1046" class="code-label">"tenantId": "default",         // 租户ID</text>
    <text x="120" y="1063" class="code-label">"roles": ["ADMIN", "USER"],    // 角色列表</text>
    <text x="120" y="1080" class="code-label">"iat": 1711234567,             // 签发时间</text>
    <text x="120" y="1097" class="code-label">"exp": 1711235467,             // 过期时间 (15分钟后)</text>
    <text x="120" y="1114" class="code-label">"jti": "uuid-xxxx-xxxx"        // JWT ID (唯一标识)</text>
    <text x="100" y="1131" class="code-label">}</text>

    <text x="550" y="975" class="step-title">Signature (签名)</text>
    <text x="550" y="995" class="code-label">HMAC-SHA256(</text>
    <text x="570" y="1012" class="code-label">base64UrlEncode(header) + "." +</text>
    <text x="570" y="1029" class="code-label">base64UrlEncode(payload),</text>
    <text x="570" y="1046" class="code-label">secret_key</text>
    <text x="550" y="1063" class="code-label">)</text>
    
    <rect x="550" y="1085" width="470" height="50" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="570" y="1105" class="step-desc">密钥存储: 环境变量 JWT_SECRET</text>
    <text x="570" y="1125" class="step-desc">推荐: 至少 256 位随机字符串</text>
  </g>

  <text x="800" y="1185" class="code-label" text-anchor="middle">© 2026 Apex Team · Token 生命周期管理 v1.0 · 完整94张SVG架构图集合</text>
</svg>
