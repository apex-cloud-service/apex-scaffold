<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980"><defs><style>.t{font:700 28px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.h{font:700 17px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.l{font:13px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}.c{font:11px 'Courier New',monospace;fill:#334155}.b{fill:#fff;stroke:#4f46e5;stroke-width:2;rx:14}.i{fill:#eef2ff;stroke:#6366f1;stroke-width:2;rx:14}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}.w{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.line{stroke:#4f46e5;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#4f46e5"/></marker></defs><rect width="1600" height="980" fill="#f8fafc"/><text x="800" y="48" text-anchor="middle" class="t">部署检查清单流程 (Deployment Checklist Flow)</text><text x="800" y="76" text-anchor="middle" class="s">工作流监控功能从文件校验到端到端验证的上线闭环</text><rect x="70" y="150" width="270" height="160" class="b"/><text x="205" y="190" text-anchor="middle" class="h">1. 文件完整性</text><text x="95" y="230" class="l">后端、前端、文档文件</text><text x="95" y="260" class="l">路由、组件、API 文件存在</text><text x="95" y="290" class="l">依赖版本已确认</text><rect x="430" y="150" width="270" height="160" class="i"/><text x="565" y="190" text-anchor="middle" class="h">2. 后端验证</text><text x="455" y="230" class="c">mvnd clean compile -DskipTests</text><text x="455" y="260" class="c">mvnd spring-boot:run</text><text x="455" y="290" class="l">确认 :8080 与 Swagger</text><path d="M340 230H430" class="line"/><rect x="790" y="150" width="270" height="160" class="g"/><text x="925" y="190" text-anchor="middle" class="h">3. API 可用性</text><text x="815" y="230" class="l">访问 doc.html</text><text x="815" y="260" class="l">验证工作流接口响应</text><text x="815" y="290" class="l">检查健康端点与日志</text><path d="M700 230H790" class="line"/><rect x="1150" y="150" width="300" height="160" class="w"/><text x="1300" y="190" text-anchor="middle" class="h">4. 前端验证</text><text x="1175" y="230" class="c">npm list echarts</text><text x="1175" y="260" class="c">npm run build · npm run dev</text><text x="1175" y="290" class="l">页面加载与路由可达</text><path d="M1060 230H1150" class="line"/><rect x="250" y="500" width="300" height="170" class="i"/><text x="400" y="540" text-anchor="middle" class="h">5. 路由与权限</text><text x="275" y="580" class="l">动态路由组件名一致</text><text x="275" y="610" class="l">菜单权限已登记</text><text x="275" y="640" class="l">角色授权可访问</text><rect x="650" y="500" width="300" height="170" class="b"/><text x="800" y="540" text-anchor="middle" class="h">6. 功能测试</text><text x="675" y="580" class="l">流程定义与实例列表</text><text x="675" y="610" class="l">任务审批与状态更新</text><text x="675" y="640" class="l">异常场景与空数据</text><rect x="1050" y="500" width="300" height="170" class="g"/><text x="1200" y="540" text-anchor="middle" class="h">7. 端到端确认</text><text x="1075" y="580" class="l">准备测试数据</text><text x="1075" y="610" class="l">执行 API 与页面联测</text><text x="1075" y="640" class="l">记录结果并交付</text><path d="M1300 310V400H400V500" class="line"/><path d="M550 585H650" class="line"/><path d="M950 585H1050" class="line"/><path d="M1200 670V760H400V670" class="line"/><text x="800" y="830" text-anchor="middle" class="s">任一项失败：记录现象 → 修复配置或代码 → 从失败步骤重新验证</text><text x="800" y="875" text-anchor="middle" class="s">通过条件：后端、前端、权限、功能和 API 均完成验证</text></svg>
