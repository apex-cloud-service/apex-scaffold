        // 搜索和过滤逻辑
        let currentFilter = 'all';
        let currentResults = documents;

        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const resultCount = document.getElementById('resultCount');
        const filterInfo = document.getElementById('filterInfo');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // 搜索函数
        function search(query) {
            query = query.toLowerCase().trim();
            
            if (!query) {
                return documents;
            }

            return documents.filter(doc => {
                const titleMatch = doc.title.toLowerCase().includes(query);
                const descMatch = doc.description.toLowerCase().includes(query);
                const tagMatch = doc.tags.some(tag => tag.toLowerCase().includes(query));
                const pathMatch = doc.path.toLowerCase().includes(query);
                
                return titleMatch || descMatch || tagMatch || pathMatch;
            });
        }

        // 过滤函数
        function filterByCategory(docs, category) {
            if (category === 'all') {
                return docs;
            }
            return docs.filter(doc => doc.category === category);
        }

        // 高亮关键词
        function highlight(text, query) {
            if (!query) return text;
            
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // 渲染结果
        function render() {
            const query = searchInput.value;
            let results = search(query);
            results = filterByCategory(results, currentFilter);
            currentResults = results;

            // 更新统计
            resultCount.textContent = results.length;

            // 渲染结果
            if (results.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div class="no-results-text">
                            ${query ? '未找到匹配的文档' : '请输入搜索关键词'}
                        </div>
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = results.map(doc => `
                <div class="result-card">
                    <div class="result-header">
                        <div class="result-icon">${doc.icon}</div>
                        <div style="flex: 1;">
                            <div class="result-title">
                                <a href="${doc.path}" target="_blank">
                                    ${highlight(doc.title, query)}
                                </a>
                            </div>
                            <div class="result-path">${doc.path}</div>
                        </div>
                    </div>
                    <div class="result-description">
                        ${highlight(doc.description, query)}
                    </div>
                    <div class="result-tags">
                        ${doc.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 事件监听
        searchInput.addEventListener('input', render);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentFilter = btn.dataset.filter;
                
                const filterNames = {
                    'all': '全部分类',
                    'integration': '集成文档',
                    'frontend': '前端文档',
                    'backend': '后端文档',
                    'operations': '运维文档',
                    'architecture': '架构文档',
                    'security': '安全文档',
                    'testing': '测试文档',
                    'commercial': '商业化文档',
                    'standards': '规范文档',
                    'reports': '报告文档'
                };
                
                filterInfo.textContent = `显示: ${filterNames[currentFilter]}`;
                render();
            });
        });

        // 初始渲染
        render();

        // 快捷键支持
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && e.target !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
