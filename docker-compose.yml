# ============================================================
# Apex Scaffold - Docker Compose 一键编排
# ============================================================
# 服务: apex-scaffold(应用) + mysql + redis；可选 rocketmq（--profile rocketmq）
#
# 用法:
#   # 1) 本地/测试一键栈（默认读取 .env，缺省值即开箱即用）
#   cp .env.example .env        # 可选，按需修改
#   docker compose up -d --build
#   docker compose ps           # 等待 mysql/redis healthy、app 就绪
#
#   # 2) 生产部署（务必先编辑 .env：数据库密码 / JWT_SECRET / 地址）
#   docker compose --env-file .env.prod up -d --build
#
#   # 3) 需要 RocketMQ（企业版消息能力）
#   ROCKETMQ_NAMESERVER=rocketmq-namesrv:9876 APEX_MQ_CONSUMER_ENABLED=true \
#   docker compose --profile rocketmq up -d --build
#
#   # 4) 监控栈（Prometheus + Grafana + Zipkin）另行启动
#   docker compose -f config/monitoring/docker-compose.yml up -d
#
#   # 5) 管理后台前端（可选，需先构建镜像: cd ../apex-admin-web && docker build -t apex-admin-web:latest .）
#   docker compose up -d apex-admin-web
#
# 访问:
#   业务 API    http://localhost:8080    （API 文档 /doc.html）
#   管理端点    http://localhost:8081/actuator/health
#   管理后台    http://localhost          （前端容器 Nginx，反代 /api、/admin-api 到后端）
#   详细文档:   docs/DEPLOYMENT.md
# ============================================================

services:
  # ---------------- 应用服务 ----------------
  apex-scaffold:
    build:
      context: .
      args:
        # 构建档位: basic | standard | enterprise（见 .env BUILD_PROFILE）
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
    image: apex-scaffold:${TAG:-latest}
    # 不固定 container_name，由 compose 按 <项目名>_<服务>_1 自动命名，避免与既有容器冲突
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-8081}:8081"
    environment:
      # 激活 profile：<环境>,<档位>，例如 prod,enterprise / dev,standard
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,enterprise}
      # ---------- JVM 调优参数（默认与 Dockerfile ENV JAVA_OPTS 一致；.env 设置 JAVA_OPTS 可整体覆盖） ----------
      # 堆内存 -Xms512m/-Xmx1024m、G1 回收器、GC 停顿目标、元空间上下限、OOM 堆转储+退出、滚动 GC 日志
      # （GC 日志/堆转储写入容器 /app/logs，需持久化时挂载 volume 或经 logstash/sidecar 采集）
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=20m -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom}
      # ---------- 数据源（dynamic-datasource，应用读取 DB_MASTER_* / DB_SLAVE_*） ----------
      DB_MASTER_URL: ${DB_MASTER_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-apex_data}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      DB_MASTER_USERNAME: ${DB_MASTER_USERNAME:-root}
      DB_MASTER_PASSWORD: ${DB_MASTER_PASSWORD:-apex-root}
      # 从库：prod 配置已启用 slave 数据源，必须注入 DB_SLAVE_*（默认与主库同库，可经 .env 指向真实只读副本）
      DB_SLAVE_URL: ${DB_SLAVE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-apex_data}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      DB_SLAVE_USERNAME: ${DB_SLAVE_USERNAME:-root}
      DB_SLAVE_PASSWORD: ${DB_SLAVE_PASSWORD:-apex-root}
      # ---------- Redis ----------
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # prod 配置强制要求（spring.data.redis.password=${REDIS_PASSWORD}），
      # 与下方 redis 服务的 --requirepass 保持一致；生产务必修改
      REDIS_PASSWORD: ${REDIS_PASSWORD:-apex-redis-password}
      # ---------- JWT（⚠️ 生产必须通过 .env 注入强随机密钥，且 ≥32 字节，否则 prod 启动校验失败） ----------
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars-minimum}
      # ---------- Nacos（本地编排无 Nacos，默认关闭；接入时改 true 并注入地址） ----------
      NACOS_CONFIG_ENABLED: ${NACOS_CONFIG_ENABLED:-false}
      NACOS_DISCOVERY_ENABLED: ${NACOS_DISCOVERY_ENABLED:-false}
      NACOS_REGISTER_ENABLED: ${NACOS_REGISTER_ENABLED:-false}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      # ---------- RocketMQ（公共配置提供本地默认地址；业务能力默认关闭） ----------
      # 启用消息能力：设置 ROCKETMQ_NAMESERVER=rocketmq-namesrv:9876、APEX_MQ_CONSUMER_ENABLED=true，并搭配 --profile rocketmq 启动
      ROCKETMQ_NAMESERVER: ${ROCKETMQ_NAMESERVER:-}
      ROCKETMQ_NAMESRV_ADDR: ${ROCKETMQ_NAMESRV_ADDR:-}
      ROCKETMQ_PRODUCER_GROUP: ${ROCKETMQ_PRODUCER_GROUP:-apex-producer-group}
      ROCKETMQ_ACCESS_KEY: ${ROCKETMQ_ACCESS_KEY:-}
      ROCKETMQ_SECRET_KEY: ${ROCKETMQ_SECRET_KEY:-}
      APEX_MQ_CONSUMER_ENABLED: ${APEX_MQ_CONSUMER_ENABLED:-false}
      APEX_MQ_DLQ_ENABLED: ${APEX_MQ_DLQ_ENABLED:-false}
      APEX_MQ_DOMAIN_EVENT_ENABLED: ${APEX_MQ_DOMAIN_EVENT_ENABLED:-false}
      APEX_MQ_DOMAIN_EVENT_TOPIC: ${APEX_MQ_DOMAIN_EVENT_TOPIC:-apex-domain-event}
      MQ_IDEMPOTENT_TTL_MINUTES: ${MQ_IDEMPOTENT_TTL_MINUTES:-30}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-120}
      OUTBOX_PARALLELISM: ${OUTBOX_PARALLELISM:-4}
      OUTBOX_RETENTION_ENABLED: ${OUTBOX_RETENTION_ENABLED:-true}
      OUTBOX_RETENTION_DELIVERED_HOURS: ${OUTBOX_RETENTION_DELIVERED_HOURS:-168}
      OUTBOX_RETENTION_DEAD_DAYS: ${OUTBOX_RETENTION_DEAD_DAYS:-30}
      OUTBOX_RETENTION_BATCH_SIZE: ${OUTBOX_RETENTION_BATCH_SIZE:-5000}
      # ---------- License（商业授权，可选；留空使用随包基础版） ----------
      APEX_LICENSE_FILE: ${APEX_LICENSE_FILE:-}
      # ---------- 文件上传（prod 强制校验：开启上传必须同时开启百度云图片审核） ----------
      FILE_UPLOAD_ENABLED: ${FILE_UPLOAD_ENABLED:-false}
      # ---------- 管理端口监听 0.0.0.0（供 Prometheus 抓取 /actuator/prometheus） ----------
      MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
      # ---------- Meilisearch（全文搜索） ----------
      MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-true}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-masterKey}
      # ---------- Loki（运行日志查询） ----------
      LOKI_ENABLED: ${LOKI_ENABLED:-true}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      # ---------- Grafana（日志查询跳转） ----------
      GRAFANA_ENABLED: ${GRAFANA_ENABLED:-false}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
      # ---------- 时区 ----------
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-apex-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apex_data}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 暴露给宿主机便于运维；生产可通过 MYSQL_PORT 改映射或注释掉
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-apex-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-apex-redis-password}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Meilisearch（全文搜索引擎） ----------------
  # 轻量级搜索引擎，用于系统管理数据（用户/角色/菜单/部门/字典/配置）全文索引
  # CJK 支持好，内存占用比 Elasticsearch 低 80%
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      # Master Key：开发环境默认值，生产必须通过 MEILI_MASTER_KEY 注入随机密钥（≥16字符）
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      # 运行环境：development（允许无 Master Key）/ production（强制 Master Key）
      MEILI_ENV: ${MEILI_ENV:-development}
      # 数据持久化路径
      MEILI_DB_PATH: /meili_data
      # 时区
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Loki（日志聚合与查询） ----------------
  # Grafana Loki 轻量级日志系统，比 ELK 资源消耗降低 80%
  # 标签索引 + 全文扫描架构，专为云原生应用设计
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Alloy（日志采集器） ----------------
  # Grafana Alloy：新一代可观测性数据采集器，统一采集日志/指标/trace
  # 替代 Logstash，配置简单，资源占用低
  alloy:
    image: grafana/alloy:v1.0.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./config/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # 挂载应用日志目录（只读），Alloy 读取 JSON 日志文件
      - ./logs:/var/log/apex-scaffold:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- RocketMQ（可选：docker compose --profile rocketmq up -d） ----------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    # mkdir 确保 GC 日志目录存在（镜像默认无 /home/rocketmq/logs）
    command:
      - /bin/sh
      - -c
      - mkdir -p /home/rocketmq/logs && exec sh mqnamesrv
    environment:
      HEAP_OPTS: "-Xms256m -Xmx512m -Xmn128m"
      # JVM 调优（JDK8 语法；JAVA_OPT_EXT 追加在末尾，覆盖默认 /dev/shm GC 日志）：
      #   ⚠️ runserver.sh 强制 CMS 回收器（JDK8），故不传 G1（G1+CMS 共存会启动崩溃）；
      #   元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m
      JAVA_OPT_EXT: "-XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/rocketmq/logs/rmq_namesrv_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xloggc:/home/rocketmq/logs/rmq_namesrv_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m -Dfile.encoding=UTF-8"
    ports:
      - "9876:9876"
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Apex Admin Web（前端管理后台，可选） ----------------
  apex-admin-web:
    # 镜像需预先构建（前端为独立仓库，compose 无法引用仓库外 build context）：
    #   cd ../apex-admin-web && docker build -t apex-admin-web:${TAG:-latest} .
    image: apex-admin-web:${TAG:-latest}
    container_name: apex-admin-web
    environment:
      # 反代后端：同 compose 网络内按服务名访问 apex-scaffold:8080
      API_PROXY_PASS: ${API_PROXY_PASS:-http://apex-scaffold:8080}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_PORT:-80}:80"
    # apex-scaffold 无 healthcheck，故用 service_started；Nginx 就绪后反代自然可用
    depends_on:
      apex-scaffold:
        condition: service_started
    restart: unless-stopped
    networks:
      - apex-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    command:
      - /bin/sh
      - -c
      - mkdir -p /home/rocketmq/logs && exec sh mqbroker -n rocketmq-namesrv:9876
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      HEAP_OPTS: "-Xms512m -Xmx1g -Xmn256m"
      # JVM 调优（JDK8 语法；runbroker.sh 已含 G1）：
      #   200ms 停顿；元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m
      JAVA_OPT_EXT: "-XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/rocketmq/logs/rmq_broker_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xloggc:/home/rocketmq/logs/rmq_broker_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m -Dfile.encoding=UTF-8"
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    restart: unless-stopped
    networks:
      - apex-network

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:
  loki-data:
  alloy-data:

networks:
  apex-network:
    driver: bridge
