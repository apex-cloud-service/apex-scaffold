# ============================================================
# Apex Scaffold - Docker Compose 一键编排
# ============================================================
# 服务: apex-scaffold(应用) + mysql + redis；可选 rocketmq（--profile rocketmq）
#
# 用法:
#   # 1) 本地/测试一键栈（默认读取 .env，缺省值即开箱即用）
#   cp .env.example .env        # 可选，按需修改
#   docker compose up -d --build
#   docker compose ps           # 等待 mysql/redis healthy、app 就绪
#
#   # 2) 生产部署（务必先编辑 .env：数据库密码 / JWT_SECRET / 地址）
#   docker compose --env-file .env.prod up -d --build
#
#   # 3) 需要 RocketMQ（企业版消息能力）
#   docker compose --profile rocketmq up -d --build \
#     -e ROCKETMQ_NAMESERVER=rocketmq-namesrv:9876 -e APEX_MQ_CONSUMER_ENABLED=true
#
#   # 4) 监控栈（Prometheus + Grafana + Zipkin）另行启动
#   docker compose -f config/monitoring/docker-compose.yml up -d
#
# 访问:
#   业务 API    http://localhost:8080    （API 文档 /doc.html）
#   管理端点    http://localhost:8081/actuator/health
#   详细文档:   docs/DEPLOYMENT.md
# ============================================================

services:
  # ---------------- 应用服务 ----------------
  apex-scaffold:
    build:
      context: .
      args:
        # 构建档位: basic | standard | enterprise（见 .env BUILD_PROFILE）
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
    image: apex-scaffold:${TAG:-latest}
    # 不固定 container_name，由 compose 按 <项目名>_<服务>_1 自动命名，避免与既有容器冲突
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-8081}:8081"
    environment:
      # 激活 profile：<环境>,<档位>，例如 prod,enterprise / dev,standard
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,enterprise}
      # ---------- 数据源（dynamic-datasource，应用读取 DB_MASTER_*） ----------
      DB_MASTER_URL: ${DB_MASTER_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-apex_data}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      DB_MASTER_USERNAME: ${DB_MASTER_USERNAME:-root}
      DB_MASTER_PASSWORD: ${DB_MASTER_PASSWORD:-apex-root}
      # ---------- Redis ----------
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # prod 配置强制要求（spring.data.redis.password=${REDIS_PASSWORD}），
      # 与下方 redis 服务的 --requirepass 保持一致；生产务必修改
      REDIS_PASSWORD: ${REDIS_PASSWORD:-apex-redis-password}
      # ---------- JWT（⚠️ 生产必须通过 .env 注入强随机密钥，且 ≥32 字节，否则 prod 启动校验失败） ----------
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32chars-minimum}
      # ---------- Nacos（本地编排无 Nacos，默认关闭；接入时改 true 并注入地址） ----------
      NACOS_CONFIG_ENABLED: ${NACOS_CONFIG_ENABLED:-false}
      NACOS_DISCOVERY_ENABLED: ${NACOS_DISCOVERY_ENABLED:-false}
      NACOS_REGISTER_ENABLED: ${NACOS_REGISTER_ENABLED:-false}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      # ---------- RocketMQ（默认不注入 ROCKETMQ_NAMESERVER → 生产者组件不装配，应用无 MQ 启动） ----------
      # 启用消息能力：.env 设置 ROCKETMQ_NAMESERVER=rocketmq-namesrv:9876 并搭配 --profile rocketmq 启动
      # ROCKETMQ_NAMESERVER: ${ROCKETMQ_NAMESERVER:-}
      APEX_MQ_CONSUMER_ENABLED: ${APEX_MQ_CONSUMER_ENABLED:-false}
      APEX_MQ_DLQ_ENABLED: ${APEX_MQ_DLQ_ENABLED:-false}
      APEX_MQ_DOMAIN_EVENT_ENABLED: ${APEX_MQ_DOMAIN_EVENT_ENABLED:-false}
      # ---------- License（商业授权，可选；留空使用随包基础版） ----------
      APEX_LICENSE_FILE: ${APEX_LICENSE_FILE:-}
      # ---------- 文件上传（prod 强制校验：开启上传必须同时开启百度云图片审核） ----------
      FILE_UPLOAD_ENABLED: ${FILE_UPLOAD_ENABLED:-false}
      # ---------- 管理端口监听 0.0.0.0（供 Prometheus 抓取 /actuator/prometheus） ----------
      MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
      # ---------- 时区 ----------
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-apex-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apex_data}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 暴露给宿主机便于运维；生产可通过 MYSQL_PORT 改映射或注释掉
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-apex-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-apex-redis-password}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- RocketMQ（可选：docker compose --profile rocketmq up -d） ----------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m"
    ports:
      - "9876:9876"
    restart: unless-stopped
    networks:
      - apex-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    command: sh mqbroker -n rocketmq-namesrv:9876
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx1g -Xmn256m"
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    restart: unless-stopped
    networks:
      - apex-network

volumes:
  mysql-data:
  redis-data:

networks:
  apex-network:
    driver: bridge
