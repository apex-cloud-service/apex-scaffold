version: '3.8'

services:
  apex-scaffold:
    build: .
    container_name: apex-scaffold
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # ⚠️ 生产环境必须通过 .env 或系统环境变量设置强随机 JWT_SECRET，
      #    默认值仅用于本地快速体验。
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/apex_scaffold?useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      # ⚠️ 生产环境必须修改数据库密码（.env: MYSQL_ROOT_PASSWORD）
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: apex-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=apex_scaffold
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apex-network

  redis:
    image: redis:7-alpine
    container_name: apex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apex-network

volumes:
  mysql-data:
  redis-data:

networks:
  apex-network:
    driver: bridge
