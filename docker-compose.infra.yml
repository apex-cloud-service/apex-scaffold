# ============================================================
# Apex Scaffold - 本地基础设施一键编排（所有中间件）
# ============================================================
# 组件: MySQL / Redis / Nacos / RocketMQ(Namesrv+Broker) /
#       Sentinel Dashboard / Zipkin / Prometheus / Grafana / Blackbox
#
# 用法:
#   docker compose -f docker-compose.infra.yml up -d          # 一键启动全部
#   docker compose -f docker-compose.infra.yml ps             # 查看状态
#   docker compose -f docker-compose.infra.yml logs -f <svc>  # 查看某组件日志
#   docker compose -f docker-compose.infra.yml down           # 停止（保留数据卷）
#   docker compose -f docker-compose.infra.yml down -v        # 停止并清数据（⚠️ 数据丢失）
#
# 访问入口:
#   MySQL    localhost:3306   (root / apex-root，库 apex_data、apex_test)
#   Redis    localhost:6379   (无密码，AOF 持久化)
#   Nacos    http://localhost:18848/nacos  (nacos / nacos；本机 8848 已被占用故映射 18848)
#   RocketMQ localhost:9876 (Namesrv) / 10911 (Broker)
#   Sentinel http://localhost:8858        (sentinel / sentinel)
#   Zipkin   http://localhost:9411
#   Prometheus http://localhost:9090
#   Grafana  http://localhost:3000        (admin / admin)
#
# 说明:
#   - 应用本地开发（java -jar）直接使用上述地址，dev 配置默认值即匹配（127.0.0.1）。
#   - 监控组件配置来自 config/monitoring/（prometheus.yml / grafana / alert-rules.yml）。
#   - JVM 调优：Nacos/RocketMQ/Sentinel/Zipkin 均已内置生产级 JVM 参数
#     （G1 回收器/GC 停顿目标/元空间/OOM 堆转储+退出/滚动 GC 日志），与 Apex 应用同思路，
#     详见各服务注释与 docs/DEPLOYMENT.md §4.5；注意组件镜像多为 JDK8，GC 日志用 -Xloggc 语法。
#   - 详细说明见 docs/DEPLOYMENT.md 第 6.5 节「本地基础设施一键部署」。
# ============================================================

services:
  # ---------------- MySQL 8.0 ----------------
  mysql:
    image: mysql:8.0
    container_name: apex-infra-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-apex-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apex_data}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-apex-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- Redis 7 ----------------
  redis:
    image: redis:7-alpine
    container_name: apex-infra-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- Nacos（配置中心 + 服务发现） ----------------
  # ⚠️ 本机 8848/9848 已被其他项目 Nacos 占用，故映射 18848/19848；
  #    如 8848 空闲可改为 "8848:8848" + "9848:9848"。
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: apex-infra-nacos
    environment:
      MODE: standalone
      # 鉴权（2.3.x 默认开启，需 ≥32 位密钥）
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-ApexScaffoldLocalSecretKey01234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: apex-scaffold-serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: apex-scaffold-serverIdentity
      # 堆内存（standalone 模式经 JVM_X* 注入，-Xms/-Xmx/-Xmn）
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      # JVM 调优（JDK8 语法；docker-startup.sh 将 JAVA_OPT 置于 CMS 之前，故不传 G1，
      # 镜像脚本 standalone 分支强制 CMS 回收器）：
      #   -XX:MetaspaceSize/-XX:MaxMetaspaceSize  元空间 256m/512m
      #   -XX:+HeapDumpOnOutOfMemoryError + ExitOnOutOfMemoryError  OOM 转储 + 退出自愈
      #   -Xloggc + PrintGCDetails + UseGCLogFileRotation  滚动 GC 日志 5×20m（/home/nacos/logs 已挂卷持久化）
      JAVA_OPT: "-XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/nacos/logs/java_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xloggc:/home/nacos/logs/nacos_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m -Dfile.encoding=UTF-8"
      TZ: Asia/Shanghai
    ports:
      - "${NACOS_PORT:-18848}:8848"
      - "${NACOS_GRPC_PORT:-19848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- RocketMQ 5.x（Namesrv + Broker） ----------------
  # ⚠️ 不挂载 store 卷：镜像内 /home/rocketmq/store 不存在，命名卷挂载点归 root 导致
  #    非 root 运行用户 rocketmq 无写权限（broker 启动即崩）；本地测试消息数据不持久化，
  #    生产部署请另行规划（挂载后需先 chown）。
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: apex-infra-rocketmq-namesrv
    # mkdir 确保 GC 日志目录存在（镜像默认无 /home/rocketmq/logs，JVM 打开日志文件不自动建父目录）
    command:
      - /bin/sh
      - -c
      - mkdir -p /home/rocketmq/logs && exec sh mqnamesrv
    environment:
      # 堆内存（镜像 JDK8，runserver.sh 经 HEAP_OPTS 注入）
      HEAP_OPTS: "-Xms256m -Xmx512m -Xmn128m"
      # JVM 调优（JDK8 语法；runserver.sh 将 JAVA_OPT_EXT 追加在末尾，覆盖默认 /dev/shm GC 日志）：
      #   ⚠️ runserver.sh 强制 CMS 回收器（JDK8），故不传 G1（G1+CMS 共存会启动崩溃）；
      #   元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m（/home/rocketmq/logs）
      JAVA_OPT_EXT: "-XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/rocketmq/logs/rmq_namesrv_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xloggc:/home/rocketmq/logs/rmq_namesrv_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m -Dfile.encoding=UTF-8"
    ports:
      - "9876:9876"
    restart: unless-stopped
    networks:
      - apex-infra

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: apex-infra-rocketmq-broker
    command:
      - /bin/sh
      - -c
      - mkdir -p /home/rocketmq/logs && exec sh mqbroker -n rocketmq-namesrv:9876
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # 堆内存（镜像 JDK8，runbroker.sh 经 HEAP_OPTS 注入）
      HEAP_OPTS: "-Xms512m -Xmx1g -Xmn256m"
      # JVM 调优（JDK8 语法；runbroker.sh 已含 G1，JAVA_OPT_EXT 追加在末尾）：
      #   200ms 停顿目标；元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m
      JAVA_OPT_EXT: "-XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/rocketmq/logs/rmq_broker_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xloggc:/home/rocketmq/logs/rmq_broker_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m -Dfile.encoding=UTF-8"
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- Sentinel Dashboard ----------------
  # ⚠️ Docker Hub 无 apache/sentinel-dashboard 官方镜像，使用社区通用镜像（1.8.2，登录 sentinel/sentinel）
  sentinel-dashboard:
    image: ${SENTINEL_IMAGE:-registry.cn-hangzhou.aliyuncs.com/zhengqing/sentinel-dashboard:1.8.2}
    container_name: apex-infra-sentinel
    environment:
      TZ: Asia/Shanghai
    # 镜像 Cmd 为固定 java -jar 命令（不展开 JAVA_OPTS），故整体覆盖 command 注入 JVM 调优参数（JDK8 语法）：
    #   堆 256m/512m；G1 + 200ms 停顿；元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m（/tmp）
    command:
      - /bin/sh
      - -c
      - >
        exec java -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m
        -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/sentinel_heapdump.hprof
        -XX:+ExitOnOutOfMemoryError
        -Xloggc:/tmp/sentinel_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps
        -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m
        -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom
        -Dserver.port=8858 -Dcsp.sentinel.api.port=8719
        -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard
        -jar /app.jar
    ports:
      - "${SENTINEL_PORT:-8858}:8858"
      - "8719:8719"
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- Zipkin（链路追踪） ----------------
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: apex-infra-zipkin
    environment:
      # JVM 调优（镜像 JDK21，统一日志 -Xlog 语法；JAVA_OPTS 整体覆盖镜像默认 -Xms160m -Xmx160m）：
      #   G1 + 200ms 停顿；元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m（/tmp）
      JAVA_OPTS: "-Xms160m -Xmx160m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/zipkin_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xlog:gc*:file=/tmp/zipkin_gc.log:time,uptime,level,tags:filecount=5,filesize=20m -Dfile.encoding=UTF-8"
      TZ: Asia/Shanghai
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- Prometheus（指标采集） ----------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: apex-infra-prometheus
    volumes:
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    extra_hosts:
      # 供抓取宿主机上的本地应用（java -jar 启动在 8081）
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- Grafana（可视化大盘） ----------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: apex-infra-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./config/monitoring/grafana/apex-dashboard.json:/var/lib/grafana/dashboards/apex-dashboard.json:ro
      - ./config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      # ⚠️ 此处 /api/health 是 Grafana 自身 API（与 Apex 应用的 /api/v1/health 无关）
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - apex-infra

  # ---------------- Blackbox Exporter（健康探针） ----------------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: apex-infra-blackbox
    ports:
      - "9115:9115"
    restart: unless-stopped
    networks:
      - apex-infra

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
  prometheus-data:
  grafana-data:

networks:
  apex-infra:
    driver: bridge
