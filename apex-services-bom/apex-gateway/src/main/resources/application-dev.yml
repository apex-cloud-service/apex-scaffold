# ============================================================
# Apex Scaffold - API 网关 开发环境配置
# ============================================================
# 说明：本地开发默认关闭 Nacos（网关以静态 URI 转发到本机单体 8080），
#       避免未启动 Nacos 时应用无法启动。
#
# @author Apex Team
# ============================================================

spring:
  # 本地访问日志落库（Task 4）：指向本机 MySQL 的独立库 apex_gateway
  r2dbc:
    url: ${GATEWAY_DB_URL:r2dbc:mysql://127.0.0.1:3306/apex_gateway?serverTimezone=Asia/Shanghai}
    username: ${GATEWAY_DB_USERNAME:root}
    password: ${GATEWAY_DB_PASSWORD:root}
  cloud:
    nacos:
      config:
        # ❌ 本地开发默认关闭 Nacos 配置中心
        enabled: ${NACOS_CONFIG_ENABLED:false}
      discovery:
        # ❌ 本地开发默认关闭服务注册
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_REGISTER_ENABLED:false}

# 本地路由说明
# 💡 application.yml 中认证域（/auth/v1/**）与工作流域（/api/v1/workflows/**）
#   已默认切换为 lb://apex-*-service，需启用 Nacos 服务发现（或通过 ROUTE_AUTH_URI /
#   ROUTE_WORKFLOW_URI 环境变量临时指回本机单体 http://127.0.0.1:8080）；
#   办公域/文件域/系统域仍默认 http://127.0.0.1:8080，此处无需重复声明。

# ==================== CORS 跨域（开发环境） ====================
# （差异）公共层 allow-all-origins 默认为 false，且不声明 allowed-origins 时会触发
#   CorsGlobalConfig 启动校验失败。开发联调需显式放行前端本机端口，
#   否则浏览器端所有跨域请求会被 CorsWebFilter 拦截。
cors:
  # 明确允许的来源域名（逗号分隔，与主应用 apex-interfaces dev 配置保持一致）
  allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175

# 本地限流放宽，避免自测被限流打断
logging:
  level:
    com.apex.scaffold.gateway: DEBUG
    # 路由调试日志可能输出含一次性 ticket 的握手 URI。
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
    reactor.netty.http.client: INFO
