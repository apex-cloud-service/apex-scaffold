# ============================================================
# Apex Scaffold - 办公服务 basic Profile 配置
# ============================================================
# 【作用】
#   基础版（basic）单机运行配置：使用 H2 内存库替代 MySQL，
#   关闭 Flyway 改用 db/basic-schema.sql 初始化表结构。
# @author Apex Team
# ============================================================

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:office-service;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/basic-schema.sql
  codec:
    # basic 环境内存受限，收窄请求体缓冲
    max-in-memory-size: 16MB

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.apex.scaffold.office: INFO
    com.apex.scaffold.officeservice: INFO
# B7: basic 档多租户行级隔离维持关闭（D09：离线最小档无多租户诉求）
apex:
  tenant:
    enabled: false
