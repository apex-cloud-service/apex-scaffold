# ============================================================
# Apex Scaffold - 工作流服务 basic Profile 配置
# ============================================================
# 【作用】
#   基础版（basic）单机运行配置：使用 H2 内存库替代 MySQL，
#   关闭 Flyway 改用 db/basic-schema.sql 初始化，关闭事务 Outbox。
# @author Apex Team
# ============================================================

spring:
  autoconfigure:
    # basic profile 排除工作流服务不依赖的自动装配组件
    exclude:
      org.redisson.spring.starter.RedissonAutoConfigurationV2,
      com.baomidou.dynamic.datasource.spring.boot.autoconfigure.DynamicDataSourceAutoConfiguration,
      com.apex.scaffold.infrastructure.remote.config.RemoteApiClientConfig
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:workflow-service;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/basic-schema.sql
apex:
  events:
    outbox:
      # basic/H2 环境关闭事务 Outbox：Outbox 存储 SQL 使用 MySQL 方言，
      # H2 MySQL 模式不完全支持，启用会导致事件写入失败。
      enabled: false
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    com.apex.scaffold.workflow: INFO
    com.apex.scaffold.workflowservice: INFO