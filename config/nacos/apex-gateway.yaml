# ============================================================
# Apex Scaffold - Nacos 服务私有配置：apex-gateway.yaml
# ============================================================
# 【作用】
#   Nacos 配置中心「服务私有配置」，仅由 apex-gateway 引用
#   （Data ID: apex-gateway.yaml，Group: DEFAULT_GROUP）。
#   承载网关可热更新的配置：路由规则、灰度策略、JWKS 密钥清单、
#   限流参数、CORS 白名单。发布后无需重启即可生效。
#
# 【与本地文件的关系】
#   application.yml 中的同名项作为「启动兜底默认值」；本文件仅覆盖需要
#   动态调整的部分（路由切流、密钥轮换、灰度放量）。未列出的项沿用本地值。
#
# 【发布方式】
#   见 config/nacos/README.md「四、发布方式」。
#
# 【安全提示】
#   🔒 仅下发公钥（public-key-base64）与 kid；HMAC 对称密钥（hmac-secret）
#      一律经环境变量 JWT_SECRET 注入，禁止写入本文件。
#
# @author Apex Team
# ============================================================

spring:
  cloud:
    gateway:
      # ==================== 路由规则（按 Phase 逐步切流） ====================
      # 💡 未迁移的域继续指向单体 http://127.0.0.1:8080（Phase 1 透明代理）；
      #    迁移完成后改为 lb://apex-xxx-service（见迁移方案 §15）。
      routes:
        # ---- 认证域（Phase 2 切为 apex-auth-service） ----
        # 💡 auth-service 承载 /auth/v1/**、/auth/v2/**（密码找回）、/oauth2/**、/.well-known/**，
        #    以及认证中心管理面：/api/v1/mfa/**、/api/mfa/**、/api/ip-access-control/**、
        #    /api/v1/auth/configs/**、/api/v1/auth/audit-logs/**。
        # ⚠️ /admin-api/v1/auth/**、/admin-api/v1/sso/** 由 system 承载（AuthConfigRouter、SsoAdminRouter），
        #    不得加入本路由；其余 /api/v1/auth/**（Keycloak OIDC 登录等）由 system-domain 兜底。
        - id: auth-domain
          uri: ${ROUTE_AUTH_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/auth/v1/**,/auth/v2/**,/oauth2/**,/.well-known/**,/api/v1/mfa/**,/api/mfa/**,/api/ip-access-control/**,/api/v1/auth/configs/**,/api/v1/auth/audit-logs/**
          filters:
            - name: CircuitBreaker
              args:
                name: authService
                fallbackUri: forward:/__gateway/fallback

        # ---- 工作流域（Phase 3 切为 apex-workflow-service） ----
        - id: workflow-domain
          uri: ${ROUTE_WORKFLOW_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/v1/workflows/**,/api/v2/workflow-definitions/**,/api/workflow/**,/admin-api/v1/workflows/**
          filters:
            - name: CircuitBreaker
              args:
                name: workflowService
                fallbackUri: forward:/__gateway/fallback

        # ---- 办公域（Phase 5 已切为 apex-office-service） ----
        # 💡 可用 ROUTE_OFFICE_URI 环境变量临时指回单体地址以一键回滚。
        # ⚠️ 本文件同样整表覆盖 routes（列表不逐元素合并）：站内信 WebSocket/HTTP 路由
        #    必须在此显式声明并排在 office-domain 之前，否则生产 WS 升级会被 office-domain 抢走。
        # 🔒 生产必须通过环境变量显式指定真实 office 实例地址，勿沿用回环默认值。
        - id: office-message-websocket
          uri: ${ROUTE_OFFICE_WS_URI:ws://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/messages/ws
            - Header=Upgrade, (?i)websocket
        - id: office-message-http
          uri: ${ROUTE_OFFICE_MESSAGE_URI:http://127.0.0.1:8084}
          predicates:
            - Path=/api/v1/messages,/api/v1/messages/**
          filters:
            - name: CircuitBreaker
              args:
                name: officeService
                fallbackUri: forward:/__gateway/fallback
        - id: office-domain
          uri: ${ROUTE_OFFICE_URI:lb://apex-office-service}
          predicates:
            - Path=/api/v1/office/**,/api/v2/office/**,/api/office/**,/api/v1/messages/**,/admin-api/v1/office/**,/admin-api/v1/org/**,/admin-api/v1/message-templates
          filters:
            - name: CircuitBreaker
              args:
                name: officeService
                fallbackUri: forward:/__gateway/fallback

        # ---- 文件域（Phase 4 切为 apex-file-service） ----
        - id: file-domain
          uri: ${ROUTE_FILE_URI:lb://apex-file-service}
          predicates:
            - Path=/api/v1/file/**,/api/v1/files/**,/api/v1/documents/**,/admin-api/v1/documents/**,/admin-api/v1/charts/**,/api/v2/files/**,/api/v2/file-shares/**
          filters:
            - name: CircuitBreaker
              args:
                name: fileService
                fallbackUri: forward:/__gateway/fallback

        # ---- 独立轻量服务：未注册 Nacos，使用固定受信地址 ----
        # ⚠️ 本文件整表覆盖 routes：job/masking 路由必须在此显式声明，否则一经下发即丢失。
        - id: job-domain
          uri: ${ROUTE_JOB_URI:http://127.0.0.1:8095}
          predicates:
            - Path=/admin-api/v1/jobs,/admin-api/v1/jobs/**
          filters:
            - name: CircuitBreaker
              args:
                name: jobService
                fallbackUri: forward:/__gateway/fallback
        - id: masking-domain
          uri: ${ROUTE_MASKING_URI:http://127.0.0.1:8096}
          predicates:
            - Path=/api/v1/masking/**
          filters:
            - name: CircuitBreaker
              args:
                name: maskingService
                fallbackUri: forward:/__gateway/fallback

        # ---- 系统域兜底（Phase 6 收敛为 apex-system-service） ----
        # 💡 /api/v2/platform/** 为平台租户管理端点（PlatformTenantRouter）。
        - id: system-domain
          uri: ${ROUTE_SYSTEM_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/api/v1/**,/api/v2/operations/**,/api/v2/platform/**,/admin-api/v1/**,/health,/actuator/**
          filters:
            - name: CircuitBreaker
              args:
                name: systemService
                fallbackUri: forward:/__gateway/fallback

# ==================== 熔断阈值（Resilience4j 实例） ====================
# ⚠️ 与 application.yml 保持一致：Nacos 的 routes 列表为整表覆盖（列表不逐元素合并），
#    因此必须在此同步下发 CircuitBreaker 过滤器与 resilience4j 实例，
#    否则一旦本文件生效，路由级熔断将被静默丢弃。
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-rate-threshold: 60
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      authService:
        base-config: default
      workflowService:
        base-config: default
      officeService:
        base-config: default
      fileService:
        base-config: default
      systemService:
        base-config: default
      jobService:
        base-config: default
      maskingService:
        base-config: default

# ==================== 网关自定义能力 ====================
apex:
  gateway:
    # ==================== JWKS 验签密钥清单 ====================
    jwks:
      # 按 kid 组织的密钥清单（可 Nacos 热更新，密钥轮换时无需重启网关）。
      # 必须为 YAML 列表，不可用标量字符串占位符。
      # 🔒 hmac-secret 不在此下发，仅经 JWT_SECRET 环境变量注入。
      ks:
        - kid: hmac-legacy
          alg: hmac
        # 示例：新增 RSA 公钥（轮换时启用，双 kid 并存过渡）
        # - kid: rsa-2026-01
        #   alg: rsa256
        #   public-key-base64: "MIIBIjANBgkqh..."
      # 统一认证收口（A2）：远程 JWKS 拉取认证中心轮换公钥，同 kid 覆盖静态条目；
      # 空值表示关闭拉取，仅用上方静态清单与 HMAC 过渡密钥。
      remote-url: ${JWKS_REMOTE_URL:}
      remote-refresh-interval-seconds: ${JWKS_REFRESH_INTERVAL_SECONDS:300}
    # 统一认证收口（A3）：令牌撤销流（认证中心内部撤销增量端点，集群内地址）。
    revocation:
      enabled: ${REVOCATION_FEED_ENABLED:false}
      url: ${REVOCATION_FEED_URL:}
      pull-interval-seconds: ${REVOCATION_PULL_INTERVAL_SECONDS:15}
      lookback-seconds: ${REVOCATION_LOOKBACK_SECONDS:7200}

    # ==================== 全局限流（Redis 分布式令牌桶） ====================
    # ⚠️ 与 application.yml 保持一致：rules 为列表，本文件一旦下发即整表覆盖本地 rules。
    rate-limit:
      # 限流总开关（false 时纯透传）
      enabled: ${RATE_LIMIT_ENABLED:true}
      # 限流算法：token-bucket（令牌桶，默认） | fixed-window（固定窗口计数）
      algorithm: ${RATE_LIMIT_ALGORITHM:token-bucket}
      # 默认桶容量（未命中 rules 时生效）
      default-capacity: ${RATE_LIMIT_CAPACITY:1000}
      # 默认令牌补充速率（令牌/秒）
      default-refill-rate: ${RATE_LIMIT_REFILL_RATE:100}
      # Redis Key 统一前缀（拼接为 {key-prefix}{scope}:{identity}:{path}）
      key-prefix: "apex:gateway:rl:"
      # 固定窗口长度（毫秒，仅 algorithm=fixed-window 使用）
      window-ms: ${RATE_LIMIT_WINDOW_MS:60000}
      # 按资源（Ant 路径通配）覆盖的限流规则，可热更新调整阈值或新增规则
      rules:
        - resource: "/api/v1/workflows/**"
          capacity: 2000
          refill-rate: 200
        - resource: "/api/v1/auth/**"
          capacity: 5000
          refill-rate: 500

# ==================== CORS 跨域（网关统一收敛） ====================
cors:
  # 是否允许所有来源（仅开发联调开启，生产必须 false）
  allow-all-origins: ${CORS_ALLOW_ALL_ORIGINS:false}
  # 明确允许的来源域名（逗号分隔；allow-all-origins=false 时必填）
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# ==================== 灰度发布 ====================
# 三级判定：Header 强制 > 租户白名单 > 用户尾号百分比（迁移方案 §15）
gray:
  # 灰度总开关
  enabled: ${GRAY_ENABLED:false}
  # 用户尾号灰度百分比（0–100），同一用户分桶稳定
  percentage: ${GRAY_PERCENTAGE:0}
  # 强制灰度的租户 ID 白名单（逗号分隔）
  tenant-whitelist: ${GRAY_TENANT_WHITELIST:}
