# ============================================================
# Grafana Loki 配置文件（本地开发/Podman Compose 部署）
# ============================================================
# 
# 【设计目标】
#   轻量级日志聚合系统，替代 ELK 栈，资源消耗降低 80% 以上。
#   专为云原生应用设计，标签索引 + 全文扫描架构。
# 
# 【核心特性】
#   1. 标签索引：仅索引标签（service、level、traceId），全文内容压缩存储
#   2. LogQL 查询：类似 PromQL 的查询语言，支持正则、JSON 解析、聚合
#   3. 多租户支持：通过 X-Scope-OrgID HTTP 头实现租户隔离（本地单租户模式）
#   4. 本地存储：开发环境使用本地文件系统，生产环境建议对象存储（S3/GCS）
# 
# 【存储策略】
#   - 保留期：7 天（满足常规排障需求）
#   - 存储路径：/loki（容器内，映射到 Docker Volume）
#   - 单次查询限制：最大 1000 行，最大时间窗口 1 小时
# 
# 【性能调优】
#   - 单租户模式：禁用多租户认证，降低 HTTP 开销
#   - 内存缓存：Query Frontend 结果缓存，加速重复查询
#   - 压缩存储：Chunks 使用 Snappy 压缩，压缩比约 4:1
# 
# @author Apex Team
# @since 1.3.0
# @see https://grafana.com/docs/loki/latest/configuration/
# ============================================================

# 认证配置
auth_enabled: false  # 单租户模式，禁用认证（多租户模式设为 true）

# HTTP 服务器配置
server:
  http_listen_port: 3100  # Loki HTTP API 端口
  grpc_listen_port: 9096  # Loki gRPC 端口（组件间通信）
  log_level: info         # 日志级别：debug/info/warn/error

# 通用配置
common:
  # 存储路径配置（单进程模式下的统一配置）
  path_prefix: /loki
  
  # 对象存储配置（本地文件系统）
  storage:
    filesystem:
      chunks_directory: /loki/chunks    # Chunks（日志数据）存储目录
      rules_directory: /loki/rules      # 告警规则存储目录（可选）
  
  # 日志保留期配置
  replication_factor: 1  # 副本数（单节点设为 1）
  
  # Ring 配置（单节点模式）
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory  # 单节点使用内存 KV 存储（生产集群使用 consul/etcd）

# Ingester 配置（日志写入组件）
ingester:
  # Chunk 大小和刷盘策略
  chunk_idle_period: 1h       # Chunk 空闲 1 小时后刷盘
  max_chunk_age: 1h           # Chunk 最大存活时间 1 小时
  chunk_target_size: 1048576  # Chunk 目标大小 1MB（1048576 bytes）
  chunk_encoding: snappy      # 压缩算法：snappy（快速） / gzip（高压缩比） / lz4
  
  # WAL（Write-Ahead Log）配置（防止崩溃丢失数据）
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 1GB  # WAL 回放内存上限

  # 生命周期配置
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s  # 关闭前等待时间（单节点设为 0）

# Querier 配置（日志查询组件）
querier:
  # 查询超时和并发限制
  max_concurrent: 20  # 最大并发查询数
  
  # 查询分片配置（并行查询多个 Ingester）
  query_ingesters_within: 3h  # 查询最近 3 小时数据时包含 Ingester（内存数据）

# Query Frontend 配置（查询前端，提供缓存和查询拆分）
query_range:
  # 结果缓存配置（加速重复查询）
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100  # 缓存最大 100MB
        ttl: 1h           # 缓存 TTL 1 小时
  
  # 查询拆分配置（大查询拆分为小查询，提高并行度）

# Schema 配置（定义索引和存储结构）
schema_config:
  configs:
    - from: 2024-01-01  # Schema 生效起始日期
      store: tsdb       # 索引类型：tsdb（Time Series Database，推荐） / boltdb-shipper
      object_store: filesystem  # 对象存储：filesystem（本地） / s3 / gcs / azure
      schema: v13       # Schema 版本（v13 是最新稳定版）
      index:
        prefix: index_  # 索引文件前缀
        period: 24h     # 索引分片周期（每 24 小时一个索引文件）

# 存储配置
storage_config:
  # TSDB Shipper 配置（管理索引文件）
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index  # 活跃索引目录
    cache_location: /loki/tsdb-cache          # 索引缓存目录
    cache_ttl: 24h                            # 缓存 TTL
  
  # 文件系统存储配置
  filesystem:
    directory: /loki/chunks

# Compactor 配置（后台压缩和清理任务）
compactor:
  working_directory: /loki/compactor  # 工作目录
  compaction_interval: 10m            # 压缩间隔（生产环境建议 1h）
  retention_enabled: true             # 启用自动清理过期数据
  delete_request_store: filesystem    # 删除请求存储后端（retention 启用时必填）
  retention_delete_delay: 2h          # 删除延迟（防止查询中删除）
  retention_delete_worker_count: 150  # 删除工作线程数

# Limits 配置（防止滥用和资源耗尽）
limits_config:
  # 写入限制
  ingestion_rate_mb: 10           # 单租户写入速率上限 10 MB/s
  ingestion_burst_size_mb: 20     # 突发写入上限 20 MB
  max_streams_per_user: 10000     # 单租户最大 Streams 数（一个 label 组合对应一个 Stream）
  max_line_size: 256KB            # 单行日志最大大小（超出截断）
  
  # 查询限制
  max_entries_limit_per_query: 5000    # 单次查询最大返回行数（前端限制 1000，此处兜底）
  max_query_length: 721h               # 最大查询时间范围（30 天，超出报错）
  max_query_parallelism: 16            # 单次查询最大并行度
  max_query_series: 500                # 单次查询最大 Series 数
  
  # 标签限制
  max_label_name_length: 1024   # 标签名最大长度
  max_label_value_length: 2048  # 标签值最大长度
  max_label_names_per_series: 30  # 单个 Stream 最大标签数
  
  # Chunk 限制
  max_chunks_per_query: 2000000  # 单次查询最大 Chunks 数
  
  # 保留期配置（必须与 compactor.retention_enabled=true 配合）
  retention_period: 168h  # 日志保留 7 天（168 小时）

# 表管理配置（TSDB 模式下自动管理索引表）
table_manager:
  retention_deletes_enabled: true  # 启用自动删除过期表
  retention_period: 168h           # 表保留 7 天

# 分析配置（可选，用于性能分析）
analytics:
  reporting_enabled: false  # 禁用使用数据上报（隐私保护）
