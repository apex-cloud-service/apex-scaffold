# ================================================================
# Apex Scaffold - 可观测性一键部署栈（Prometheus + Grafana + Zipkin）
# ================================================================
# 用途: 本地/测试环境一键拉起监控与链路追踪全套组件。
# 用法: docker compose -f config/monitoring/docker-compose.yml up -d
# 访问:
#   Grafana    http://localhost:3000   (admin / admin，首次登录提示修改)
#   Prometheus http://localhost:9090
#   Zipkin     http://localhost:9411
# 说明: Apex 应用自身通过 docker-compose.yml 或独立方式启动，
#       管理端口 8081 暴露 /actuator/prometheus 供 Prometheus 抓取；
#       链路采样数据由应用主动上报 trace.zipkin-url（默认 http://localhost:9411）。
# ================================================================

services:
  # ---- Prometheus：指标抓取与告警 ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: apex-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - apex-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    networks:
      - apex-observability

  # ---- Grafana：可视化大盘 ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: apex-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/apex-dashboard.json:/var/lib/grafana/dashboards/apex-dashboard.json:ro
      # 自动置备数据源与大盘（容器启动时执行）
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - apex-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - apex-observability

  # ---- Blackbox Exporter：健康探针（探测应用 /actuator/health） ----
  # 供 ApexHealthCheckDown 告警使用；经 host.docker.internal 访问宿主机应用
  # （Linux 需 Docker 20.10+ 支持 host-gateway）。
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: apex-blackbox-exporter
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9115:9115"
    networks:
      - apex-observability

  # ---- Zipkin：链路追踪后端 ----
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: apex-zipkin
    restart: unless-stopped
    environment:
      # JVM 调优（镜像 JDK21，统一日志 -Xlog 语法；JAVA_OPTS 整体覆盖镜像默认 -Xms160m -Xmx160m）：
      #   G1 + 200ms 停顿；元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m（/tmp）
      JAVA_OPTS: "-Xms160m -Xmx160m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/zipkin_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xlog:gc*:file=/tmp/zipkin_gc.log:time,uptime,level,tags:filecount=5,filesize=20m -Dfile.encoding=UTF-8"
    ports:
      - "9411:9411"
    networks:
      - apex-observability

volumes:
  apex-prometheus-data:
  apex-grafana-data:

networks:
  apex-observability:
    driver: bridge
