# ================================================================
# Apex Scaffold - Prometheus 抓取配置
# ================================================================
# 采集应用 /actuator/prometheus 与 Sentinel 治理指标。
# Podman 通过 host.containers.internal 访问宿主机；容器栈内改用服务名。
# ================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: apex-scaffold

rule_files:
  - alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 网关与六个业务服务：宿主机运行时按各自业务端口抓取；容器栈内改为服务名。
  # system 的管理端口为 8083（业务 8082），integration 管理端口 8097（业务 8094）。
  - job_name: apex-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.containers.internal:8080"]
        labels: {application: apex-scaffold, module: gateway}

  - job_name: apex-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.containers.internal:8081"]
        labels: {application: apex-scaffold, module: auth-service}

  - job_name: apex-system-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.containers.internal:8083"]
        labels: {application: apex-scaffold, module: system-service}

  - job_name: apex-workflow-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.containers.internal:8093"]
        labels: {application: apex-scaffold, module: workflow-service}

  - job_name: apex-office-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.containers.internal:8084"]
        labels: {application: apex-scaffold, module: office-service}

  - job_name: apex-file-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.containers.internal:8085"]
        labels: {application: apex-scaffold, module: file-service}

  - job_name: apex-integration-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.containers.internal:8097"]
        labels: {application: apex-scaffold, module: integration-service}

  - job_name: apex-sentinel
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.containers.internal:8720"
        labels:
          application: apex-scaffold
          component: sentinel

  # Blackbox Exporter 探测宿主机应用健康端点（网关与六个业务服务）。
  - job_name: apex-scaffold-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 15s
    static_configs:
      - targets:
          - "http://host.containers.internal:8080/actuator/health"
          - "http://host.containers.internal:8081/actuator/health"
          - "http://host.containers.internal:8083/actuator/health"
          - "http://host.containers.internal:8093/actuator/health"
          - "http://host.containers.internal:8084/actuator/health"
          - "http://host.containers.internal:8085/actuator/health"
          - "http://host.containers.internal:8097/actuator/health"
        labels:
          application: apex-scaffold
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: grafana
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - "grafana:3000"

  - job_name: zipkin
    metrics_path: /prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "zipkin:9411"
        labels:
          application: apex-scaffold
          component: zipkin
