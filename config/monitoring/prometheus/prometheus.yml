# ================================================================
# Apex Scaffold - Prometheus 抓取配置
# ================================================================
# 用途: 采集 Apex Scaffold 应用指标（/actuator/prometheus，独立管理端口 8081）
#      以及 Sentinel 限流熔断指标（sentinel_prometheus_exporter，端口 8720）。
# 背景: 应用通过 spring-boot-starter-actuator + micrometer-registry-prometheus
#      暴露 Micrometer 指标，Sentinel 通过 sentinel-prometheus-exporter 暴露治理指标。
# 影响: 配合 grafana/apex-dashboard.json 大盘与 alert-rules.yml 告警规则使用。
# ================================================================

global:
  scrape_interval: 15s      # 默认抓取周期
  evaluation_interval: 15s  # 告警规则评估周期
  external_labels:
    cluster: apex-scaffold

# 告警规则文件（服务宕机 / 高错误率 / 高延迟 / JVM / 连接池）
rule_files:
  - alert-rules.yml

scrape_configs:
  # ---- Apex Scaffold 应用实例 ----
  # 单实例: 修改 targets 指向实际部署地址（K8s 内为 <service>:8081）
  - job_name: apex-scaffold
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "localhost:8081"
        labels:
          application: apex-scaffold
          module: interfaces

  # ---- Sentinel 限流熔断指标（可选，未启用 exporter 时忽略） ----
  - job_name: apex-sentinel
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "localhost:8720"
        labels:
          application: apex-scaffold
          component: sentinel

  # ---- Grafana 自身指标（可选，用于监控监控本身） ----
  - job_name: grafana
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - "grafana:3000"
