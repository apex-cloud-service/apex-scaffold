# ================================================================
# Apex Scaffold - Prometheus 抓取配置
# ================================================================
# 采集应用 /actuator/prometheus 与 Sentinel 治理指标。
# Podman 通过 host.containers.internal 访问宿主机；容器栈内改用服务名。
# ================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: apex-scaffold

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: apex-scaffold
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.containers.internal:8081"
        labels:
          application: apex-scaffold
          module: interfaces

  - job_name: apex-sentinel
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.containers.internal:8720"
        labels:
          application: apex-scaffold
          component: sentinel

  # Blackbox Exporter 探测宿主机应用健康端点。
  - job_name: apex-scaffold-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 15s
    static_configs:
      - targets:
          - "http://host.containers.internal:8081/actuator/health"
        labels:
          application: apex-scaffold
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: grafana
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - "grafana:3200"

  - job_name: zipkin
    metrics_path: /prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - "zipkin:9411"
        labels:
          application: apex-scaffold
          component: zipkin
