# ================================================================
# Apex Scaffold - Prometheus 告警规则
# ================================================================
# 用途: 面向 Apex Scaffold 生产部署的核心告警规则，覆盖服务可用性、
#      接口质量、JVM 健康、数据库连接池与下游依赖。
# 背景: 指标来源为 Micrometer（apex_api_*）、Actuator（jvm_*/hikaricp_*）、
#      Sentinel（sentinel_*）。
# 影响: 与 grafana/apex-dashboard.json 大盘配套；告警收敛阈值按
#      「基础版中小规模部署」预设，可按业务规模调整。
# ================================================================

groups:
  # ---------- 服务可用性 ----------
  - name: apex-service-availability
    rules:
      # 应用进程不可达（管理端口探活失败 1 分钟）
      - alert: ApexServiceDown
        expr: up{job="apex-scaffold"} == 0
        for: 1m
        labels:
          severity: critical
          component: apex-scaffold
        annotations:
          summary: "Apex Scaffold 实例不可达"
          description: "实例 {{ $labels.instance }} 已连续 1 分钟无法抓取指标，服务可能已宕机。"

      # 健康探针返回非 UP 状态
      - alert: ApexHealthCheckDown
        expr: probe_success{job="apex-scaffold"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "健康检查失败"
          description: "实例 {{ $labels.instance }} 的 /actuator/health 连续 2 分钟返回非 UP。"

  # ---------- 接口质量 ----------
  - name: apex-api-quality
    rules:
      # 5xx 错误率超过 5%（5 分钟窗口）
      - alert: ApexHighErrorRate
        expr: |
          sum(rate(apex_api_request_count_total{status=~"5.."}[5m]))
            / sum(rate(apex_api_request_count_total[5m]))
            * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 5xx 错误率过高"
          description: "5 分钟窗口内 5xx 错误率 {{ $value | humanize }}% 超过 5% 阈值。"

      # P95 响应时间超过 2 秒（基于 histogram 分位数）
      - alert: ApexHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(apex_api_response_time_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 P95 响应时间过高"
          description: "最近 5 分钟 P95 响应时间 {{ $value }}s 超过 2s 阈值。"

      # 请求量骤降（疑似流量异常/路由故障）
      - alert: ApexTrafficDrop
        expr: |
          sum(rate(apex_api_request_count_total[10m]))
            / (sum(rate(apex_api_request_count_total[1d])) / 144)
            < 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "接口请求量骤降"
          description: "当前请求速率不足日常均值的 20%，疑似流量异常。"

  # ---------- JVM 健康 ----------
  - name: apex-jvm-health
    rules:
      # 堆内存使用率超过 85%（持续 10 分钟，排除短暂 GC 波动）
      - alert: ApexJvmHeapHigh
        expr: |
          jvm_memory_used_bytes{area="heap"}
            / jvm_memory_max_bytes{area="heap"}
            * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "堆内存使用率 {{ $value | humanize }}% 持续 10 分钟超过 85%，建议扩容或排查泄漏。"

      # 老年代 GC 次数突增（Full GC 1 分钟超 5 次）
      - alert: ApexFullGcFrequent
        expr: |
          rate(jvm_gc_pause_seconds_count{action="end of major GC"}[5m]) > 0.0833
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Full GC 过于频繁"
          description: "Full GC 频率 {{ $value }} 次/秒（5 分钟均值 > 5 次/分钟），堆可能不足。"

      # 线程数过高（> 2000，WebFlux 下多为线程池泄漏）
      - alert: ApexThreadCountHigh
        expr: jvm_threads_live_threads > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "存活线程数过高"
          description: "当前存活线程 {{ $value }} 超过 2000，存在线程泄漏风险。"

  # ---------- 数据库连接池 ----------
  - name: apex-database-health
    rules:
      # 活跃连接占比超过 80%（连接池耗尽风险）
      - alert: ApexDbConnectionPoolHigh
        expr: |
          hikaricp_connections_active
            / hikaricp_connections_max
            * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接池水位过高"
          description: "HikariCP 活跃连接占比 {{ $value | humanize }}% 超过 80%，可能引发获取连接超时。"

      # 等待获取连接超时累计（10 分钟超 5 次）
      - alert: ApexDbConnectionTimeout
        expr: |
          increase(hikaricp_connection_timeout_total[10m]) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "数据库连接获取超时"
          description: "10 分钟内连接获取超时 {{ $value }} 次，数据库可能不可用或连接池耗尽。"

  # ---------- 治理（Sentinel） ----------
  - name: apex-sentinel-governance
    rules:
      # Sentinel 限流/熔断触发次数（10 分钟超 100 次）
      - alert: ApexSentinelBlockHigh
        expr: |
          increase(sentinel_block_qps_total[10m]) > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Sentinel 拦截请求过多"
          description: "10 分钟内 Sentinel 拦截 {{ $value }} 次，系统可能过载或资源被过度保护。"

  # ---------- 下游依赖 ----------
  - name: apex-downstream-dependencies
    rules:
      # Redis 连接失败（5 分钟窗口出现任何连接异常）
      - alert: ApexRedisDown
        expr: |
          increase(redis_connection_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 连接异常"
          description: "5 分钟内 Redis 连接失败 {{ $value }} 次，缓存/分布式锁功能不可用。"
