groups:
  # ============================================================
  # JVM深度告警
  # ============================================================
  - name: jvm_deep_monitoring
    interval: 30s
    rules:
      # Metaspace使用率告警
      - alert: MetaspaceUsageHigh
        expr: |
          100 * jvm_memory_used_bytes{area="nonheap",id="Metaspace"} 
            / jvm_memory_max_bytes{area="nonheap",id="Metaspace"} > 85
        for: 5m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: "Metaspace使用率过高"
          description: "实例 {{ $labels.instance }} 的Metaspace使用率为 {{ $value | humanizePercentage }},超过85%阈值"
      
      - alert: MetaspaceUsageCritical
        expr: |
          100 * jvm_memory_used_bytes{area="nonheap",id="Metaspace"} 
            / jvm_memory_max_bytes{area="nonheap",id="Metaspace"} > 90
        for: 2m
        labels:
          severity: critical
          component: jvm
        annotations:
          summary: "Metaspace使用率严重过高"
          description: "实例 {{ $labels.instance }} 的Metaspace使用率为 {{ $value | humanizePercentage }},超过90%,可能导致OOM"
      
      # CodeCache使用率告警
      - alert: CodeCacheUsageHigh
        expr: |
          100 * jvm_memory_used_bytes{area="nonheap",id="CodeCache"} 
            / jvm_memory_max_bytes{area="nonheap",id="CodeCache"} > 80
        for: 10m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: "CodeCache使用率过高"
          description: "实例 {{ $labels.instance }} 的CodeCache使用率为 {{ $value | humanizePercentage }},可能影响JIT编译性能"
      
      # GC暂停时间告警
      - alert: GCPauseTimeHigh
        expr: |
          jvm_gc_pause_seconds_max > 0.5
        for: 5m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: "GC 最大暂停时间过长"
          description: "实例 {{ $labels.instance }} 的GC最大暂停时间为 {{ $value }}秒,超过500ms阈值"
      
      - alert: GCPauseTimeCritical
        expr: |
          jvm_gc_pause_seconds_max > 1.0
        for: 2m
        labels:
          severity: critical
          component: jvm
        annotations:
          summary: "GC 最大暂停时间严重过长"
          description: "实例 {{ $labels.instance }} 的GC最大暂停时间为 {{ $value }}秒,严重影响性能"

  # ============================================================
  # Sentinel治理告警
  # ============================================================
  - name: sentinel_governance
    interval: 30s
    rules:
      # 限流 QPS 告警：sentinel-prometheus-metric-exporter 输出的是 Gauge 快照，不能使用 rate()。
      - alert: SentinelBlockQpsHigh
        expr: |
          max by (resource) (sentinel_metrics{type="blockQps"}) > 10
        for: 5m
        labels:
          severity: warning
          component: sentinel
        annotations:
          summary: "Sentinel 限流 QPS 过高"
          description: "资源 {{ $labels.resource }} 的限流 QPS 为 {{ $value }}，请检查规则与流量"

      # 资源平均响应时间告警：该值由 Sentinel 以毫秒 Gauge 快照暴露。
      - alert: SentinelResourceRtHigh
        expr: |
          max by (resource) (sentinel_metrics{type="rt"}) > 1000
        for: 5m
        labels:
          severity: warning
          component: sentinel
        annotations:
          summary: "Sentinel 资源响应时间过高"
          description: "资源 {{ $labels.resource }} 的平均响应时间为 {{ $value }} ms，请检查下游依赖"

  # ============================================================
  # 网关性能告警
  # ============================================================
  - name: gateway_performance
    interval: 30s
    rules:
      # 慢请求过多告警
      - alert: SlowRequestsExcessive
        expr: |
          1 - (
            sum(rate(apex_api_response_time_seconds_bucket{le="3.0"}[5m]))
            /
            sum(rate(apex_api_response_time_seconds_count[5m]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "慢请求(>3s)数量过多"
          description: "慢请求比例（>3s）为 {{ $value | humanizePercentage }}"
      
      # 连接池使用率告警
      - alert: ConnectionPoolUsageHigh
        expr: |
          100 * reactor_netty_connection_provider_active_connections 
            / reactor_netty_connection_provider_max_connections > 80
        for: 5m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "连接池使用率过高"
          description: "实例 {{ $labels.instance }} 的连接池使用率为 {{ $value | humanizePercentage }}"

  # ============================================================
  # 熔断器告警
  # ============================================================
  - name: circuit_breaker
    interval: 30s
    rules:
      # 熔断器Open状态告警
      - alert: CircuitBreakerOpen
        expr: |
          resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
          component: circuit_breaker
        annotations:
          summary: "熔断器已开启"
          description: "熔断器 {{ $labels.name }} 处于Open状态,请求被拒绝"
      
      # 失败率过高告警
      - alert: CircuitBreakerFailureRateHigh
        expr: |
          resilience4j_circuitbreaker_failure_rate > 50
        for: 5m
        labels:
          severity: warning
          component: circuit_breaker
        annotations:
          summary: "熔断器失败率过高"
          description: "熔断器 {{ $labels.name }} 失败率为 {{ $value }}%,可能即将触发熔断"

  # ============================================================
  # 数据库告警
  # ============================================================
  - name: database_monitoring
    interval: 30s
    rules:
      # 数据库连接池使用率告警
      - alert: DBConnectionPoolUsageHigh
        expr: |
          100 * hikaricp_connections_active / hikaricp_connections_max > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "数据库连接池使用率过高"
          description: "连接池 {{ $labels.pool }} 使用率为 {{ $value | humanizePercentage }}"
      
      # 数据库慢查询告警
      - alert: DBSlowQueriesExcessive
        expr: |
          sum(rate(apex_sql_slow_count_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "数据库慢查询过多"
          description: "慢SQL计数速率为 {{ $value }} queries/s（阈值由 apex.sql.slow.threshold-ms 配置）"
