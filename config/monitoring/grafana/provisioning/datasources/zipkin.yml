apiVersion: 1

datasources:
  - name: Zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
    isDefault: false
    jsonData:
      # 注意：未置备 Loki 数据源（uid=loki），故不启用 tracesToLogsV2；
      # 引入 Loki provisioning 后可恢复 trace→日志关联。
      # 链路追踪到指标关联
      tracesToMetrics:
        datasourceUid: 'prometheus'
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        tags:
          - key: 'service.name'
            value: 'service'
      
      # 节点图配置
      nodeGraph:
        enabled: true
    
    # 基本配置
    editable: true
    uid: zipkin
