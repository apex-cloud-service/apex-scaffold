# 此文件不再覆盖 OAP 的 application.yml，不要挂载到 /skywalking/config/application.yml。
# podman-compose.infra.yml 使用 apache/skywalking-oap-server:9.7.0 镜像内完整官方配置。
# 官方基线：https://github.com/apache/skywalking/blob/v9.7.0/oap-server/server-starter/src/main/resources/application.yml
# 环境变量由 Compose 设置：
#   SW_STORAGE=h2
#   SW_STORAGE_H2_URL=jdbc:h2:file:/skywalking/data/skywalking;DATABASE_TO_UPPER=FALSE
#   SW_CORE_RECORD_DATA_TTL=7（天）
#   SW_CORE_METRICS_DATA_TTL=7（天）
# H2 数据通过 skywalking-data 卷持久化到 /skywalking/data。
