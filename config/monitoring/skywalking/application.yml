# ============================================================
# Apex Scaffold - SkyWalking OAP 服务端配置
# ============================================================
# 用途: 挂载到 skywalking-oap 容器 /skywalking/config/application.yml
#       （docker-compose.infra.yml 中 skywalking-oap 的 volumes）
#
# 定位: 承接各微服务经 skywalking-agent（-javaagent 方式）上报的链路数据，
#       提供链路查询、服务拓扑、告警能力，替代原 Zipkin。
#
# 存储: 默认 H2（内存）——轻量、零外部依赖，适合本地开发与单机演示；
#       生产建议切换为 Elasticsearch（与 ELK 复用，见 storage.elasticsearch 段注释）。
#
# 采样: 由 应用侧 agent 的 agent.sample_n_per_3_secs 控制（见 config/monitoring/skywalking/agent-options.md），
#       OAP 侧不再重复采样，仅做聚合与持久化。
#
# 详细说明见 docs/05-operations/deployment.md 「SkyWalking 链路追踪」章节。
# ============================================================

core:
  default:
    # 角色：混合模式（同时承担 receiver + aggregator，单机部署推荐）
    role: Mixed
    # 后端接收端口：11800 gRPC（agent 上报）/ 12800 HTTP（UI 查询）
    restHost: 0.0.0.0
    restPort: 12800
    gRPCHost: 0.0.0.0
    gRPCPort: 11800

storage:
  # ---------------- H2（默认，轻量） ----------------
  selector: ${SW_STORAGE:h2}
  h2:
    driver: org.h2.jdbcx.JdbcDataSource
    # 数据落盘位置（容器内），compose 已挂卷 skywalking-data 持久化
    url: jdbc:h2:file:/skywalking/data/skywalking
    user: sa
    password: ""
  # ---------------- Elasticsearch（生产可选，与 ELK 复用） ----------------
  # 启用方式：设置环境变量 SW_STORAGE=elasticsearch，并确保 skywalking-oap 与
  # elasticsearch 处于同一 docker 网络（apex-infra），命名空间默认 skywalking。
  elasticsearch:
    namespace: ${SW_NAMESPACE:skywalking}
    clusterNodes: ${SW_STORAGE_ES_CLUSTER_NODES:elasticsearch:9200}
    protocol: http
    user: ${SW_ES_USER:""}
    password: ${SW_ES_PASSWORD:""}
    # 关闭索引安全插件（本地环境 ES 未开启安全认证时使用）
    secretsManagementFiles: ${SW_ES_SECRETS_MANAGEMENT_FILES:""}
    indexShardsNumber: 2
    indexReplicasNumber: 0
    # 按天滚动，保留 7 天（与 ELK ILM 策略一致，避免磁盘膨胀）
    recordDataTTL: ${SW_STORAGE_ES_RECORD_DATA_TTL:7}
    metricsDataTTL: ${SW_STORAGE_ES_METRICS_DATA_TTL:7}

# ---------------- 告警 ---------------- 
alarm:
  default:
    # 告警规则文件（容器内路径）
    rules: alarm-settings.yml

# ---------------- 接收器 ---------------- 
receiver-sharing-server:
  default:
    # gRPC 共享端口（多个 receiver 复用）
    restHost: 0.0.0.0
    gRPCHost: 0.0.0.0

# ---------------- 集群（单机部署无需，保留占位） ----------------
cluster:
  selector: ${SW_CLUSTER:standalone}

# ---------------- 自监控（关闭，避免额外端口暴露） ----------------
telemetry:
  selector: ${SW_TELEMETRY:none}

# ---------------- 查询缓存 ----------------
query:
  # 链路查询最大返回条数；过大将占用较多内存
  maxQueryComplexity: ${SW_QUERY_MAX_QUERY_COMPLEXITY:1000}
  # 单次查询最大 span 数
  maxQuerySize: ${SW_QUERY_MAX_QUERY_SIZE:5000}
