server:
  port: ${MASKING_PORT:8096}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
spring:
  application:
    name: apex-masking-service
  codec:
    max-in-memory-size: 256KB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
apex:
  masking:
    issuer: ${MASKING_JWT_ISSUER:}
    jwk-set-uri: ${MASKING_JWT_JWK_SET_URI:}
    audience: ${MASKING_JWT_AUDIENCE:}
    # 默认只对显式配置租户开放；真实租户通过部署配置覆盖。
    versions:
      v1:
        tenants:
          - ${MASKING_ALLOWED_TENANT:}
        fields:
          name:
            type: NAME
          phone:
            type: PHONE
          email:
            type: EMAIL
          idCard:
            type: ID_CARD
          bankCard:
            type: BANK_CARD
          address:
            type: ADDRESS
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
