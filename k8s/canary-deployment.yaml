# ============================================================
# Apex Scaffold Kubernetes 金丝雀（灰度）发布配置
# ============================================================
# 仅包含预览后端。稳定组和金丝雀组的端点通过校验后，CLI 才创建独立的 0% Ingress。
# 请按 README 使用 CLI，不要直接对整个 k8s/ 目录执行 apply。
# ============================================================

---
# 网关金丝雀 Deployment（新版本先部署，仅接收灰度流量；多服务拓扑下灰度以入口为单位）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-gateway-canary
  namespace: apex-scaffold
  labels:
    app: apex-gateway
    track: canary
    version: v-next
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apex-gateway
      track: canary
  template:
    metadata:
      labels:
        app: apex-gateway
        track: canary
        version: v-next
    spec:
      # 120 秒覆盖应用 90 秒总关停预算、readiness 摘流传播与容器退出缓冲
      terminationGracePeriodSeconds: 120
      containers:
        - name: apex-gateway
          # 替换为新版本镜像（灰度验证对象）
          image: apex-gateway:v-next
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: apex-secrets
          env:
            # JVM 生产级调优参数（与 Containerfile 默认一致；GC 日志/堆转储写入容器 /app/logs）
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx768m -Xss512k -XX:MaxDirectMemorySize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=20m -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom"
            # 显式选择 Kubernetes 治理模式，启动后不随运行环境热切换
            - name: APEX_GOVERNANCE_DEPLOYMENT_MODE
              value: kubernetes
            - name: APEX_GOVERNANCE_SHUTDOWN_TIMEOUT
              value: 90s
            - name: APEX_GOVERNANCE_READINESS_WITHDRAW_TIMEOUT
              value: 5s
            - name: APEX_GOVERNANCE_MQ_DRAIN_TIMEOUT
              value: 30s
            - name: APEX_GOVERNANCE_FORCE_SHUTDOWN
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # 仅留出 readiness 摘流传播时间，实际排空由应用响应 SIGTERM 完成
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
      restartPolicy: Always

---
# 金丝雀 Service（供 Ingress 按权重导入流量）
apiVersion: v1
kind: Service
metadata:
  name: apex-gateway-canary-service
  namespace: apex-scaffold
  labels:
    app: apex-gateway
    track: canary
spec:
  type: ClusterIP
  selector:
    app: apex-gateway
    track: canary
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
