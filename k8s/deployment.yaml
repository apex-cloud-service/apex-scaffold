# ============================================================
# Apex Scaffold Kubernetes 部署配置
# ============================================================
# 使用方式:
#   kubectl apply -f k8s/
# 说明:
#   - 配置注入方式与应用 Docker/Compose 一致：全部通过环境变量（Secret + env），
#     不覆盖 classpath 内 application*.yml（应用本身已含完整配置）。
#   - 镜像: 本地 docker build -t apex-scaffold:latest .（详见 docs/DEPLOYMENT.md §5）
#   - 探针: startup/liveness/readiness 指向管理端口 8081 的 Actuator 端点（与 Dockerfile 一致）
#   - 数据库/Redis 为集群外服务时，将 Secret 与 env 中的地址改为实际 Service/DNS。
# ============================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: apex-scaffold
  labels:
    app: apex-scaffold

---
# Secret - 敏感信息（生产必须修改；应用读取 DB_MASTER_* / DB_SLAVE_* / REDIS_* / JWT_SECRET）
apiVersion: v1
kind: Secret
metadata:
  name: apex-secrets
  namespace: apex-scaffold
type: Opaque
stringData:
  SPRING_PROFILES_ACTIVE: prod,enterprise
  DB_MASTER_USERNAME: root
  DB_MASTER_PASSWORD: changeme-to-a-strong-password
  # 从库凭据（prod 已启用 slave 数据源；与 master 保持一致，生产必须修改为只读副本凭据）
  DB_SLAVE_USERNAME: root
  DB_SLAVE_PASSWORD: changeme-to-a-strong-password
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  REDIS_PASSWORD: changeme-to-a-strong-redis-password
  JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  # 无 Nacos 部署时保持 false；接入时改 true 并注入 NACOS_SERVER_ADDR / NACOS_NAMESPACE
  NACOS_CONFIG_ENABLED: "false"
  NACOS_DISCOVERY_ENABLED: "false"
  NACOS_REGISTER_ENABLED: "false"
  NACOS_NAMESPACE: public
  ROCKETMQ_NAMESERVER: ""
  ROCKETMQ_NAMESRV_ADDR: ""
  ROCKETMQ_PRODUCER_GROUP: apex-producer-group
  ROCKETMQ_ACCESS_KEY: ""
  ROCKETMQ_SECRET_KEY: ""
  APEX_MQ_CONSUMER_ENABLED: "false"
  APEX_MQ_DLQ_ENABLED: "false"
  APEX_MQ_DOMAIN_EVENT_ENABLED: "false"
  APEX_MQ_DOMAIN_EVENT_TOPIC: apex-domain-event
  MQ_IDEMPOTENT_TTL_MINUTES: "30"
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_MAX_ATTEMPTS: "8"
  OUTBOX_LOCK_TIMEOUT_SECONDS: "120"
  OUTBOX_PARALLELISM: "4"
  OUTBOX_RETENTION_ENABLED: "true"
  OUTBOX_RETENTION_DELIVERED_HOURS: "168"
  OUTBOX_RETENTION_DEAD_DAYS: "30"
  OUTBOX_RETENTION_BATCH_SIZE: "5000"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-scaffold
  namespace: apex-scaffold
  labels:
    app: apex-scaffold
    version: v1.2.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-scaffold
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: apex-scaffold
        version: v1.2.0
    spec:
      containers:
        - name: apex-scaffold
          image: apex-scaffold:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8081
              name: management
              protocol: TCP
          envFrom:
            - secretRef:
                name: apex-secrets
          env:
            # JVM 生产级调优参数（与 Dockerfile 默认一致；GC 日志/堆转储写入容器 /app/logs）
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx768m -Xss512k -XX:MaxDirectMemorySize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=20m -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # 仅留出 readiness 摘流传播时间，实际排空由应用响应 SIGTERM 完成
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
      restartPolicy: Always

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: apex-scaffold-service
  namespace: apex-scaffold
  labels:
    app: apex-scaffold
spec:
  type: ClusterIP
  selector:
    app: apex-scaffold
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# Ingress (可选,需要安装Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-scaffold-ingress
  namespace: apex-scaffold
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: apex-scaffold.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apex-scaffold-service
                port:
                  number: 80
  tls:
    - hosts:
        - apex-scaffold.example.com
      secretName: apex-tls-secret

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apex-scaffold-hpa
  namespace: apex-scaffold
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apex-scaffold
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
