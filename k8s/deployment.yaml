# ============================================================
# Apex Scaffold Kubernetes 部署配置
# ============================================================
# 使用方式:
#   kubectl apply -f k8s/
# 说明:
#   - 配置注入方式与应用 Docker/Compose 一致：全部通过环境变量（Secret + env），
#     不覆盖 classpath 内 application*.yml（应用本身已含完整配置）。
#   - 镜像: 本地 docker build -t apex-scaffold:latest .（详见 docs/DEPLOYMENT.md §5）
#   - 探针: liveness/readiness 指向管理端口 8081 的 Actuator 端点（与 Dockerfile 一致）
#   - 数据库/Redis 为集群外服务时，将 Secret 与 env 中的地址改为实际 Service/DNS。
# ============================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: apex-scaffold
  labels:
    app: apex-scaffold

---
# Secret - 敏感信息（生产必须修改；应用读取 DB_MASTER_* / REDIS_* / JWT_SECRET）
apiVersion: v1
kind: Secret
metadata:
  name: apex-secrets
  namespace: apex-scaffold
type: Opaque
stringData:
  SPRING_PROFILES_ACTIVE: prod,enterprise
  DB_MASTER_USERNAME: root
  DB_MASTER_PASSWORD: changeme-to-a-strong-password
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  REDIS_PASSWORD: changeme-to-a-strong-redis-password
  JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  # 无 Nacos 部署时保持 false；接入时改 true 并注入 NACOS_SERVER_ADDR / NACOS_NAMESPACE
  NACOS_CONFIG_ENABLED: "false"
  NACOS_DISCOVERY_ENABLED: "false"
  NACOS_REGISTER_ENABLED: "false"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-scaffold
  namespace: apex-scaffold
  labels:
    app: apex-scaffold
    version: v1.1.3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-scaffold
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: apex-scaffold
        version: v1.1.3
    spec:
      containers:
        - name: apex-scaffold
          image: apex-scaffold:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8081
              name: management
              protocol: TCP
          envFrom:
            - secretRef:
                name: apex-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: apex-scaffold-service
  namespace: apex-scaffold
  labels:
    app: apex-scaffold
spec:
  type: ClusterIP
  selector:
    app: apex-scaffold
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
# Ingress (可选,需要安装Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-scaffold-ingress
  namespace: apex-scaffold
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: apex-scaffold.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apex-scaffold-service
                port:
                  number: 80
  tls:
    - hosts:
        - apex-scaffold.example.com
      secretName: apex-tls-secret

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apex-scaffold-hpa
  namespace: apex-scaffold
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apex-scaffold
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
