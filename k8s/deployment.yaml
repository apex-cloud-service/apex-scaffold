# ============================================================
# Apex Scaffold Kubernetes 部署配置（多服务清单）
# ============================================================
# 使用方式:
#   新集群通过 apex.sh deploy k8s apply；旧集群先按本目录 README 迁移网关 selector。
# 说明:
#   - 一镜像一服务：每个 Deployment 由 Containerfile + SERVICE_MODULE 构建独立镜像，
#     镜像名与 build-manifest.yaml 的 service-jar 集合一致（8 个发布服务）。
#   - 配置注入方式与应用 Podman/Compose 一致：全部通过环境变量（Secret + env），
#     不覆盖 classpath 内 application*.yml（应用本身已含完整配置）。
#   - 端口与 podman-compose.yml / build-manifest.yaml 同源：
#     gateway 8080、auth 8081、system 8082（管理 8083）、workflow 8093、
#     office 8084、file 8085、integration 8094（管理 8097）、aggregation 8098。
#   - 探针统一指向各服务 /actuator/health/{readiness,liveness}；system 与 integration
#     走管理端口，aggregation 无数据库、无独立管理端口故走 8098。
#   - 数据库/Redis/Nacos 为集群外服务时，将 Secret 与 env 中的地址改为实际 Service/DNS。
# ============================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: apex-scaffold
  labels:
    app: apex-scaffold

---
# Secret - 敏感信息（生产必须修改；应用读取 DB_MASTER_* / DB_SLAVE_* / REDIS_* / JWT_SECRET）
apiVersion: v1
kind: Secret
metadata:
  name: apex-secrets
  namespace: apex-scaffold
type: Opaque
stringData:
  SPRING_PROFILES_ACTIVE: prod,enterprise
  DB_MASTER_USERNAME: root
  DB_MASTER_PASSWORD: changeme-to-a-strong-password
  # 从库凭据（prod 已启用 slave 数据源；与 master 保持一致，生产必须修改为只读副本凭据）
  DB_SLAVE_USERNAME: root
  DB_SLAVE_PASSWORD: changeme-to-a-strong-password
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"
  REDIS_PASSWORD: changeme-to-a-strong-redis-password
  JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  # 内部服务调用签名（/internal/v1/**）：所有服务必须使用同一密钥
  APEX_INTERNAL_AUTH_SECRET: change-this-to-a-secure-internal-auth-secret-32ch
  # 配置加密密钥（恰好 32 字节）与数据/Token 加密密钥（Base64 编码 32 字节）
  CONFIG_ENCRYPTION_KEY: change-this-to-32-byte-config-key!!
  APEX_SECURITY_DATA_ENCRYPTION_KEY: Y2hhbmdlLXRoaXMtYmFzZTY0LTMyLWJ5dGUta2V5MDA=
  SECURITY_ENCRYPTION_KEY: Y2hhbmdlLXRoaXMtYmFzZTY0LTMyLWJ5dGUta2V5MDA=
  # 各服务独立验签密钥（生产按服务拆分轮换；HMAC 过渡口径）
  WORKFLOW_JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  OFFICE_JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  FILE_JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  INTEGRATION_JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  AGGREGATION_JWT_SECRET: change-this-to-a-secure-random-string-min-32-chars!!!
  # 无 Nacos 部署时保持 false；接入时改 true 并注入 NACOS_SERVER_ADDR / NACOS_NAMESPACE
  NACOS_CONFIG_ENABLED: "false"
  NACOS_DISCOVERY_ENABLED: "false"
  NACOS_REGISTER_ENABLED: "false"
  NACOS_NAMESPACE: public
  ROCKETMQ_NAMESERVER: ""
  ROCKETMQ_NAMESRV_ADDR: ""
  ROCKETMQ_PRODUCER_GROUP: apex-producer-group
  ROCKETMQ_ACCESS_KEY: ""
  ROCKETMQ_SECRET_KEY: ""
  APEX_MQ_CONSUMER_ENABLED: "false"
  APEX_MQ_DLQ_ENABLED: "false"
  APEX_MQ_DOMAIN_EVENT_ENABLED: "false"
  APEX_MQ_DOMAIN_EVENT_TOPIC: apex-domain-event
  MQ_IDEMPOTENT_TTL_MINUTES: "30"
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_MAX_ATTEMPTS: "8"
  OUTBOX_LOCK_TIMEOUT_SECONDS: "120"
  OUTBOX_PARALLELISM: "4"
  OUTBOX_RETENTION_ENABLED: "true"
  OUTBOX_RETENTION_DELIVERED_HOURS: "168"
  OUTBOX_RETENTION_DEAD_DAYS: "30"
  OUTBOX_RETENTION_BATCH_SIZE: "5000"

---
# ============================================================
# 网关（8080）
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-gateway
  namespace: apex-scaffold
  labels:
    app: apex-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: apex-gateway
        track: stable
    spec:
      containers:
        - name: apex-gateway
          image: apex-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: apex-secrets
          env:
            - name: GATEWAY_PORT
              value: "8080"
            # 关闭 Nacos 时直连各服务（与 podman-compose 同口径）
            - name: ROUTE_JOB_URI
              value: http://apex-job-service:8095
            - name: ROUTE_MASKING_URI
              value: http://apex-masking-service:8096
            - name: ROUTE_INTEGRATION_URI
              value: http://apex-integration-service:8094
            - name: ROUTE_AGGREGATION_URI
              value: http://apex-aggregation-service:8098
            - name: JAVA_OPTS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=70 -Dfile.encoding=UTF-8"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          lifecycle:
            preStop:
              # 仅留出 readiness 摘流传播时间，实际排空由应用响应 SIGTERM 完成
              exec:
                command: ["/bin/sh", "-c", "sleep 8"]
---
apiVersion: v1
kind: Service
metadata:
  name: apex-gateway
  namespace: apex-scaffold
spec:
  type: ClusterIP
  selector:
    app: apex-gateway
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# ============================================================
# apex-auth-service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-auth-service
  namespace: apex-scaffold
  labels:
    app: apex-auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: apex-auth-service
    spec:
      containers:
        - name: apex-auth-service
          image: apex-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - secretRef:
                name: apex-secrets
          env:
            - name: DB_NAME
              value: apex_auth
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/apex_auth?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            - name: JAVA_OPTS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=70 -Dfile.encoding=UTF-8"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
---
apiVersion: v1
kind: Service
metadata:
  name: apex-auth-service
  namespace: apex-scaffold
spec:
  type: ClusterIP
  selector:
    app: apex-auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081

