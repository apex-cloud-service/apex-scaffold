# ============================================================
# Ingress（网关统一入口，需集群已安装 Ingress Controller）
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apex-scaffold-ingress
  namespace: apex-scaffold
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: apex-scaffold.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apex-gateway
                port:
                  number: 80
  tls:
    - hosts:
        - apex-scaffold.example.com
      secretName: apex-tls-secret

---
# ============================================================
# 网关 HPA
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apex-gateway-hpa
  namespace: apex-scaffold
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apex-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
