# ============================================================
# Apex Scaffold - Podman Compose 一键编排
# ============================================================
# 服务: apex-gateway + 6 个业务服务 + nacos + mysql + redis；可选 rocketmq（--profile rocketmq）
#       以及可选的 apex-job-service（任务代理）与 apex-masking-service（脱敏）
#
# 用法:
#   # 1) 本地/测试一键栈（默认读取 .env，需先配置全部安全密钥）
#   cp .env.example .env        # 密钥格式见 docs/05-operations/configuration.md
#   # 先在项目固定 Java 21/mvnd 环境构建 security-key-check 所需 JAR：
#   source scripts/build/init-build-env.sh
#   mvnd -B -pl apex-tools-deployment -am verify
#   podman-compose -f podman-compose.yml up -d --build
#   podman-compose -f podman-compose.yml ps           # 等待 mysql/redis/nacos healthy、各微服务就绪
#
#   # 2) 生产部署（务必先编辑 .env：数据库密码 / JWT_SECRET / 地址）
#   podman-compose -f podman-compose.yml --env-file .env.prod up -d --build
#
#   # 3) 需要 RocketMQ（企业版消息能力）
#   ROCKETMQ_NAMESERVER=rocketmq-namesrv:9876 APEX_MQ_CONSUMER_ENABLED=true \
#   podman-compose -f podman-compose.yml --profile rocketmq up -d --build
#
#   # 4) 应用启动前先启动观测服务，创建共享 apex-observability 网络
#   podman-compose -p apex-infra -f podman-compose.infra.yml up -d skywalking-oap skywalking-ui elasticsearch kibana filebeat
#
#   # 5) 管理后台前端（可选，需先构建镜像: cd ../apex-admin-web && podman build -t apex-admin-web:latest .）
#   podman-compose -f podman-compose.yml up -d apex-admin-web
#
# 访问（旧单体 apex-scaffold 已退役，由 apex-gateway 承接 8080 统一入口，见 §15.1/§15.3）:
#   业务 API    http://localhost:8080 （网关，API 文档 /doc.html）
#   认证服务    http://localhost:8081     系统服务    http://localhost:8082（管理 8083）
#   工作流服务  http://localhost:8093     办公服务    http://localhost:8084
#   文件服务    http://localhost:8085
#   Nacos 控制台  http://localhost:8848/nacos
#   管理后台    http://localhost          （前端容器 Nginx，反代 /api、/admin-api 到网关 8080）
#   详细文档:   docs/05-operations/deployment.md
# ============================================================

x-security-environment: &security-environment
  APEX_DATA_ENCRYPTION_KEY: ${APEX_DATA_ENCRYPTION_KEY:?APEX_DATA_ENCRYPTION_KEY is required}
  SECURITY_ENCRYPTION_KEY: ${SECURITY_ENCRYPTION_KEY:?SECURITY_ENCRYPTION_KEY is required}
  CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}
  APEX_CONFIG_ENCRYPTION_KEY: ${APEX_CONFIG_ENCRYPTION_KEY:?APEX_CONFIG_ENCRYPTION_KEY is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

# 共享环境变量锚点：所有微服务复用安全密钥、Redis、Nacos、JWT、RocketMQ、Outbox、
# Keycloak、License、治理与可观测等公共配置；各服务仅在自身块内追加 DB / 端口等差异项。
x-app-common-environment: &app-common-environment
  <<: *security-environment
  # 激活 profile：<环境>,<档位>，例如 prod,enterprise / dev,standard
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,enterprise}
  # ---------- 日志与链路追踪 ----------
  LOG_PATH: /app/logs
  SW_AGENT_ENABLED: ${SW_AGENT_ENABLED:-true}
  SW_AGENT_COLLECTOR_BACKEND_SERVICES: ${SW_AGENT_COLLECTOR_BACKEND_SERVICES:-skywalking-oap:11800}
  # ---------- JVM 调优参数（默认与 Containerfile ENV JAVA_OPTS 一致；.env 设置 JAVA_OPTS 可整体覆盖） ----------
  # 堆内存 -Xms512m/-Xmx1024m、G1 回收器、GC 停顿目标、元空间上下限、OOM 堆转储+退出、滚动 GC 日志
  # （GC 日志/堆转储写入容器 /app/logs，需持久化时挂载 volume 或经 logstash/sidecar 采集）
  JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=20m -Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/./urandom}
  # ---------- 数据库主机（各服务在自身块内提供 DB_NAME / SPRING_DATASOURCE_URL） ----------
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-apex-root}
  # ---------- Redis（网关限流 / 各服务缓存与分布式锁共用） ----------
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # prod 配置强制要求（spring.data.redis.password=${REDIS_PASSWORD}），
  # 与下方 redis 服务的 --requirepass 保持一致；生产务必修改
  REDIS_PASSWORD: ${REDIS_PASSWORD:-apex-redis-password}
  # Spring 标准属性键：auth/workflow/file/office/integration/job/masking 未在自身
  # application.yml 声明 spring.data.redis，Redisson 会回退 localhost:6379 导致启动失败
  SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
  SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-apex-redis-password}
  # ---------- Nacos（服务发现 + 配置中心；微服务拓扑默认启用） ----------
  NACOS_CONFIG_ENABLED: ${NACOS_CONFIG_ENABLED:-true}
  NACOS_DISCOVERY_ENABLED: ${NACOS_DISCOVERY_ENABLED:-true}
  NACOS_REGISTER_ENABLED: ${NACOS_REGISTER_ENABLED:-true}
  NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
  # ---------- 内部服务调用签名（/internal/v1/**） ----------
  # 全部服务必须使用同一密钥；未配置时内部接口一律 503 拒绝。
  APEX_INTERNAL_AUTH_ENABLED: ${APEX_INTERNAL_AUTH_ENABLED:-true}
  APEX_INTERNAL_AUTH_SECRET: ${APEX_INTERNAL_AUTH_SECRET:?APEX_INTERNAL_AUTH_SECRET is required}
  APEX_INTERNAL_AUTH_SKEW_SECONDS: ${APEX_INTERNAL_AUTH_SKEW_SECONDS:-60}
  # ---------- 中台内部回源（能力守卫 / 跨域聚合 / 计量） ----------
  # 默认按服务名寻址；单进程或非 Nacos 拓扑应按实际地址覆盖。
  APEX_SYSTEM_BASE_URL: ${APEX_SYSTEM_BASE_URL:-http://apex-system-service:8082}
  APEX_OVERVIEW_SOURCES_FILE: ${APEX_OVERVIEW_SOURCES_FILE:-http://apex-file-service:8085}
  APEX_OVERVIEW_SOURCES_WORKFLOW: ${APEX_OVERVIEW_SOURCES_WORKFLOW:-http://apex-workflow-service:8093}
  APEX_OVERVIEW_SOURCES_OFFICE: ${APEX_OVERVIEW_SOURCES_OFFICE:-http://apex-office-service:8084}
  APEX_OVERVIEW_SOURCES_INTEGRATION: ${APEX_OVERVIEW_SOURCES_INTEGRATION:-http://apex-integration-service:8094}
  # ---------- RocketMQ（公共配置提供本地默认地址；业务能力默认关闭） ----------
  # 启用消息能力：设置 ROCKETMQ_NAMESERVER=rocketmq-namesrv:9876、APEX_MQ_CONSUMER_ENABLED=true，并搭配 --profile rocketmq 启动
  ROCKETMQ_NAMESERVER: ${ROCKETMQ_NAMESERVER:-}
  ROCKETMQ_NAMESRV_ADDR: ${ROCKETMQ_NAMESRV_ADDR:-}
  ROCKETMQ_PRODUCER_GROUP: ${ROCKETMQ_PRODUCER_GROUP:-apex-producer-group}
  ROCKETMQ_ACCESS_KEY: ${ROCKETMQ_ACCESS_KEY:-}
  ROCKETMQ_SECRET_KEY: ${ROCKETMQ_SECRET_KEY:-}
  APEX_MQ_CONSUMER_ENABLED: ${APEX_MQ_CONSUMER_ENABLED:-false}
  APEX_MQ_DLQ_ENABLED: ${APEX_MQ_DLQ_ENABLED:-false}
  APEX_MQ_DOMAIN_EVENT_ENABLED: ${APEX_MQ_DOMAIN_EVENT_ENABLED:-false}
  APEX_MQ_DOMAIN_EVENT_TOPIC: ${APEX_MQ_DOMAIN_EVENT_TOPIC:-apex-domain-event}
  MQ_IDEMPOTENT_TTL_MINUTES: ${MQ_IDEMPOTENT_TTL_MINUTES:-30}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
  OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-120}
  OUTBOX_PARALLELISM: ${OUTBOX_PARALLELISM:-4}
  OUTBOX_RETENTION_ENABLED: ${OUTBOX_RETENTION_ENABLED:-true}
  OUTBOX_RETENTION_DELIVERED_HOURS: ${OUTBOX_RETENTION_DELIVERED_HOURS:-168}
  OUTBOX_RETENTION_DEAD_DAYS: ${OUTBOX_RETENTION_DEAD_DAYS:-30}
  OUTBOX_RETENTION_BATCH_SIZE: ${OUTBOX_RETENTION_BATCH_SIZE:-5000}
  # ---------- Keycloak（IAM/OIDC，对齐 OrbStack 旧实例） ----------
  KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
  KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-http://keycloak:8080}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-apex}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-apex-client}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
  KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
  KEYCLOAK_FRONTEND_CALLBACK_URL: ${KEYCLOAK_FRONTEND_CALLBACK_URL:-http://localhost:5173/auth/callback}
  KEYCLOAK_USER_SYNC_ENABLED: ${KEYCLOAK_USER_SYNC_ENABLED:-true}
  # ---------- License（商业授权，可选；留空使用随包基础版） ----------
  APEX_LICENSE_FILE: ${APEX_LICENSE_FILE:-}
  # ---------- Meilisearch（全文搜索，供 system-service 使用） ----------
  MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-true}
  MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
  MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-masterKey}
  # ---------- Loki（运行日志查询） ----------
  LOKI_ENABLED: ${LOKI_ENABLED:-true}
  LOKI_URL: ${LOKI_URL:-http://loki:3100}
  # ---------- Grafana（日志查询跳转） ----------
  GRAFANA_ENABLED: ${GRAFANA_ENABLED:-false}
  GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3200}
  # ---------- 服务治理：Compose 模式与统一关停预算 ----------
  APEX_GOVERNANCE_DEPLOYMENT_MODE: ${APEX_GOVERNANCE_DEPLOYMENT_MODE:-compose}
  APEX_GOVERNANCE_SHUTDOWN_TIMEOUT: ${APEX_GOVERNANCE_SHUTDOWN_TIMEOUT:-90s}
  APEX_GOVERNANCE_READINESS_WITHDRAW_TIMEOUT: ${APEX_GOVERNANCE_READINESS_WITHDRAW_TIMEOUT:-5s}
  APEX_GOVERNANCE_MQ_DRAIN_TIMEOUT: ${APEX_GOVERNANCE_MQ_DRAIN_TIMEOUT:-30s}
  APEX_GOVERNANCE_FORCE_SHUTDOWN: ${APEX_GOVERNANCE_FORCE_SHUTDOWN:-true}
  # ---------- 时区 ----------
  TZ: ${TZ:-Asia/Shanghai}

services:
  security-key-check:
    image: docker.io/library/eclipse-temurin:21-jre-alpine
    environment: *security-environment
    command: ["java", "-jar", "/tools/local-deployment.jar", "validate"]
    volumes:
      # 发布包内路径为 tools/local-deployment.jar；源码构建时回退到模块 target。
      - ${APEX_DEPLOY_TOOL_JAR:-./tools/local-deployment.jar}:/tools/local-deployment.jar:ro
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    restart: "no"
  # ---------------- 应用微服务（§13.1：gateway + 5 服务；一个镜像 = 一个服务） ----------------
  #
  # 旧单体 apex-scaffold 已退役（见 docs/08-project-management/plans/microservice-migration-plan.md §15.1/§15.3）。
  # Containerfile 以 --build-arg SERVICE_MODULE 参数化，每个微服务构建独立镜像；
  # 网关（apex-gateway）承接原单体 8080 入口职责，其余服务经网关 lb:// 路由。
  # 服务间路由依赖 Nacos 服务发现，故本地编排默认启用 Nacos（见 NACOS_* 变量）。
  #

  # 网关：统一入口（原单体 8080 职责），无独立数据库，依赖 Redis 限流。
  apex-gateway:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-gateway
        SERVICE_PORT: "8080"
        MANAGEMENT_PORT: "8080"
        HEALTHCHECK_PORT: "8080"
    image: apex-gateway:${TAG:-latest}
    volumes:
      - ./logs/apex-gateway:/app/logs
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      <<: *app-common-environment
      GATEWAY_PORT: "8080"
      # prod profile 下 cors.allow-all-origins=false，必须给出明确来源，否则网关启动即失败
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      ROUTE_JOB_URI: ${ROUTE_JOB_URI:-http://apex-job-service:8095}
      ROUTE_MASKING_URI: ${ROUTE_MASKING_URI:-http://apex-masking-service:8096}
      ROUTE_INTEGRATION_URI: ${ROUTE_INTEGRATION_URI:-http://apex-integration-service:8094}
    depends_on:
      security-key-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    stop_grace_period: ${APEX_STOP_GRACE_PERIOD:-105s}
    restart: unless-stopped
    networks:
      - apex-network
      - observability

  # 认证服务：Token/会话/OAuth2（独立库 apex_auth）。
  apex-auth-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-auth-service
        SERVICE_PORT: "8081"
        MANAGEMENT_PORT: "8081"
        HEALTHCHECK_PORT: "8081"
    image: apex-auth-service:${TAG:-latest}
    volumes:
      - ./logs/apex-auth-service:/app/logs
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      <<: *app-common-environment
      DB_NAME: apex_auth
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      AUTH_CENTER_OAUTH2_PRIVATE_KEY: ${AUTH_CENTER_OAUTH2_PRIVATE_KEY:-}
      AUTH_CENTER_OAUTH2_PUBLIC_KEY: ${AUTH_CENTER_OAUTH2_PUBLIC_KEY:-}
      AUTH_CENTER_OAUTH2_KEY_ID: ${AUTH_CENTER_OAUTH2_KEY_ID:-oauth2-signing}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_auth?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-apex-root}
    depends_on:
      security-key-check:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    stop_grace_period: ${APEX_STOP_GRACE_PERIOD:-105s}
    restart: unless-stopped
    networks:
      - apex-network
      - observability

  # 系统服务：user/rbac/config/log/job/tenant 等系统域收敛（独立库 apex_system；管理端口 8083）。
  apex-system-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-system-service
        SERVICE_PORT: "8082"
        MANAGEMENT_PORT: "8083"
        HEALTHCHECK_PORT: "8083"
    image: apex-system-service:${TAG:-latest}
    volumes:
      - ./logs/apex-system-service:/app/logs
    ports:
      - "${SYSTEM_PORT:-8082}:8082"
      - "${SYSTEM_MANAGEMENT_PORT:-8083}:8083"
      # Sentinel Prometheus exporter（SPI 随 system 进程启动，默认 9092；
      # monitoring 栈经 host.containers.internal:9092 抓取，须发布到宿主）
      - "${SENTINEL_EXPORTER_PORT:-9092}:9092"
    environment:
      <<: *app-common-environment
      MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
      # system 使用 JDBC 持久化，保留临时 R2DBC 连接探测，但禁用全局自动配置。
      # 环境变量覆盖排除列表，必须同时保留 prod 的 Zipkin 排除项。
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration,org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
      DB_NAME: apex_system
      # prod 配置使用动态数据源节点，不继承下方 spring.datasource 顶层属性。
      # 单库 Compose 默认同指系统库；生产可分别配置主、从库地址和凭据。
      DB_MASTER_URL: ${DB_MASTER_URL:-jdbc:mysql://mysql:3306/apex_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      DB_MASTER_USERNAME: ${DB_MASTER_USERNAME:-${DB_USERNAME:-root}}
      DB_MASTER_PASSWORD: ${DB_MASTER_PASSWORD:-${DB_PASSWORD:-apex-root}}
      DB_SLAVE_URL: ${DB_SLAVE_URL:-jdbc:mysql://mysql:3306/apex_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      DB_SLAVE_USERNAME: ${DB_SLAVE_USERNAME:-${DB_USERNAME:-root}}
      DB_SLAVE_PASSWORD: ${DB_SLAVE_PASSWORD:-${DB_PASSWORD:-apex-root}}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_system?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-apex-root}
    depends_on:
      security-key-check:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8083/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    stop_grace_period: ${APEX_STOP_GRACE_PERIOD:-105s}
    restart: unless-stopped
    networks:
      - apex-network
      - observability

  # 工作流服务：工作流引擎/审批（独立库 apex_workflow）。
  apex-workflow-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-workflow-service
        SERVICE_PORT: "8093"
        MANAGEMENT_PORT: "8093"
        HEALTHCHECK_PORT: "8093"
    image: apex-workflow-service:${TAG:-latest}
    volumes:
      - ./logs/apex-workflow-service:/app/logs
    ports:
      - "${WORKFLOW_PORT:-8093}:8093"
    environment:
      <<: *app-common-environment
      DB_NAME: apex_workflow
      WORKFLOW_JWT_PUBLIC_KEY_BASE64: ${WORKFLOW_JWT_PUBLIC_KEY_BASE64:-}
      WORKFLOW_JWT_HMAC_ENABLED: ${WORKFLOW_JWT_HMAC_ENABLED:-false}
      WORKFLOW_JWT_SECRET: ${WORKFLOW_JWT_SECRET:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_workflow?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-apex-root}
    depends_on:
      security-key-check:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8093/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    stop_grace_period: ${APEX_STOP_GRACE_PERIOD:-105s}
    restart: unless-stopped
    networks:
      - apex-network
      - observability

  # 办公服务：组织/审批/日历/消息/三平台同步（独立库 apex_office）。
  apex-office-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-office-service
        SERVICE_PORT: "8084"
        MANAGEMENT_PORT: "8084"
        HEALTHCHECK_PORT: "8084"
    image: apex-office-service:${TAG:-latest}
    volumes:
      - ./logs/apex-office-service:/app/logs
    ports:
      - "${OFFICE_PORT:-8084}:8084"
    environment:
      <<: *app-common-environment
      DB_NAME: apex_office
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_office?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-apex-root}
    depends_on:
      security-key-check:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8084/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    stop_grace_period: ${APEX_STOP_GRACE_PERIOD:-105s}
    restart: unless-stopped
    networks:
      - apex-network
      - observability

  # 文件服务：文件/文档/存储 SPI/分片与预览（独立库 apex_file）。
  apex-file-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-file-service
        SERVICE_PORT: "8085"
        MANAGEMENT_PORT: "8085"
        HEALTHCHECK_PORT: "8085"
    image: apex-file-service:${TAG:-latest}
    volumes:
      - ./logs/apex-file-service:/app/logs
      # 与容器路径固定绑定，避免 .env 中主机相对路径改变对象实际位置。
      - ./data/storage:/app/data/storage
    ports:
      - "${FILE_PORT:-8085}:8085"
    environment:
      <<: *app-common-environment
      DB_NAME: apex_file
      FILE_JWT_PUBLIC_KEY_BASE64: ${FILE_JWT_PUBLIC_KEY_BASE64:-}
      FILE_JWT_PUBLIC_KEYS_BASE64: ${FILE_JWT_PUBLIC_KEYS_BASE64:-}
      FILE_JWT_SECRET: ${FILE_JWT_SECRET:-}
      STORAGE_DEFAULT_TYPE: ${STORAGE_DEFAULT_TYPE:-local}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-apex}
      STORAGE_PRESIGNED_URL_EXPIRE_SECONDS: ${STORAGE_PRESIGNED_URL_EXPIRE_SECONDS:-300}
      STORAGE_LOCAL_ENABLED: ${STORAGE_LOCAL_ENABLED:-true}
      STORAGE_LOCAL_BASE_PATH: /app/data/storage
      STORAGE_MINIO_ENABLED: ${STORAGE_MINIO_ENABLED:-false}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      STORAGE_VOLCENGINE_ENABLED: ${STORAGE_VOLCENGINE_ENABLED:-false}
      STORAGE_VOLCENGINE_ENDPOINT: ${STORAGE_VOLCENGINE_ENDPOINT:-}
      STORAGE_VOLCENGINE_REGION: ${STORAGE_VOLCENGINE_REGION:-}
      STORAGE_VOLCENGINE_ACCESS_KEY: ${STORAGE_VOLCENGINE_ACCESS_KEY:-}
      STORAGE_VOLCENGINE_SECRET_KEY: ${STORAGE_VOLCENGINE_SECRET_KEY:-}
      STORAGE_ALIYUN_OSS_ENABLED: ${STORAGE_ALIYUN_OSS_ENABLED:-false}
      STORAGE_ALIYUN_OSS_ENDPOINT: ${STORAGE_ALIYUN_OSS_ENDPOINT:-}
      STORAGE_ALIYUN_OSS_ACCESS_KEY: ${STORAGE_ALIYUN_OSS_ACCESS_KEY:-}
      STORAGE_ALIYUN_OSS_SECRET_KEY: ${STORAGE_ALIYUN_OSS_SECRET_KEY:-}
      STORAGE_QINIU_ENABLED: ${STORAGE_QINIU_ENABLED:-false}
      STORAGE_QINIU_ACCESS_KEY: ${STORAGE_QINIU_ACCESS_KEY:-}
      STORAGE_QINIU_SECRET_KEY: ${STORAGE_QINIU_SECRET_KEY:-}
      STORAGE_QINIU_REGION: ${STORAGE_QINIU_REGION:-}
      STORAGE_QINIU_BUCKET: ${STORAGE_QINIU_BUCKET:-}
      STORAGE_QINIU_DOWNLOAD_DOMAIN: ${STORAGE_QINIU_DOWNLOAD_DOMAIN:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_file?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-apex-root}
    depends_on:
      security-key-check:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8085/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    stop_grace_period: ${APEX_STOP_GRACE_PERIOD:-105s}
    restart: unless-stopped
    networks:
      - apex-network
      - observability

  # 集成中心与物联网（独立库 apex_integration，业务 8094 / 管理 8097）。
  # MQTT 桥接默认关闭（hivemq-mqtt-client 为 optional 依赖）；启用需经 EMQX 联调。
  # 凭据加密密钥 APEX_CREDENTIAL_ENCRYPTION_KEY 必须为 32 字节，否则凭据管理拒绝工作。
  apex-integration-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-integration-service
        SERVICE_PORT: "8094"
        MANAGEMENT_PORT: "8097"
        HEALTHCHECK_PORT: "8097"
    image: apex-integration-service:${TAG:-latest}
    volumes:
      - ./logs/apex-integration-service:/app/logs
    ports:
      - "${INTEGRATION_PORT:-8094}:8094"
      - "${INTEGRATION_MANAGEMENT_PORT:-8097}:8097"
    environment:
      <<: *app-common-environment
      MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
      DB_NAME: apex_integration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apex_integration?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-apex-root}
      APEX_CREDENTIAL_ENCRYPTION_KEY: ${APEX_CREDENTIAL_ENCRYPTION_KEY:-}
      APEX_IOT_MQTT_ENABLED: ${APEX_IOT_MQTT_ENABLED:-false}
    depends_on:
      security-key-check:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8097/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s
    stop_grace_period: ${APEX_STOP_GRACE_PERIOD:-105s}
    restart: unless-stopped
    networks:
      - apex-network
      - observability

  # 任务代理无数据库和注册中心；403 探针只证明 HTTP 安全链存活，不证明上游就绪。
  apex-job-service:
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-job-service
        SERVICE_PORT: "8095"
        MANAGEMENT_PORT: "8095"
        HEALTHCHECK_PORT: "8095"
    image: apex-job-service:${TAG:-latest}
    ports:
      - "127.0.0.1:${APEX_JOB_PORT:-8095}:8095"
    environment:
      APEX_JOB_PORT: "8095"
      APEX_JOB_SYSTEM_URL: ${APEX_JOB_SYSTEM_URL:-http://apex-system-service:8082}
      SW_AGENT_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8095/actuator/health 2>&1 | grep -q 'HTTP/1.1 403'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [apex-network]

  # 脱敏服务不需要数据库；必填信任配置为空时应用校验明确拒绝启动。
  apex-masking-service:
    profiles: [masking]
    build:
      context: .
      dockerfile: Containerfile
      args:
        BUILD_PROFILE: ${BUILD_PROFILE:-enterprise}
        SERVICE_MODULE: apex-masking-service
        SERVICE_PORT: "8096"
        MANAGEMENT_PORT: "8096"
        HEALTHCHECK_PORT: "8096"
    image: apex-masking-service:${TAG:-latest}
    ports:
      - "127.0.0.1:${MASKING_PORT:-8096}:8096"
    environment:
      MASKING_PORT: "8096"
      MASKING_JWT_ISSUER: ${MASKING_JWT_ISSUER:-}
      MASKING_JWT_JWK_SET_URI: ${MASKING_JWT_JWK_SET_URI:-}
      MASKING_JWT_AUDIENCE: ${MASKING_JWT_AUDIENCE:-}
      MASKING_ALLOWED_TENANT: ${MASKING_ALLOWED_TENANT:-}
      SW_AGENT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8096/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [apex-network]

  # 调度中心与 TC 均可选；外部完整配置和官方建表是启动前置条件，不内置秘密。
  xxl-job-admin:
    profiles: [xxl-job]
    image: docker.io/xuxueli/xxl-job-admin:3.1.1
    environment:
      PARAMS: "--spring.config.additional-location=file:/config/application.properties"
    volumes:
      - type: bind
        source: ${XXL_ADMIN_CONFIG_FILE:-./config/xxl-job/application.properties}
        target: /config/application.properties
        read_only: true
        bind:
          create_host_path: false
      - xxl-job-logs:/data/applogs
    ports:
      - "127.0.0.1:${XXL_ADMIN_PORT:-8098}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/xxl-job-admin/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks: [apex-network]

  seata-tc:
    profiles: [seata]
    image: docker.io/apache/seata-server:2.2.0
    environment:
      SEATA_IP: ${SEATA_ADVERTISE_HOST:-seata-tc}
      SEATA_PORT: "8091"
      STORE_MODE: db
    volumes:
      - type: bind
        source: ${SEATA_SERVER_CONFIG_FILE:-./config/seata/application.yml}
        target: /seata-server/resources/application.yml
        read_only: true
        bind:
          create_host_path: false
      - seata-logs:/seata-server/logs
    ports:
      - "127.0.0.1:${SEATA_RPC_PORT:-8091}:8091"
      - "127.0.0.1:${SEATA_CONSOLE_PORT:-7091}:7091"
    # TCP 探针不代表真实 AT 提交、回滚或数据库恢复成功。
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8091'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks: [apex-network]

  # ---------------- Nacos（服务发现 + 配置中心） ----------------
  # 微服务拓扑下网关 lb:// 路由依赖服务发现；提供 nacos/nacos（单机模式，仅用于本地起步）。
  nacos:
    image: docker.io/nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- MySQL ----------------
  mysql:
    image: docker.io/library/mysql:9.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-apex-root}
      # 引导库（旧单体 apex_data 已随单体退役收敛为 apex_system，见 §Phase 6）；
      # 各微服务另经 createDatabaseIfNotExist 自建独立库（apex_auth/apex_system/apex_workflow/...）
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apex_system}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 暴露给宿主机便于运维；生产可通过 MYSQL_PORT 改映射或注释掉
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-apex-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Redis ----------------
  redis:
    image: docker.io/library/redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-apex-redis-password}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    # Redis 开启 requirepass 后，健康检查必须携带密码，否则应用依赖检查会长期失败
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Meilisearch（全文搜索引擎） ----------------
  # 轻量级搜索引擎，用于系统管理数据（用户/角色/菜单/部门/字典/配置）全文索引
  # CJK 支持好，内存占用比 Elasticsearch 低 80%
  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.10
    environment:
      # Master Key：开发环境默认值，生产必须通过 MEILI_MASTER_KEY 注入随机密钥（≥16字符）
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      # 运行环境：development（允许无 Master Key）/ production（强制 Master Key）
      MEILI_ENV: ${MEILI_ENV:-development}
      # 数据持久化路径
      MEILI_DB_PATH: /meili_data
      # 时区
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Loki（日志聚合与查询） ----------------
  # Grafana Loki 轻量级日志系统，比 ELK 资源消耗降低 80%
  # 标签索引 + 全文扫描架构，专为云原生应用设计
  loki:
    image: docker.io/grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Alloy（日志采集器） ----------------
  # Grafana Alloy：新一代可观测性数据采集器，统一采集日志/指标/trace
  # 替代 Logstash，配置简单，资源占用低
  alloy:
    image: docker.io/grafana/alloy:v1.0.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APEX_LOG_ENV: ${APEX_LOG_ENV:-prod}
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./config/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # 挂载应用日志目录（只读），Alloy 读取 JSON 日志文件
      - ./logs:/var/log/apex-scaffold:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Keycloak（IAM 身份认证与访问管理） ----------------
  # 企业级开源 IAM，提供 OIDC/OAuth2/SAML 单点登录、社交登录、MFA、用户联邦等能力
  # 默认关闭，通过 --profile keycloak 启用：podman-compose -f podman-compose.yml --profile keycloak up -d keycloak
  # 管理控制台: http://localhost:${KEYCLOAK_PORT:-8180}  (admin/admin123)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["keycloak"]
    environment:
      # 管理员账号（生产必须修改）
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      # 数据库配置（使用现有 MySQL 实例）
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/${KEYCLOAK_DB_NAME:-keycloak}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-root}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-apex-root}
      # 主机名与端口（对齐 OrbStack 旧实例：hostname-strict=false + start-dev，容器内按请求 Host 解析 issuer）
      KC_HOSTNAME_STRICT: "false"
      KC_RUN_IN_CONTAINER: "true"
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443
      # 日志
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
      KC_HEALTH_ENABLED: "true"
      # 时区
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - start-dev
      - --http-enabled=true
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- RocketMQ（可选：podman-compose -f podman-compose.yml --profile rocketmq up -d） ----------------
  rocketmq-namesrv:
    image: docker.io/apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    # mkdir 确保 GC 日志目录存在（镜像默认无 /home/rocketmq/logs）
    command:
      - /bin/sh
      - -c
      - mkdir -p /home/rocketmq/logs && exec sh mqnamesrv
    environment:
      HEAP_OPTS: "-Xms256m -Xmx512m -Xmn128m"
      # JVM 调优（JDK8 语法；JAVA_OPT_EXT 追加在末尾，覆盖默认 /dev/shm GC 日志）：
      #   ⚠️ runserver.sh 强制 CMS 回收器（JDK8），故不传 G1（G1+CMS 共存会启动崩溃）；
      #   元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m
      JAVA_OPT_EXT: "-XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/rocketmq/logs/rmq_namesrv_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xloggc:/home/rocketmq/logs/rmq_namesrv_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m -Dfile.encoding=UTF-8"
    ports:
      - "9876:9876"
    restart: unless-stopped
    networks:
      - apex-network

  # ---------------- Apex Admin Web（前端管理后台，可选） ----------------
  apex-admin-web:
    # 镜像需预先构建（前端为独立仓库，compose 无法引用仓库外 build context）：
    #   cd ../apex-admin-web && podman build -t apex-admin-web:${TAG:-latest} .
    image: apex-admin-web:${TAG:-latest}
    container_name: apex-admin-web
    environment:
      # 反代后端：同 compose 网络内按服务名访问 apex-gateway:8080（网关承接原单体 8080 入口）
      API_PROXY_PASS: ${API_PROXY_PASS:-http://apex-gateway:8080}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_PORT:-80}:80"
    # 等待网关 readiness 通过后再启动反向代理，避免将流量导向未就绪实例
    depends_on:
      apex-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apex-network

  rocketmq-broker:
    image: docker.io/apache/rocketmq:5.3.1
    profiles: ["rocketmq"]
    # brokerIP1 显式指定为宿主机回环地址：若不设置，broker 会向 namesrv 上报容器内部网络 IP，
    # 从宿主机（如 IDE、本机跑集成测试）直连时该内部 IP 不可路由，连接会报 RemotingSendRequestException。
    # mqbroker 的 BrokerStartup 不支持单项 -D 覆盖，只能通过 -c 加载配置文件，故启动前先落一份临时
    # broker.conf。同机场景下 EXTERNAL_IP 固定为 127.0.0.1 即可；如需从其他主机访问，应替换为宿主机对外可达地址。
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /home/rocketmq/logs
        printf 'brokerClusterName=DefaultCluster\nbrokerName=broker-a\nbrokerId=0\nbrokerIP1=%s\n' "${ROCKETMQ_BROKER_EXTERNAL_IP:-127.0.0.1}" > /home/rocketmq/broker-external.conf
        exec sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker-external.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      HEAP_OPTS: "-Xms512m -Xmx1g -Xmn256m"
      # JVM 调优（JDK8 语法；runbroker.sh 已含 G1）：
      #   200ms 停顿；元空间 256m/512m；OOM 堆转储 + 退出自愈；滚动 GC 日志 5×20m
      JAVA_OPT_EXT: "-XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/home/rocketmq/logs/rmq_broker_heapdump.hprof -XX:+ExitOnOutOfMemoryError -Xloggc:/home/rocketmq/logs/rmq_broker_gc.log -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=5 -XX:GCLogFileSize=20m -Dfile.encoding=UTF-8"
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    restart: unless-stopped
    networks:
      - apex-network

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:
  loki-data:
  alloy-data:
  keycloak-data:
  nacos-data:
  xxl-job-logs:
  seata-logs:

networks:
  apex-network:
    driver: bridge
  observability:
    name: apex-observability
    external: true
