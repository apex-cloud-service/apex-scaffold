spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/apex_auth_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  
  r2dbc:
    # R2DBC MySQL 响应式数据源(与 JDBC 数据源指向同一开发库)
    url: r2dbc:mysql://localhost:3306/apex_auth_dev?serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql
    out-of-order: true

logging:
  level:
    root: INFO
    com.apex.scaffold.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.r2dbc: DEBUG
