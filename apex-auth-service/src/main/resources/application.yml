apex:
  security:
    data-encryption-key: ${APEX_DATA_ENCRYPTION_KEY:}
    config-encryption-key: ${APEX_CONFIG_ENCRYPTION_KEY:}

auth-center:
  authorization-reader-user-id: ${AUTH_CENTER_AUTHORIZATION_READER_USER_ID:}

server:
  port: 8081

spring:
  application:
    # 服务名 = Nacos 注册名 = 网关路由 lb:// 的目标名（迁移方案 Phase 2.2 服务名收敛）
    # 与 bootstrap.yml 保持一致，统一为 apex-auth-service。
    name: apex-auth-service
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/apex_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql
    out-of-order: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:your-secret-key-here-must-be-at-least-32-bytes-long}
  expiration: 7200000
  refresh-expiration: 604800000

security:
  token:
    encryption:
      # Token加密密钥(AES-256)，必须为Base64编码的32字节密钥
      # 生成新密钥: java -cp apex-auth-service.jar com.apex.scaffold.auth.infrastructure.encryption.TokenEncryptionServiceImpl
      # 或使用环境变量: TOKEN_ENCRYPTION_KEY
      key: ${TOKEN_ENCRYPTION_KEY:}
  config:
    encryption:
      # 配置加密密钥，必须为32字节（256位）；生产环境必须通过环境变量 CONFIG_ENCRYPTION_KEY 注入独立密钥
      key: ${CONFIG_ENCRYPTION_KEY:}

logging:
  level:
    root: INFO
    com.apex.scaffold.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
