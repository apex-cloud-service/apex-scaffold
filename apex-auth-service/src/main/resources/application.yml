apex:
  internal-auth:
    # 内部契约（/internal/v1/**）签名校验。共享密钥必须由部署编排注入；
    # 启用但未配置密钥时一律 503 拒绝。仅本地单测可显式关闭。
    enabled: ${APEX_INTERNAL_AUTH_ENABLED:true}
    secret: ${APEX_INTERNAL_AUTH_SECRET:}
    service-name: apex-auth-service
    allowed-skew-seconds: ${APEX_INTERNAL_AUTH_SKEW_SECONDS:60}
  seata:
    enabled: ${APEX_SEATA_ENABLED:false}
    application-id: apex-auth-service
    transaction-service-group: ${APEX_SEATA_TX_GROUP:apex_tx_group}
    propagation-secret: ${APEX_SEATA_PROPAGATION_SECRET:}
    allowed-origins: []
  security:
    data-encryption-key: ${APEX_DATA_ENCRYPTION_KEY:}
    config-encryption-key: ${APEX_CONFIG_ENCRYPTION_KEY:}
    ip-rate-limit:
      # 可信反向代理网段（CIDR），逗号分隔；仅直连地址命中这些网段时才采信
      # X-Forwarded-For / X-Real-IP，否则一律使用 TCP 直连地址，防止客户端伪造转发头
      trusted-proxy-cidrs: ${APEX_TRUSTED_PROXY_CIDRS:}
  tenant-check:
    # 统一认证收口（A6）：登录前置租户校验（主应用内部租户状态端点）。
    # 租户中心（主应用）内部基址；空 = 校验跳过（basic/dev 档）。
    base-url: ${TENANT_CHECK_BASE_URL:}
    # 判定缓存秒数（正/负结果均缓存）
    cache-seconds: ${TENANT_CHECK_CACHE_SECONDS:60}
    # 单次拉取超时（毫秒）
    timeout-millis: ${TENANT_CHECK_TIMEOUT_MILLIS:3000}

auth-center:
  authorization-reader-user-id: ${AUTH_CENTER_AUTHORIZATION_READER_USER_ID:}

# 创蓝短信（密码找回 SMS 通道验证码投递）
# 账号、密码、模板 ID 未注入时短信通道不可用，接口返回 SMS_SERVICE_ERROR（503）。
chuanglan:
  sms:
    host: ${CL_SMS_HOST:smssh.253.com}
    port: ${CL_SMS_PORT:443}
    account: ${CL_SMS_ACCOUNT:}
    password: ${CL_SMS_PASSWORD:}
    signature: ${CL_SMS_SIGNATURE:【Apex】}
    template-id: ${CL_SMS_TEMPLATE_ID:}
    send-uri: /msg/sms/v2/tpl/send
    balance-uri: /msg/balance/json
    ssl-enabled: ${CL_SMS_SSL:true}

server:
  port: 8081

spring:
  application:
    # 服务名 = Nacos 注册名 = 网关路由 lb:// 的目标名（迁移方案 Phase 2.2 服务名收敛）
    # 与 bootstrap.yml 保持一致，统一为 apex-auth-service。
    name: apex-auth-service
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/apex_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}
    # dynamic-datasource 由 apex-infrastructure-persistence（经 apex-auth）传递引入，
    # 其自动配置要求 spring.datasource.dynamic.datasource 下至少有一个数据源，
    # 否则启动报 "dynamic-datasource can not find primary datasource"。
    # auth 只使用单库，用 master 单数据源声明即可；basic 档位在 application-basic.yml
    # 中显式排除该自动配置（改用 H2 + 普通 DataSource）。
    # ⚠️ 一旦启用 dynamic，Spring Boot 的 spring.datasource.url/username/password 不再被消费，
    #    必须在这里显式引用同名环境变量（SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD），
    #    否则 Compose 与 K8s 注入的标准变量会被忽略、连接回落到 localhost。
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: ${SPRING_DATASOURCE_URL:${DB_MASTER_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:apex_auth}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}}
          username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
          password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
          driver-class-name: com.mysql.cj.jdbc.Driver
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql
    out-of-order: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:your-secret-key-here-must-be-at-least-32-bytes-long}
  expiration: 7200000
  refresh-expiration: 604800000

security:
  token:
    encryption:
      # Token加密密钥(AES-256)，必须为Base64编码的32字节密钥
      # 生成新密钥: java -cp apex-auth-service.jar com.apex.scaffold.auth.infrastructure.encryption.TokenEncryptionServiceImpl
      # 或使用环境变量: TOKEN_ENCRYPTION_KEY
      key: ${TOKEN_ENCRYPTION_KEY:}
  config:
    encryption:
      # 配置加密密钥，必须为32字节（256位）；生产环境必须通过环境变量 CONFIG_ENCRYPTION_KEY 注入独立密钥
      key: ${CONFIG_ENCRYPTION_KEY:}

logging:
  level:
    root: INFO
    com.apex.scaffold.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

# Actuator：容器 HEALTHCHECK 请求 /actuator/health/readiness，
# 启用 readiness/liveness 探针组并暴露 health/info；安全链对 /actuator/health/** 放行。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
