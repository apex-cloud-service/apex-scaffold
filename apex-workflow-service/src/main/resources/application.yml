# ============================================================
# Apex Scaffold - 工作流服务 application.yml
# ============================================================
# 【作用】
#   工作流服务（apex-workflow-service）运行期主配置：端口、数据源、Flyway、MyBatis-Plus。
#   服务名 = Nacos 注册名 = 网关路由 lb:// 的目标名（迁移方案 Phase 3）。
#
# 【独立库】
#   工作流服务使用独立数据库 apex_workflow（迁移方案 §3.3），
#   表结构：wf_definition / wf_instance / wf_task / wf_approval。
#
# @author Apex Team
# ============================================================

apex:
  seata:
    enabled: ${APEX_SEATA_ENABLED:false}
    application-id: apex-workflow-service
    transaction-service-group: ${APEX_SEATA_TX_GROUP:apex_tx_group}
    propagation-secret: ${APEX_SEATA_PROPAGATION_SECRET:}
    allowed-origins: []
  open-api:
    guard:
      # D4 服务侧能力二次校验：携带网关 X-Open-Api-Capability 标记头的请求须通过能力订阅复核
      enabled: true
      base-url: ${APEX_SYSTEM_BASE_URL:http://127.0.0.1:8082}
  jwks:
    # 共享 JWKS 拉取（统一认证收口 A2）：认证中心 /.well-known/jwks.json；
    # 空 = 拉取关闭，仅用静态公钥兜底；轮换公钥最迟一个刷新周期内生效。
    remote-url: ${JWKS_REMOTE_URL:}
    refresh-interval-seconds: ${JWKS_REFRESH_INTERVAL_SECONDS:300}

workflow:
  security:
    # auth RS256 活跃公钥，X509 DER Base64；缺失时拒绝认证。
    jwt-public-key-base64: ${WORKFLOW_JWT_PUBLIC_KEY_BASE64:}
    # 多公钥格式为 kid=Base64PublicKey,kid=Base64PublicKey，按 JWT header 的 kid 选择公钥；
    # 多公钥优先于单公钥。生产推荐配置 apex.jwks.remote-url 自动拉取认证中心轮换公钥。
    jwt-public-keys-base64: ${WORKFLOW_JWT_PUBLIC_KEYS_BASE64:}
    # 仅历史 HMAC 签发方显式开启；配置 RSA 后不降级。
    jwt-hmac-enabled: ${WORKFLOW_JWT_HMAC_ENABLED:false}
    jwt-secret: ${WORKFLOW_JWT_SECRET:}
    # 受权限注解保护接口的授权快照来源；未确认共享命名空间或缺少租户凭据时拒绝访问。
    authorization:
      shared-user-namespace: ${WORKFLOW_AUTHORIZATION_SHARED_USER_NAMESPACE:false}
      base-url: ${WORKFLOW_AUTHORIZATION_BASE_URL:}
      timeout: ${WORKFLOW_AUTHORIZATION_TIMEOUT:3s}
      reader-tokens: {}

server:
  # 工作流服务端口（迁移方案 §3.1：端口 8083）
  port: 8083

spring:
  application:
    # 服务名 = Nacos 注册名 = 网关路由 lb:// 的目标名
    # 与 bootstrap.yml 保持一致，统一为 apex-workflow-service。
    name: apex-workflow-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/apex_workflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql
    out-of-order: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.apex.scaffold.workflow: DEBUG
    com.apex.scaffold.workflowservice: DEBUG
    org.springframework.web: DEBUG

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json