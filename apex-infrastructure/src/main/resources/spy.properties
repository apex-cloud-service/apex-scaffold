# ============================================================
# P6Spy SQL 日志代理配置（dev 环境生效）
# ============================================================
# 职责：拦截 JDBC SQL 并输出格式化日志（含参数值），便于开发调试。
# 生效范围：dev profile（application-dev.yml 中 driver/url 已切换为 P6Spy 代理）。
# 生产/测试环境不启用：prod 使用纯 Druid stat 监控（p6spy: false），
#                     it 测试通过 logging.level 控制 SQL 日志，避免代理层干扰断言。
# 日志输出：经 Slf4JLogger 汇入 logback 的 "p6spy" logger
#           （logback-spring.xml dev 段已配置 SQL_CONSOLE + SQL_FILE appender）。
# ============================================================

# 启用模块：spy（核心代理）+ logging（SQL 日志）
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory

# 真实 JDBC 驱动列表（p6spy 自动按 URL 选择；dev=H2，prod=MySQL 备用）
driverlist=org.h2.Driver,com.mysql.cj.jdbc.Driver

# 日志格式：单行，含耗时/类别/连接号/SQL（参数已内联）
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime)|%(executionTime) ms|%(category)|connection %(connectionId)|%(sqlSingleLine)

# 输出方式：走 SLF4J（logger name = p6spy），由 logback 统一路由到控制台与文件
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 追加写入（配合 logback SQL_FILE，p6spy 自身不写文件）
append=true

# 时间戳格式
dateformat=yyyy-MM-dd HH:mm:ss

# 排除噪音类别：仅保留 statement/preparedstatement/commit 等核心 SQL 日志
excludecategories=info,debug,result,resultset
