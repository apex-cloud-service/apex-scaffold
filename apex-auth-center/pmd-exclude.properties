# PMD Exclusion Rules for Apex Scaffold
# This file defines violations that should be excluded from PMD checks
# Format: fully-qualified-class-name.violation-rule=comma-separated-line-numbers or * for all

# OAuth2 标准命名类 - 不应检查 UpperCamelCase 规范
com.apex.scaffold.infrastructure.persistence.mapper.OAuth2AuthorizationConsentMapper.ClassNamingShouldBeCamelRule=*
com.apex.scaffold.infrastructure.persistence.mapper.OAuth2RegisteredClientMapper.ClassNamingShouldBeCamelRule=*
com.apex.scaffold.infrastructure.persistence.po.OAuth2AuthorizationConsentPO.ClassNamingShouldBeCamelRule=*
com.apex.scaffold.infrastructure.persistence.po.OAuth2RegisteredClientPO.ClassNamingShouldBeCamelRule=*
com.apex.scaffold.infrastructure.repository.OAuth2AuthorizationConsentRepositoryImpl.ClassNamingShouldBeCamelRule=*
com.apex.scaffold.infrastructure.repository.OAuth2RegisteredClientRepositoryImpl.ClassNamingShouldBeCamelRule=*

# Mapper 接口方法缺少 JavaDoc - 历史遗留,暂不修复
com.apex.scaffold.infrastructure.persistence.mapper.AccountDeletionCleanupMapper.AbstractMethodOrInterfaceMethodMustUseJavadocRule=*
com.apex.scaffold.infrastructure.persistence.mapper.AccountDeletionTaskMapper.AbstractMethodOrInterfaceMethodMustUseJavadocRule=*
com.apex.scaffold.infrastructure.persistence.mapper.ProcessInstanceMapper.AbstractMethodOrInterfaceMethodMustUseJavadocRule=*
com.apex.scaffold.infrastructure.persistence.mapper.TaskMapper.AbstractMethodOrInterfaceMethodMustUseJavadocRule=*

# MapStruct 抽象转换器 - 不应检查 Abstract 命名规范
com.apex.scaffold.infrastructure.office.converter.ApprovalProcessConverter.AbstractClassShouldStartWithAbstractNamingRule=*
com.apex.scaffold.infrastructure.persistence.converter.OfficeMessageConverter.AbstractClassShouldStartWithAbstractNamingRule=*
com.apex.scaffold.infrastructure.office.persistence.converter.OfficeMessageConverter.AbstractClassShouldStartWithAbstractNamingRule=*

# 设计决策:Service 类不以 Impl 结尾(使用 Default 前缀表示默认实现)
com.apex.scaffold.infrastructure.audit.DefaultAuditLogService.ServiceOrDaoClassShouldEndWithImplRule=*
com.apex.scaffold.infrastructure.security.DefaultEncryptionService.ServiceOrDaoClassShouldEndWithImplRule=*

# Office 接口命名遵循行业惯例
com.apex.scaffold.infrastructure.office.spi.OfficeOAuthClient.ClassNamingShouldBeCamelRule=*

# RocketMQ 标准配置属性名(非项目变量)
com.apex.scaffold.infrastructure.mq.config.RocketMqProducerConfig.LowerCamelCaseVariableNamingRule=*

# MapStruct 转换器 toPO/toEntity 方法命名惯例(PO 为 Persistent Object 缩写)
com.apex.scaffold.infrastructure.office.converter.DocumentInfoConverter.LowerCamelCaseVariableNamingRule=*
com.apex.scaffold.infrastructure.office.converter.CalendarEventConverter.LowerCamelCaseVariableNamingRule=*
com.apex.scaffold.infrastructure.office.converter.ApprovalProcessConverter.LowerCamelCaseVariableNamingRule=*
com.apex.scaffold.infrastructure.persistence.converter.OfficeMessageConverter.LowerCamelCaseVariableNamingRule=*
com.apex.scaffold.infrastructure.office.persistence.converter.OfficeMessageConverter.LowerCamelCaseVariableNamingRule=*

# LokiAdapter buildLogQLQuery 变量名遵循 LogQL 查询语言惯例
com.apex.scaffold.infrastructure.log.LokiAdapter.LowerCamelCaseVariableNamingRule=*

# 微信标准命名类 - 不应检查 UpperCamelCase 规范
com.apex.scaffold.infrastructure.wechat.service.WeChatOAuthService.ClassNamingShouldBeCamelRule=*

