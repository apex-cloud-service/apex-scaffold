name: Release Pipeline

# Apex Scaffold 发布流水线：标签 v* 触发三档构建与发布。
on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'
  MVND_VERSION: '2.0.0-rc-3'

jobs:
  build-and-release:
    name: Build 3-Tier Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Maven Daemon
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install mvnd "${MVND_VERSION}"
          echo "$HOME/.sdkman/candidates/mvnd/current/bin" >> "$GITHUB_PATH"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build basic tier
        run: mvnd -q clean package -Pbasic -DskipTests
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Package basic dist
        run: |
          mkdir -p dist
          zip -r dist/apex-scaffold-${{ steps.version.outputs.VERSION }}-basic.zip \
            apex-gateway/target/*.jar apex-auth-service/target/*.jar apex-system-service/target/*.jar \
            apex-workflow-service/target/*.jar apex-office-service/target/*.jar apex-file-service/target/*.jar \
            apex-integration-service/target/*.jar apex-boot-all/target/*.jar \
            apex-tools-deployment/target/local-deployment.jar \
            apex-example/target/*.jar \
            LICENSE LICENSE-COMMERCIAL.md docs config podman-compose.yml Containerfile k8s scripts

      - name: Build standard tier
        run: mvnd -B -q clean package -Pstandard -DskipTests
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Package standard dist
        run: |
          zip -r dist/apex-scaffold-${{ steps.version.outputs.VERSION }}-standard.zip \
            apex-gateway/target/*.jar apex-auth-service/target/*.jar apex-system-service/target/*.jar \
            apex-workflow-service/target/*.jar apex-office-service/target/*.jar apex-file-service/target/*.jar \
            apex-integration-service/target/*.jar apex-boot-all/target/*.jar \
            apex-tools-deployment/target/local-deployment.jar \
            apex-example/target/*.jar \
            LICENSE LICENSE-COMMERCIAL.md docs config podman-compose.yml Containerfile k8s scripts

      - name: Build enterprise tier
        run: mvnd -B -q clean package -Penterprise -DskipTests
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Package enterprise dist
        run: |
          zip -r dist/apex-scaffold-${{ steps.version.outputs.VERSION }}-enterprise.zip \
            apex-gateway/target/*.jar apex-auth-service/target/*.jar apex-system-service/target/*.jar \
            apex-workflow-service/target/*.jar apex-office-service/target/*.jar apex-file-service/target/*.jar \
            apex-integration-service/target/*.jar apex-boot-all/target/*.jar \
            apex-tools-deployment/target/local-deployment.jar \
            apex-example/target/*.jar \
            LICENSE LICENSE-COMMERCIAL.md docs config podman-compose.yml Containerfile k8s scripts

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
