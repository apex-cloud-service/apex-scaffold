name: Release Pipeline

# ================================================================
# Apex Scaffold 发布流水线（C13 CD）
# 触发：推送 v* 标签（如 v1.1.3）时，执行三档构建并上传发布产物。
# 产物：dist/apex-scaffold-<version>-<profile>.zip（basic/standard/enterprise）
# 说明：CI 容器使用 temurin + Maven（容器原生），与本地 sdkman+mvnd 环境互补。
# ================================================================

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9'

jobs:
  # ============================================
  # 三档构建 + 发布产物
  # ============================================
  build-and-release:
    name: Build 3-Tier Distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build basic tier
        run: mvn -B -q clean package -Pbasic -DskipTests
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Package basic dist
        run: |
          mkdir -p dist
          zip -r dist/apex-scaffold-${{ steps.version.outputs.VERSION }}-basic.zip \
            apex-interfaces/target/*.jar apex-common/target/*.jar \
            LICENSE LICENSE-COMMERCIAL.md docs config docker-compose.yml Dockerfile k8s scripts

      - name: Build standard tier
        run: mvn -B -q clean package -Pstandard -DskipTests
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Package standard dist
        run: |
          zip -r dist/apex-scaffold-${{ steps.version.outputs.VERSION }}-standard.zip \
            apex-interfaces/target/*.jar apex-common/target/*.jar \
            LICENSE LICENSE-COMMERCIAL.md docs config docker-compose.yml Dockerfile k8s scripts

      - name: Build enterprise tier
        run: mvn -B -q clean package -Penterprise -DskipTests
        env:
          MAVEN_OPTS: -Xmx1024m

      - name: Package enterprise dist
        run: |
          zip -r dist/apex-scaffold-${{ steps.version.outputs.VERSION }}-enterprise.zip \
            apex-interfaces/target/*.jar apex-common/target/*.jar \
            LICENSE LICENSE-COMMERCIAL.md docs config docker-compose.yml Dockerfile k8s scripts

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
