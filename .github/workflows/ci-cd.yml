name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '21'
  MVND_VERSION: '2.0.0-rc-3'

jobs:
  # ============================================
  # 代码质量检查
  # ============================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Set up Maven Daemon
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install mvnd "${MVND_VERSION}"
          echo "$HOME/.sdkman/candidates/mvnd/current/bin" >> "$GITHUB_PATH"

      - name: Compile and check code style
        run: mvnd clean compile spotless:check
      
      - name: Run PMD static analysis
        run: mvnd pmd:check || true

      - name: Check SpringDoc annotation coverage
        run: bash scripts/ci/check-springdoc-coverage.sh
  
  # ============================================
  # 单元测试
  # ============================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Set up Maven Daemon
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install mvnd "${MVND_VERSION}"
          echo "$HOME/.sdkman/candidates/mvnd/current/bin" >> "$GITHUB_PATH"

      - name: Run unit tests and generate coverage
        run: mvnd -T1 clean test jacoco:report -P basic

      - name: Run SonarQube analysis
        if: vars.SONAR_HOST_URL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "Configure the SONAR_TOKEN repository secret"; exit 1; }
          mvnd -T1 -P basic compile sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.qualitygate.wait=true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/target/surefire-reports/'
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          flags: unittests
          fail_ci_if_error: false

  # ============================================
  # 集成测试
  # ============================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Podman integration services and API socket
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          systemctl --user start podman.socket
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"
          podman run -d --name apex-ci-mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root123 -e MYSQL_DATABASE=apex_example \
            docker.io/library/mysql:9.0
          podman run -d --name apex-ci-redis -p 127.0.0.1:6379:6379 docker.io/library/redis:7-alpine
          ready=false
          for attempt in {1..60}; do
            if podman exec apex-ci-mysql mysqladmin ping -h127.0.0.1 -uroot -proot123 --silent \
              && podman exec apex-ci-redis redis-cli ping; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Initialize database
        run: |
          podman exec -i apex-ci-mysql mysql -u root -proot123 apex_example < apex-applications-parent/apex-example/src/main/resources/db/init.sql
      
      - name: Set up Maven Daemon
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install mvnd "${MVND_VERSION}"
          echo "$HOME/.sdkman/candidates/mvnd/current/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        run: mvnd verify -P standard -Dskip.unit.tests=true
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/apex_example?useSSL=false&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
      
      - name: Clean up Podman integration services
        if: always()
        run: podman rm -f apex-ci-mysql apex-ci-redis || true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/target/failsafe-reports/'

  # ============================================
  # 构建镜像(仅main分支)
  # 微服务拓扑：为网关 + 六个业务服务 + 只读查询聚合服务共 8 个标准服务分别构建独立镜像（一个镜像只打包一个服务）
  # ============================================
  build-image:
    name: Build Podman Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [code-quality, unit-test, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service:
          - apex-gateway
          - apex-auth-service
          - apex-system-service
          - apex-workflow-service
          - apex-office-service
          - apex-file-service
          - apex-integration-service
          - apex-aggregation-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman info

      - name: Login to Docker Hub with Podman
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login docker.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push Podman image
        env:
          SERVICE_MODULE: ${{ matrix.service }}
        run: |
          podman build -f Containerfile \
            --build-arg SERVICE_MODULE="$SERVICE_MODULE" \
            --build-arg BUILD_PROFILE=enterprise \
            -t "docker.io/apexscaffold/$SERVICE_MODULE:latest" \
            -t "docker.io/apexscaffold/$SERVICE_MODULE:$GITHUB_SHA" .
          podman push "docker.io/apexscaffold/$SERVICE_MODULE:latest"
          podman push "docker.io/apexscaffold/$SERVICE_MODULE:$GITHUB_SHA"

  # ============================================
  # 发布版本(打tag时触发)
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [code-quality, unit-test, integration-test]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Set up Maven Daemon
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install mvnd "${MVND_VERSION}"
          echo "$HOME/.sdkman/candidates/mvnd/current/bin" >> "$GITHUB_PATH"

      - name: Build project
        run: mvnd clean package -DskipTests -P enterprise

      - name: Archive OpenAPI documentation
        run: bash scripts/dev/openapi/archive-openapi.sh --version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apex-services-bom/apex-gateway/target/*.jar
            apex-services-bom/apex-auth-service/target/*.jar
            apex-services-bom/apex-system-service/target/*.jar
            apex-services-bom/apex-workflow-service/target/*.jar
            apex-services-bom/apex-office-service/target/*.jar
            apex-services-bom/apex-file-service/target/*.jar
            apex-services-bom/apex-integration-service/target/*.jar
            apex-services-bom/apex-aggregation-service/target/*.jar
            docs/03-api/openapi/openapi-latest.json
            docs/03-api/openapi/openapi-latest.yaml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
