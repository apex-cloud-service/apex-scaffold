server:
  port: 0  # 使用随机端口

spring:
  application:
    name: apex-example-test

  # 允许 Bean 定义覆盖：测试替身（ExampleTestMockConfiguration 的 @Primary 桩）
  # 需覆盖 apex-system 及共享基础设施依赖引入的同名真实 Bean
  # （如 redissonClient）
  main:
    allow-bean-definition-overriding: true

  # 邮件（演示占位）：满足 MailService 对 JavaMailSender 的装配依赖
  mail:
    host: smtp.example.com
    port: 25

  # 测试环境不接入 Nacos 注册中心（避免启动时尝试注册服务）
  cloud:
    nacos:
      discovery:
        enabled: false

  # 测试环境不依赖本地 Redis：关闭 Spring Data Redis 自动配置，
  # RedissonClient 由 ExampleTestMockConfiguration 的 @Primary 替身覆盖
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      # 关闭 R2DBC 自动配置：spring-boot-starter-data-r2dbc 经 apex-system 传递引入，
      # 示例应用未配置 R2DBC 连接（无 url），否则 R2dbcAutoConfiguration 会因
      # 「Failed to determine a suitable R2DBC Connection URL」导致上下文启动失败；
      # 响应式事务由 ExampleTestMockConfiguration 的 @Primary TransactionalOperator 替身满足
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration

  # 主从地址和凭据由 BaseIntegrationTest 的独立 MySQL 容器动态提供。
  datasource:
    dynamic:
      primary: master
      strict: true
      druid:
        initial-size: 1
        min-idle: 1
        max-active: 4
        max-wait: 10000
        connect-timeout: 5000
        socket-timeout: 10000
        connection-properties:
          connectTimeout: 5000
          socketTimeout: 10000
        connection-error-retry-attempts: 0
        break-after-acquire-failure: true
        fail-fast: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
        # 主从指向同一测试库以保证读写一致性；单库测试不验证主从复制。
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway：加载 MySQL 建表脚本（src/test/resources/db/example-migration）
  flyway:
    enabled: true
    locations: classpath:db/example-migration
    baseline-on-migrate: true
    clean-disabled: true

# 定时任务：测试环境禁用所有 @Scheduled 任务（outbox/账号注销等），
# 避免依赖主应用业务表（SYS_DOMAIN_EVENT_OUTBOX 等）产生日志噪音
apex:
  scheduling:
    enabled: false
  # Sentinel 系统保护规则：测试环境关闭（避免慢启动/低流量误触发全局降级 503）
  sentinel:
    system-rules:
      enabled: false
  # 数据加密密钥：DefaultEncryptionService (@Service) 构造时要求
  # apex.security.data-encryption-key 为 Base64 编码的 32 字节（256 位）密钥，
  # 缺失或非法会抛异常导致上下文启动失败。此处提供与 auth-center 测试一致的占位密钥
  # （32 字节零值），仅保证容器装配通过，不涉及真实数据加密。
  security:
    data-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# 跨域配置（测试环境放开所有来源，与主应用 application-it.yml 一致）
cors:
  allow-all-origins: true

# 配置加密密钥：ConfigEncryptionService (@Service) 会在容器启动时要求
# security.config.encryption.key 恰好为 32 字节（UTF-8），否则抛异常导致上下文启动失败。
# 集成测试真正加载 Spring 容器（区别于主应用仅跑纯 JDBC 测试），故需提供显式测试密钥。
security:
  config:
    encryption:
      key: 01234567890123456789012345678901
  # Token 加密密钥：EncryptionKeyProvider (@Component) 构造时要求
  # security.encryption.key 为 Base64 编码的 32 字节（256 位）密钥，缺失或非法会抛异常。
  # 提供与 auth-center 测试一致的占位密钥（32 字节零值），仅保证装配通过。
  encryption:
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.apex.example.model
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# JWT配置(测试用弱密钥)
jwt:
  secret: test-secret-key-for-integration-testing-only-min-32-chars!!!
  access-token-expire: 7200000
  refresh-token-expire: 604800000
  min-secret-length: 32

# 日志配置
logging:
  level:
    root: WARN
    com.apex: DEBUG
    org.springframework.test: INFO
